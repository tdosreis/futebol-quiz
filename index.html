const DCFG = () => DIFFS.find(d => d.key === diffKey) || DIFFS[0];

/* ═══════════════════════════════════════════════════
   SMART DISTRACTOR ENGINE
   Wrong answers are scored for plausibility instead of
   being drawn at random, so harder levels really are harder.
═══════════════════════════════════════════════════ */
/* Seedable PRNG — when _seed is set the sequence is reproducible, which is
   what makes the Daily Challenge identical for every player. */
let _seed = null;
function rnd() {
  if (_seed === null) return Math.random();
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function seedFrom(n) { _seed = (n * 2654435761) | 0; }

function shuf(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* days since 2024-01-01 — the daily puzzle number */
function dayIndex(d) {
  const n = d || new Date();
  return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())
                     - Date.UTC(2024, 0, 1)) / 86400000);
}

function eraOverlap(a, b) {
  if (!a.era || !b.era) return 0;
  return Math.max(0, Math.min(a.era[1], b.era[1]) - Math.max(a.era[0], b.era[0]));
}

/* How confusable is `cand` with the correct player `ref`? 0-100 */
function simPlayer(cand, ref) {
  let sc = 0;
  if (cand.pos  === ref.pos)  sc += 38;           // same position
  if (cand.ctry === ref.ctry) sc += 22;           // same country
  sc += Math.min(26, eraOverlap(cand, ref) * 1.8); // contemporaries
  const shared = (cand.clubs || []).filter(c => (ref.clubs || []).includes(c)).length;
  sc += Math.min(14, shared * 7);                 // shared clubs
  return sc;
}

/* Years between two careers: 0 when they overlap, otherwise the gap. */
function eraGap(a, b) {
  if (!a.era || !b.era) return 99;
  if (eraOverlap(a, b) > 0) return 0;
  return Math.min(Math.abs(a.era[0] - b.era[1]), Math.abs(b.era[0] - a.era[1]));
}

/* Confusability between clubs */
function simClub(cand, ref) {
  let sc = 0;
  if (cand.s === ref.s) sc += 42;                              // same state
  sc += Math.max(0, 22 - Math.abs((cand.f||1900) - (ref.f||1900)) / 2);
  if ((cand.lib > 0) === (ref.lib > 0)) sc += 20;              // both/neither Libertadores
  if ((cand.br  > 0) === (ref.br  > 0)) sc += 16;              // both/neither Brasileirão
  return sc;
}

/* ── Reading the question for clues ──────────────────────────
   "Qual argentino…", "…o goleiro que…", "…na Copa de 1958" — each of
   those hands the player a filter. If the board then shows flags, or
   nine strikers and one keeper, the filter alone answers it. So the
   engine reads the same clues and makes the wrong answers match them:
   an Argentine question gets Argentines, a 1958 question gets players
   who were actually around in 1958, and the flags come off the tiles. */
const _fold = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const DEMONYM = [
  ['brasil', 'BRA'], ['argentin', 'ARG'], ['portug', 'POR'], ['franca', 'FRA'], ['frances', 'FRA'],
  ['holand', 'NED'], ['alema', 'GER'], ['germ', 'GER'], ['bulgar', 'BUL'], ['itali', 'ITA'],
  ['ingl', 'ENG'], ['suec', 'SWE'], ['polon', 'POL'], ['marfim', 'CIV'], ['ivor', 'CIV'],
  ['liberia', 'LBR'], ['croa', 'CRO'], ['colomb', 'COL'], ['espanh', 'ESP'], ['urugua', 'URU'],
  ['egipc', 'EGY'], ['egito', 'EGY'], ['norueg', 'NOR'], ['camar', 'CMR'], ['ucran', 'UKR'],
  ['hungar', 'HUN'], ['hungri', 'HUN'], ['belg', 'BEL'], ['tchec', 'CZE'], ['chequi', 'CZE'],
  ['checo', 'CZE'], ['dinamarq', 'DEN'], ['russ', 'RUS'], ['mexic', 'MEX'], ['chile', 'CHI'],
  [' gana', 'GHA'], ['ganes', 'GHA'], ['escoc', 'SCO'], ['gales', 'WAL'], ['senegal', 'SEN'],
  ['nigeri', 'NGA'],
];
const POS_WORDS = [
  ['goleiro', 'GK'],
  ['zagueiro', 'DF'], ['lateral', 'DF'], ['defensor', 'DF'], ['beque', 'DF'],
  ['meia', 'MF'], ['meio-campista', 'MF'], ['meio campista', 'MF'], ['volante', 'MF'], ['armador', 'MF'],
  ['atacante', 'FW'], ['centroavante', 'FW'], ['artilheir', 'FW'], ['ponta', 'FW'],
];

function qCues(q) {
  if (q._cues) return q._cues;
  const t = ' ' + _fold(q.t) + ' ';
  const cues = { ctry: null, pos: null, year: null };
  for (const [w, code] of DEMONYM) if (t.indexOf(w) !== -1) { cues.ctry = code; break; }
  for (const [w, pos]  of POS_WORDS) if (t.indexOf(w) !== -1) { cues.pos = pos; break; }
  const y = /\b(19[3-9]\d|20[0-2]\d)\b/.exec(t);
  if (y) cues.year = parseInt(y[1], 10);
  else {
    const d = /anos (\d0)\b/.exec(t);              // "anos 70", "anos 2000"
    if (d) { const n = parseInt(d[1], 10); cues.year = (n >= 30 ? 1900 + n : 2000 + n) + 5; }
  }
  cues.any = !!(cues.ctry || cues.pos || cues.year);
  q._cues = cues;
  return cues;
}

/* ── Which questions may cross the generations ───────────────
   "Quem é o maior artilheiro de Copas de todos os tempos?" is *about*
   the whole history, so Klose beside Pelé beside Mbappé is the question
   working as intended. Everything else is not: asking who won a 2002
   final and offering a board that runs from 1958 to 2024 turns a
   football question into a date-sorting exercise, and the answer stands
   out for being the only man of the right vintage. So only these are
   allowed to mix eras; every other board is held to one. */
const ALL_TIME = /(todos os tempos|de todos|da historia|na historia|recordista|maior artilheiro da|mais titulos|toda a historia)/;
function qAllTime(q) {
  if (q._at === undefined) q._at = ALL_TIME.test(_fold(q.t));
  return q._at;
}

/* Does this candidate fit every clue the question gives away? */
function cueFits(p, cues) {
  if (cues.ctry && p.ctry !== cues.ctry) return false;
  if (cues.pos  && p.pos  !== cues.pos)  return false;
  if (cues.year && p.era && (p.era[0] > cues.year + 2 || p.era[1] < cues.year - 2)) return false;
  return true;
}

/* How well the candidate matches the clues, as a score to add to sim() */
function cueSim(p, cues) {
  let sc = 0;
  if (cues.ctry && p.ctry === cues.ctry) sc += 30;
  if (cues.pos  && p.pos  === cues.pos)  sc += 26;
  if (cues.year && p.era) {
    const gap = p.era[0] > cues.year ? p.era[0] - cues.year
              : p.era[1] < cues.year ? cues.year - p.era[1] : 0;
    sc += Math.max(0, 26 - gap * 2.2);
  }
  return sc;
}

function getDisp(q) {
  /* A third kind of answer. Players and clubs are rows of data with an id, a
     photo and a shape on screen; "onde foram escritas as primeiras regras do
     futebol?" is answered by a word. Those questions carry their own choices
     and become plain text tiles — the same board, the same scoring, no row in
     PL or CL invented to hold a country's name. */
  if (q.type === 'txt') {
    return shuf((q.choices || []).map(c => ({ id: c, n: c })));
  }

  const isPlayer = q.type === 'player';
  const pool0 = isPlayer ? PL : CL;
  const sim   = isPlayer ? simPlayer : simClub;
  const cfg   = DCFG();
  const strict = (q.strict !== undefined) ? q.strict : qStrict();
  const nOpts  = q.opts || cfg.opts;
  const cues   = isPlayer ? qCues(q) : { any: false };

  /* A tile is a figurinha, and a figurinha prints where the man is from and
     when he played. That is the album working — and, on the wrong question, a
     free answer. "Qual destes defendeu a seleção argentina?" is over the
     moment the band says ARGENTINA; "qual estreou nos anos 60?" is over when
     the band says 60, and again when eight tea-coloured cards sit beside one
     mint one, because the two printings split at the year 2000.
     So the cue the engine already reads for choosing distractors also decides
     what the card is allowed to show. Generators can set either flag directly
     when the giveaway is in the shape of the question rather than its words. */
  if (cues.ctry) { q._noFlag = true; q._hideCtry = true; }
  if (cues.year) q._hideEra = true;

  // `fixed` = show exactly these tiles (comparison questions)
  if (q.fixed) return shuf(q.fixed.map(id => pool0.find(x => x.id === id)).filter(Boolean));

  const right = q.a.map(id => pool0.find(x => x.id === id)).filter(Boolean);

  // `pool` = explicit list of ids allowed as wrong answers
  let wrong;
  if (q.pool) {
    const allow = new Set(q.pool);
    wrong = pool0.filter(x => allow.has(x.id) && !q.a.includes(x.id));
  } else {
    const skip = new Set([...(q.excl || []), ...q.a]);
    wrong = pool0.filter(x => !skip.has(x.id));
  }

  const ref  = right[0];
  const need = nOpts - right.length;

  /* ── One board, one generation ──────────────────────────────
     Unless the question is explicitly about all of history, every wrong
     answer has to be a contemporary of the right one. This runs at every
     level, fácil included: a board that spans seventy years is not an
     easier question, it is a worse one, because the answer announces
     itself. Difficulty is carried by how tight the window is and by how
     much the position and the country have to match, below. */
  const generic = isPlayer ? qAllTime(q) : true;
  if (isPlayer && ref && ref.era && !generic && wrong.length > need + 2) {
    /* Not tighter than this at difícil: squeezing the era to a handful of
       candidates leaves the ranking no room to also match the position and
       the country, and the hard board ends up no harder than the moderate
       one — just narrower. */
    const win  = strict >= 0.9 ? 13 : strict >= 0.4 ? 17 : 26;
    let near = wrong.filter(x => eraGap(x, ref) <= win);
    // widen rather than give up, so a thin era still fills a board
    if (near.length < need + 2) near = wrong.filter(x => eraGap(x, ref) <= win * 2);
    if (near.length >= need + 2) wrong = near;
  }

  if (ref && wrong.length > need) {
    const jitter = 14 * (1 - strict) + 6;
    /* On a question that is not about all of history the nation and the
       shirt are part of what makes a board cohere, so they carry weight
       even at fácil — the level still differs, because `strict` scales
       everything else and the era window above is far wider. */
    const floor = generic ? strict : Math.max(strict, 0.3);
    const ranked = wrong
      .map(x => ({ x, s: sim(x, ref) * floor
                       + (isPlayer && !generic && x.ctry === ref.ctry ? 16 : 0)
                       + (isPlayer && !generic && (x.clubs || []).some(c => (ref.clubs || []).includes(c)) ? 10 : 0)
                       + (isPlayer ? cueSim(x, cues) : 0)
                       + rnd() * jitter }))
      .sort((a, b) => b.s - a.s)
      .map(o => o.x);
    // the plausible band: tighter as strictness rises, never below need+2
    const band   = Math.max(need + 2, Math.round(ranked.length * (1 - strict * 0.8)));
    const inBand = shuf(ranked.slice(0, band));
    let picks;

    /* Clues are honoured at every level — a share of the wrong answers must
       fit what the question just said, or the clue is a free pass. The share
       grows with the level: a third of the board on fácil, most of it on
       difícil, where the question is meant to be decided by knowledge alone. */
    if (cues.any) {
      const fits   = shuf(wrong.filter(x => cueFits(x, cues)));
      const quota  = Math.min(fits.length, Math.max(2, Math.round(need * (0.35 + 0.45 * strict))));
      const chosen = fits.slice(0, quota);
      const ids    = new Set(chosen.map(x => x.id));
      picks = chosen.concat(inBand.filter(x => !ids.has(x.id)));
      for (const x of ranked) {                       // top up if the band ran dry
        if (picks.length >= need) break;
        if (!ids.has(x.id) && picks.indexOf(x) === -1) picks.push(x);
      }
      picks = picks.slice(0, need);
    } else {
      picks = inBand.slice(0, need);
    }

    /* ── and one nationality, mostly ─────────────────────────────
       A board of ten Brazilians of the same decade is a real question;
       the same ten with a Norwegian and a Ghanaian dropped in is a
       spotting exercise. Half the board is held to the answer's own
       country whenever that many exist — the rest stay mixed, so it
       never becomes a lineup of one nation and one nation only. */
    if (isPlayer && !generic && ref) {
      const kin = ranked.filter(x => x.ctry === ref.ctry);
      const want = Math.min(kin.length, Math.round(need * (0.3 + 0.3 * strict)));
      if (want > 0) {
        const have = picks.filter(x => x.ctry === ref.ctry).length;
        if (have < want) {
          const add = kin.filter(x => !picks.some(pk => pk.id === x.id)).slice(0, want - have);
          // drop the least plausible outsiders to make room
          const outs = picks.filter(x => x.ctry !== ref.ctry);
          const keep = picks.filter(x => x.ctry === ref.ctry)
                            .concat(outs.slice(0, Math.max(0, outs.length - add.length)));
          picks = keep.concat(add).slice(0, need);
        }
      }
    }
    return shuf([...right, ...picks]);
  }

  wrong = shuf(wrong);
  return shuf([...right, ...wrong.slice(0, Math.max(0, need))]);
}

/* ═══════════════════════════════════════════════════
   QUESTION DIFFICULTY RATING
═══════════════════════════════════════════════════ */
const FAMOUS = new Set(['pele','messi','cr7','ronaldo','ronaldinho','neymar',
  'maradona','zidane','romario','garrincha','zico','kaka','mbappe','vinicius','gabigol']);

/* How hard a question is, on a scale of five.
   It used to be three, which is fine for three difficulty buttons and wrong
   for a sixteen-rung ladder: rungs 10 to 16 all asked for "tier 3" and drew
   from one bucket, so the last seven questions of a Milhão run were no harder
   than the tenth. The category still sets the base; what moves it is the
   answer itself — a famous name is easier than an obscure one whatever the
   category, a man who debuted in 1955 is harder than one playing now, and
   being asked for two names is harder than being asked for one. */
function qTier(q) {
  return Math.max(1, Math.min(5, _qBase(q) + _qShift(q)));
}

function _qShift(q) {
  if (q.type !== 'player') return 0;
  const ans = (q.a || []).map(id => PL.find(x => x.id === id)).filter(Boolean);
  let shift = ans.length > 1 ? 1 : 0;        // "selecione os 2" is harder
  if (!ans.length) return shift;
  if (ans.some(p => FAMOUS.has(p.id))) return shift - 1;
  const debut = Math.min(...ans.map(p => (p.era ? p.era[0] : 2000)));
  if (debut < 1960) return shift + 2;
  if (debut < 1975) return shift + 1;
  return shift;
}

function _qBase(q) {
  if (q.d) return q.d;                       // explicit override
  const cid = (q._cat && q._cat.id) || '';
  if (cid === 'ouro') return 4;              // the older pages, by construction
  if (cid === 'origens') return 4;           // nobody knows 1863 by accident
  if (cid === 'europa') return 3;
  if (cid === 'curiosos') return 3;
  if (cid === 'estados')  return 1;
  if (cid === 'estadios') return 2;
  if (cid === 'lendas')   return 2;
  if (cid === 'libertadores' || cid === 'brasileirao') {
    const m = /\b(19|20)\d{2}\b/.exec(q.t);
    const y = m ? parseInt(m[0], 10) : 2000;
    return y >= 2015 ? 1 : y >= 2005 ? 2 : 3;
  }
  if (cid === 'craques') {
    return q.a.some(id => FAMOUS.has(id)) ? 2 : 3;
  }
  if (cid === 'copa') {
    const m = /\b(19|20)\d{2}\b/.exec(q.t);
    const y = m ? parseInt(m[0], 10) : 2000;
    return y >= 2002 ? 2 : 3;
  }
  if (cid === 'apelidos') return q.a.some(id => FAMOUS.has(id)) ? 1 : 2;
  return 2;
}

/* What a question is *about*, as a key: its answers, sorted. Two questions
   with the same answer are the same question as far as one round is concerned,
   however differently they are worded. */
const ansKey = q => ((q && q.a) || []).slice().sort().join('|');

/* Text tiles: either the question asked for them (photo reveal, career path)
   or its answers are words rather than rows, which leaves nothing to draw. */
const isTextQ = q => !!(q && (q.textTiles || q.type === 'txt'));

/* The question's *shape* — its opening words with the variable parts
   stripped out. Two questions share a shape when they would feel like the
   same question asked twice, even though their text differs. */
function qShape(q) {
  return String(q.t || '')
    .replace(/\d+/g, '#')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 34)
    .toLowerCase();
}

function buildGame(key) {
  const cfg = DIFFS.find(d => d.key === key) || DIFFS[0];
  let all = CATS.flatMap(c => c.qs.map(q => ({ ...q, _cat: c })));
  if (typeof GEN_QS === 'function') all = all.concat(GEN_QS(cfg.tier));
  all.forEach(q => { q._d = qTier(q); });

  // prefer questions at the requested tier, then nearest tiers
  const scored = shuf(all).map(q => ({ q, w: -Math.abs(q._d - cfg.tier) * 10 + rnd() * 4 }));
  scored.sort((a, b) => b.w - a.w);

  /* Fill the round greedily, but charge a price for repetition: the same
     category twice in a row, or a fourth "qual destes clubes foi fundado…",
     makes a round feel like a worksheet even when every question is fair.
     De-duplication by exact text is not enough — it is the *shape* that
     repeats, so questions are also bucketed by their opening words. */
  /* Two questions can be different sentences and still be the same question:
     "qual goleiro soviético é o único a ganhar a Bola de Ouro" and "qual
     goleiro é o único a ganhar a Bola de Ouro" are both Yashin, and a round
     that asked both looked broken. Text and shape were already de-duplicated;
     the answer is the third thing that must not repeat. */
  const seen  = new Set();
  const seenA = new Set();
  const byCat = {};
  const byShape = {};
  const qs = [];
  while (qs.length < cfg.n) {
    let best = null, bestI = -1, bestW = -1e9;
    for (let i = 0; i < scored.length; i++) {
      const o = scored[i];
      if (!o || seen.has(o.q.t) || seenA.has(ansKey(o.q))) continue;
      const cid   = (o.q._cat && o.q._cat.id) || '?';
      const shape = qShape(o.q);
      const w = o.w
              - (byCat[cid] || 0) * 6
              - (byShape[shape] || 0) * 14
              - (qs.length && ((qs[qs.length - 1]._cat || {}).id === cid) ? 9 : 0);
      if (w > bestW) { bestW = w; best = o; bestI = i; }
    }
    if (!best) break;
    scored[bestI] = null;
    seen.add(best.q.t);
    seenA.add(ansKey(best.q));
    const cid = (best.q._cat && best.q._cat.id) || '?';
    byCat[cid] = (byCat[cid] || 0) + 1;
    byShape[qShape(best.q)] = (byShape[qShape(best.q)] || 0) + 1;
    qs.push(best.q);
  }

  return {
    id: 'mixed', name: 'Futebol Quiz BR', emoji: '⚽',
    tag: 'Perguntas misturadas', col: '#FFD700', diff: cfg.label,
    qs: shuf(qs),
  };
}


/* ═══════════════════════════════════════════════════
   QUESTION GENERATORS
   Build fresh questions from the structured data so the
   pool never runs dry and distractors are correct by design.
═══════════════════════════════════════════════════ */
function GEN_QS(tier) {
  /* GENCAT — badge shown in the quiz header for generated questions */
  const GC = {
    club:  { id:'g_club',  name:'Carreira',  emoji:'🧭', col:'#26A69A' },
    pos:   { id:'g_pos',   name:'Posição',   emoji:'🎯', col:'#7E57C2' },
    nat:   { id:'g_nat',   name:'Seleções',  emoji:'🌎', col:'#42A5F5' },
    hist:  { id:'g_hist',  name:'História',  emoji:'📚', col:'#C8A400' },
    squad: { id:'g_squad', name:'Elenco',    emoji:'👥', col:'#66BB6A' },
    era:   { id:'g_era',   name:'Época',     emoji:'⏳', col:'#FFA726' },
    photo: { id:'g_photo', name:'Foto',      emoji:'📸', col:'#EC407A' },
    path:  { id:'g_path',  name:'Caminho',   emoji:'🔀', col:'#26C6DA' },
  };
  const out  = [];
  const CIDS = new Set(CL.map(c => c.id));
  const rndOf = a => a[Math.floor(rnd() * a.length)];
  const pick = (a, n) => shuf(a).slice(0, n);

  /* ── 1. Which Brazilian club did this player turn out for? ── */
  const withBr = PL.filter(p => (p.clubs || []).some(c => CIDS.has(c)));
  pick(withBr, 26).forEach(p => {
    const mine = (p.clubs || []).filter(c => CIDS.has(c));
    out.push({
      t: `Por qual destes clubes ${p.n} jogou?`,
      a: [rndOf(mine)],
      pool: CL.filter(c => !(p.clubs || []).includes(c.id)).map(c => c.id),
      face: p.img, _cat: GC.club,
      d: p.ctry === 'BRA' ? 2 : 3,
    });
  });

  /* ── 2. Position recognition ── */
  ['GK', 'DF', 'MF'].forEach(pos => {
    const same   = PL.filter(p => p.pos === pos);
    const others = PL.filter(p => p.pos !== pos);
    if (same.length < 2 || others.length < 9) return;
    pick(same, 4).forEach(p => {
      out.push({
        t: `Qual destes jogadores atuava como ${POS_NAME[pos].toLowerCase()}?`,
        a: [p.id], type: 'player',
        pool: others.map(x => x.id), _cat: GC.pos,
        d: pos === 'GK' ? 1 : 2,
      });
    });
  });

  /* ── 3. Nationality ── */
  const byCtry = {};
  PL.forEach(p => { (byCtry[p.ctry] = byCtry[p.ctry] || []).push(p); });
  Object.keys(byCtry).filter(c => c !== 'BRA' && byCtry[c].length >= 1).forEach(c => {
    const p = rndOf(byCtry[c]);
    out.push({
      t: `Qual destes jogadores defendeu a seleção ${ctrySel(c)}?`,
      _skip: !CTRY_NAME[c],
      a: [p.id], type: 'player',
      pool: PL.filter(x => x.ctry !== c).map(x => x.id), _cat: GC.nat,
      d: 2,
    });
  });

  /* ── 4. Oldest club (comparison, exact 10 tiles) ── */
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const oldest = set.reduce((a, b) => (a.f <= b.f ? a : b));
    if (set.filter(c => c.f === oldest.f).length > 1) continue;   // avoid ties
    out.push({ t: 'Qual destes clubes foi fundado primeiro?',
               a: [oldest.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 3 });
  }

  /* ── 5. Most Brasileirão titles ── */
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const top = set.reduce((a, b) => (a.br >= b.br ? a : b));
    if (top.br === 0 || set.filter(c => c.br === top.br).length > 1) continue;
    out.push({ t: 'Qual destes clubes tem mais títulos do Brasileirão?',
               a: [top.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* ── 6. Libertadores winners (multi-select) ── */
  for (let i = 0; i < 3; i++) {
    const champs = pick(CL.filter(c => c.lib > 0), 3);
    const rest   = pick(CL.filter(c => c.lib === 0), 7);
    if (champs.length < 3 || rest.length < 7) break;
    out.push({ t: 'Selecione os clubes que JÁ venceram a Libertadores',
               a: champs.map(c => c.id),
               fixed: champs.concat(rest).map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* ── 7. Team-mates: who also played for this club? ── */
  const clubPlayers = {};
  PL.forEach(p => (p.clubs || []).forEach(c => {
    if (CIDS.has(c)) (clubPlayers[c] = clubPlayers[c] || []).push(p);
  }));
  pick(Object.keys(clubPlayers).filter(c => clubPlayers[c].length >= 2), 6).forEach(c => {
    const yes = pick(clubPlayers[c], 2);
    const no  = PL.filter(p => !(p.clubs || []).includes(c));
    out.push({
      t: `Selecione os 2 jogadores que passaram pelo ${clubName(c)}`,
      a: yes.map(p => p.id), type: 'player',
      pool: no.map(p => p.id),
      crest: c, _cat: GC.squad,
      d: 3,
    });
  });

  /* ── 8. Era placement ── */
  pick(PL.filter(p => p.era && p.era[0] >= 1990), 6).forEach(p => {
    const dec = Math.floor(p.era[0] / 10) * 10;
    const others = PL.filter(x => x.era && Math.floor(x.era[0] / 10) * 10 !== dec);
    if (others.length < 9) return;
    out.push({
      t: `Qual destes jogadores começou a carreira nos anos ${dec}?`,
      a: [p.id], type: 'player',
      pool: others.map(x => x.id), _cat: GC.era,
      d: 3,
    });
  });

  /* ── 9. PHOTO REVEAL: the picture sharpens as the clock runs down ── */
  pick(PL.filter(p => p.img), 8).forEach(p => {
    const others = PL.filter(x => x.id !== p.id);
    out.push({
      t: 'Quem é este jogador? (a foto vai ficando nítida)',
      a: [p.id], type: 'player',
      reveal: p.img,
      textTiles: true,
      pool: others.map(x => x.id), _cat: GC.photo,
      d: 2,
    });
  });

  /* ── 10. CAREER PATH: guess the player from the clubs he played for ── */
  pick(PL.filter(p => (p.clubs || []).length >= 3), 8).forEach(p => {
    /* Joined with a middle dot, not an arrow: U+2192 has no glyph in Roboto,
       so Android's WebView draws a box between every club. The wording
       carries the ordering instead. */
    const path = (p.clubs || []).slice(0, 4).map(clubName).join('  ·  ');
    out.push({
      t: `Que jogador passou por estes clubes, nesta ordem?\n${path}`,
      a: [p.id], type: 'player',
      textTiles: true,
      pool: PL.filter(x => x.id !== p.id).map(x => x.id), _cat: GC.path,
      d: 3,
    });
  });

  /* ═════ GEN2 — extra templates ═════ */

  /* 11. Stadium → club */
  const STIDS = Object.keys(typeof STAD !== 'undefined' ? STAD : {});
  const STAD_CLUB = { allianz:'palmeiras', neoq:'corinthians', beirario:'internacional',
    vilabelmiro:'santos', saojanua:'vasco', arena_gre:'gremio',
    morumbi:'saopaulo',
    fontenova:'bahia',
    couto:'coritiba',
    arruda:'santacruz',  };
  pick(STIDS.filter(k => STAD_CLUB[k]), 4).forEach(k => {
    const owner = STAD_CLUB[k];
    out.push({
      t: `Qual clube manda seus jogos no ${STAD[k].name}, em ${STAD[k].city}?`,
      a: [owner],
      pool: CL.filter(c => c.id !== owner).map(c => c.id),
      stad: k,
      _cat: GC.hist, d: 2,
    });
  });

  /* 12. Which club is from this state? */
  const byState = {};
  CL.forEach(c => { (byState[c.s] = byState[c.s] || []).push(c); });
  const ST_NAME = { RJ:'Rio de Janeiro', SP:'São Paulo', RS:'Rio Grande do Sul',
    MG:'Minas Gerais', PR:'Paraná', BA:'Bahia', CE:'Ceará', PE:'Pernambuco',
    SC:'Santa Catarina', GO:'Goiás', MT:'Mato Grosso', PA:'Pará', AL:'Alagoas',
    RN:'Rio Grande do Norte', MA:'Maranhão' };
  /* Bahia is from Bahia, Ceará from Ceará, Goiás from Goiás — asking which of
     these is from that state answers itself. Such a club stays in the pool as a
     wrong answer elsewhere; it just cannot be the answer to its own name. */
  const namesState = (c, st) => {
    const a = _fold(c.n), b = _fold(ST_NAME[st] || '');
    return !!b && (a.indexOf(b) !== -1 || b.indexOf(a) !== -1);
  };
  pick(Object.keys(byState).filter(st =>
    ST_NAME[st] && byState[st].some(c => !namesState(c, st))), 5).forEach(st => {
    const ok = byState[st].filter(c => !namesState(c, st));
    out.push({
      t: `Qual destes clubes é de ${ST_NAME[st]}?`,
      a: [rndOf(ok).id],
      pool: CL.filter(c => c.s !== st && !namesState(c, st)).map(c => c.id),
      _cat: GC.hist, d: 1,
    });
  });

  /* 13. Head-to-head: who played longer? */
  for (let i = 0; i < 4; i++) {
    const two = pick(PL.filter(p => p.era), 2);
    if (two.length < 2) break;
    const span = p => p.era[1] - p.era[0];
    if (span(two[0]) === span(two[1])) continue;
    const longer = span(two[0]) > span(two[1]) ? two[0] : two[1];
    out.push({
      t: 'Quem teve a carreira mais longa?',
      a: [longer.id], type: 'player',
      fixed: two.map(p => p.id),
      _cat: GC.era, d: 2,
    });
  }

  /* 14. Odd one out — nine share a trait, one doesn't */
  ['GK', 'DF', 'MF', 'FW'].forEach(pos => {
    const same = PL.filter(p => p.pos === pos);
    const other = PL.filter(p => p.pos !== pos);
    if (same.length < 9 || !other.length) return;
    const odd = rndOf(other);
    out.push({
      t: `Qual destes NÃO era ${POS_NAME[pos].toLowerCase()}?`,
      a: [odd.id], type: 'player',
      fixed: pick(same, 9).map(p => p.id).concat(odd.id),
      _cat: GC.pos, d: 2,
    });
  });

  /* 15. Which club was founded in this decade? */
  for (let i = 0; i < 3; i++) {
    const c = rndOf(CL);
    const dec = Math.floor(c.f / 10) * 10;
    const others = CL.filter(x => Math.floor(x.f / 10) * 10 !== dec);
    if (others.length < 9) continue;
    out.push({
      t: `Qual destes clubes foi fundado na década de ${dec}?`,
      a: [c.id],
      pool: others.map(x => x.id),
      _cat: GC.hist, d: 3,
    });
  }

  /* 16. Contemporaries — who played in the same era? */
  pick(PL.filter(p => p.era), 5).forEach(p => {
    const overlaps = x => x.id !== p.id &&
      Math.min(x.era[1], p.era[1]) - Math.max(x.era[0], p.era[0]) >= 5;
    const mates = PL.filter(overlaps);
    const strangers = PL.filter(x => x.id !== p.id && !overlaps(x));
    if (!mates.length || strangers.length < 9) return;
    const mate = rndOf(mates);
    out.push({
      t: `Quem jogou na mesma época que ${p.n}?`,
      a: [mate.id], type: 'player',
      fixed: pick(strangers, 9).map(x => x.id).concat(mate.id),
      face: p.img,
      _cat: GC.era, d: 3,
    });
  });

  /* 17. Most Libertadores titles among these */
  for (let i = 0; i < 3; i++) {
    const set = pick(CL, 10);
    const top = set.reduce((a, b) => (a.lib >= b.lib ? a : b));
    if (top.lib === 0 || set.filter(c => c.lib === top.lib).length > 1) continue;
    out.push({ t: 'Qual destes clubes tem mais títulos da Libertadores?',
               a: [top.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* 18. Country → multi-select */
  Object.keys(byCtry).filter(c => byCtry[c].length >= 2 && c !== 'BRA').slice(0, 4).forEach(c => {
    const yes = pick(byCtry[c], 2);
    const no = PL.filter(p => p.ctry !== c);
    if (no.length < 8) return;
    out.push({
      t: `Selecione os 2 jogadores de ${CTRY_NAME[c] || c}`,
      a: yes.map(p => p.id), type: 'player',
      fixed: yes.map(p => p.id).concat(pick(no, 8).map(p => p.id)),
      _cat: GC.nat, d: 3,
    });
  });

  /* ═════ GEN3 — honours, nicknames, careers abroad ═════ */
  const GC3 = {
    copa:  { id:'copa',   name:'Copa do Mundo', emoji:'🌍', col:'#2E7D4F' },
    bo:    { id:'g_bo',   name:'Bola de Ouro',  emoji:'🏅', col:'#B8860B' },
    nick:  { id:'apelidos', name:'Apelidos',    emoji:'🏷️', col:'#8E4E9E' },
    abroad:{ id:'g_abroad', name:'Europa',      emoji:'✈️', col:'#3F6FB5' },
  };

  /* 19. World champion of a given year — the year clue keeps the wrong
         answers in that era, so this is a real memory test, not a calendar */
  const wcYears = [...new Set(PL.flatMap(p => p.wc))];
  pick(wcYears, 6).forEach(y => {
    const yes = PL.filter(p => p.wc.includes(y));
    const no  = PL.filter(p => !p.wc.includes(y));
    if (!yes.length || no.length < 9) return;
    out.push({
      t: `Qual destes jogadores foi campeão do mundo em ${y}?`,
      a: [rndOf(yes).id], type: 'player',
      pool: no.map(p => p.id), _cat: GC3.copa,
      d: y >= 1994 ? 2 : 3,
    });
  });

  /* 20. Two champions of the same World Cup, among eight who were not */
  pick(wcYears.filter(y => PL.filter(p => p.wc.includes(y)).length >= 2), 3).forEach(y => {
    const yes = pick(PL.filter(p => p.wc.includes(y)), 2);
    const no  = pick(PL.filter(p => !p.wc.includes(y) && p.era && Math.abs(p.era[0] - y) < 22), 8);
    if (no.length < 8) return;
    out.push({
      t: `Selecione os 2 campeões mundiais de ${y}`,
      a: yes.map(p => p.id), type: 'player',
      fixed: yes.concat(no).map(p => p.id), _cat: GC3.copa, d: 3,
    });
  });

  /* 21. The one who never lifted it */
  for (let i = 0; i < 3; i++) {
    const champs = pick(PL.filter(p => p.wc.length), 9);
    const never  = PL.filter(p => !p.wc.length && p.era && p.era[0] >= 1975);
    if (champs.length < 9 || !never.length) break;
    const odd = rndOf(never);
    out.push({
      t: 'Qual destes jogadores NUNCA foi campeão do mundo?',
      a: [odd.id], type: 'player',
      fixed: champs.map(p => p.id).concat(odd.id), _cat: GC3.copa, d: 3,
    });
  }

  /* 22. Ballon d'Or */
  for (let i = 0; i < 3; i++) {
    const yes = PL.filter(p => p.bo > 0);
    const no  = PL.filter(p => !p.bo);
    if (yes.length < 3 || no.length < 8) break;
    const two = pick(yes, 2);
    out.push({
      t: 'Selecione os 2 jogadores que JÁ venceram a Bola de Ouro',
      a: two.map(p => p.id), type: 'player',
      fixed: two.concat(pick(no, 8)).map(p => p.id), _cat: GC3.bo, d: 3,
    });
  }
  pick(PL.filter(p => p.bo > 0), 4).forEach(p => {
    out.push({
      t: 'Qual destes jogadores venceu a Bola de Ouro?',
      a: [p.id], type: 'player',
      pool: PL.filter(x => !x.bo).map(x => x.id), _cat: GC3.bo, d: 2,
    });
  });
  for (let i = 0; i < 2; i++) {
    const set = pick(PL.filter(p => p.bo > 0), 10);
    const top = set.reduce((a, b) => (a.bo >= b.bo ? a : b));
    if (set.length < 10 || set.filter(p => p.bo === top.bo).length > 1) continue;
    out.push({
      t: 'Qual destes jogadores tem MAIS Bolas de Ouro?',
      a: [top.id], type: 'player',
      fixed: set.map(p => p.id), _cat: GC3.bo, d: 3,
    });
  }

  /* 23. Nicknames — match the name the crowd uses to the face */
  pick(PL.filter(p => p.nick && p.nick !== p.n), 8).forEach(p => {
    out.push({
      t: `Qual jogador é conhecido como "${p.nick}"?`,
      a: [p.id], type: 'player',
      pool: PL.filter(x => x.id !== p.id).map(x => x.id), _cat: GC3.nick,
      d: FAMOUS.has(p.id) ? 1 : 2,
    });
  });

  /* 24. Careers abroad — which of these wore this foreign club's shirt? */
  const abroad = {};
  PL.forEach(p => (p.clubs || []).forEach(c => {
    if (!CIDS.has(c)) (abroad[c] = abroad[c] || []).push(p);
  }));
  const bigAbroad = Object.keys(abroad).filter(c => abroad[c].length >= 3 && CLUB_NAMES[c]);
  pick(bigAbroad, 6).forEach(c => {
    const yes = rndOf(abroad[c]);
    out.push({
      t: `Qual destes jogadores vestiu a camisa do ${CLUB_NAMES[c]}?`,
      a: [yes.id], type: 'player',
      pool: PL.filter(p => !(p.clubs || []).includes(c)).map(p => p.id), _cat: GC3.abroad,
      d: abroad[c].length >= 6 ? 2 : 3,
    });
  });
  pick(bigAbroad.filter(c => abroad[c].length >= 4), 3).forEach(c => {
    const yes = pick(abroad[c], 2);
    const no  = PL.filter(p => !(p.clubs || []).includes(c));
    if (no.length < 8) return;
    out.push({
      t: `Selecione os 2 jogadores que passaram pelo ${CLUB_NAMES[c]}`,
      a: yes.map(p => p.id), type: 'player',
      pool: no.map(p => p.id), _cat: GC3.abroad, d: 3,
    });
  });

  /* 25. Team-mates abroad: who shared a dressing room with this player? */
  pick(PL.filter(p => (p.clubs || []).some(c => !CIDS.has(c) && (abroad[c] || []).length >= 2)), 5).forEach(p => {
    const cs = (p.clubs || []).filter(c => !CIDS.has(c) && (abroad[c] || []).length >= 2);
    const c  = rndOf(cs);
    const mates = abroad[c].filter(x => x.id !== p.id);
    if (!mates.length) return;
    out.push({
      t: `Quem foi companheiro de ${p.n} no ${CLUB_NAMES[c]}?`,
      a: [rndOf(mates).id], type: 'player',
      pool: PL.filter(x => x.id !== p.id && !(x.clubs || []).includes(c)).map(x => x.id),
      face: p.img, _cat: GC3.abroad, d: 3,
    });
  });

  /* 26. Clubs: the one that never won the league, and the youngest club */
  for (let i = 0; i < 2; i++) {
    const winners = pick(CL.filter(c => c.br > 0), 9);
    const never   = CL.filter(c => c.br === 0);
    if (winners.length < 9 || !never.length) break;
    const odd = rndOf(never);
    out.push({ t: 'Qual destes clubes NUNCA foi campeão brasileiro?',
               a: [odd.id], fixed: winners.map(c => c.id).concat(odd.id), _cat: GC.hist, d: 2 });
  }
  for (let i = 0; i < 2; i++) {
    const set = pick(CL, 10);
    const newest = set.reduce((a, b) => (a.f >= b.f ? a : b));
    if (set.filter(c => c.f === newest.f).length > 1) continue;
    out.push({ t: 'Qual destes clubes é o mais novo — fundado por último?',
               a: [newest.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 3 });
  }

  /* 27. Same-year league and cup — who won the Brasileirão the year this club won the Libertadores? */
  pick(Object.keys(LIB_CHAMPS).filter(y => BR_CHAMPS[y] && BR_CHAMPS[y] !== LIB_CHAMPS[y]), 3).forEach(y => {
    out.push({
      t: `Em ${y} o ${clubName(LIB_CHAMPS[y])} venceu a Libertadores. Quem foi o campeão brasileiro naquele ano?`,
      a: [BR_CHAMPS[y]],
      pool: CL.filter(c => c.id !== BR_CHAMPS[y]).map(c => c.id),
      crest: LIB_CHAMPS[y], _cat: GC.hist, d: 3,
    });
  });

  /* ═════ GEN4 — as gerações: quem jogou com quem, e quando ═════
     Everything here is derived from era, position and the World Cup table, so
     it grows on its own as the album does. Each generator refuses to emit
     unless the answer is unique — an "odd one out" with two odd ones is worse
     than no question at all. */
  const GC4 = {
    geracao: { id:'g_geracao', name:'Gerações',  emoji:'⏳', col:'#8A6D3B' },
    elenco:  { id:'g_elenco',  name:'O elenco',  emoji:'👥', col:'#2E7D4F' },
  };

  /* 28. Who lifted it alongside him — the same squad, same year */
  pick(PL.filter(p => p.wc.length), 6).forEach(p => {
    const y     = rndOf(p.wc);
    const mates = PL.filter(x => x.id !== p.id && x.wc.includes(y));
    if (mates.length < 1) return;
    /* wrong answers are contemporaries who never won that one, so the question
       cannot be solved by spotting the one old photo among nine new ones */
    const no = PL.filter(x => !x.wc.includes(y) && x.era && Math.abs(x.era[0] - y) < 18);
    if (no.length < 9) return;
    out.push({
      t: `Quem foi campeão do mundo em ${y} ao lado de ${p.n}?`,
      a: [rndOf(mates).id], type: 'player',
      pool: no.map(x => x.id), face: p.img, _cat: GC4.elenco, d: 3,
    });
  });

  /* 29. The man in that shirt: one position, one winning squad */
  const POS_ASK = { GK:'o goleiro', DF:'um zagueiro', MF:'um meio-campista', FW:'um atacante' };
  pick(wcYears, 5).forEach(y => {
    const squad = PL.filter(p => p.wc.includes(y));
    const pos   = rndOf(['GK', 'DF', 'MF', 'FW']);
    const yes   = squad.filter(p => p.pos === pos);
    /* only ask when the answer is the one man it can be */
    if (yes.length !== 1) return;
    const no = PL.filter(p => p.pos === pos && !p.wc.includes(y)
                              && p.era && Math.abs(p.era[0] - y) < 20);
    if (no.length < 9) return;
    out.push({
      t: `Quem era ${POS_ASK[pos]} campeão do mundo de ${y}?`,
      a: [yes[0].id], type: 'player',
      pool: no.map(p => p.id), _cat: GC4.elenco, d: 3,
    });
  });

  /* 30. Oldest of the ten — the album spans seventy years, so this is a real
         question about eras rather than a guess */
  for (let i = 0; i < 3; i++) {
    const set = pick(PL.filter(p => p.era), 10);
    if (set.length < 10) break;
    const first = set.reduce((a, b) => (a.era[0] <= b.era[0] ? a : b));
    if (set.filter(p => p.era[0] === first.era[0]).length > 1) continue;
    out.push({
      t: 'Qual destes jogadores começou a carreira PRIMEIRO?',
      a: [first.id], type: 'player',
      fixed: set.map(p => p.id), _cat: GC4.geracao, d: 3,
      _hideEra: true,   // the card's own decade and stock would answer it
    });
  }

  /* 31. The intruder from another age */
  for (let i = 0; i < 4; i++) {
    const dec  = rndOf([1950, 1960, 1970, 1980, 1990, 2000]);
    const same = PL.filter(p => p.era && Math.floor(p.era[0] / 10) * 10 === dec);
    const far  = PL.filter(p => p.era && Math.abs(p.era[0] - dec) >= 25);
    if (same.length < 9 || !far.length) continue;
    const odd = rndOf(far);
    out.push({
      t: `Nove destes jogadores estrearam nos anos ${String(dec).slice(2)}. Qual é o intruso?`,
      a: [odd.id], type: 'player',
      fixed: pick(same, 9).map(p => p.id).concat(odd.id), _cat: GC4.geracao, d: 3,
      _hideEra: true,
    });
  }

  /* 32. A world champion in this club's shirt.
         Deliberately not "wore it in the 70s": the data holds a career span and
         a set of clubs, never which club in which year, so a decade in the
         question would be a claim the album cannot back — it would have had
         Ronaldo at Corinthians in the 1990s, fifteen years early. Club plus
         world title is two facts the data really does hold. */
  for (let i = 0; i < 5; i++) {
    const c   = rndOf(CL).id;
    const yes = PL.filter(p => (p.clubs || []).includes(c) && p.wc.length);
    if (!yes.length) continue;
    const no = PL.filter(p => p.wc.length && !(p.clubs || []).includes(c));
    if (no.length < 9) continue;
    out.push({
      t: `Qual destes campeões do mundo vestiu a camisa do ${clubName(c)}?`,
      a: [rndOf(yes).id], type: 'player',
      pool: no.map(p => p.id), crest: c, _cat: GC4.geracao, d: 3,
    });
  }

  /* 33. More World Cups than the rest */
  for (let i = 0; i < 2; i++) {
    const set = pick(PL.filter(p => p.wc.length), 10);
    if (set.length < 10) break;
    const top = set.reduce((a, b) => (a.wc.length >= b.wc.length ? a : b));
    if (set.filter(p => p.wc.length === top.wc.length).length > 1) continue;
    out.push({
      t: 'Qual destes jogadores ganhou MAIS Copas do Mundo?',
      a: [top.id], type: 'player',
      fixed: set.map(p => p.id), _cat: GC4.elenco, d: 3,
    });
  }

  /* 34. Countrymen — the album reaches thirty-nine nations now */
  pick([...new Set(PL.map(p => p.ctry))].filter(
        c => c !== 'BRA' && PL.filter(p => p.ctry === c).length >= 3), 5).forEach(c => {
    const yes = pick(PL.filter(p => p.ctry === c), 2);
    const no  = PL.filter(p => p.ctry !== c);
    if (yes.length < 2 || no.length < 8) return;
    out.push({
      t: `Selecione os 2 jogadores que defenderam a seleção ${ctrySel(c)}`,
      a: yes.map(p => p.id), type: 'player',
      fixed: yes.concat(pick(no, 8)).map(p => p.id), _cat: GC4.geracao, d: 3,
      _noFlag: true, _hideCtry: true,
    });
  });

  /* ═════ GEN5 — read the crest, read the years ═════ */
  const GC5 = {
    escudo: { id:'g_escudo', name:'Escudos',  emoji:'🛡️', col:'#B23A2E' },
    conta:  { id:'g_conta',  name:'Contas',   emoji:'🔢', col:'#6B5B3E' },
  };

  /* 35. Whose crest is this?
         The tiles must be names, not crests — ten crests beside the one in the
         question turns a football question into spot-the-picture. */
  pick(CL.filter(c => LOGOS[c.id]), 8).forEach(c => {
    out.push({
      t: 'De que clube é este escudo?',
      a: [c.id],
      crest: c.id,
      _crestIsQ: true,          // the crest is the question, not decoration
      textTiles: true,
      pool: CL.filter(x => x.id !== c.id).map(x => x.id),
      _cat: GC5.escudo,
      /* a crest you see every weekend is easier than one from the Série B */
      d: (c.br || 0) + (c.lib || 0) > 0 ? 2 : 4,
    });
  });

  /* 36. Which decade did he start in? Answers are decades, so the tiles are
         words and the card cannot show its own band. */
  pick(PL.filter(p => p.era), 6).forEach(p => {
    const dec = Math.floor(p.era[0] / 10) * 10;
    const span = [1920, 1930, 1940, 1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020];
    const near = span.filter(d => d !== dec && Math.abs(d - dec) <= 30);
    if (near.length < 4) return;
    const label = d => `Anos ${String(d).slice(2)}`;
    out.push({
      t: `Em que década ${p.n} começou a carreira?`,
      type: 'txt',
      choices: shuf([dec].concat(pick(near, 4))).map(label),
      a: [label(dec)],
      face: p.img,
      _cat: GC5.conta,
      d: FAMOUS.has(p.id) ? 2 : 4,
    });
  });

  /* 37. How many did he win? */
  pick(PL.filter(p => p.wc.length), 5).forEach(p => {
    const n = p.wc.length;
    const label = k => k === 1 ? '1 Copa' : `${k} Copas`;
    const opts = [0, 1, 2, 3].filter(k => k !== n).slice(0, 3);
    out.push({
      t: `Quantas Copas do Mundo ${p.n} venceu como jogador?`,
      type: 'txt',
      choices: shuf([n].concat(opts)).map(k => k === 0 ? 'Nenhuma' : label(k)),
      a: [n === 0 ? 'Nenhuma' : label(n)],
      face: p.img,
      _cat: GC5.conta,
      d: 3,
    });
  });

  // Safety net: a generator bug must never put an unanswerable question in front
  // of a player, so drop anything whose answers don't resolve.
  return out.filter(q =>
    !q._skip &&
    q.a && q.a.length &&
    q.a.every(id => (q.type === 'player' ? PL : CL).some(x => x.id === id)));
}

/* ═══════════════════════════════════════════════════
   GAME STATE
═══════════════════════════════════════════════════ */
let sc       = 'home';
let cat      = null;
let qi       = 0;
let numQs    = 10;
let diffKey  = 'facil';
let sel      = new Set();
let pts      = 0;
let prevPts  = 0;   // to detect score change for animation
let streak   = 0;
let disp     = [];
let tLeft    = 30;
let tMax     = 30;
let tmr      = null;
let lastMsg  = '';
/* ═══════════════════════════════════════════════════
   COMBO SCORING + PERSISTENCE
═══════════════════════════════════════════════════ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('fqbr_' + k);
                    return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fqbr_' + k, JSON.stringify(v)); } catch (e) {} },
};
let scores     = LS.get('scores', {});      // best points per difficulty
/* ── The album proper ───────────────────────────────────────
   Answer a player correctly and his figurinha is stuck into your album
   for good. This is the one piece of progress that survives every run
   and never goes down, so it is stored as a plain list of ids. */
let album      = new Set(LS.get('album', []));
function collect(ids) {
  const fresh = ids.filter(id => !album.has(id) && PL.some(p => p.id === id));
  fresh.forEach(id => album.add(id));
  if (fresh.length) LS.set('album', [...album]);
  return fresh;
}
const albumPct = () => Math.round(album.size / Math.max(1, PL.length) * 100);
let stats      = LS.get('stats', { games:0, correct:0, answered:0, bestStreak:0 });
let nCorrect   = 0;   // perfect answers this run
let nPartial   = 0;
let bestStreak = 0;
let lastGain   = 0;
let runLog     = [];  // per-question 3/1/0, for the share card
let runNew     = 0;   // figurinhas collected this run
let runNewIds  = [];  // and which ones, so the end screen can show them

/* points for one answer, with speed + combo + difficulty multipliers */
function scoreAnswer(base) {
  if (base <= 0) return { gained:0, mult:1, speed:0 };
  const frac  = tMax ? tLeft / tMax : 0;
  const speed = base === 3 ? (frac > 0.6 ? 2 : frac > 0.3 ? 1 : 0) : 0;
  const mult  = streak >= 6 ? 3 : streak >= 3 ? 2 : 1;
  return { gained: Math.round((base + speed) * mult * DCFG().pmul), mult, speed };
}


/* ═══════════════════════════════════════════════════
   DAILY CHALLENGE
   One identical 10-question run per day for everybody,
   plus a Wordle-style card that is easy to paste in WhatsApp.
═══════════════════════════════════════════════════ */
let isDaily = false;

function dailyDone() { return LS.get('dailyDay', -1) === dayIndex(); }
function dailyInfo() { return LS.get('dailyRes', null); }

function dailyStreakNow() {
  const last = LS.get('dailyDay', -1);
  const st   = LS.get('dailyStreak', 0);
  const today = dayIndex();
  if (last === today || last === today - 1) return st;
  return 0;                       // streak broken
}

function saveDaily() {
  const today = dayIndex(), last = LS.get('dailyDay', -1);
  let st = LS.get('dailyStreak', 0);
  st = (last === today - 1) ? st + 1 : (last === today ? st : 1);
  LS.set('dailyDay', today);
  LS.set('dailyStreak', st);
  LS.set('dailyRes', { pts, nCorrect, total: cat.qs.length, log: runLog, streak: st });
}

function shareText() {
  const link = 'https://tdosreis.github.io/futebol-quiz/';

  /* The ladder gets its own card: the climb reads better as a column of
     rungs than as a row of squares, and the number is the whole story. */
  if (isMil) {
    const climb   = LADDER.map((s, i) => i < rung ? '🟨' : '⬛').join('');
    const verdict = banked >= LADDER[LADDER.length - 1].v ? 'LEVEI O MILHÃO!'
                  : cashed ? 'parei e levei' : 'caí e levei';
    return `Rumo ao Milhão ⚽ Futebol Quiz BR\n${climb}\n`
         + `${verdict} ${money(banked)} · degrau ${rung}/${LADDER.length}\n${link}`;
  }

  const grid = runLog.map(p => p === 3 ? '🟩' : p === 1 ? '🟨' : p === -1 ? '⬜' : '⬛').join('');
  const head = isDaily ? `Futebol Quiz BR ⚽ Desafio #${dayIndex()}`
                       : `Futebol Quiz BR ⚽ ${DCFG().label}`;
  const strk = bestStreak >= 3 ? `  🔥${bestStreak}` : '';
  return `${head}\n${grid}\n${nCorrect}/${cat.qs.length} acertos · ${pts} pts${strk}\n${link}`;
}

function doShare() {
  const txt = shareText();
  if (navigator.share) {
    navigator.share({ text: txt }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      const b = document.getElementById('bshare');
      if (b) { b.textContent = 'COPIADO!'; setTimeout(() => { b.textContent = 'COMPARTILHAR'; }, 1600); }
    }).catch(() => {});
  }
}

function startDaily() {
  isDaily = true; isSurv = false; isMil = false;
  diffKey = 'moderado';
  seedFrom(dayIndex());
  cat = buildGame('moderado');
  cat.qs = cat.qs.slice(0, 10);
  cat.name = 'Desafio Diário';
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = []; runNew = 0; runNewIds = []; gameN++;
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}


/* ═══════════════════════════════════════════════════
   AJUDAS (LIFELINES)
   The show's five cards, each usable once per run. They cost
   nothing but the speed bonus, so using one is a real trade-off.
     cortar   — burns half the wrong tiles
     placar   — the audience votes
     expert   — a pundit gives an opinion (and can be wrong)
     congelar — stops the clock for this question
     pular    — next question, same rung
   `parar` (cash out) lives with the ladder, not here: it ends the run.
═══════════════════════════════════════════════════ */
let lifes  = { half: 1, poll: 1, expert: 1, freeze: 1, skip: 1 };
let hidden = new Set();   // tiles burned by "cortar"
let frozen = false;       // clock paused for this question
let poll   = null;        // {id: percent} audience vote, drawn over the tiles
let expert = null;        // { id, line } the pundit's call

function resetLifes() {
  lifes  = { half: 1, poll: 1, expert: 1, freeze: 1, skip: 1 };
  hidden = new Set();
  frozen = false;
  poll   = null;
  expert = null;
  ladderOpen = false;
}

/* cleared between questions; the cards themselves stay spent */
function clearHelpers() {
  hidden = new Set();
  frozen = false;
  poll   = null;
  expert = null;
  ladderOpen = false;
}

/* How many tiles Cortar would actually burn right now. Some questions are
   two-way comparisons ("who had the longer career?"), where halving one
   wrong option rounds to nothing — the card must not be spent on those. */
function cutCount() {
  if (!cat || !cat.qs || !cat.qs[qi]) return 0;
  const q = cat.qs[qi];
  const wrong = disp.filter(o => !q.a.includes(o.id) && !hidden.has(o.id));
  return Math.floor(wrong.length / 2);
}

function useHalf() {
  if (!lifes.half || sc !== 'quiz' || cutCount() < 1) return;
  const q = cat.qs[qi];
  const wrong = disp.filter(o => !q.a.includes(o.id) && !hidden.has(o.id)).map(o => o.id);
  // remove half of the wrong options, keeping the board readable
  const drop = shuf(wrong).slice(0, cutCount());
  drop.forEach(id => { hidden.add(id); sel.delete(id); });
  lifes.half = 0;
  snd.cut();
  justCut = true;   // one render only: the pockets open, then stay open
  firedAid = 'bhalf';
  go();
}

/* ── PLACAR: the audience votes ──────────────────────────────
   The crowd is well informed but not infallible, and it gets shakier
   as the money climbs: the right answer takes the biggest share only
   about as often as the rung is easy. */
function usePoll() {
  if (!lifes.poll || sc !== 'quiz') return;
  const q    = cat.qs[qi];
  const live = disp.filter(o => !hidden.has(o.id));
  if (!live.length) return;

  /* How often the crowd's biggest bar is actually the right answer. Decided
     up front rather than emerging from weights, because this number is the
     whole balance of the card: too high and Placar is a free answer that
     makes the other four pointless, too low and nobody would spend it.
     ~88% on the first rung, ~22% on the last. */
  const acc     = isMil ? Math.max(0.22, 0.88 - rung * 0.045) : 0.75;
  const rightOf = live.filter(o => q.a.includes(o.id));
  const wrongOf = live.filter(o => !q.a.includes(o.id));
  const lands   = rnd() < acc && rightOf.length > 0;
  const pool    = lands ? rightOf : (wrongOf.length ? wrongOf : live);
  const winner  = pool[Math.floor(rnd() * pool.length)];

  /* The leading bar, then the remainder scattered over everyone else. Every
     other share is capped below the lead and whatever is left over from the
     rounding goes back to the winner, so the biggest bar is always the one
     the crowd actually picked — otherwise the card would lie about itself. */
  const lead   = Math.round(24 + rnd() * 22);      // 24–46%
  const others = live.filter(o => o.id !== winner.id);
  const noise  = others.map(o => ({ id: o.id, w: 0.25 + rnd() * rnd() * 3 }));
  const sum    = noise.reduce((s, x) => s + x.w, 0) || 1;
  const cap    = Math.max(1, lead - 2);

  poll = {};
  let spent = 0;
  noise.forEach(x => {
    const share = Math.max(0, Math.min(cap, Math.round(x.w / sum * (100 - lead))));
    poll[x.id] = share;
    spent += share;
  });
  poll[winner.id] = 100 - spent;                   // ≥ lead, so always the tallest

  lifes.poll = 0;
  snd.crowd();
  firedAid = 'bpoll';
  go();
}

/* ── ESPECIALISTA: a commentator calls it ────────────────────
   Right most of the time early on, distinctly shaky near the million —
   and the phrasing tells you how much to trust him. */
const EXPERT_SURE  = ['Sem sombra de dúvida:', 'Pode marcar tranquilo:', 'Essa eu sei de cor:',
                      'Cravo aqui, sem medo:', 'Acompanhei isso de perto:'];
const EXPERT_UNSURE = ['Acho que é', 'Se a memória não falha,', 'Chutaria em',
                       'Na dúvida eu iria de', 'Vou no palpite:'];

function useExpert() {
  if (!lifes.expert || sc !== 'quiz') return;
  const q    = cat.qs[qi];
  const live = disp.filter(o => !hidden.has(o.id));
  const acc  = isMil ? Math.max(0.4, 0.95 - rung * 0.038) : 0.8;
  const sure = rnd() < acc;

  const rightOnes = live.filter(o => q.a.includes(o.id));
  const wrongOnes = live.filter(o => !q.a.includes(o.id));
  const pickFrom  = sure && rightOnes.length ? rightOnes : (wrongOnes.length ? wrongOnes : live);
  const choice    = pickFrom[Math.floor(rnd() * pickFrom.length)];

  const lines = sure ? EXPERT_SURE : EXPERT_UNSURE;
  expert = {
    id: choice ? choice.id : null,
    sure,
    line: lines[Math.floor(rnd() * lines.length)],
    name: choice ? choice.n : '—',
  };
  lifes.expert = 0;
  snd.select();
  firedAid = 'bexpert';
  go();
}

function useFreeze() {
  if (!lifes.freeze || sc !== 'quiz') return;
  lifes.freeze = 0;
  frozen = true;
  snd.freeze();
  firedAid = 'bfreeze';
  go();
}

function useSkip() {
  if (!lifes.skip || sc !== 'quiz') return;
  lifes.skip = 0;
  clearInterval(tmr);
  snd.swipe();
  runLog.push(-1);                 // neither right nor wrong
  qi++;
  sel.clear(); clearHelpers(); lastMsg = '';
  if (qi >= cat.qs.length) { finishRun(); }
  else {
    sc = 'quiz'; tMax = qTime(); tLeft = tMax;
    disp = getDisp(cat.qs[qi]);
    startTmr();
  }
  firedAid = 'bskip';
  go();
}


/* ═══════════════════════════════════════════════════
   THE BACK OF THE STICKER

   A Panini figurinha has the player's details printed on the reverse.
   So does this one: when the answer is revealed, the card turns over
   and says who he was. Built from the data we already hold, so it is
   right by construction and there is no prose to keep in sync.
═══════════════════════════════════════════════════ */
function playerFacts(p) {
  const out = [];
  out.push(`${POS_NAME[p.pos]} · ${CTRY_NAME[p.ctry] || p.ctry}`);
  if (p.era) out.push(`${p.era[0]}–${p.era[1]}`);
  const honours = [];
  if (p.wc && p.wc.length) honours.push(p.wc.length === 1 ? `Copa de ${p.wc[0]}`
    : `${p.wc.length} Copas (${p.wc.join(', ')})`);
  if (p.bo) honours.push(p.bo === 1 ? 'Bola de Ouro' : `${p.bo} Bolas de Ouro`);
  /* "Ronaldo Fenômeno" already says Fenômeno — only print the nickname
     when it is not sitting in the name already. */
  const nick = p.nick && !p.n.toLowerCase().includes(p.nick.toLowerCase()) ? p.nick : null;
  return { line: out.join(' · '), honours,
           clubs: (p.clubs || []).slice(0, 4).map(clubName).join(' · '), nick };
}

function clubFacts(c) {
  const t = [];
  if (c.lib) t.push(c.lib === 1 ? '1 Libertadores' : `${c.lib} Libertadores`);
  if (c.br)  t.push(c.br === 1 ? '1 Brasileirão' : `${c.br} Brasileirões`);
  return { line: `Fundado em ${c.f} · ${c.s}`, honours: t, clubs: '', nick: c.a };
}

/* The reverse of an album card, shaped like the front so it can sit in the
   same pocket and turn over into it. A real figurinha printed the player's
   details on the back and that is the whole reason you peeled it off the
   sheet and read it — the album had this data all along and never showed it.
   Only collected stickers turn: an empty pocket has no back. */
function figurinhaBack(p, num) {
  const f = playerFacts(p);
  const yrs = p.era ? `${p.era[0]}–${p.era[1]}` : '';
  return `
    <span class="figback">
      <span class="figback-h">
        <span class="figback-n">Nº ${String(num).padStart(3, '0')}</span>
        ${p.ctry ? flagSVG(p.ctry, 8) : ''}
      </span>
      <span class="figback-nm">${p.n}</span>
      ${f.nick ? `<span class="figback-nick">“${f.nick}”</span>` : ''}
      <span class="figback-rule"></span>
      <span class="figback-l"><b>${POS_NAME[p.pos]}</b> · ${CTRY_NAME[p.ctry] || p.ctry}</span>
      ${yrs ? `<span class="figback-l">${yrs}</span>` : ''}
      ${f.clubs ? `<span class="figback-l figback-clubs">${f.clubs}</span>` : ''}
      ${f.honours.length ? `<span class="figback-h2">${f.honours.join(' · ')}</span>` : ''}
    </span>`;
}

/* The card, turned over. `isNew` puts the brass edge on a figurinha the
   player has just collected — the small reward for getting it right. */
function stickerBack(item, isPlayer, isNew) {
  const f = isPlayer ? playerFacts(item) : clubFacts(item);
  return `
  <div class="ficha${isNew ? ' ficha-new' : ''}">
    ${isPlayer
      ? `<div class="ficha-art print"><img src="${item.img}" alt="" aria-hidden="true" /></div>`
      : `<div class="ficha-art ficha-crest">${clubArt(item.id, '', false)}</div>`}
    <div class="ficha-txt">
      <div class="ficha-n">${item.n}${f.nick ? ` <em>“${f.nick}”</em>` : ''}</div>
      <div class="ficha-l">${f.line}</div>
      ${f.clubs ? `<div class="ficha-l">${f.clubs}</div>` : ''}
      ${f.honours.length ? `<div class="ficha-h">${f.honours.join(' · ')}</div>` : ''}
    </div>
    ${isNew ? `<span class="ficha-tag">${ICON.check('currentColor', 10)} nova</span>` : ''}
  </div>`;
}

function earnedMedals() { return MEDALS.filter(m => { try { return m.t(stats); } catch (e) { return false; } }); }

/* returns medals unlocked by the run that just finished */
function newMedals() {
  const had = new Set(LS.get('medals', []));
  const now = earnedMedals().map(m => m.id);
  LS.set('medals', now);
  return MEDALS.filter(m => now.includes(m.id) && !had.has(m.id));
}

/* ═══════════════════════════════════════════════════
   SURVIVAL — one mistake and the run is over
═══════════════════════════════════════════════════ */
let isSurv = false;

function startSurvival() {
  isSurv = true; isDaily = false; isMil = false; _seed = null;
  diffKey = 'moderado';
  cat = buildGame('moderado');
  cat.name = 'Mata-mata';
  // a long queue; the run ends on the first mistake, not on length
  const extra = buildGame('dificil');
  cat.qs = cat.qs.concat(extra.qs);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = []; runNew = 0; runNewIds = []; gameN++;
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);

/* ═══════════════════════════════════════════════════
   RUMO AO MILHÃO — the prize ladder

   The headline mode. Sixteen questions, one per rung, each worth
   more than the last and each drawn from a harder pool with a shorter
   clock and nastier distractors. Two rungs are checkpoints: clear one
   and that money is yours whatever happens afterwards. Miss a question
   and the run ends at your last checkpoint — so every rung above one is
   a bet, and "PARAR" is always on the table.
═══════════════════════════════════════════════════ */
/* Sixteen rungs across five tiers, so the climb is a climb. The two safe
   rungs sit at the top of a tier — you bank at the end of a plateau, then the
   questions step up. */
const LADDER = [
  { v:      1000, tier: 1, time: 45 },
  { v:      2000, tier: 1, time: 45 },
  { v:      3000, tier: 1, time: 42 },
  { v:      5000, tier: 1, time: 40, safe: true },
  { v:     10000, tier: 2, time: 38 },
  { v:     15000, tier: 2, time: 36 },
  { v:     20000, tier: 2, time: 34 },
  { v:     30000, tier: 3, time: 32 },
  { v:     50000, tier: 3, time: 30, safe: true },
  { v:     75000, tier: 3, time: 30 },
  { v:    100000, tier: 4, time: 28 },
  { v:    150000, tier: 4, time: 26 },
  { v:    250000, tier: 4, time: 24 },
  { v:    400000, tier: 5, time: 22 },
  { v:    600000, tier: 5, time: 20 },
  { v:   1000000, tier: 5, time: 20 },
];

let isMil  = false;
let rung   = 0;       // index into LADDER — the question being played for
let banked = 0;       // guaranteed by the last checkpoint cleared
let cashed = false;   // player pressed PARAR instead of falling
let ladderOpen = false;   // the ladder sheet is up; the clock waits

const RUNG    = () => LADDER[Math.min(rung, LADDER.length - 1)];
const isFinal = () => rung === LADDER.length - 1;

/* R$ 1.000.000 — pt-BR grouping without leaning on Intl in old WebViews */
function money(v) {
  return 'R$ ' + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

/* the money you walk away with if you get this one wrong */
function safetyNet() {
  let v = 0;
  for (let i = 0; i < rung; i++) if (LADDER[i].safe) v = LADDER[i].v;
  return v;
}

/* seconds on the clock and distractor strictness for the current question */
function qTime()   { return isMil ? RUNG().time : DCFG().time; }
function qStrict() { return isMil ? Math.min(1, rung / (LADDER.length - 1) * 1.15) : DCFG().strict; }

/* One question per rung, each matched to that rung's tier. Built in one pass
   so a question can never repeat inside a run. */
function buildMilhao() {
  let all = CATS.flatMap(c => c.qs.map(q => ({ ...q, _cat: c })));
  if (typeof GEN_QS === 'function') {
    all = all.concat(GEN_QS(1)).concat(GEN_QS(2)).concat(GEN_QS(3));
  }
  all.forEach(q => { q._d = qTier(q); });

  const seen = new Set();
  const pool = shuf(all).filter(q => { if (seen.has(q.t)) return false; seen.add(q.t); return true; });

  const used = new Set();
  const usedA = new Set();
  const byCat = {}, byShape = {};
  let prevCat = null;
  const qs = LADDER.map(step => {
    let best = null, bestW = -1e9;
    for (let i = 0; i < pool.length; i++) {
      if (used.has(i) || usedA.has(ansKey(pool[i]))) continue;
      const cid = (pool[i]._cat && pool[i]._cat.id) || '?';
      const w = -Math.abs(pool[i]._d - step.tier) * 10 + rnd() * 3
              - (byCat[cid] || 0) * 5
              - (byShape[qShape(pool[i])] || 0) * 12
              - (cid === prevCat ? 8 : 0);
      if (w > bestW) { bestW = w; best = i; }
    }
    if (best === null) return null;
    used.add(best);
    const q = pool[best];
    usedA.add(ansKey(q));
    const cid = (q._cat && q._cat.id) || '?';
    byCat[cid] = (byCat[cid] || 0) + 1;
    byShape[qShape(q)] = (byShape[qShape(q)] || 0) + 1;
    prevCat = cid;
    return q;
  }).filter(Boolean);

  return { id:'milhao', name:'Rumo ao Milhão', emoji:'💰',
           tag:'Uma pergunta por degrau', col:'#FFD700', diff:'Show', qs };
}

function startMilhao() {
  isMil = true; isDaily = false; isSurv = false; _seed = null;
  diffKey = 'moderado';                  // only used for the score multiplier
  cat = buildMilhao();
  rung = 0; banked = 0; cashed = false;
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = []; runNew = 0; runNewIds = []; gameN++;
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* PARAR — take the money on the table and stop. Always a win. */
function cashOut() {
  if (!isMil || sc !== 'quiz') return;
  clearInterval(tmr);
  cashed = true;
  banked = rung > 0 ? LADDER[rung - 1].v : 0;
  snd.cash();
  finishRun();
  go();
}

function milBest() { return LS.get('milBest', 0); }

        <path d="M44 28 q8 -4 12 2 q-3 7 -12 6 Z" fill="#2E7D4F"/>

  /* a little printed vignette of a ground, for the stadium questions */
  stadium(w) {

        <ellipse cx="60" cy="62" rx="44" ry="13" fill="#2E7D4F"/>

/* ═══════════════════════════════════════════════════
   SVG — STADIUM ILLUSTRATION

function mkStad(s) {

  const field = ov
    ? `<ellipse cx="30" cy="30" rx="25" ry="20" fill="#3A7030"/>
       <ellipse cx="30" cy="30" rx="25" ry="20" fill="none" stroke="#FFF" stroke-width="1.5"/>

       the badge sheet on the deepest card stock, the national teams on a cool
       page, the mascots on the brightest sheet in the book. */
    .dec-xe { --pg-paper:#EDE4CE; --pg-edge:#C0AC85; --pg-band:#7A2E22; --pg-bandink:#F6E9DA; }
    .dec-xs { --pg-paper:#E6EDEF; --pg-edge:#A8BEC6; --pg-band:#1F5E7A; --pg-bandink:#E6F3F9; }
    .dec-xm { --pg-paper:#F1E8D0; --pg-edge:#C8B584; --pg-band:#8E5A16; --pg-bandink:#FBF0DA; }
    :root[data-theme="dark"] .dec-xe, :root:not([data-theme="light"]) .dec-xe {
      --pg-paper:#231D17; --pg-edge:#3D3328; --pg-band:#63261C; --pg-bandink:#EDD9CC; }
    :root[data-theme="dark"] .dec-xs, :root:not([data-theme="light"]) .dec-xs {
      --pg-paper:#171F22; --pg-edge:#2B3B41; --pg-band:#194B60; --pg-bandink:#DCEDF5; }
    :root[data-theme="dark"] .dec-xm, :root:not([data-theme="light"]) .dec-xm {
      --pg-paper:#221E14; --pg-edge:#3D3524; --pg-band:#75490F; --pg-bandink:#F6E9D2; }

    /* A crest, a flag or a mascot in the picture window a photo would fill.
       The window keeps the photo's proportions so a row of escudos lines up
       with a row of faces. */
    .fig-extra .fig-art { display: flex; align-items: center; justify-content: center;
      background: var(--retro-card2); }
    .fig-crest, .fig-flagbox, .fig-msc { display: flex; align-items: center;
      justify-content: center; width: 100%; height: 100%; }
    .fig-crest .crest-disc { width: 76%; height: 76%; background: none; box-shadow: none; }
    .fig-flagbox > span { width: 72% !important; height: auto !important;
      box-shadow: 0 0 0 .5px rgba(0,0,0,.35) !important; border-radius: 2px !important; }
    .fig-msc svg { width: 100%; height: 100%; }
    .fig-x-mascote .fig-art { background: none; }
    /* the mascot as a question: square, and on plain card so the club's own
       colours do not answer it */
    .qart-msc { display: flex; align-items: center; justify-content: center; }
    .qart-msc svg { width: 100%; height: 100%; }
    .fig-x-mascote .fig-msc svg rect:first-of-type { opacity: 0; }

    /* ── The country band that opens each page ──────────────────
       Straight out of the old albums: the crest, the name set large and
       heavy, and the same name repeated small in the other languages the
       album was printed in. */
    .alb-sec { display: flex; align-items: center; gap: 9px; margin: 20px 0 9px; }
    .alb-globe { color: var(--ink-3); display: block; }
    .alb-sec .crest-box { width: 34px; flex: none; }
    .alb-sec .t { font-family: var(--font-c); font-weight: 700; text-transform: uppercase;
      font-size: 21px; letter-spacing: .02em; line-height: 1; }
    .alb-sec .langs { font-family: var(--font-c); font-weight: 600; font-size: 7.5px;
      letter-spacing: .16em; text-transform: uppercase; color: #F4EDDC; background: var(--retro-band);
      padding: 2.5px 7px; border-radius: 2px; margin-top: 3px; display: inline-block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .alb-sec .cnt { margin-left: auto; font-family: var(--font-s); font-weight: 800; font-size: 11px;
      color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }

    .alb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
      align-items: stretch; flex: none; margin-bottom: 16px; }
    @media (min-width: 380px) { .alb-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 470px) { .alb-grid { grid-template-columns: repeat(6, 1fr); } }
    .alb-slot { position: relative; display: flex; }
    .alb-slot > .fig { width: 100%; }
    /* the pocket you have not filled yet: the album prints the number and
       waits for the sticker */
    .alb-slot.empty { border: 1.5px dashed var(--rule); border-radius: 4px;
      width: 100%; min-height: 118px; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; background: transparent; }
    @media (min-width: 400px) { .alb-slot.empty { min-height: 132px; } }
    .alb-slot.empty .ph { font-family: var(--font-c); font-weight: 700; color: var(--rule);
      font-size: 15px; letter-spacing: .08em; }
    .alb-slot.empty .nm { font-family: var(--font-c); font-size: 7px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
    .alb-n { position: absolute; top: -4px; left: -4px; z-index: 5; background: var(--ink);
      color: var(--stock); font-family: var(--font-s); font-size: 7px; font-weight: 800;
      padding: 1.5px 4px; border-radius: 3px; font-variant-numeric: tabular-nums;
      box-shadow: 0 1px 2px var(--shadow); }
    .alb-slot.empty .alb-n { background: var(--rule-2); color: var(--ink-3); box-shadow: none; }
    /* The pocket number sits over the card's top-left corner, which is where
       the country band starts, so the band keeps clear of it. An album card is
       only about 70px wide and that padding is expensive — which is why the
       album drops the decade from the band (`noYear`): the spread's own title
       already says the era, and "ARGÉLIA 70" would not fit where "ARGÉLIA"
       does. The exact years are on the back of the card. */
    .alb-slot .fig-band { padding-left: 21px; padding-right: 5px; }
    .alb-foot { margin-top: auto; padding-top: 9px; border-top: 1px solid var(--rule-2);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-c); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--ink-3); font-weight: 600; }

    /* ── Paper, falling (the million only) ── */
    @keyframes confFall { 0% { opacity: 1; transform: translate3d(0,-24px,0) rotate(0deg); }
      100% { opacity: .1; transform: translate3d(var(--dx,0px), 105vh, 0) rotate(var(--rot,720deg)); } }
    .conf { position: fixed; top: -24px; width: 7px; height: 11px; border-radius: 1px; pointer-events: none; z-index: 999;
      animation: confFall linear forwards; box-shadow: 0 1px 2px rgba(0,0,0,.2); }

    /* ═══════════════════════════════════════════════════════════════
       ACCESSIBILITY
    ═══════════════════════════════════════════════════════════════ */
    :focus-visible { outline: 3px solid var(--pitch); outline-offset: 2px; border-radius: 8px; }
    :focus:not(:focus-visible) { outline: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important; animation-iteration-count: 1 !important;
        transition-duration: .001ms !important; scroll-behavior: auto !important;
      }
      .conf, .gain { display: none !important; }
    }
  </style>
</head>

<div id="qz">
  <div id="ct"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   WEB AUDIO — procedural sound effects
═══════════════════════════════════════════════════ */
let _AC = null;
function AC() {
  if (!_AC) _AC = new (window.AudioContext || window.webkitAudioContext)();
  return _AC;
}

/* MUTE — read straight from storage so it survives a reload */
let muted = (() => { try { return localStorage.getItem('fqbr_muted') === 'true'; }
                     catch (e) { return false; } })();
function setMuted(v) {
  muted = v;
  try { localStorage.setItem('fqbr_muted', String(v)); } catch (e) {}
}

/* ── The album's voice ──────────────────────────────────────
   The old set was a TV studio: sawtooth buzzers, a brass fanfare, a
   game-show sting. Against paper that reads as somebody else's app. So
   the palette is wood, paper and a soft mallet instead: filtered noise
   for anything physical (a sticker pressed, a page turned, the snip of
   the scissors) and warm triangle tones, quietly, for anything musical.
   Every cue keeps its old name so the callers do not change. */

/* One tone, with a real attack so it never clicks at the edges. */
function tone(freq, dur, opt) {
  if (muted) return;
  opt = opt || {};
  try {
    const ac = AC(), t0 = ac.currentTime + (opt.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = opt.type || 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    if (opt.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opt.to), t0 + dur);
    const vol = opt.vol === undefined ? 0.12 : opt.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}

/* A burst of filtered noise — paper, wood, a crowd, a pair of scissors. */
function noise(dur, opt) {
  if (muted) return;
  opt = opt || {};
  try {
    const ac = AC(), t0 = ac.currentTime + (opt.delay || 0);
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = opt.type || 'bandpass';
    f.frequency.setValueAtTime(opt.freq || 1800, t0);
    if (opt.to) f.frequency.exponentialRampToValueAtTime(Math.max(60, opt.to), t0 + dur);
    f.Q.value = opt.q === undefined ? 1.2 : opt.q;
    const g = ac.createGain();
    const vol = opt.vol === undefined ? 0.09 : opt.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.012, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
  } catch (e) {}
}

/* kept: a few callers still want a plain tone */
function beep(freq, dur, type, vol, freqEnd) {
  tone(freq, dur, { type: type || 'sine', vol: vol === undefined ? 0.12 : vol, to: freqEnd });
}

const snd = {
  /* ── paper ── */
  tap()    { noise(.03, { freq: 1500, q: .9, vol: .055 }); },
  select() { noise(.035, { freq: 2100, q: 1.1, vol: .06 }); },
  swipe()  { noise(.19, { type: 'highpass', freq: 500, to: 3400, q: .5, vol: .045 }); },
  /* A page being turned, in three parts, because that is what it sounds like:
     the sheet peeling off the one under it, the long dry rustle while it is in
     the air, and the soft slap as it lands on the other side. Nothing tonal —
     paper has no pitch. */
  page()   {
    /* One rustle and a settle. The version before this had a peel, seven
       randomised crackles and a landing, and it sounded like static rather
       than paper — too many events for something that takes half a second. */
    noise(.26, { type: 'highpass', freq: 800,  to: 2400, q: .4, vol: .05 });
    noise(.12, { type: 'lowpass',  freq: 520,  to: 170,  q: .6, vol: .045, delay: .30 });
  },

  /* ── the answer ── */
  correct() {
    noise(.035, { freq: 1700, q: 1, vol: .05 });               // the sticker going down
    tone(523.25, .16, { vol: .1,  delay: .02 });
    tone(783.99, .30, { vol: .09, delay: .12 });
  },
  almost() { tone(440, .2, { vol: .09 }); noise(.03, { freq: 1400, vol: .04 }); },
  wrong()  {                                                    // a soft wooden knock
    tone(150, .26, { type: 'sine', vol: .11, to: 92 });
    noise(.11, { type: 'lowpass', freq: 420, q: .7, vol: .07, delay: .01 });
  },

  /* ── the moment ── */
  lock()      { noise(.07, { type: 'lowpass', freq: 700, q: .6, vol: .08 });
                tone(196, .17, { type: 'sine', vol: .08 }); },
  heartbeat() { tone(78, .12, { type: 'sine', vol: .09, to: 58 }); },

  /* ── the ladder ── */
  rung() {                                                      // a page turning, then two rungs
    noise(.17, { type: 'highpass', freq: 600, to: 3000, q: .5, vol: .05 });
    tone(659.25, .13, { vol: .085, delay: .06 });
    tone(987.77, .22, { vol: .08,  delay: .15 });
  },
  fanfare() {                                                   // warm, not brassy
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
      { tone(f, .5, { vol: .1, delay: i * .1 }); tone(f / 2, .5, { type: 'sine', vol: .05, delay: i * .1 }); });
    noise(.5, { type: 'highpass', freq: 900, to: 4000, q: .4, vol: .035, delay: .1 });
  },
  cash() { [783.99, 1046.5].forEach((f, i) => tone(f, .26, { vol: .09, delay: i * .09 })); },
  drop() {                                                      // falling back down the page
    tone(300, .55, { type: 'sine', vol: .1, to: 70 });
    noise(.4, { type: 'lowpass', freq: 900, to: 180, q: .6, vol: .05 });
  },

  /* ── the cards ── */
  cut()    { noise(.035, { freq: 3600, q: 3, vol: .07 });        // two snips of the scissors
             noise(.045, { freq: 2900, q: 3, vol: .06, delay: .07 }); },
  crowd()  { noise(.62, { freq: 700, to: 1500, q: .35, vol: .055 });
             noise(.62, { type: 'lowpass', freq: 300, q: .5, vol: .03 }); },
  freeze() { [1568, 1244.5, 1046.5].forEach((f, i) => tone(f, .2, { vol: .06, delay: i * .055 })); },
};

/* The band on a card is one line, ellipsised, and about ten characters wide.
   Four countries do not fit under their own name, so the band — and only the
   band, never the caption or the flag's label — uses a short form. */
const CTRY_BAND = { NIR:'Irl. Norte', KOR:'Coreia', WAL:'Gales', CIV:'Marfim' };

/* "a seleção argentina" reads like football; "a seleção de Argentina" does not.
   Anything without an adjective here falls back to "de <país>". */
/* "a seleção italiana", not "a seleção de Itália". Falls back to "de <país>"
   for the countries with no adjective in the table. */
const ctrySel = c => CTRY_ADJ[c] || ('de ' + (CTRY_NAME[c] || c));

/* "passou pelo Juventus" is wrong — in Portuguese the club is a Juventus, and
   so are a Roma, a Inter, a Lazio, a Fiorentina. Everything else here takes
   "pelo", which is why only the exceptions are listed. */
const CLUB_FEM = new Set(['juventus', 'roma', 'inter', 'lazio', 'fiorentina',
  'sampdoria', 'atalanta', 'portuguesa', 'ponte preta', 'chapecoense']);
const byClub = id => (CLUB_FEM.has(String(clubName(id)).toLowerCase()) ? 'pela ' : 'pelo ') + clubName(id);
/* "passaram PELO Bahia" but "o mascote DO Bahia" — same gender, different
   preposition, and byClub only knows the first one. */
const ofClub = id => (CLUB_FEM.has(String(clubName(id)).toLowerCase()) ? 'da ' : 'do ') + clubName(id);

const CTRY_ADJ = {

/* ═══════════════════════════════════════════════════
   FLAGS — drawn, not typed

   Flag emoji (🇧🇷 and friends) are regional-indicator pairs: Android WebView
   and Windows have no glyphs for most of them, so they degrade to the bare
   letters "BR" or to tofu boxes. The England flag is worse still — a tag
   sequence that almost nothing outside Apple renders. Every flag here is
   therefore hand-drawn SVG on a 9×6 field, which looks identical on every
   device the app can possibly run on.
═══════════════════════════════════════════════════ */
const _NORDIC = (bg, cross, inner) =>
  `<rect width="9" height="6" fill="${bg}"/>` +
  `<path d="M0 2.35h9v1.3H0z M2.45 0h1.3v6h-1.3z" fill="${cross}"/>` +
  (inner ? `<path d="M0 2.7h9v.6H0z M2.8 0h.6v6h-.6z" fill="${inner}"/>` : '');

const _VERT = (a, b, c) =>
  `<rect width="3" height="6" fill="${a}"/><rect x="3" width="3" height="6" fill="${b}"/>` +
  `<rect x="6" width="3" height="6" fill="${c}"/>`;

const _HORZ = (a, b, c) =>
  `<rect width="9" height="2" fill="${a}"/><rect y="2" width="9" height="2" fill="${b}"/>` +
  `<rect y="4" width="9" height="2" fill="${c}"/>`;

const _STAR = (cx, cy, r, fill) => {
  let d = '';
  for (let i = 0; i < 5; i++) {
    const o = -Math.PI / 2 + i * 2 * Math.PI / 5;
    const inn = o + Math.PI / 5;
    d += (i ? 'L' : 'M') + (cx + Math.cos(o) * r).toFixed(2) + ' ' + (cy + Math.sin(o) * r).toFixed(2)
       + 'L' + (cx + Math.cos(inn) * r * .4).toFixed(2) + ' ' + (cy + Math.sin(inn) * r * .4).toFixed(2);
  }
  return `<path d="${d}Z" fill="${fill}"/>`;
};

/* A drawn flag chip. `h` is the height in px; the flag keeps a 3:2 ratio. */
function flagSVG(code, h) {
  h = h || 8;
  const name = CTRY_NAME[code] || code || '';
  const art  = FLAGS[code];
  const box  = `width:${(h * 1.5).toFixed(1)}px;height:${h}px;flex-shrink:0;vertical-align:-1px;
    border-radius:1.5px;box-shadow:0 0 0 .5px rgba(0,0,0,.35);`;
  if (!art) {
    return `<span title="${name}" style="${box}display:inline-block;background:#3a4a5a;
      font-size:${(h * .78).toFixed(0)}px;line-height:${h}px;text-align:center;color:#fff;
      font-weight:800;letter-spacing:-.3px;">${(code || '?').slice(0, 2)}</span>`;
  }
  return `<svg viewBox="0 0 9 6" preserveAspectRatio="none" role="img" aria-label="${name}"
    style="${box}display:inline-block;">${art}</svg>`;
}

/* The little mark on a category chip. Most categories carry an emoji that
   every platform has a glyph for; the ones whose natural mark is a flag set
   `flag` instead and get the drawing, because a flag emoji would come out as
   the bare letters "BR". */
function catIcon(c) {
  if (!c) return '';
  if (c.flag) return flagSVG(c.flag, 10);
  return c.col ? `<span class="dot" style="background:${c.col}" aria-hidden="true"></span>` : '';
}

/* ═══════════════════════════════════════════════════
   ICONS — drawn, not typed

   ✓ ✗ ✕ ★ → and friends are *text* symbols, not emoji: Roboto has no
   glyph for most of them, so Android's WebView draws an empty box. The
   ones that are emoji but default to text presentation (✂ ❄ ⏭ 🛡 🗺)
   are just as unreliable. Everything structural in the UI is therefore
   an inline SVG path — same pixels on every device, and it inherits the
   colour we actually want instead of a vendor's.
═══════════════════════════════════════════════════ */

     stroke-linejoin="round" aria-hidden="true"
     style="display:inline-block;vertical-align:-.14em;flex-shrink:0;${extra || ''}"><path d="${d}"/></svg>`;

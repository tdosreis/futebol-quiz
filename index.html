function mkStad(s) {
  const ov = s.oval;
  const field = ov
    ? `<ellipse cx="30" cy="30" rx="25" ry="20" fill="#3A7030"/>
       <ellipse cx="30" cy="30" rx="25" ry="20" fill="none" stroke="#FFF" stroke-width="1.5"/>
       <ellipse cx="30" cy="30" rx="14" ry="9" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
       <line x1="30" y1="10" x2="30" y2="50" stroke="rgba(255,255,255,.4)" stroke-width="1"/>`
    : `<rect x="6" y="9" width="48" height="42" fill="#3A7030"/>
       <rect x="6" y="9" width="48" height="42" fill="none" stroke="#FFF" stroke-width="1.5"/>
       <rect x="17" y="9" width="26" height="42" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
       <line x1="6" y1="30" x2="54" y2="30" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
       <circle cx="30" cy="30" r="6" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1"/>`;
  return `<rect width="60" height="60" fill="#2A5020"/>
    ${field}
    <text x="30" y="57" text-anchor="middle" font-size="6.5" font-weight="700"
      fill="rgba(255,255,255,.7)" font-family="Inter,system-ui">${s.name}</text>`;
}

/* ═══════════════════════════════════════════════════
   SVG — CLUB CRESTS
═══════════════════════════════════════════════════ */


/* Club artwork: use the licensed crest image when we have one, otherwise fall
   back to genericCrest(): a designed shield in the club's colours. This keeps
   the bundle free of non-free Wikipedia files. */

/* ── Designed fallback badge (used when we have no licensed crest file) ── */
function _lum(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
/* How far apart two colours are in plain RGB terms. Luminance alone is the
   wrong test for a kit: Sport's red and black stripes sit only 0.16 apart in
   brightness but are obviously different colours, and judging them by
   lightness painted them white. */
function _dist(a, b) {
  const p = hex => {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(x => x + x).join('');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  return Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
}
function _shade(hex, amt) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
  const r = f(parseInt(h.slice(0, 2), 16)), g = f(parseInt(h.slice(2, 4), 16)), b = f(parseInt(h.slice(4, 6), 16));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* Every club now ships its own official escudo, so nothing reaches this badge
   through LOGOS any more. It stays as clubFallback's landing spot: if a crest
   file ever 404s — an old cached page pointing at a file we replaced — a drawn
   shield is a better answer than a broken-image icon.
   It deliberately does not resemble any real crest. It is an identification
   device built from public facts we already hold —
   the club's colours, its kit pattern, its founding year, its titles — and it
   is drawn with enough craft to sit beside a photographed crest without
   looking like a missing asset. */
const KIT = {
  vasco:       'sash',     // black shirt, white diagonal sash
  nautico:     'stripes',  // red and white vertical stripes
  sport:       'stripes',  // red and black vertical stripes
  bragantino:  'band',     // white shirt, red chest band
  corinthians: 'solid',
};

function genericCrest(id) {
  const c = CL.find(x => x.id === id);
  if (!c) return '';
  const uid  = 'c' + id.replace(/\W/g, '');
  const base = c.c1;
  /* The pattern takes the club's real second colour whenever the two are
     visibly different, so Sport gets its red-on-black stripes instead of
     Náutico's red-on-white. Only genuinely similar pairs get a neutral. */
  const alt  = _dist(c.c1, c.c2) > 70
               ? c.c2
               : (_lum(base) < 0.5 ? '#ececec' : '#1a1a1a');
  const kit  = KIT[id] || 'solid';
  const ink  = _lum(base) < 0.55 ? '#ffffff' : '#141414';
  const edge = _lum(base) < 0.5 ? '#f0f0f0' : '#1a1a1a';

  /* The same outline every real crest is cut to, so the drawn badge sits in
     the row as one of them rather than as a different kind of object. It is
     flat on purpose: the chrome ring and glossy dome this used to have were
     the loudest thing on a board of flat, printed marks. */
  const SHIELD = 'M30 2 L55.8 10.4 L55.8 31.2 C55.8 45.6 43.8 55.2 30 59.1 '
               + 'C16.2 55.2 4.2 45.6 4.2 31.2 L4.2 10.4 Z';

  let field = `<path d="${SHIELD}" fill="${base}"/>`;
  if (kit === 'stripes') {
    field += [-21, -13, -5, 3, 11].map(x =>
      `<rect x="${30 + x}" y="0" width="4.4" height="60" fill="${alt}"/>`).join('');
  } else if (kit === 'sash') {
    field += `<path d="M2 42 L44 2 L54 11 L12 51 Z" fill="${alt}"/>`;
  } else if (kit === 'band') {
    field += `<rect x="0" y="24" width="60" height="10" fill="${alt}"/>`;
  }

  const stars = Math.min(3, (c.br || 0) + (c.lib || 0));
  const starRow = stars
    ? Array.from({ length: stars }, (_, i) =>
        _STAR(30 + (i - (stars - 1) / 2) * 7.5, 13, 2.6, ink)).join('')
    : '';

  return `
    <defs><clipPath id="${uid}s"><path d="${SHIELD}"/></clipPath></defs>
    <g clip-path="url(#${uid}s)">${field}</g>
    <path d="${SHIELD}" fill="none" stroke="${edge}" stroke-width="2.2" stroke-linejoin="round"/>
    ${starRow}
    <text x="30" y="36" text-anchor="middle"
      font-family="'Archivo','Arial Black',Impact,sans-serif"
      font-size="15" font-weight="800" letter-spacing="0.3" fill="${ink}">${c.a}</text>
    ${c.f ? `<text x="30" y="46.5" text-anchor="middle"
      font-family="'Archivo',system-ui,sans-serif"
      font-size="6.4" font-weight="700" letter-spacing=".4" fill="${ink}"
      opacity=".78">${c.f}</text>` : ''}
  `;
}

/* `label` decides whether the crest speaks. On an answer tile the club name
   sits right underneath it, so the crest is decorative and stays silent —
   otherwise a screen reader says every name twice. In the question header
   there is no such caption, so there the crest has to carry the name. */
/* The six clubs whose escudo exists nowhere under a free licence. They are
   shipped to identify the club inside the quiz and nothing else, and are named
   here — in one place, next to the code that draws them — so the licence
   distinction stays auditable instead of being buried among three hundred
   attributions. The credits screen names the same six to the player. */
const NONFREE_CRESTS = new Set(['vasco', 'corinthians', 'nautico',
                                'paysandu', 'sport', 'bragantino',
  /* e os estrangeiros, setembro de 2026 */
  'argentinos', 'arsenal', 'atletico', 'barcelona', 'bayern', 'benfica', 'bordeaux',
  'celtic', 'chelsea', 'cosmos', 'deportivo', 'dortmund', 'everton', 'fenerbahce', 'fulham',
  'intermiami', 'kaiserslautern', 'lazio', 'leverkusen', 'liverpool', 'lyon', 'mancity',
  'manutd', 'monaco', 'napoli', 'penarol', 'porto', 'psg', 'psv', 'realmadrid', 'roma',
  'sampdoria', 'sevilla', 'stuttgart', 'torino', 'tottenham', 'valencia', 'werder',
  'zaragoza'
]);

/* Every club now ships its own official escudo, and every one of those files
   is transparent artwork that floats on the page. The shield clip-path this
   used to need — for flags and for files flattened onto a background — went
   with the last of them. */
function clubArt(id, style, label) {
  const name = clubName(id);
  const inner = LOGOS[id]
    ? `<img src="${LOGOS[id]}" alt="" aria-hidden="true" onerror="clubFallback(this,'${id}')" />`
    : `<svg viewBox="0 0 60 60" class="fill" aria-hidden="true">${genericCrest(id)}</svg>`;
  return `<span class="crest-disc" style="${style || ''}"
    ${label ? `role="img" aria-label="${name}"` : 'aria-hidden="true"'}>${inner}</span>`;
}

/* If a crest file is missing (e.g. an old cached page pointing at a file we
   removed), swap in the app's own SVG crest instead of a broken-image icon. */
function clubFallback(img, id) {
  try {
    img.outerHTML = `<svg viewBox="0 0 60 60" class="fill" aria-hidden="true">${genericCrest(id)}</svg>`;
  } catch (e) { img.style.opacity = '.3'; }
}

/* ═══════════════════════════════════════════════════
   POCKET — one answer tile

   Ten of these make the board. Each is a pocket in the album page with
   a numbered tab in the corner, and can carry the audience vote, the
   pundit's pick, or the lock-in dimming, depending on what the player
   has spent.
═══════════════════════════════════════════════════ */
const NUM = i => String((i || 0) + 1).padStart(2, '0');

function badge(item, idx) {
  const isPlayer = 'img' in item;
  const isSel   = sel.has(item.id);
  const live    = sc === 'quiz' || sc === 'ask' || sc === 'lock';
  const isAns   = (sc === 'reveal') && cat.qs[qi].a.includes(item.id);
  const isWrong = (sc === 'reveal') && isSel && !isAns;
  const curQ    = (cat && cat.qs && cat.qs[qi]) || {};
  const delay   = `animation-delay:${Math.min(9, idx || 0) * 28}ms;`;

  if (hidden.has(item.id) && live) {
    return `<div class="b-gone" style="${delay}${isTextQ(curQ) ? 'min-height:44px' : 'aspect-ratio:1/1.22'}"></div>`;
  }

  let cls = 'b';
  if (sc === 'reveal') {
    if (isAns)        cls += ' b-correct';
    else if (isWrong) cls += ' b-wrong';
  } else if (sc === 'ask' || sc === 'lock') {
    cls += isSel ? ' b-locked' : ' b-faded';       // the board holds its breath
  } else if (isSel) {
    cls += ' b-sel';
  } else if (expert && expert.id === item.id) {
    cls += ' expert-ring';
  }

  const tab = `<span class="tab">${NUM(idx)}</span>`;
  const votePct = poll && poll[item.id] !== undefined ? poll[item.id] : null;
  if (votePct !== null) {
    cls += ' b-voted';
    /* the tile the room actually backed reads in the pitch green, so the
       audience's answer is legible at a glance rather than by comparing ten
       percentages */
    if (poll && votePct === Math.max(...Object.values(poll))) cls += ' b-top-vote';
  }
  const voteEl  = votePct === null ? '' :
    `<span class="vote-pct">${votePct}%</span>
     <span class="vote"><i style="width:${votePct}%;animation-delay:${(idx || 0) * 45}ms;"></i></span>`;
  const longCls = item.n.length > 15 ? ' tile-name-long' : '';

  if (isTextQ(curQ)) {
    return `<div class="${cls} b-text" data-id="${item.id}" style="${delay}">
      ${tab}${voteEl}<span class="tile-name${longCls}">${item.n}</span></div>`;
  }

  if (isPlayer) {
    /* The tile is the same figurinha that goes in the album — old stock or
       new depending on the man — so picking one and later finding it stuck
       on your page is visibly the same object. */
    return `<div class="${cls} b-fig" data-id="${item.id}" style="${delay}">
      ${tab}${voteEl}
      ${figurinha(item, 'sm', { decorative: true, sub: '', noFlag: curQ._noFlag,
                                hideCtry: curQ._hideCtry, hideEra: curQ._hideEra })}
    </div>`;
  }

  // ── Club pocket ──
  return `<div class="${cls} b-crest" data-id="${item.id}" style="${delay}">
    ${tab}${voteEl}
    <div class="crest-box">${clubArt(item.id, '', false)}</div>
    <span class="tile-name tile-club${longCls}">${item.n}</span>
  </div>`;
}

/* Every question carries a picture.
   A bare question card is the one place the album stops looking like an album,
   and the text questions — the rules, the leagues, the coaches — had nothing at
   all. Explicit art first (a face, a crest, a flag, a drawn vignette), then a
   fallback from the category, so a question added later can never end up bare.

   The fallback must not answer anything: it is a category mark, never the
   subject of the question. A flag is only ever set by hand, and never on a
   question whose answer is a country. */
const QICON = {
  rules: w => ART.rules(w), plane: w => ART.plane(w), boot: w => ART.boot(w),
  terrace: w => ART.terrace(w), route: w => ART.route(w), map: w => ART.mapBR(w),
  bench: w => ART.bench(w), globe: w => ART.globe(w), stadium: w => ART.stadium(w),
  trophy: w => ART.trophy(w), ball: w => ART.ball(w),
};

/* what a category falls back to when a question names nothing to draw */
const CAT_ART = {
  origens: 'rules',  europa: 'globe',   curiosos: 'bench',
  copa:    'trophy', ouro:   'boot',    craques: 'boot',
  estadios:'stadium',lendas: 'trophy',  brasileirao: 'trophy',
  libertadores:'trophy', estados: 'globe', apelidos: 'ball',
  g_escudo:'ball',   g_conta:'ball',  torcida: 'terrace',
};

function questionArt(q) {
  if (q.port)  return `<div class="qart qart-face print"><img src="${PORT_IMGS[q.port]}" alt="${PORT[q.port].name}" /></div>`;
  /* The app has a photograph of all twelve grounds and was drawing a generic
     one instead. The ground is the subject of the question, so show it — the
     drawn vignette stays as the fallback for a stadium with no photo. */
  if (q.stad) return STAD_IMGS[q.stad]
    ? `<div class="qart qart-wide print"><img src="${STAD_IMGS[q.stad]}" alt="" aria-hidden="true"
        onerror="this.parentElement.outerHTML='<div class=\'qart qart-wide qart-draw\'>' + ART.stadium(104) + '</div>'" /></div>`
    : `<div class="qart qart-wide qart-draw">${ART.stadium(104)}</div>`;
  if (q.face)  return `<div class="qart qart-face print"><img src="${q.face}" alt="" aria-hidden="true"
        onerror="this.parentElement.style.display='none'" /></div>`;
  /* A mascot question shows the drawing and nothing else — the club's colours
     behind it would name the club, which is the whole question. */
  if (q.msc && MASCOTS[q.msc] && MASC_ART[MASCOTS[q.msc].art])
    return `<div class="qart qart-crest qart-hero qart-msc" role="img"
      aria-label="Mascote de um clube brasileiro">${MASC_ART[MASCOTS[q.msc].art]()}</div>`;
  if (q.crest) return `<div class="qart qart-crest${q._crestIsQ ? ' qart-hero' : ''}">${
        clubArt(q.crest, 'max-width:100%;max-height:100%;object-fit:contain;', true)}</div>`;
  if (q.qimg)  return `<div class="qart qart-wide print"><img src="${q.qimg}" alt="Momento do jogo referido na pergunta" style="object-position:center;"
        onerror="this.parentElement.style.display='none'" /></div>`;
  if (q.flag && FLAGS[q.flag])
    /* the wrapper carries the label, so the drawing inside it is decorative —
       otherwise a screen reader announces the flag twice */
    return `<div class="qart qart-flag" role="img" aria-label="${CTRY_NAME[q.flag] || q.flag}">
      <svg viewBox="0 0 9 6" preserveAspectRatio="none" aria-hidden="true">${FLAGS[q.flag]}</svg></div>`;
  /* a question about a Brazilian state gets the map, with that state lit */
  if (q.uf) return `<div class="qart qart-map qart-draw">${ART.mapBR(72, q.uf)}</div>`;
  /* A career asked as a list of clubs shows those clubs' crests, in order —
     the question is the path, so the path is what should be pictured. Only the
     ones that actually have a crest file: a foreign club falls back to the
     drawn badge, which is built from CL data it has no row in, so it comes out
     as an empty disc. Fewer than two and the route vignette says it better. */
  if (q.path && q.path.length) {
    const shown = q.path.filter(c => LOGOS[c]).slice(0, 4);
    if (shown.length >= 2)
      return `<div class="qart qart-path" role="img" aria-label="Clubes da carreira">
        ${shown.map((c, i) => `<span class="qp crest-box" style="animation-delay:${i * 90}ms">${
          clubArt(c, '', false)}</span>`).join('')}</div>`;
    return `<div class="qart qart-wide qart-draw">${ART.route(104)}</div>`;
  }
  const key = q.icon || CAT_ART[(q._cat && q._cat.id) || ''] || 'ball';
  const draw = QICON[key] || QICON.ball;
  return `<div class="qart qart-wide qart-draw">${draw(92)}</div>`;
}

/* What the run actually earned you, as the objects themselves. A chip saying

const medalChips = () => (window._newMedals || []).length ? `

/* ── Which printing a player belongs to ─────────────────────
   The album was collected over fifty years, so it has two kinds of page
   in it. A career that started before the Premier League is on the old
   stock; anything since is on the current one. */
/* 2000, not 1992: Ronaldo, Ronaldinho and Rivaldo belong to the old
   pages in every way that matters, and putting them on mint stock looked
   like a filing error. */
const MODERN_FROM = 2000;
const figEra = p => (p.era && p.era[0] < MODERN_FROM) ? 'retro' : 'modern';

/* The two shapes behind a modern figurinha take the player's own
   national colours, the way the real ones do. */
const CTRY_COLORS = {
  BRA:['#FEDF00','#009B3A'], ARG:['#74ACDF','#F6B40E'], POR:['#DA291C','#046A38'],
  FRA:['#002395','#ED2939'], NED:['#AE1C28','#21468B'], GER:['#DD0000','#FFCE00'],
  ITA:['#008C45','#CD212A'], ENG:['#CE1124','#0A2C6B'], ESP:['#AA151B','#F1BF00'],
  URU:['#0038A8','#F6B40E'], BEL:['#FAE042','#ED2939'], CRO:['#FF0000','#171796'],
  COL:['#FCD116','#003893'], SWE:['#FECC00','#006AA7'], POL:['#DC143C','#EEEEEE'],
  EGY:['#CE1126','#111111'], CMR:['#007A5E','#FCD116'], NOR:['#BA0C2F','#00205B'],
  UKR:['#FFDD00','#0057B7'], HUN:['#CE2939','#477050'], CZE:['#D7141A','#11457E'],
  DEN:['#C8102E','#EEEEEE'], RUS:['#0039A6','#D52B1E'], MEX:['#006847','#CE1126'],
  CHI:['#D52B1E','#0039A6'], GHA:['#CE1126','#006B3F'], SCO:['#0065BD','#EEEEEE'],
  WAL:['#C8102E','#00AB39'], SEN:['#00853F','#FDEF42'], NGA:['#008751','#EEEEEE'],
  BUL:['#00966E','#D62612'], CIV:['#F77F00','#009E60'], LBR:['#BF0A30','#002868'],
};
const ctryColors = c => CTRY_COLORS[c] || ['#17593F', '#B8860B'];

/* One figurinha. `size` is lg (album page), sm (a tile on the board) or
   hero (the cover). */
function figurinha(p, size, opts) {
  opts = opts || {};
  /* hideEra also flattens the two printings into one. The retro/modern split
     is itself an era clue — one mint card among nine tea-coloured ones answers
     "who is the intruder" before a single name is read. */
  const era  = opts.hideEra ? 'retro' : figEra(p);
  const yr   = p.era ? p.era[0] : '';
  /* What the header band is allowed to say on this board. */
  const bandTxt = [
    opts.hideCtry ? '' : bandCtry(p.ctry),
    /* `noYear` drops the decade without touching the printing, which is what
       `hideEra` would also do. On an album spread already titled "Anos 70",
       every card repeating "70" is redundancy that costs the country's name
       its room — "ARGÉLIA 70" truncated to "ARGÉLIA…". A merged spread keeps
       the year, because there it is the thing that tells the cards apart. */
    (opts.hideEra || opts.noYear || !yr) ? ''
      : String(Math.floor(yr / 10) * 10).slice(2),
  ].filter(Boolean).join(' ');
  const sub  = opts.sub !== undefined ? opts.sub
             : `${POS_NAME[p.pos]} · ${p.era ? p.era[0] + '–' + p.era[1] : ''}`;
  const alt  = opts.decorative ? 'alt="" aria-hidden="true"' : `alt="${p.n}"`;
  const nmCls = 'fig-nm' + (p.n.length > 13 ? ' fig-nm-long' : '');
  const shot = `<div class="fig-shot"><img src="${p.img}" ${alt}
      onerror="this.style.opacity='.2'" /></div>`;

  if (era === 'retro') {
    /* the header band carries the country and the decade, the way the old
       albums carried the tournament — unless this board must not say so */
    return `<span class="fig fig-retro fig-${size}">
      <span class="fig-band${bandTxt ? '' : ' fig-band-mute'}">${bandTxt || ''}</span>
      <span class="fig-art">${shot}</span>
      <span class="fig-cap"><span class="${nmCls}">${p.n}</span>
      ${sub ? `<span class="fig-sub">${sub}</span>` : ''}</span>
    </span>`;
  }

  const [c1, c2] = ctryColors(p.ctry);
  /* The new stock carries the country alone — it already shows the flag and
     the club underneath, and "BRASIL 2001" ran out of band whatever the font.
     (A board that must hide the era renders everyone on retro stock, so this
     branch is never the one asked to drop a decade.) */
  /* Country alone normally — "BRASIL 2001" ran out of band whatever the font.
     When the country is being hidden the decade takes its place, so a modern
     card does not sit blank-headed in a row of cards showing one. */
  const mBand = opts.hideCtry
    ? (opts.hideEra || !yr ? '' : String(Math.floor(yr / 10) * 10).slice(2))
    : bandCtry(p.ctry);
  return `<span class="fig fig-modern fig-${size}">
    <span class="fig-band${mBand ? '' : ' fig-band-mute'}">${mBand}</span>
    <span class="fig-art">
      ${opts.hideCtry ? '' : `<span class="blob" style="background:${c1};width:54%;height:58%;left:0;top:10%;"></span>
      <span class="blob" style="background:${c2};width:42%;height:46%;right:0;top:34%;"></span>`}
      ${shot}
      ${(opts.noFlag || opts.hideCtry) ? '' : `<span class="fig-flag">${flagSVG(p.ctry, size === 'hero' ? 15 : size === 'lg' ? 9.5 : 7)}</span>`}
    </span>
    <span class="fig-cap"><span class="${nmCls}">${p.n}</span>
    ${sub ? `<span class="fig-sub">${sub}</span>` : ''}</span>
  </span>`;
}

/* ═══════════════════════════════════════════════════
   THE ALBUM AS A BOOK

   A Panini album is not a scroll. It is a section per country and a spread per
   era, and you turn the page. This builds that: for one country, the decades
   its players debuted in, merged where a decade is too thin to be worth a page
   of its own — two men from the 1930s share a spread with the 1940s the way a
   real album opens on "os primeiros anos" rather than giving each a page.
═══════════════════════════════════════════════════ */
const DEC_MIN = 6;          // fewer than this and a decade shares its spread

/* The escudos, the seleções and the mascotes have no decade to be sorted by,
   so their sections are paged the way a real album pages a badge sheet: a
   fixed number to a spread, in the order they are printed. */
const EXTRA_PER = 18;
function extraPages(items, label) {
  const out = [];
  for (let i = 0; i < items.length; i += EXTRA_PER) {
    out.push({ label: items.length > EXTRA_PER
                 ? `${label} · ${out.length + 1}` : label,
               items: items.slice(i, i + EXTRA_PER) });
  }
  return out;
}

/* The reverse of an escudo, a seleção or a mascote. A player's back prints his
   career; these print what the sticker is and where it came from. */
function figExtraBack(sid, num) {
  const st = stk(sid);
  if (!st) return '';
  const lines = [];
  if (st.kind === 'escudo') {
    /* `cl`, not `br`: the Brasileirão count is itself the field `br`, and
       `br.br` reads like a typo. */
    const cl = CL.find(c => c.id === st.id);
    lines.push(cl ? `Clube brasileiro · ${cl.s}` : 'Clube estrangeiro');
    const tit = [];
    if (cl && cl.lib) tit.push(`${cl.lib} ${cl.lib === 1 ? 'Libertadores' : 'Libertadores'}`);
    if (cl && cl.br)  tit.push(`${cl.br} ${cl.br === 1 ? 'Brasileirão' : 'Brasileirões'}`);
    if (tit.length) lines.push(tit.join(' · '));
    if (cl && cl.f)   lines.push(`Fundado em ${cl.f}`);
    const men = PL.filter(x => (x.clubs || []).includes(st.id));
    if (men.length) lines.push(men.slice(0, 4).map(x => x.n).join(' · '));
  } else if (st.kind === 'selecao') {
    const men = PL.filter(x => x.ctry === st.id);
    lines.push(`${men.length} ${men.length === 1 ? 'figurinha' : 'figurinhas'} no álbum`);
    const wc = men.filter(x => (x.wc || []).length);
    if (wc.length) lines.push(`Campeões do mundo: ${wc.length}`);
    lines.push(men.slice(0, 4).map(x => x.n).join(' · '));
  } else {
    /* The same sentence printed on all twenty-five backs is filler. The club
       behind the mascot is the thing worth reading. */
    const cl = CL.find(c => c.id === st.id);
    lines.push(`Mascote ${byClub(st.id)}`);
    if (cl) {
      lines.push([cl.s, cl.f ? `fundado em ${cl.f}` : ''].filter(Boolean).join(' · '));
      const tit = [];
      if (cl.lib) tit.push(`${cl.lib} Libertadores`);
      if (cl.br)  tit.push(`${cl.br} ${cl.br === 1 ? 'Brasileirão' : 'Brasileirões'}`);
      if (tit.length) lines.push(tit.join(' · '));
    }
  }
  return `
    <span class="figback">
      <span class="figback-h">
        <span class="figback-n">Nº ${String(num).padStart(3, '0')}</span>
      </span>
      <span class="figback-nm">${st.n}</span>
      <span class="figback-rule"></span>
      ${lines.filter(Boolean).map(l => `<span class="figback-l">${l}</span>`).join('')}
    </span>`;
}

function albumPages(items) {
  if (!items.length) return [];
  const by = {};
  items.forEach(g => {
    const d = g.p.era ? Math.floor(g.p.era[0] / 10) * 10 : 1990;
    (by[d] = by[d] || []).push(g);
  });
  const pages = [];
  Object.keys(by).map(Number).sort((a, b) => a - b).forEach(d => {
    const last = pages[pages.length - 1];
    /* merge forward while the previous spread is still thin — this is what
       keeps a country with one man per decade from becoming eight pages of a
       single sticker */
    if (last && last.items.length < DEC_MIN) {
      last.to = d;
      last.items = last.items.concat(by[d]);
    } else {
      pages.push({ from: d, to: d, items: by[d].slice() });
    }
  });
  /* The forward pass cannot help the last decade: Brazil's 2020s is one man,
     and the 2010s before it was full, so he was left alone on a page of his
     own. A thin final spread folds back into the one before it. */
  if (pages.length > 1 && pages[pages.length - 1].items.length < 3) {
    const tail = pages.pop();
    const prev = pages[pages.length - 1];
    prev.to = tail.to;
    prev.items = prev.items.concat(tail.items);
  }
  return pages;
}

/* What a spread is called. Two digits up to the nineties, four from 2000 on —
   which is both how Portuguese says it and the only way to tell "anos 20" the
   decade of Domingos da Guia from "anos 2020" the decade of Endrick. */
const decName = d => d >= 2000 ? `${d}` : String(d).slice(2);
const decLabel = pg => pg.from === pg.to
  ? `Anos ${decName(pg.from)}`
  : `Anos ${decName(pg.from)} – ${decName(pg.to)}`;

/* Which paper the spread is printed on. The album spans a century, and a page
   of 1950s cards has no business looking like a page of 2020s ones. */
const decStyle = d => d <= 1940 ? 'dec-a' : d <= 1960 ? 'dec-b'
                    : d <= 1970 ? 'dec-c' : d <= 1980 ? 'dec-d'
                    : d <= 1990 ? 'dec-e' : d <= 2000 ? 'dec-f' : 'dec-g';

/* The sticker on the cover. It changes every time the album is opened — a
   fixed face made the cover look broken — and once you have collected
   anything it shows one of yours, so the cover is your album, not ours.

   Its caption is always position · country. It used to prefer the nickname
   where there was one, which read as an inconsistency rather than a flourish:
   the line said "Atacante · Inglaterra" under Bobby Charlton and "Fenômeno"
   under Ronaldo Fenômeno, so the same slot meant a different thing depending
   on the face. The nickname still has its own place on the back of the card. */
function heroSticker() {
  const great = PL.filter(p => FAMOUS.has(p.id) || (p.wc && p.wc.length) || p.bo > 0);
  const mine  = great.filter(p => album.has(p.id));
  const pool  = mine.length ? mine : (great.length ? great : PL);
  const p = pool[Math.floor(Math.random() * pool.length)] || PL[0];
  return { p, num: PL.indexOf(p) + 1 };
}

function html() {

  /* ── Home: the cover ────────────────────────────────────────── */
  if (sc === 'home') {
    const best = milBest();
    const done = dailyDone(), dst = dailyStreakNow(), dres = dailyInfo();
    const { p: hero, num } = heroSticker();
    const year = new Date().getFullYear();

    /* The three modes share the lifelines' language now: the icon in a disc

    const mode = (id, ic, label, tail, kind) => `

      <div class="eyebrow" style="width:100%;display:flex;justify-content:space-between;">
        <span>Edição ${year}</span><b>Fig. Nº ${String(num).padStart(3, '0')}</b>
      </div>

      </div>

      <p class="small muted" style="max-width:280px;font-size:12.5px;">
        Dezesseis perguntas separam você de
        <b class="brass" style="white-space:nowrap;">R$ 1.000.000</b>.
        Elas ficam mais difíceis a cada degrau.</p>

      ${best > 0 ? `<span class="chip chip-brass">${ICON.money('currentColor', 11)} Seu recorde · ${money(best)}</span>` : ''}

      <button id="mil-btn" class="btn btn-brass btn-lg">${ICON.play('currentColor', 15)} Jogar agora</button>

      <div class="modes">
        ${mode('daily-btn', ICON.calendar('currentColor', 16), 'Diário',

               : 'Nº ' + dayIndex() + (dst > 0 ? ' · ' + dst + ' seg.' : ''), done ? 'done' : 'daily')}
        ${mode('surv-btn', ICON.shield('currentColor', 16), 'Mata-mata',
          (stats.survBest || 0) > 0 ? 'recorde ' + stats.survBest : 'até errar', 'surv')}
        ${mode('cta-btn', ICON.ladder('currentColor', 16), 'Treino', 'sem apostar', 'train')}
      </div>

      })()}

      <button id="balb" class="mode mode-album" style="width:100%;max-width:340px;flex-direction:row;gap:11px;text-align:left;">
        <span class="mode-disc">${ICON.book('currentColor', 17)}</span>
        <span style="flex:1;min-width:0;">
          <span class="mt" style="display:block;">Meu álbum</span>
          <!-- ALL_STICKERS, not PL: the home button was still counting only

      ${stats.games > 0 ? `<div class="small muted" style="font-size:10.5px;display:flex;gap:5px;align-items:center;">

        ${stats.bestStreak >= 3 ? `· ${ICON.flame('var(--brass)', 11)} ${stats.bestStreak}` : ''}</div>` : ''}

  }

  /* ── O ÁLBUM: every figurinha, collected or still missing ────
     The album is the one thing that only ever grows. Answer a player
     correctly and he is stuck in here for good; the empty pockets are
     the reason to keep playing. */
  if (sc === 'album') {
    const byCountry = {};
    PL.forEach((p, i) => { (byCountry[p.ctry] = byCountry[p.ctry] || []).push({ p, n: i + 1 }); });

    /* Thirty-nine countries and half of them are one player. Countries with a
       section of their own get one; everyone else shares the last section.
       Each sticker still carries its own flag, so nobody loses their
       nationality — only the section is shared. */
    const PAGE_MIN = 3;
    const own  = Object.keys(byCountry).filter(c => byCountry[c].length >= PAGE_MIN);
    const rest = Object.keys(byCountry).filter(c => byCountry[c].length <  PAGE_MIN);
    const groups = {};
    own.forEach(c => groups[c] = byCountry[c]);
    const order = own.sort((a, b) =>
      a === 'BRA' ? -1 : b === 'BRA' ? 1 : groups[b].length - groups[a].length || a.localeCompare(b));
    if (rest.length) {
      groups.__resto = rest
        .sort((a, b) => (CTRY_NAME[a] || a).localeCompare(CTRY_NAME[b] || b))

      order.push('__resto');
    }

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Futebol Quiz BR</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#E9E6DB" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#171A12" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Futebol Quiz" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Archivo:wght@400;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════════
       O ÁLBUM
       The app is a football sticker album. Paper, ink, and the players'
       photographs printed as screen-prints and slipped into pockets on
       the page. One ink does the work — pitch green — and brass appears
       only where money does. Nothing shines: no gloss, no glow, no
       neon. On a phone that has asked for dark, the same album under a
       reading lamp.
    ═══════════════════════════════════════════════════════════════ */
    :root {
      color-scheme: light dark;
      --stock:     #E9E6DB;   /* the page */
      --stock-2:   #DDD9C9;   /* the table the album lies on */
      --pocket:    #F6F4EE;   /* a sticker pocket */
      --pocket-2:  #EFECE2;   /* a pocket, pressed */
      --ink:       #20241E;
      --ink-2:     #4B4F45;
      --ink-3:     #5B5D54;   /* was #7E8175 — 2.76:1 on the retro card */
      --ink-4:     #A6A89C;   /* the faint tone: disabled controls only.
                                    WCAG exempts those, and anything you are
                                    meant to read belongs on --ink-3. */
      --rule:      #CBC5B2;
      --rule-2:    #DBD6C6;
      --pitch:     #17593F;
      --pitch-2:   #1E7150;
      --pitch-soft:#D9E6DD;
      --on-pitch:  #F3F1E8;
      --brass:     #A9803B;
      --brass-ink: #735728;   /* brass as TEXT: the fill tone is 2.5:1 on paper */
      --good-ink:  #266842;   /* likewise the green, for a finished section */
      --brass-2:   #C79A4E;
      --brass-soft:#EFE3C6;
      --on-brass:  #2A1F08;
      --good:      #2E7D4F;
      --bad:       #B3402F;
      --bad-soft:  #F0DCD6;
      --warn:      #B8761F;
      --shadow:    rgba(32,36,30,.14);
      --shadow-2:  rgba(32,36,30,.28);
      --grain:     rgba(0,0,0,.028);
      --halftone:  rgba(18,22,16,.62);
      --font-d: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-s: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      /* Every fallback here is *narrow*. With a plain sans in the stack the
         header band silently overflowed to "BRASI…" whenever the webfont had
         not arrived yet — which on a cold, slow connection is every first
         paint. */
      --font-c: 'Archivo Narrow', 'Roboto Condensed', 'Arial Narrow',
                'Helvetica Neue Condensed', 'Archivo', system-ui, sans-serif;

      /* ── The album has two halves ──────────────────────────────
         The old pages are printed on stock that has gone the colour of
         weak tea, with a red header band and the name set in narrow
         caps under a warm, faded photograph. The new pages are the
         current Panini: a mint field, big rounded shapes in the
         player's own national colours, a flag, and his details set
         small and clean. A player joins whichever half his career
         belongs to, so the album reads as one collected over decades. */
      --retro-card:  #EFE4CA;
      --retro-card2: #E4D6B4;
      --retro-edge:  #BFA97C;
      --retro-ink:   #3B2E1B;
      --retro-band:  #B23A2E;
      --retro-band2: #8E2A20;
      --modern-card: #56BEB2;
      --modern-card2:#2A736C;   /* was #3E9E96 — the band's white sat at 2.97:1 */
      --modern-ink:  #0C2F2C;
      --modern-chip: #F2F7F5;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --stock:     #171A12;
        --stock-2:   #0F110B;
        --pocket:    #20251B;
        --pocket-2:  #1B2017;
        --ink:       #ECE7D6;
        --ink-2:     #C4C0AE;
        --ink-3:     #8E9182;
        --ink-4:     #62655A;
        --rule:      #363B2D;
        --rule-2:    #2A2F23;
        --pitch:     #3E9C6E;
        --pitch-2:   #55B585;
        --pitch-soft:#1E3529;
        --on-pitch:  #0F1A13;
        --brass:     #C79A4E;
        --brass-ink: #C79A4E;   /* already 6:1 on the dark page */
        --good-ink:  #4CAE74;
        --brass-2:   #E0B968;
        --brass-soft:#3A2F16;
        --on-brass:  #1A1204;
        --good:      #4CAE74;
        --bad:       #E06A55;
        --bad-soft:  #3A211C;
        --warn:      #D9963A;
        --shadow:    rgba(0,0,0,.45);
        --shadow-2:  rgba(0,0,0,.7);
        --grain:     rgba(255,255,255,.025);
        --halftone:  rgba(0,0,0,.7);
        --retro-card:  #2A2418; --retro-card2: #221D13; --retro-edge: #5A4C31;
        --retro-ink:   #E8DCC0; --retro-band: #8E2A20; --retro-band2: #6E1F17;
        --modern-card: #1C4A46; --modern-card2:#153B38; --modern-ink: #DCF0EC;
        --modern-chip: #CFEDE6;   /* was #0E2422 — a dark chip on the dark
                                     card is 1.32:1, so the country band on a
                                     post-2000 figurinha was all but invisible */
      }
    }
    :root[data-theme="dark"] {
      --stock:#171A12; --stock-2:#0F110B; --pocket:#20251B; --pocket-2:#1B2017;
      --ink:#ECE7D6; --ink-2:#C4C0AE; --ink-3:#8E9182; --ink-4:#62655A;
      --rule:#363B2D; --rule-2:#2A2F23; --pitch:#3E9C6E; --pitch-2:#55B585;
      --pitch-soft:#1E3529; --on-pitch:#0F1A13; --brass:#C79A4E; --brass-2:#E0B968;
      --brass-ink:#C79A4E; --good-ink:#4CAE74;
      --brass-soft:#3A2F16; --on-brass:#1A1204; --good:#4CAE74; --bad:#E06A55;
      --bad-soft:#3A211C; --warn:#D9963A; --shadow:rgba(0,0,0,.45); --shadow-2:rgba(0,0,0,.7);
      --grain:rgba(255,255,255,.025); --halftone:rgba(0,0,0,.7);
      --retro-card:#2A2418; --retro-card2:#221D13; --retro-edge:#5A4C31;
      --retro-ink:#E8DCC0; --retro-band:#8E2A20; --retro-band2:#6E1F17;
      --modern-card:#1C4A46; --modern-card2:#153B38; --modern-ink:#DCF0EC;
      --modern-chip:#CFEDE6;
    }

    /* ── Reset & base ── */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--stock-2); }
    body {
      background: var(--stock-2);
      background-image:
        radial-gradient(circle at 15% 12%, var(--grain) 0 1px, transparent 1px),
        radial-gradient(circle at 62% 78%, var(--grain) 0 1px, transparent 1px);
      background-size: 7px 7px, 11px 11px;
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      font-family: var(--font-s);
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: var(--font-s); color: inherit; }

    /* The page of the album */
    #qz {
      background: var(--stock);
      color: var(--ink);
      position: relative; overflow: hidden;
      width: 100%; max-width: 680px; min-height: 500px;
      /* the sheet is a column so the screen inside it can claim the whole
         page — otherwise the album's book stops short and leaves bare stock
         under it on a tall phone */
      display: flex; flex-direction: column;
      z-index: 1;
    }
    #qz::before {                       /* faint album rule lines */
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
      background-image: repeating-linear-gradient(0deg, transparent 0 41px, var(--rule-2) 41px 42px);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent);
      mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent);
    }
    @media (min-width: 700px) {
      #qz { border-radius: 14px; box-shadow: 0 0 0 1px var(--rule), 0 30px 60px -24px var(--shadow-2); margin: 24px 0; }
    }
    @media (max-width: 699px) {
      body { align-items: stretch; }
      #qz { min-height: 100vh; min-height: 100dvh; }
    }
    #ct { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; }
    #ct > div { flex: 1; }

    /* Flex/grid children default to min-width:auto, so one wide child (a long
       author name, a club-career path) stretches the screen past the viewport
       and #qz's overflow:hidden clips everything. Opt every box out of that. */
    #ct > div { max-width: 100%; }
    #ct div, #ct p { min-width: 0; }
    #ct p, #ct span { overflow-wrap: anywhere; }

    /* ── Screens ── */
    /* Arriving at a screen is worth a beat. Tapping a tile is not — and this
       ran on every render, so the whole page slid and faded under the finger
       each time you changed your mind about an answer. `screen-in` is added
       only when the screen actually changed. */
    @keyframes screenIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    #ct.screen-in > div { animation: screenIn .2s ease-out; }
    .pg { display: flex; flex-direction: column; min-height: 500px; padding: 16px; gap: 12px; }
    .pg-center { align-items: center; justify-content: center; text-align: center; }
    .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ── Type ── */
    .eyebrow { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); }
    .eyebrow b { color: var(--pitch); font-weight: 800; }
    .display { font-family: var(--font-d); font-optical-sizing: auto; font-weight: 600; letter-spacing: -.02em; line-height: .95; }
    .display em { font-style: italic; }
    .num { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: .01em; }
    .muted { color: var(--ink-3); }
    .small { font-size: 11px; line-height: 1.5; }
    /* the utility class is text, so it takes the text tone; --brass itself
       stays as it is for rings, pips and borders */
    .brass { color: var(--brass-ink); }
    .pitch { color: var(--pitch); }
    .good  { color: var(--good); }
    .bad   { color: var(--bad); }

    /* ── Top bar ── */
    .topbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .crumb { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; cursor: pointer; border-radius: 12px;
      font-family: var(--font-s); font-weight: 700; letter-spacing: .03em; font-size: 14px;
      padding: 13px 22px; transition: transform .12s, background .15s, opacity .15s;
      touch-action: manipulation; user-select: none;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { cursor: default; }
    .btn-primary { background: var(--pitch); color: var(--on-pitch); }
    .btn-primary:hover { background: var(--pitch-2); }
    .btn-primary:disabled { background: var(--rule-2); color: var(--ink-4); }
    /* The button is "Confirmar" with nothing chosen and "Colar figurinha" once
       something is — a change of meaning, not just of state, so it is worth a
       beat rather than a repaint. */
    .btn { transition: background .18s ease, color .18s ease, transform .12s; }
    @keyframes armed { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
    .btn-lg:not(:disabled).is-armed { animation: armed .3s cubic-bezier(.3,.8,.4,1); }
    .btn-brass { background: var(--brass); color: var(--on-brass); }
    .btn-brass:hover { background: var(--brass-2); }
    .btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule); }
    .btn-ghost:hover { background: var(--pocket); }
    .btn-icon { padding: 7px 9px; border-radius: 10px; }
    .btn-lg { font-size: 15px; padding: 15px 30px; }
    .btn-sm { font-size: 12px; padding: 9px 14px; border-radius: 10px; }
    .btn-press { }   /* kept for the event bindings; the press lives on .btn */

    /* ── Chips ── */
    .chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      border: 1px solid var(--rule); border-radius: 20px; padding: 3px 10px 3px 8px;
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--ink-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .chip-pitch { border-color: var(--pitch); color: var(--pitch); }
    .chip-brass { border-color: var(--brass); color: var(--brass); background: var(--brass-soft); }
    .chip-soft  { border-color: transparent; background: var(--pocket-2); }

    /* ═══════════════════════════════════════════════════════════════
       THE STICKER
       Every photograph in the album is printed, not pasted: the real
       photo underneath, posterised to a three-ink ramp, a halftone
       screen over it, and the paper's grain over that. Applied live by
       an SVG filter, so all 162 pictures get the treatment at once.
    ═══════════════════════════════════════════════════════════════ */
    /* The photograph is the artwork. Every treatment tried here — posterising,
       halftone, traced linework — degraded a picture that was already good,
       and a real sticker album is photographs anyway. What makes it an album
       is the pocket around it, not an effect on top of it. */
    .print { position: relative; overflow: hidden; background: var(--rule-2); }
    .print img { width: 100%; height: 100%; object-fit: cover; object-position: top center;
      display: block; pointer-events: none; }

    /* ═══════════════════════════════════════════════════════════════
       A FIGURINHA, IN TWO PRINTINGS
       Old stock: tea-coloured card, a red header band, the photograph
       warmed and softened the way forty-year-old ink goes, the name in
       narrow caps underneath. New stock: a mint field with two rounded
       shapes in the player's national colours behind him, his flag, and
       his details set small and clean.
    ═══════════════════════════════════════════════════════════════ */
    /* One skeleton, two printings: band, picture, caption. Keeping the
       three parts identical in both is what lets a page of them line up
       even though a 1958 card and a 2024 card look nothing alike. */
    .fig { position: relative; border-radius: 4px; overflow: hidden;
      display: flex; flex-direction: column; height: 100%;
      box-shadow: 0 1px 3px var(--shadow); }
    .fig-band { flex: none; font-family: var(--font-c); font-weight: 700; text-transform: uppercase;
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* A board that hides both the country and the decade leaves the band with
       nothing to print. A full-height coloured bar with no text in it reads as
       missing text, so it collapses to a slim rule — the card keeps its
       silhouette and says nothing it should not. */
    .fig-band-mute { font-size: 0 !important; padding: 0 !important;
      height: 4px; opacity: .55; }
    .fig-art { flex: none; position: relative; overflow: hidden; }
    .fig-shot { position: relative; overflow: hidden; background: var(--rule-2); height: 100%; }
    .fig-shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center;
      display: block; pointer-events: none; }
    .fig-cap { flex: 1; text-align: center; line-height: 1.12;
      display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .fig-nm { font-family: var(--font-c); font-weight: 700; text-transform: uppercase;
      letter-spacing: .03em; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    /* "Cristiano Ronaldo" in caps is a lot of letters for a card 90px wide,
       so the long ones shrink instead of losing their tail. In px, not em:
       em resolves against the parent, which is the 16px body, so .84em made
       these names *bigger* — and clipped them. */
    .fig-nm-long { letter-spacing: .01em; }
    .fig-sub { font-family: var(--font-s); font-weight: 600; opacity: .9;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

    /* ── old stock: tea-coloured card, red band, warm faded picture ── */
    .fig-retro { background: var(--retro-card); color: var(--retro-ink);
      box-shadow: inset 0 0 0 1px var(--retro-edge), 0 1px 3px var(--shadow); }
    .fig-retro .fig-band { background: var(--retro-band); color: #F6EBD8; letter-spacing: .12em; }
    .fig-retro .fig-shot { background: var(--retro-card2); }
    .fig-retro .fig-shot img { filter: sepia(.32) saturate(.9) contrast(1.03); }
    .fig-retro .fig-shot::after {           /* the corners of an old card go dark */
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(118% 88% at 50% 38%, transparent 56%, rgba(80,60,30,.26));
    }

    /* ── new stock: mint field, national shapes, the picture inset ── */
    .fig-modern { background: var(--modern-card); color: var(--modern-ink); }
    .fig-modern .fig-band { background: var(--modern-card2); color: var(--modern-chip); letter-spacing: .1em; }
    /* The national shapes sit inside the card rather than bleeding off it:
       a box clipped by its parent still reports its full width, so a
       bleeding blob shows up as a page overflow in tools/narrow.py. */
    .fig-modern .blob { position: absolute; border-radius: 999px; pointer-events: none; z-index: 1; }
    .fig-modern .fig-shot { position: absolute; left: 11%; right: 11%; top: 7%; bottom: 0;
      height: auto; background: transparent; border-radius: 3px 3px 0 0; z-index: 2;
      box-shadow: 0 1px 4px rgba(0,0,0,.18); }
    .fig-modern .fig-flag { position: absolute; z-index: 3; border-radius: 2px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0,0,0,.22); line-height: 0; }

    /* the album page, the cover, and a tile on the board */
    /* 16px of padding each side is a third of the card once the album grid is
       six columns wide on a 470px phone, and every long country truncated:
       "BULGÁRI…", "DINAMAR…", "IRL. NOR…". The band still reads as an inset
       strip at 7px, and now "DINAMARCA 80" fits inside it. */
    .fig-lg  .fig-band { font-size: 7px; padding: 2.5px 7px; }
    .fig-lg  .fig-art  { aspect-ratio: 1 / 1.06; }
    .fig-lg  .fig-cap  { padding: 5px 3px 6px; min-height: 34px; }
    .fig-lg  .fig-nm   { font-size: 9.4px; }
    .fig-lg  .fig-nm-long { font-size: 8px; }
    .fig-lg  .fig-sub  { font-size: 7.2px; margin-top: 2px; }
    .fig-lg  .fig-flag { width: 14px; height: 9.5px; right: 5%; top: 5%; }

    .fig-sm  .fig-band { font-size: 7px; padding: 2px 7px; letter-spacing: .06em; }
    .fig-sm  .fig-art  { aspect-ratio: 1 / 1.02; }
    .fig-sm  .fig-cap  { padding: 4px 3px 5px; min-height: 26px; }
    .fig-sm  .fig-nm   { font-size: 9.2px; }
    .fig-sm  .fig-nm-long { font-size: 8px; }
    .fig-sm  .fig-sub  { display: none; }
    .fig-sm  .fig-flag { width: 13px; height: 9px; right: 4%; top: 4%; }
    @media (min-width: 400px) {
      .fig-sm .fig-nm { font-size: 10.2px; }
      .fig-sm .fig-nm-long { font-size: 8.8px; }
    }

    .fig-hero .fig-band { font-size: 10px; padding: 5px 34px; letter-spacing: .16em; }
    .fig-hero .fig-art  { aspect-ratio: 1 / 1.1; }
    .fig-hero .fig-cap  { padding: 9px 6px 11px; }
    .fig-hero .fig-nm   { font-size: 16px; -webkit-line-clamp: 2; }
    .fig-hero .fig-nm-long { font-size: 13px; }
    .fig-hero .fig-sub  { font-size: 10px; margin-top: 3px; }
    .fig-hero .fig-flag { width: 22px; height: 15px; right: 5%; top: 5%; }

    .sticker {                              /* a pocket with a print in it */
      position: relative; background: var(--pocket); border-radius: 11px; padding: 6px 6px 8px;
      box-shadow: inset 0 0 0 1px var(--rule-2), 0 2px 5px var(--shadow);
    }
    .sticker .print { border-radius: 7px; aspect-ratio: 1 / 1.06; }
    .sticker-foil { box-shadow: inset 0 0 0 1.5px var(--brass), 0 3px 10px var(--shadow); }
    .sticker .nm { font-size: 12px; font-weight: 700; text-align: center; margin-top: 7px; letter-spacing: .01em; }
    .sticker .ctry { font-size: 8.5px; letter-spacing: .12em; color: var(--ink-3); text-align: center; text-transform: uppercase; font-weight: 700; margin-top: 1px; }

    /* The number tab in the pocket's corner */
    .tab {
      position: absolute; top: -1px; left: -1px; z-index: 4; pointer-events: none;
      background: var(--ink); color: var(--stock);
      font-family: var(--font-s); font-weight: 800; font-size: 10px; letter-spacing: .06em;
      padding: 2.5px 7px; border-radius: 9px 2px 8px 2px; line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }
    .tab-brass { background: var(--brass); color: var(--on-brass); }

    /* ═══════════════════════════════════════════════════════════════
       THE BOARD — ten answer pockets
    ═══════════════════════════════════════════════════════════════ */
    .board { display: grid; gap: 7px; }
    /* Four across, not five. Ten cards over five columns left each one about
       65px wide on a phone — the photograph too small to recognise a face by
       and the name down at 7.6px. Flex, not grid, so the trailing row of two
       centres itself instead of hanging off the left. */
    .board-5 { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
    /* min-width:0 matters: a flex item defaults to min-width:auto, so a long
       name ("CRISTIANO RONALDO") pushed the card past its 25% and the whole
       board off the right edge of the phone. */
    .board-5 > * { flex: 0 0 calc(25% - 5.25px); min-width: 0; }
    .board-2 { grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .board-big { grid-template-columns: repeat(2, 1fr); gap: 12px; }

    @keyframes tileIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .b {
      position: relative; cursor: pointer; user-select: none; touch-action: manipulation;
      background: var(--pocket); border-radius: 9px; padding: 4px 4px 5px;
      box-shadow: inset 0 0 0 1px var(--rule-2), 0 1px 3px var(--shadow);
      display: flex; flex-direction: column; align-items: stretch; gap: 3px;
      transition: transform .12s, box-shadow .15s, opacity .3s, filter .3s;
    }
    /* dealt in on a new question only — see introOn */
    .intro .b { animation: tileIn .28s cubic-bezier(.2,.8,.3,1) backwards; }
    .b:active { transform: scale(.95); }
    .b .print { border-radius: 5px; aspect-ratio: 1 / .92; flex-shrink: 0; }
    .b-crest { }
    /* Every crest sits in the same disc, whatever shape or background its file
       happens to have. That is what makes a row of them read as one set — and
       it is also what keeps a dark crest legible on a dark page. */
    .crest-box { position: relative; aspect-ratio: 1 / .92; flex-shrink: 0; }
    .crest-disc {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 86%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
      background: #F4F1E7; box-shadow: inset 0 0 0 1px rgba(32,36,30,.16);
      display: flex; align-items: center; justify-content: center;
    }
    .crest-disc > img, .crest-disc > svg { width: 78%; height: 78%; object-fit: contain; pointer-events: none; display: block; }
    .crest-disc > .fill { width: 100%; height: 100%; object-fit: cover; }
    .qart-crest .crest-disc, .ficha-crest .crest-disc { position: static; transform: none; width: 100%; height: 100%; }

    /* the caption: the name is the answer, so it must never clip.
       Three lines at 320px, two on anything roomier. */
    .tile-name {
      font-size: 7.6px; font-weight: 700; line-height: 1.12; text-align: center; color: var(--ink);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      overflow-wrap: anywhere; min-height: 17px; padding: 0 1px;
    }
    .tile-name .fl { display: inline-block; vertical-align: -1px; margin-right: 2px; }
    .tile-club { font-size: 8px; -webkit-line-clamp: 2; }
    .tile-name-long { font-size: 6.7px; line-height: 1.06; -webkit-line-clamp: 4; }
    @media (min-width: 400px) {
      .tile-name { font-size: 8.4px; -webkit-line-clamp: 2; }
      .tile-club { font-size: 8.8px; }
      .tile-name-long { font-size: 7.4px; -webkit-line-clamp: 3; }
    }

    /* text pockets (names only, two columns) */
    .b-text { flex-direction: row; align-items: center; justify-content: center; min-height: 62px; padding: 12px 10px 12px 24px; }
    /* 62px was sized for a six-choice question, where every tile is a sentence.
       The photo-reveal and career-path boards put ten names in the same space —
       five rows — and at 62px each that plus the revealing photograph ran off
       the bottom of a 844px phone. Ten short names need less room, not more. */
    .board-2-tight .b-text { min-height: 46px; padding: 8px 9px 8px 21px; }
    .board-2-tight .b-text .tile-name { font-size: 11.5px; }
    .board-2-tight .b-text .tile-name-long { font-size: 10.5px; }
    /* A text pocket centres its name, so on a narrow phone a long one wraps up
       into the corner the audience figure occupies. Reserve that corner only
       while the vote is actually on screen. */
    /* 44px, not 30: a crowd that votes 100% for one tile makes the badge
       wider than a two-digit one, and the caption met it in the corner. */
    .b-text.b-voted { padding-right: 44px; }
    .b-text .tile-name { -webkit-line-clamp: 3; font-size: 13.5px; min-height: 0; }
    .b-text .tile-name-long { font-size: 12px; }

    /* a burned pocket (Cortar) */
    /* Cortar takes a card off the board. The empty pocket used to appear
       between one frame and the next, which read as a glitch rather than as
       something being removed; it fades open instead. */
    @keyframes cutAway { from { opacity: 0; transform: scale(1.04); } }
    .b-gone { background: transparent; box-shadow: none; opacity: .45; cursor: default;
      border: 1.5px dashed var(--rule); border-radius: 9px; }
    .cut-now .b-gone { animation: cutAway .3s ease-out; }
    .b-gone .print { visibility: hidden; }
    /* a tile that *is* a card needs no pocket of its own behind it */
    .b-fig { padding: 0; background: transparent; box-shadow: none; overflow: visible; }
    .b-fig > .fig { width: 100%; }
    .b-fig.b-sel   { box-shadow: 0 0 0 2px var(--ink), 0 4px 10px var(--shadow-2); }
    .b-fig.b-correct { box-shadow: 0 0 0 2.5px var(--good), 0 4px 12px var(--shadow); }
    .b-fig.b-wrong   { box-shadow: 0 0 0 2.5px var(--bad); }
    .b-fig.b-locked  { box-shadow: 0 0 0 2px var(--ink), 0 4px 10px var(--shadow-2); }
    .b-fig.b-wrong .fig-shot img { filter: grayscale(1); opacity: .55; }

    /* states */
    .b-sel { box-shadow: inset 0 0 0 2px var(--ink), 0 4px 10px var(--shadow-2); transform: translateY(-2px); }
    .b-sel .tab { background: var(--pitch); color: var(--on-pitch); }
    @keyframes lockPulse { 0%,100% { box-shadow: inset 0 0 0 2px var(--ink), 0 4px 10px var(--shadow-2); } 50% { box-shadow: inset 0 0 0 3px var(--ink), 0 6px 16px var(--shadow-2); } }
    .b-locked { animation: lockPulse .9s ease-in-out infinite; transform: translateY(-2px); }
    .b-faded  { opacity: .28; filter: grayscale(1); }
    /* A wrong answer shakes; a right one had nothing. It gets the gesture the
       album is built on — the sticker pressed down into the page and settling.
       One short beat, no bounce: the reveal is already carrying the moment. */
    @keyframes stickDown {
      0%   { transform: translateY(-2px) scale(1); }
      38%  { transform: translateY(1px)  scale(.965); }
      100% { transform: translateY(-2px) scale(1); }
    }
    .b-correct { box-shadow: inset 0 0 0 2.5px var(--good), 0 4px 12px var(--shadow);
      transform: translateY(-2px); animation: stickDown .42s cubic-bezier(.3,.7,.3,1); }
    .b-correct .tab { background: var(--good); color: #fff; }
    .b-fig.b-correct { animation: stickDown .42s cubic-bezier(.3,.7,.3,1); }
    @keyframes wrongShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
    .b-wrong { box-shadow: inset 0 0 0 2.5px var(--bad); animation: wrongShake .4s ease-out; }
    .b-wrong .tab { background: var(--bad); color: #fff; }
    .b-wrong .print img { filter: grayscale(1); opacity: .55; }
    .expert-ring { outline: 2px dashed var(--brass); outline-offset: 2px; }

    /* the audience vote — an underline along the pocket's bottom edge and a
       small figure at the top right, the two places no caption ever uses */
    .vote { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 0 0 9px 9px; overflow: hidden;
      background: var(--rule-2); z-index: 4; pointer-events: none; }
    .vote > i { display: block; height: 100%; background: var(--pitch); animation: voteGrow .7s cubic-bezier(.2,.9,.3,1) backwards; }
    @keyframes voteGrow { from { width: 0 !important; } }
    .vote-pct { position: absolute; right: 3px; top: 3px; z-index: 4; pointer-events: none;
      padding: 1.5px 5px; border-radius: 5px; background: var(--ink); color: var(--stock);
      font: 800 9px/1.2 var(--font-s); font-variant-numeric: tabular-nums;
      animation: votePop .34s cubic-bezier(.2,1.4,.4,1) backwards; }
    @keyframes votePop { from { opacity: 0; transform: scale(.6); } }
    /* the tile the room actually backed */
    .b-voted { transition: box-shadow .3s; }
    .b-top-vote .vote-pct { background: var(--pitch); color: var(--on-pitch); }
    .b-top-vote .vote > i { background: var(--pitch); }

    /* ═══════════════════════════════════════════════════════════════
       THE QUESTION — a ficha, with a double rule
    ═══════════════════════════════════════════════════════════════ */
    .qcard {
      position: relative; background: var(--pocket); border-radius: 12px; padding: 12px 14px;
      box-shadow: inset 0 0 0 1px var(--rule-2), 0 2px 6px var(--shadow);
      display: flex; align-items: center; gap: 12px; min-height: 60px;
    }
    /* The board's tiles deal themselves in one by one; the question above them
       simply swapped its text, so on a fast answer it was easy to start
       reading the new question believing it was still the old one. It arrives
       just ahead of the first tile. */
    .intro .qcard { animation: qIn .32s cubic-bezier(.2,.9,.3,1); }
    @keyframes qIn { from { opacity: 0; transform: translateY(-5px); } }
    /* the accent rule draws itself down the side as the card lands */
    .qcard::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
      border-radius: 0 3px 3px 0; background: var(--pitch); transform-origin: top; }
    .intro .qcard::before { animation: qRule .44s cubic-bezier(.2,.9,.3,1) .06s backwards; }
    @keyframes qRule { from { transform: scaleY(0); } }
    .qcard-brass::before { background: var(--brass); }
    .qcard p { font-family: var(--font-d); font-optical-sizing: auto; font-weight: 500; font-size: 17.5px; line-height: 1.32;
      letter-spacing: -.005em; flex: 1; min-width: 0; white-space: pre-line; text-wrap: balance; }
    .qart { flex-shrink: 0; border-radius: 8px; overflow: hidden; }
    .qart-face { width: 66px; height: 66px; border-radius: 50%; }
    .qart-wide { width: 104px; height: 68px; }
    /* a flag drawn at the size of a vignette, for the questions about a country */
    .qart-flag { width: 78px; height: 52px; border-radius: 4px; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(32,36,30,.3), 0 1px 3px var(--shadow); }
    .qart-flag svg { width: 100%; height: 100%; display: block; }
    /* the map is portrait where the other vignettes are landscape */
    .qart-map { width: 72px; height: 76px; }
    @media (max-width: 360px) { .qart-map { width: 60px; height: 64px; } }
    /* a career shown as the crests it passed through, dealt left to right */
    .qart-path { display: flex; align-items: center; gap: 2px; width: auto; }
    /* .crest-box gives the disc the box it positions itself against — without
       it clubArt's absolute disc escapes and fills the screen. */
    .qart-path .qp { display: block; width: 30px; flex: none;
      animation: qpIn .34s cubic-bezier(.2,.9,.3,1) backwards; }
    .qart-path .qp:nth-child(n+2) { margin-left: -6px; }
    @keyframes qpIn { from { opacity: 0; transform: translateX(-6px) scale(.8); } }
    @media (max-width: 360px) { .qart-path .qp { width: 25px; } }
    .qart-draw { display: flex; align-items: center; justify-content: center;
      background: var(--retro-card); box-shadow: inset 0 0 0 1px var(--retro-edge); }
    .qart-crest { width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; }
    /* When the crest *is* the question, 50px is not enough to read a club's
       mark by. Elsewhere it is an aside beside the text and stays small. */
    .qart-crest.qart-hero { width: 86px; height: 86px; }
    @media (max-width: 360px) { .qart-crest.qart-hero { width: 70px; height: 70px; } }

    /* ── Photo reveal ── */
    .reveal-box { width: 138px; height: 138px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--rule), 0 6px 18px var(--shadow); }

    /* ── Header rail: the score, the clock, the dots ── */
    .pdot { width: 5px; height: 5px; border-radius: 50%; background: var(--rule); transition: background .25s, transform .25s; flex-shrink: 0; }
    .pdot-on   { background: var(--pitch); }
    .pdot-cur  { background: var(--ink); transform: scale(1.5); }
    .pdot-miss { background: var(--bad); }

    .score { display: flex; align-items: baseline; gap: 3px; position: relative; }
    .score .v { font-size: 20px; }
    .score .u { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
    @keyframes scoreUp { 0%,100% { transform: scale(1); } 45% { transform: scale(1.25); } }
    .score-up .v { display: inline-block; animation: scoreUp .28s ease-out; }
    @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 4px); } 18% { opacity: 1; transform: translate(-50%, -4px); } 100% { opacity: 0; transform: translate(-50%, -34px); } }
    .gain { position: absolute; left: 50%; top: -2px; font-size: 14px; font-weight: 800; color: var(--good); pointer-events: none; z-index: 40; animation: floatUp 1s ease-out forwards; white-space: nowrap; }

    .clock { display: flex; align-items: center; gap: 4px; color: var(--ink-2); }
    .clock .v { font-size: 18px; }
    .clock.timer-low { color: var(--bad); }
    @keyframes timerPulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    .timer-low { animation: timerPulse .55s ease-in-out infinite; }

    /* timer bar */
    .timer { height: 4px; background: var(--rule-2); border-radius: 4px; overflow: hidden; }
    .timer > i { display: block; height: 100%; background: var(--pitch); border-radius: 4px; transition: width .8s linear, background .3s; }
    .timer > i.t-brass { background: var(--brass); }
    .timer > i.t-warn { background: var(--warn); }
    .timer > i.t-bad  { background: var(--bad); }

    /* the ladder rail: sixteen notches */
    .rail { display: flex; gap: 2px; align-items: center; }
    .notch { flex: 1; height: 5px; border-radius: 3px; background: var(--rule-2);
      transition: background .45s ease, transform .3s cubic-bezier(.3,.9,.4,1), height .3s; }
    .notch-done { background: var(--pitch); }
    .notch-safe { background: var(--rule); }
    /* a banked checkpoint is money you keep, so it stays brass and stands up */
    .notch-safe.notch-done { background: var(--brass); height: 7px; }
    /* the rung being played: taller, brass, and breathing */
    .notch-now { background: var(--brass); height: 9px; transform: scaleX(1.06);
      box-shadow: 0 0 0 1px var(--brass-soft); animation: notchNow 1.5s ease-in-out infinite; }
    @keyframes notchNow { 0%,100% { opacity: .95; } 50% { opacity: .5; } }

    /* the multiplier climbs; it should look like it just did */
    @keyframes streakUp { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
    .streak-up { animation: streakUp .38s cubic-bezier(.3,.8,.3,1); }

    /* what this question is worth */
    .stakes { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .stakes-v { font-family: var(--font-d); font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: -.02em; color: var(--brass-ink); }
    @keyframes prizeUp { 0% { transform: translateY(4px); opacity: 0; } 100% { transform: none; opacity: 1; } }
    .prize-pop { animation: prizeUp .4s ease-out; }
    .safe-box { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--rule); border-radius: 10px; padding: 5px 9px; cursor: pointer; text-align: right; flex-shrink: 0; }
    .safe-box .k { font-size: 8px; letter-spacing: .16em; color: var(--ink-3); font-weight: 800; text-transform: uppercase; }
    .safe-box .v { font-size: 12px; font-weight: 800; }

    /* the pundit */
    .expert-box { display: flex; align-items: center; gap: 9px; border: 1px dashed var(--brass);
      border-radius: 10px; padding: 7px 11px; background: var(--brass-soft);
      animation: expertIn .4s cubic-bezier(.25,.9,.3,1); }
    @keyframes expertIn { from { opacity: 0; transform: translateY(-6px); } }
    .expert-box p { font-size: 11px; line-height: 1.45; color: var(--ink-2); }
    .expert-box em { color: var(--ink-3); }

    /* the five cards */
    .ajudas { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .ajuda {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px;
      background: var(--pocket); border: 1px solid var(--rule); border-radius: 12px; padding: 7px 8px 6px;
      font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
      cursor: pointer; transition: transform .12s, box-shadow .18s, border-color .18s, background .18s;
    }
    /* the icon sits in its own tinted disc, the way the crests do */
    .aj-disc { display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%; flex: none;
      background: var(--aj-soft); color: var(--aj); transition: transform .18s, background .18s; }
    .aj-lbl { line-height: 1; }

    /* Each lifeline borrows the colour the game already uses for what it does.
       Written as rgba rather than color-mix(): that lands in Chrome 111, and
       this ships inside whatever WebView the phone happens to have. */
    .aj-cut  { --aj: #B3402F; --aj-soft: rgba(179, 64, 47, .14); }
    .aj-poll { --aj: #3F6FB5; --aj-soft: rgba(63, 111, 181, .14); }
    .aj-mic  { --aj: #8E4E9E; --aj-soft: rgba(142, 78, 158, .14); }
    .aj-snow { --aj: #2E8BA8; --aj-soft: rgba(46, 139, 168, .14); }
    .aj-skip { --aj: #17593F; --aj-soft: rgba(23, 89, 63, .14); }
    :root[data-theme="dark"] .aj-cut,  :root:not([data-theme="light"]) .aj-cut  { --aj: #E06A55; }
    :root[data-theme="dark"] .aj-poll, :root:not([data-theme="light"]) .aj-poll { --aj: #7FA9E8; }
    :root[data-theme="dark"] .aj-mic,  :root:not([data-theme="light"]) .aj-mic  { --aj: #C58FD4; }
    :root[data-theme="dark"] .aj-snow, :root:not([data-theme="light"]) .aj-snow { --aj: #6BC2DC; }
    :root[data-theme="dark"] .aj-skip, :root:not([data-theme="light"]) .aj-skip { --aj: #3E9C6E; }

    .ajuda:not(:disabled):hover { border-color: var(--aj); box-shadow: 0 2px 8px var(--shadow); }
    .ajuda:not(:disabled):hover .aj-disc { transform: scale(1.08); }
    .ajuda:not(:disabled):active { transform: translateY(1px) scale(.96); }

    /* Spent. Struck-through text at 30% opacity read as a rendering fault more
       than as a used-up card; it is greyed and stamped instead, and the disc
       keeps its shape so the row does not jump when one goes. */
    .ajuda:disabled { cursor: default; opacity: .55; background: transparent;
      border-style: dashed; color: var(--ink-4); }
    .ajuda:disabled .aj-disc { background: transparent; color: var(--ink-4);
      box-shadow: inset 0 0 0 1px var(--rule); }
    .ajuda:disabled .aj-lbl { text-decoration: line-through; text-decoration-thickness: 1px; }

    /* the one being spent right now */
    @keyframes ajSpend {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    /* the one just spent: the disc flares as it hands itself in */
    .aj-firing .aj-disc { animation: ajSpend .42s cubic-bezier(.3,.8,.3,1); }
    .aj-firing::after { content: ''; position: absolute; inset: 0; border-radius: 12px;
      background: var(--aj); opacity: 0; animation: ajFlash .5s ease-out; pointer-events: none; }
    @keyframes ajFlash { 0% { opacity: .22; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .aj-firing::after { display: none; } }
    .footer-hint { font-size: 10px; color: var(--ink-3); text-align: center; }
    .foot { display: flex; flex-direction: column; align-items: center; gap: 7px; padding-top: 2px; }
    .foot-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }

    /* the moment: everything not picked fades while the answer hangs */
    @keyframes stageDim { from { opacity: 0; } to { opacity: 1; } }
    .stage-dark { position: absolute; inset: 0; z-index: 2; pointer-events: none; animation: stageDim .4s ease-out backwards;
      background: radial-gradient(ellipse at 50% 42%, transparent 30%, var(--stock) 95%); opacity: .55; }

    /* ── The ladder sheet ── */
    .sheet { position: absolute; inset: 0; z-index: 20; background: var(--stock); display: flex; flex-direction: column; padding: 14px; gap: 8px; animation: screenIn .18s ease-out; }
    .rung { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 7px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; transition: background .25s, color .25s; }
    .rung-safe { color: var(--ink-2); background: var(--pocket); }
    .rung-done { color: var(--good); }
    .rung-now  { background: var(--pitch-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--pitch); }
    .rung-top  { color: var(--brass); }
    .rung-n { width: 17px; text-align: right; flex-shrink: 0; font-size: 9px; color: var(--ink-3); font-weight: 700; }

    /* The pause between locking an answer in and seeing it.
       It used to announce "Resposta travada", which told the player something
       they had just done themselves. Three dots settling in turn say the only
       thing worth saying there: the answer is coming. */
    .settling { display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 14px 0 10px; }
    .settle-dots { display: flex; gap: 7px; }
    .settle-dots i { width: 7px; height: 7px; border-radius: 50%;
      background: var(--brass); display: block;
      animation: settle 1.05s ease-in-out infinite; }
    .settle-dots i:nth-child(2) { animation-delay: .16s; }
    .settle-dots i:nth-child(3) { animation-delay: .32s; }
    @keyframes settle {
      0%, 70%, 100% { opacity: .25; transform: translateY(0) scale(.85); }
      35%           { opacity: 1;   transform: translateY(-3px) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .settle-dots i { opacity: .7; } }

    /* how far along a locked medal is */
    .medal-prog { height: 3px; background: var(--rule-2); border-radius: 2px;
      overflow: hidden; margin-top: 5px; }
    .medal-prog > i { display: block; height: 100%; background: var(--brass);
      border-radius: 2px; transition: width .9s cubic-bezier(.2,.8,.3,1); }
    .medal-num { font-size: 9px; font-weight: 700; color: var(--ink-3);
      margin-top: 3px; font-variant-numeric: tabular-nums; }

    /* ── The stickers a run earned, shown at the end ── */
    .newfigs { width: 100%; max-width: 330px; display: flex; flex-direction: column;
      align-items: center; gap: 7px; margin-top: 4px; padding: 11px 10px 13px;
      background: var(--pocket); border: 1px solid var(--rule);
      border-radius: 12px; }
    .newfigs-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .newfig { width: 54px; flex: none; display: block;
      animation: figpop .34s cubic-bezier(.2,1.5,.4,1) backwards; }
    /* The small sticker's band is padded for a 90px answer tile. At 54px that
       padding is most of the card, and every country truncates to "BRASI…". */
    .newfig .fig-band { padding-left: 3px; padding-right: 3px; letter-spacing: .02em; }
    .newfig .fig-nm   { font-size: 6.6px; }
    .newfig-more { align-self: center; font-size: 11px; font-weight: 800;
      color: var(--ink-3); padding: 0 2px; }
    @keyframes figpop { from { opacity: 0; transform: scale(.72) translateY(6px) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .newfig { animation: none; } }

    /* ── Home ── */
    /* The cover sticker is a different player every time the app opens. It
       used to arrive with the rest of the page, which read as a fixed part of
       the layout; dealing it in says it was picked for you just now. */
    .hero-sticker { width: 138px; margin: 0 auto;
      animation: dealIn .5s cubic-bezier(.2,.9,.3,1) 60ms backwards; }
    @keyframes dealIn { from { opacity: 0; transform: translateY(9px) rotate(-2.2deg) scale(.965); } }
    .modes { display: flex; gap: 7px; width: 100%; max-width: 340px; }
    .mode { flex: 1; min-width: 0; background: var(--pocket); border: 1px solid var(--rule);
      border-radius: 12px; padding: 11px 6px 10px; text-align: center; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      transition: transform .12s, background .15s, border-color .18s, box-shadow .18s; }
    /* same disc the lifelines use, so the two screens read as one app */
    .mode-disc { display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      background: var(--md-soft); color: var(--md); transition: transform .18s; }
    .mode-daily { --md: #17593F; --md-soft: rgba(23, 89, 63, .14); }
    .mode-done  { --md: #7E8175; --md-soft: rgba(126, 129, 117, .14); }
    .mode-surv  { --md: #B3402F; --md-soft: rgba(179, 64, 47, .14); }
    .mode-train { --md: #B8860B; --md-soft: rgba(184, 134, 11, .14); }
    /* `.mode` grows to share the three-across row it was written for. The
       album button reuses the look but stands alone in a column, where
       growing would stretch it down the whole page. */
    .mode-album { --md: #B8860B; --md-soft: rgba(184, 134, 11, .14); flex: none; }
    :root[data-theme="dark"] .mode-album, :root:not([data-theme="light"]) .mode-album { --md: #D8A83C; }
    :root[data-theme="dark"] .mode-daily, :root:not([data-theme="light"]) .mode-daily { --md: #3E9C6E; }
    :root[data-theme="dark"] .mode-surv,  :root:not([data-theme="light"]) .mode-surv  { --md: #E06A55; }
    :root[data-theme="dark"] .mode-train, :root:not([data-theme="light"]) .mode-train { --md: #D8A83C; }
    .mode:hover { background: var(--pocket-2); border-color: var(--md); box-shadow: 0 2px 8px var(--shadow); }
    .mode:hover .mode-disc { transform: scale(1.08); }
    .mode:active { transform: translateY(1px) scale(.97); }
    .mode .mt { font-size: 12px; font-weight: 800; letter-spacing: .01em; color: var(--ink); }
    .mode .ms { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; font-variant-numeric: tabular-nums; }
    .home-foot { display: flex; gap: 14px; align-items: center; justify-content: center; }
    .link { background: none; border: none; color: var(--pitch); font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px; text-decoration: underline; text-underline-offset: 3px; }
    .medal-strip { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 300px; cursor: pointer; }
    .medal-strip .medal-dot { animation: tileIn .34s ease-out backwards; }
    .medal-strip .medal-dot:nth-child(1){animation-delay:40ms} .medal-strip .medal-dot:nth-child(2){animation-delay:80ms}
    .medal-strip .medal-dot:nth-child(3){animation-delay:120ms} .medal-strip .medal-dot:nth-child(4){animation-delay:160ms}
    .medal-strip .medal-dot:nth-child(5){animation-delay:200ms} .medal-strip .medal-dot:nth-child(6){animation-delay:240ms}
    .medal-strip .medal-dot:nth-child(n+7){animation-delay:280ms}
    .medal-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--pocket); box-shadow: inset 0 0 0 1px var(--rule); display: flex; align-items: center; justify-content: center; color: var(--brass); }

    /* ── Difficulty cards ── */
    .dc { display: flex; align-items: center; gap: 14px; background: var(--pocket); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; cursor: pointer;
      transition: transform .12s, background .15s, border-color .18s, box-shadow .18s;
      animation: tileIn .34s cubic-bezier(.2,.9,.3,1) backwards; }
    .dc:nth-child(1) { animation-delay: 40ms; }
    .dc:nth-child(2) { animation-delay: 100ms; }
    .dc:nth-child(3) { animation-delay: 160ms; }
    .dc:hover { background: var(--pocket-2); border-color: var(--dc-col); box-shadow: 0 3px 12px var(--shadow); }
    .dc:hover .ic { transform: scale(1.07); }
    .dc:active { transform: translateY(1px) scale(.985); }
    /* the filled disc the modes and the lifelines use, so every choice in the
       app is made of the same object */
    .dc .ic { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; background: var(--dc-soft); color: var(--dc-col);
      transition: transform .18s; }
    /* three rungs of heat: the harder it is, the heavier the card reads */
    .dc-facil    { --dc-col: #2E7D4F; --dc-soft: rgba(46, 125, 79, .14); }
    .dc-moderado { --dc-col: #B8761F; --dc-soft: rgba(184, 118, 31, .15); }
    .dc-dificil  { --dc-col: #B3402F; --dc-soft: rgba(179, 64, 47, .15); }
    :root[data-theme="dark"] .dc-facil,    :root:not([data-theme="light"]) .dc-facil    { --dc-col: #4CAE74; }
    :root[data-theme="dark"] .dc-moderado, :root:not([data-theme="light"]) .dc-moderado { --dc-col: #E0A340; }
    :root[data-theme="dark"] .dc-dificil,  :root:not([data-theme="light"]) .dc-dificil  { --dc-col: #E06A55; }
    .dc .t { font-family: var(--font-d); font-weight: 600; font-size: 20px; line-height: 1.05; letter-spacing: -.01em; }
    .dc .d { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
    .dc .n { font-size: 18px; text-align: right; flex-shrink: 0; }
    .dc .n small { display: block; font-size: 9px; letter-spacing: .12em; color: var(--ink-3); font-weight: 700; text-transform: uppercase; margin-top: 2px; }

    /* ── Medals ── */
    .medal { display: flex; align-items: center; gap: 12px; background: var(--pocket); border: 1px solid var(--rule-2); border-radius: 11px; padding: 9px 12px; }
    .medal .ic { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 0 0 1px var(--rule); }
    .medal-on { border-color: var(--brass); background: var(--brass-soft); }
    .medal-on .ic { color: var(--brass); }
    /* A locked medal is not a disabled control — the whole point of the row is
       to read what it asks and how far along you are. .55 put that text at
       2.4:1; the lock now reads from the icon and the missing brass, not from
       making the words hard to see. */
    .medal-off { opacity: 1; }
    .medal-off .ic { color: var(--ink-4); }
    .medal .t { font-size: 13px; font-weight: 800; }
    .medal .d { font-size: 10.5px; color: var(--ink-2); }

    /* ── Result squares (the share card, drawn) ── */
    .runlog { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
    .runlog i { width: 13px; height: 13px; border-radius: 3px; display: block; background: var(--rule); }
    .rl-3 { background: var(--pitch) !important; }
    .rl-1 { background: var(--brass) !important; }
    .rl-0 { background: var(--ink-3) !important; }

    /* ── Stat row on the end screens ── */
    .stats { display: flex; gap: 18px; justify-content: center; }
    .stats .v { font-size: 17px; }
    .stats .k { font-size: 8.5px; letter-spacing: .16em; color: var(--ink-3); font-weight: 800; text-transform: uppercase; margin-top: 2px; }
    .bar { width: 200px; height: 5px; background: var(--rule-2); border-radius: 3px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--pitch); border-radius: 3px; transition: width 1s ease-out; }
    .bonus { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--rule); border-radius: 9px; padding: 1px 7px; font-size: 10px; font-weight: 700; margin-left: 4px; color: var(--ink-2); }

    /* ── Credits ── */
    .credit-row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule-2); font-size: 10px; }
    .credit-row .l { color: var(--brass-ink); white-space: nowrap; font-size: 9px; }
    .note { background: var(--brass-soft); border: 1px solid var(--brass); border-radius: 9px; padding: 8px 11px; font-size: 10px; line-height: 1.5; }

    /* ═══════════════════════════════════════════════════════════════
       SHORT SCREENS
       On a 568px-tall phone the quiz fits — until an ajuda adds a row
       or the question carries a photo. Reclaim the height from padding
       and the picture, never from the caption or the button.
    ═══════════════════════════════════════════════════════════════ */
    /* Four across costs a row: ten cards become 4+4+2 instead of 5+5, and on a
       320px-wide phone that pushed CONFIRMAR below the fold — the one control
       the player must reach. Small screens keep five across and the smaller
       type that goes with it; everything roomier gets the bigger cards. */
    /* Four across costs a row of card height, and on a 390-420px phone the
       tightest board there is — a Milhão question with the audience and the
       pundit both on screen — sits about 45px above the fold. A question that
       runs to three lines spends that. This gives it back where it is cheapest:
       the padding around the stakes and the pundit, not the cards. */
    @media (min-width: 380px) and (max-width: 430px) {
      .qz-screen { gap: 7px !important; }
      .qz-screen .stakes { padding-bottom: 1px; }
      .qz-screen .expert-box { padding: 5px 9px; }
      .qz-screen .expert-box p { font-size: 10.5px; line-height: 1.35; }
      .qz-screen .ajuda { padding: 6px 7px 5px; }
      .qz-screen .aj-disc { width: 23px; height: 23px; }
      .qz-screen .board { gap: 6px; }
      .qz-screen .board-5 > * { flex: 0 0 calc(25% - 4.5px); }
    }

    @media (max-width: 379px) {
      .board-5 > * { flex: 0 0 calc(20% - 5.6px); }
      .fig-sm .fig-band { font-size: 5.6px; padding: 1.5px 4px; }
      .fig-sm .fig-cap  { padding: 3px 2px; min-height: 21px; }
      .fig-sm .fig-nm   { font-size: 7.6px; }
      .fig-sm .fig-nm-long { font-size: 6.7px; }
      .fig-sm .fig-flag { width: 10px; height: 7px; }
      .tab { font-size: 8.5px; padding: 2px 6px; }
      .qcard p { font-size: 15.5px; }
      /* ten text pockets is five rows; at 52px they pushed CONFIRMAR off a
         568px-tall screen, so here they stay close to their old height. */
      .b-text { min-height: 45px; padding: 8px 8px 8px 20px; }
      .b-text .tile-name { font-size: 10.8px; }
      .b-text .tile-name-long { font-size: 9.8px; }
      .qart-wide { width: 88px; height: 58px; }
      .qart-face { width: 56px; height: 56px; }
      .qart-flag { width: 66px; height: 44px; }
    }

    @media (max-height: 660px) {
      .qz-screen { padding: 8px !important; gap: 6px !important; }
      .qz-screen .qcard { min-height: 46px; padding: 9px 12px; gap: 9px; }
      .qz-screen .qcard p { font-size: 15px; }
      .qz-screen .ajuda { padding: 4px 7px 3px; font-size: 8.5px; gap: 2px; }
      .qz-screen .aj-disc { width: 21px; height: 21px; }
      .qz-screen .reveal-box { width: 96px; height: 96px; }
      .qz-screen .qart-wide { width: 88px; height: 58px; }
      .qz-screen .qart-face { width: 56px; height: 56px; }
      .qz-screen .stakes-v { font-size: 21px; }
      .qz-screen .expert-box { padding: 4px 8px; }
      .qz-screen .expert-box p { font-size: 10px; }
      .qz-screen .footer-hint { display: none; }
      /* Ten text pockets is five rows, and on a 568px screen that plus a
         photo-reveal image is the tightest board in the game — it was tipping
         CONFIRMAR over the fold about half the time. The pockets give the
         height back here; they are full size on anything taller. */
      .qz-screen .b-text { min-height: 38px; padding: 6px 8px 6px 18px; }
      .qz-screen .b-text .tile-name { font-size: 10px; }
      .qz-screen .b-text .tile-name-long { font-size: 9.2px; }
      .qz-screen .board-2 { gap: 6px; }
      .qz-screen .b .print { aspect-ratio: 1 / .8; }
      .qz-screen .board-5 { gap: 5px; }
      .qz-screen .board-2 { gap: 5px; }
      .qz-screen .b-text { min-height: 34px; padding: 4px 6px 4px 18px; }
      /* must repeat here: same specificity as the rule above, and this block
         comes later, so without it the reserved vote corner is undone */
      .qz-screen .b-text.b-voted { padding-right: 44px; }
      .qz-screen .b-text .tile-name { font-size: 10px; }
      .qz-screen .ajudas { gap: 4px; }
      .qz-screen .foot { gap: 5px; }
      .qz-screen .btn-lg { padding: 11px 26px; font-size: 14px; }
    }
    /* 600, not 520. On a 568px screen the label under each lifeline is the
       difference between CONFIRMAR sitting above the fold and below it, and
       now that each icon has its own colour and disc the row still reads
       without them. Measured: it failed about a third of runs at 520. */
    @media (max-height: 600px) {
      .qz-screen .reveal-box { width: 72px; height: 72px; }
      /* label only: `span` alone would now also hide the icon's disc */
      .qz-screen .ajuda .aj-lbl { display: none; }
      .qz-screen .ajuda { min-width: 34px; padding: 5px; }
    }

    /* ── The back of a sticker, shown on the reveal ── */
    /* The back of the card is the payoff of getting it right — the detail you
       only see because you knew the answer. It turns over into place rather
       than appearing already there. */
    @keyframes fichaIn {
      0%   { opacity: 0; transform: perspective(600px) rotateX(-38deg) translateY(-8px); }
      100% { opacity: 1; transform: none; }
    }
    .ficha { display: flex; align-items: center; gap: 11px; text-align: left; position: relative;
      background: var(--pocket); border: 1px solid var(--rule-2); border-radius: 10px;
      padding: 8px 10px; margin: 8px auto 0; max-width: 420px;
      transform-origin: top center;
      animation: fichaIn .46s cubic-bezier(.25,.9,.3,1) 60ms backwards; }
    /* a sticker you did not have yet gets the brass edge and a beat of its own */
    @keyframes fichaGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(184,134,11,0); }
      45%     { box-shadow: 0 0 0 4px rgba(184,134,11,.22); }
    }
    .ficha-new { border-color: var(--brass); background: var(--brass-soft);
      animation: fichaIn .46s cubic-bezier(.25,.9,.3,1) 60ms backwards,
                 fichaGlow 1.1s ease-out .5s 2; }
    .ficha-art { width: 44px; height: 46px; border-radius: 6px; flex-shrink: 0; }
    .ficha-crest { display: flex; align-items: center; justify-content: center; }
    .ficha-crest img, .ficha-crest svg, .ficha-crest .roundel { width: 100%; height: 100%; object-fit: contain; }
    .ficha-txt { min-width: 0; flex: 1; }
    .ficha-n { font-size: 12.5px; font-weight: 800; line-height: 1.2; }
    .ficha-n em { font-style: italic; font-weight: 600; color: var(--ink-3); }
    .ficha-l { font-size: 10px; color: var(--ink-3); line-height: 1.4; margin-top: 1px; }
    .ficha-h { font-size: 10px; color: var(--brass); font-weight: 700; line-height: 1.4; margin-top: 2px; }
    .ficha-tag { animation: figpop .4s cubic-bezier(.2,1.5,.4,1) .42s backwards;
      position: absolute; top: -7px; right: 8px; background: var(--brass); color: var(--on-brass);
      font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 7px; display: flex; align-items: center; gap: 3px; }

    /* ── The album pages ── */
    .alb-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .alb-bar { height: 5px; background: var(--rule-2); border-radius: 3px; overflow: hidden; }
    .alb-bar > i { display: block; height: 100%; background: var(--brass); border-radius: 3px;
      transition: width .9s cubic-bezier(.2,.8,.3,1); }
    /* Open the album straight after a run and the new stickers are somewhere
       among two hundred. These are the ones the run just earned — a brass
       edge and one slow breath, so the eye finds them without the page
       turning into a light show. It lasts only while the run is on screen:
       runNewIds is cleared the moment the next game starts. */
    /* ── Turning a figurinha over ──────────────────────────────
       A real sticker printed the player's details on the back, and reading
       them was half the point of peeling it off the sheet. The album held
       all of this data and never showed it. Only collected cards turn. */
    /* Each page of the album says how full it is. The count alone ("22/85") is
       a fact; the ring is the thing you glance at while scrolling and feel. */
    /* A finished page is the whole point of a sticker album and looked exactly
       like an unfinished one. The band goes brass and the ring becomes a tick. */
    .alb-sec-done .t { color: var(--brass); }
    .alb-sec-done .cnt { color: var(--brass); font-weight: 800; }
    .alb-done .alb-ring { background: var(--brass); }
    .alb-done .alb-ring-n { display: none; }
    .alb-done .alb-ring::after { content: ''; position: relative; display: block;
      width: 9px; height: 5px; border: 2px solid var(--brass); border-top: 0; border-right: 0;
      transform: rotate(-45deg) translate(1px, -1px); }

    .alb-sec-end { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
    .alb-ring { position: relative; width: 30px; height: 30px; border-radius: 50%;
      flex: none; display: flex; align-items: center; justify-content: center;
      background: conic-gradient(var(--brass) calc(var(--p) * 1%), var(--rule-2) 0);
      transition: background .9s cubic-bezier(.2,.8,.3,1); }
    .alb-ring::before { content: ''; position: absolute; inset: 3px;
      border-radius: 50%; background: var(--stock); }
    .alb-ring-n { position: relative; font-size: 8.5px; font-weight: 800;
      color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1; }
    .alb-ring-n i { font-style: normal; font-size: 6px; opacity: 1; }
    /* the same ring, at the size the home screen can give it */
    .alb-ring-lg { width: 40px; height: 40px; }
    .alb-ring-lg::before { inset: 4px; background: var(--pocket); }
    .alb-ring-lg .alb-ring-n { font-size: 11px; }
    .alb-ring-lg .alb-ring-n i { font-size: 7.5px; }

    .alb-hint { display: flex; align-items: center; gap: 5px; font-size: 10px;
      color: var(--ink-3); margin: 1px 0 2px; }
    .alb-turn { cursor: pointer; perspective: 620px; -webkit-perspective: 620px; }
    .flip { display: block; width: 100%; }
    .flip-in { display: block; position: relative; width: 100%;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      transition: transform .48s cubic-bezier(.3,.85,.35,1); }
    .alb-turn.turned .flip-in { transform: rotateY(180deg); }
    /* the pocket's own number sits over the card; the back prints its own */
    .alb-turn.turned > .alb-n { opacity: 0; transition: opacity .12s; }
    .flip-face { display: block; width: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .flip-back { position: absolute; inset: 0; transform: rotateY(180deg); }
    /* the pocket has no intrinsic height, so the back is sized by the front */
    .flip-front { position: relative; }

    .figback { --figback-acc: #8E2A20; position: relative; display: flex; flex-direction: column; height: 100%;
      overflow: hidden;
      border-radius: 4px; padding: 6px 6px 7px; text-align: left;
      background: var(--retro-card2); color: var(--retro-ink);
      box-shadow: inset 0 0 0 1px var(--retro-edge), 0 1px 3px var(--shadow); }
    .figback-wm { position: absolute; right: -14px; bottom: -12px; width: 54%;
      opacity: .08; filter: grayscale(1) contrast(1.3); pointer-events: none; }
    /* on dark paper the crest sits under the honours line, so it has to stay
       below the ink rather than beside it */
    :root[data-theme="dark"] .figback-wm,
    :root:not([data-theme="light"]) .figback-wm { opacity: .1; }
    .figback > span { position: relative; }
    .figback-h { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    /* --retro-band is a deep red made for a band with white on it; as text on
       the card itself it measured 2.0:1 in dark. The back gets its own accent,
       kept red but lifted until it is legible on both papers. */
    .figback-n { font-family: var(--font-c); font-weight: 700; font-size: 7px;
      letter-spacing: .1em; color: var(--figback-acc); }
    .figback-nm { font-family: var(--font-c); font-weight: 700; text-transform: uppercase;
      font-size: 8.4px; line-height: 1.1; margin-top: 3px; overflow-wrap: anywhere; }
    .figback-nick { font-size: 7px; font-style: italic; opacity: .85; margin-top: 1px; }
    :root[data-theme="dark"] .figback, :root:not([data-theme="light"]) .figback {
      --figback-acc: #DB6B60; }   /* #8E2A20 is 2.0:1 on the dark card */
    .figback-rule { display: block; height: 1px; background: var(--retro-edge);
      opacity: .6; margin: 4px 0 4px; }
    .figback-l { font-size: 6.8px; line-height: 1.35; opacity: .85; }
    .figback-l b { font-weight: 700; opacity: 1; }
    .figback-clubs { margin-top: 2px; opacity: .82;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .figback-h2 { font-size: 6.8px; font-weight: 700; color: var(--figback-acc);
      line-height: 1.3; margin-top: auto; padding-top: 3px; }

    .alb-fresh > .fig { box-shadow: 0 0 0 2px var(--brass), 0 2px 8px var(--shadow); }
    .alb-fresh { animation: freshGlow 2.4s ease-in-out 3; }
    @keyframes freshGlow { 0%,100% { filter: none; } 50% { filter: brightness(1.06); } }

    /* ═══════════════════════════════════════════════════════════════
       THE ALBUM AS A BOOK

       A section per country along the top, a spread per era underneath, and
       you turn the page. Each era is printed on its own paper: the twenties
       are a foxed sepia, the fifties the cream-and-red of the albums this is
       modelled on, and the last two decades are the mint card the modern
       stickers already use. The tokens are per-spread, so the band, the paper
       and the rules all move together.
    ═══════════════════════════════════════════════════════════════ */
    .alb-pg { min-height: 0; }

    /* the index */
    .alb-tabs { display: flex; gap: 5px; overflow-x: auto; padding: 2px 1px 4px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      -webkit-mask-image: var(--tabs-mask, none); mask-image: var(--tabs-mask, none); }
    .alb-tabs::-webkit-scrollbar { display: none; }
    /* The index holds far more sections than fit across a phone. Fading the
       side that still has sections on it is the only cue that there are more —
       there is no scrollbar to see. Neither end fades when it is the end. */
    .alb-tabs.fade-l { --tabs-mask: linear-gradient(90deg, transparent 0, #000 24px, #000 100%); }
    .alb-tabs.fade-r { --tabs-mask: linear-gradient(90deg, #000 0, #000 calc(100% - 24px), transparent 100%); }
    .alb-tabs.fade-l.fade-r { --tabs-mask: linear-gradient(90deg, transparent 0, #000 24px,
      #000 calc(100% - 24px), transparent 100%); }
    .alb-tab { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: var(--pocket); border: 1px solid var(--rule); border-radius: 9px;
      padding: 5px 7px 4px; cursor: pointer; min-width: 42px;
      transition: border-color .18s, background .18s, transform .12s; }
    .alb-tab-fl { display: block; line-height: 0; opacity: .9; }
    /* Eighteen sections is more flags than anyone recognises at 11px, and the
       band only names the one you are already on. The code says which is which
       while you scan. */
    .alb-tab-c { font-family: var(--font-c); font-size: 8px; font-weight: 700;
      letter-spacing: .08em; color: var(--ink-2); line-height: 1; }
    .alb-tab-n { font-size: 7.5px; font-weight: 800; color: var(--ink-2);
      font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .alb-tab.is-on .alb-tab-c { color: var(--brass-ink); }
    .alb-tab:active { transform: scale(.95); }
    .alb-tab.is-on { border-color: var(--brass); background: var(--brass-soft); }
    .alb-tab.is-on .alb-tab-n { color: var(--brass-ink); }
    .alb-tab.is-done .alb-tab-n { color: var(--good-ink); }
    .alb-tab.is-on.is-done .alb-tab-n { color: var(--brass-ink); }

    /* the spread */
    .alb-book { flex: 1; min-height: 0; display: flex; flex-direction: column;
      border-radius: 12px; overflow: hidden; background: var(--pg-paper);
      box-shadow: inset 0 0 0 1px var(--pg-edge), 0 2px 10px var(--shadow);
      /* the gutter, where the two halves of a real spread meet */
      background-image: linear-gradient(90deg, transparent 49.4%, var(--pg-edge) 49.7%,
                        var(--pg-edge) 50.3%, transparent 50.6%);
      background-size: 100% 100%; }
    /* Above the turning leaf: rotated in 3D the page grows past its own box on
       the near side, and swept up over the country band, which does not turn. */
    .alb-band { display: flex; align-items: center; gap: 8px; flex: none;
      position: relative; z-index: 7;
      padding: 7px 10px; background: var(--pg-band); color: var(--pg-bandink); }
    .alb-band .t { display: block; font-family: var(--font-c); font-weight: 700;
      text-transform: uppercase; font-size: 15px; letter-spacing: .04em; line-height: 1.1; }
    .alb-band .langs { display: block; font-size: 7.5px; letter-spacing: .1em;
      text-transform: uppercase; opacity: .95; margin-top: 1px; }
    .alb-dec { flex: none; font-family: var(--font-c); font-weight: 700; font-size: 9.5px;
      letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px;
      background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
    /* a column, so the page number can sink to the foot of the page the way
       a printed one does rather than floating under the last row */
    .alb-sheet { flex: 1; min-height: 0; padding: 9px 8px 6px;
      display: flex; flex-direction: column; }

    /* the page arriving from the side it was turned towards */
    /* ── Turning the page ───────────────────────────────────────
       This was sixteen strips hinged end to end, approximating a curve. It
       looked like a barcode: thirty-two clipped faces cannot meet cleanly, and
       for most of the turn the page was a grey mass crossed by bright vertical
       seams. A curve built from facets is not worth having if you can see the
       facets, so it is one solid leaf again — and everything that was being
       spent on geometry now goes on perspective, light and timing, which is
       what actually sells it.

       The half-page still turns about the spine and still has two faces: the
       half you were reading on the front, the half you are about to read on
       the back. */
    .alb-book { perspective: 760px; -webkit-perspective: 760px;
      perspective-origin: 50% 42%; }
    .alb-turnwrap { position: absolute; z-index: 6; pointer-events: none;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
    .alb-under { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden;
      background: var(--pg-paper); }
    .alb-under.side-l { left: 0; } .alb-under.side-r { left: 50%; }
    .alb-clip { position: absolute; top: 0; height: 100%; width: 200%; }
    .alb-clip.half-l { left: 0; } .alb-clip.half-r { left: -100%; }

    .alb-leaf { position: absolute; top: 0; bottom: 0; width: 50%;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      will-change: transform; }
    .alb-leaf.leaf-fwd  { left: 50%; transform-origin: left center; }
    .alb-leaf.leaf-back { left: 0;   transform-origin: right center; }

    .alb-face { position: absolute; inset: 0; overflow: hidden;
      background: var(--pg-paper);
      backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .alb-face.is-back { transform: rotateY(180deg); }

    /* One gradient across the whole leaf, not one per strip. Paper going away
       from the lamp darkens towards the spine; the free edge keeps the light. */
    .alb-shade { position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.12) 45%,
                                          rgba(255,255,255,.30) 100%); }
    .leaf-back .alb-shade { background: linear-gradient(270deg, rgba(0,0,0,.55) 0%,
      rgba(0,0,0,.12) 45%, rgba(255,255,255,.30) 100%); }

    /* the shadow the raised page throws across the one it uncovers */
    .alb-cast { position: absolute; top: 0; bottom: 0; width: 50%; pointer-events: none; }
    .alb-cast.side-l { left: 0;   background: linear-gradient(270deg, rgba(0,0,0,.38), rgba(0,0,0,0) 62%); }
    .alb-cast.side-r { left: 50%; background: linear-gradient(90deg,  rgba(0,0,0,.38), rgba(0,0,0,0) 62%); }

    @keyframes pageFwd  { from { opacity: .85; } }
    @keyframes pageBack { from { opacity: .85; } }
    .alb-sheet.turn-fwd  { animation: pageFwd .28s ease-out; }
    .alb-sheet.turn-back { animation: pageBack .28s ease-out; }

    .alb-edge { position: absolute; top: 7px; bottom: 7px; pointer-events: none; z-index: 4;
      background: repeating-linear-gradient(90deg,
        var(--pg-edge) 0 1px, transparent 1px 3px);
      opacity: .55; }
    .alb-edge-l { left: 0;  border-radius: 12px 0 0 12px;
      box-shadow: inset -3px 0 5px -3px rgba(0,0,0,.4); }
    .alb-edge-r { right: 0; border-radius: 0 12px 12px 0;
      box-shadow: inset 3px 0 5px -3px rgba(0,0,0,.4); }

    @media (prefers-reduced-motion: reduce) {
      .alb-turnwrap { display: none; }
      .alb-sheet.turn-fwd, .alb-sheet.turn-back { animation: none; }
    }

    /* turning the page */
    .alb-turnbar { flex: none; display: flex; align-items: center; justify-content: center;
      gap: 12px; padding-top: 1px; }
    .alb-arrow { width: 34px; height: 34px; border-radius: 50%; flex: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: var(--pocket); border: 1px solid var(--rule); color: var(--ink-2);
      transition: transform .12s, border-color .18s, opacity .18s; }
    .alb-arrow.alb-fwd { transform: rotate(180deg); }
    .alb-arrow:not(:disabled):hover { border-color: var(--brass); color: var(--brass); }
    .alb-arrow:not(:disabled):active { transform: scale(.9); }
    .alb-arrow.alb-fwd:not(:disabled):active { transform: rotate(180deg) scale(.9); }
    .alb-arrow:disabled { opacity: .28; cursor: default; }
    .alb-pips { display: flex; gap: 5px; align-items: center; flex-wrap: wrap;
      justify-content: center; max-width: 190px; }
    .alb-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--rule);
      transition: background .25s, transform .25s; }
    .alb-pip.is-full { background: var(--good); }
    .alb-pip.is-on { background: var(--brass); transform: scale(1.5); }

    /* ── the papers, oldest to newest ── */
    .dec-a { --pg-paper:#E4D5B4; --pg-edge:#B9A277; --pg-band:#6B4B2A; --pg-bandink:#F3E7CE; }
    .dec-b { --pg-paper:#EFE4CA; --pg-edge:#BFA97C; --pg-band:#B23A2E; --pg-bandink:#F6EBD8; }
    .dec-c { --pg-paper:#F0E3C2; --pg-edge:#C4A96E; --pg-band:#B4691E; --pg-bandink:#FBF0DA; }
    .dec-d { --pg-paper:#EDE6D2; --pg-edge:#BDB394; --pg-band:#1F6E63; --pg-bandink:#EAF6F2; }
    .dec-e { --pg-paper:#EDE9DC; --pg-edge:#B9B4A0; --pg-band:#2B5EA8; --pg-bandink:#EAF1FB; }
    .dec-f { --pg-paper:#EDEBE4; --pg-edge:#B6B3A8; --pg-band:#3C3B39; --pg-bandink:#F2F1EE; }
    .dec-g { --pg-paper:#E6EFEB; --pg-edge:#A9C4BB; --pg-band:#2E8B7A; --pg-bandink:#ECFAF5; }
    /* Under lamplight the papers stay distinguishable but stop glowing: a
       cream page on a dark screen is a torch, and the album is meant to be
       read in bed. */
    :root[data-theme="dark"] .alb-book, :root:not([data-theme="light"]) .alb-book {
      --pg-paper:#1B1E19; --pg-edge:#333A31; }
    /* Every dark page used to be the same near-black, which threw away the era
       the light pages carry. These keep the same low brightness — the album is
       still read in bed — but each holds its decade's tint, so a 60s spread is
       warm and a 2000s spread is cool even at night. */
    :root[data-theme="dark"] .dec-a, :root:not([data-theme="light"]) .dec-a {
      --pg-paper:#221D16; --pg-edge:#3B3227; --pg-band:#5A4029; --pg-bandink:#E8DAC0; }
    :root[data-theme="dark"] .dec-b, :root:not([data-theme="light"]) .dec-b {
      --pg-paper:#241C18; --pg-edge:#3E302A; --pg-band:#8E2F26; --pg-bandink:#F2E2D2; }
    :root[data-theme="dark"] .dec-c, :root:not([data-theme="light"]) .dec-c {
      --pg-paper:#241E15; --pg-edge:#3F3524; --pg-band:#8C5218; --pg-bandink:#F6E9D2; }
    :root[data-theme="dark"] .dec-d, :root:not([data-theme="light"]) .dec-d {
      --pg-paper:#182120; --pg-edge:#2C3B38; --pg-band:#1A574F; --pg-bandink:#DDF0EA; }
    :root[data-theme="dark"] .dec-e, :root:not([data-theme="light"]) .dec-e {
      --pg-paper:#191D24; --pg-edge:#2E3542; --pg-band:#254B83; --pg-bandink:#DCE8F8; }
    :root[data-theme="dark"] .dec-f, :root:not([data-theme="light"]) .dec-f {
      --pg-paper:#1D1D1C; --pg-edge:#353531; --pg-band:#3A3A38; --pg-bandink:#E6E5E1; }
    :root[data-theme="dark"] .dec-g, :root:not([data-theme="light"]) .dec-g {
      --pg-paper:#16211E; --pg-edge:#2A3C36; --pg-band:#256E61; --pg-bandink:#DEF3EC; }

    /* The pages at the back have no decade, so they get papers of their own:

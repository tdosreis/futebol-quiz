<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Futebol Quiz BR</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a1030" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Futebol Quiz" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════════
       THE STUDIO
       The whole app is staged like a TV quiz set: a dark arena, two
       spotlights raking in from above, and one lit panel in the middle
       where everything happens. Gold is the money colour and is spent
       sparingly — on the plaque, the ladder and the prize — so that it
       still reads as special when the big numbers arrive.
    ═══════════════════════════════════════════════════════════════ */
    :root {
      --gold:      #FFC845;
      --gold-hi:   #FFF0B0;
      --gold-lo:   #B8860B;
      --stage:     #05081a;
      --panel:     #0a1030;
      --panel-2:   #121a45;
      --ink:       #ffffff;
      --ink-dim:   rgba(255,255,255,.45);
      --ink-faint: rgba(255,255,255,.22);
      --win:       #00e676;
      --lose:      #ff4d5e;
      --line:      rgba(255,255,255,.09);
    }

    /* ── Reset & base ── */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--stage);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', system-ui, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }

    /* Two spotlights raking down onto the set. Fixed, so they stay put
       while the panel's contents change underneath them. */
    body::before, body::after {
      content: '';
      position: fixed;
      top: -30vh;
      width: 60vw;
      height: 130vh;
      pointer-events: none;
      z-index: 0;
      filter: blur(28px);
      opacity: .5;
    }
    body::before {
      left: -18vw;
      background: linear-gradient(160deg, rgba(255,200,69,.16), transparent 58%);
      transform: rotate(14deg);
    }
    body::after {
      right: -18vw;
      background: linear-gradient(200deg, rgba(90,140,255,.18), transparent 58%);
      transform: rotate(-14deg);
    }

    #qz {
      background:
        radial-gradient(120% 70% at 50% -8%, #1b2a6b 0%, transparent 62%),
        linear-gradient(180deg, var(--panel) 0%, #060a20 100%);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      color: var(--ink);
      min-height: 500px;
      width: 100%;
      max-width: 680px;
      box-shadow:
        0 0 0 1px rgba(255,200,69,.14),
        0 24px 70px rgba(0,0,0,.75),
        0 0 90px rgba(60,90,220,.14);
      z-index: 1;
    }

    /* Floor grid — the set's perspective lines, faint enough to feel like depth */
    #grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(120,160,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,160,255,.045) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(115% 80% at 50% 4%, #000 12%, transparent 74%);
      mask-image: radial-gradient(115% 80% at 50% 4%, #000 12%, transparent 74%);
      pointer-events: none;
      z-index: 0;
    }

    #ct { position: relative; z-index: 1; }

    /* Flex/grid children default to min-width:auto, so one wide child (a long
       author name, a club-career path) stretches the screen past the viewport
       and #qz's overflow:hidden clips everything. Opt every box out of that. */
    #ct > div { max-width: 100%; }
    #ct div, #ct p { min-width: 0; }
    #ct p, #ct span { overflow-wrap: anywhere; }

    /* ── Screen entrance ── */
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #ct > div { animation: screenIn .22s ease-out; }

    /* ── Badge: tap press ── */
    .b { touch-action: manipulation; }
    .b:active { transform: scale(0.93) !important; filter: brightness(1.2); }

    /* ── Category card hover ── */
    .cc { touch-action: manipulation; }
    .cc:hover  { transform: scale(1.03); background: rgba(255,255,255,.07) !important; }
    .cc:active { transform: scale(0.97) !important; }

    /* ── Difficulty card hover ── */
    .dc { touch-action: manipulation; }
    .dc:hover  { transform: translateY(-2px); background: rgba(255,255,255,.08) !important; }
    .dc:active { transform: scale(0.98) !important; }

    /* ── Badge animations ── */
    @keyframes badgePop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.14); }
      65%  { transform: scale(1.04); }
      100% { transform: scale(1.06); }
    }
    @keyframes correctGlow {
      0%, 100% { box-shadow: 0 0 0 3px #00e676, 0 0 20px rgba(0,230,118,.45); }
      50%       { box-shadow: 0 0 0 4px #00e676, 0 0 38px rgba(0,230,118,.8), 0 0 64px rgba(0,230,118,.25); }
    }
    @keyframes wrongShake {
      0%, 100% { transform: translateX(0) scale(1); }
      18%      { transform: translateX(-6px) scale(0.96); }
      36%      { transform: translateX(6px) scale(0.96); }
      54%      { transform: translateX(-4px); }
      72%      { transform: translateX(4px); }
      88%      { transform: translateX(-2px); }
    }
    @keyframes scoreUp {
      0%, 100% { transform: scale(1); }
      45%      { transform: scale(1.45); }
    }
    @keyframes fireBob {
      0%, 100% { transform: scale(1) rotate(0deg); }
      30%      { transform: scale(1.12) rotate(-4deg); }
      70%      { transform: scale(1.06) rotate(4deg); }
    }
    @keyframes ctaBounce {
      0%, 100% { transform: translateY(0); box-shadow: 0 4px 24px rgba(255,215,0,.25); }
      50%      { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(255,215,0,.45); }
    }
    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }

    .b-correct { animation: correctGlow 1.4s ease-in-out infinite !important; transform: scale(1.04) !important; }
    .b-wrong   { animation: wrongShake .45s ease-out !important; }
    .b-sel     { animation: badgePop .18s ease-out forwards; }

    .score-up  { animation: scoreUp .28s ease-out; }
    .fire-bob  { animation: fireBob .7s ease-in-out infinite; }

    #cta-btn   { animation: ctaBounce 2.2s ease-in-out infinite; }
    .timer-low { animation: timerPulse .55s ease-in-out infinite; }


    /* ══════════ VISUAL POLISH ══════════ */

    /* Key light from the rig above the panel */
    #qz::before {
      content: '';
      position: absolute;
      left: -25%; right: -25%; top: -30%;
      height: 78%;
      background: radial-gradient(ellipse at 50% 0%,
        rgba(255,200,69,.11), rgba(70,110,255,.07) 42%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }
    #qz::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0; height: 34%;
      background: linear-gradient(to top, rgba(0,0,0,.45), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* Option tiles fade in with a slight stagger */
    @keyframes tileIn {
      from { opacity: 0; transform: translateY(9px) scale(.94); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .b { animation: tileIn .3s cubic-bezier(.2,.8,.3,1) backwards; }

    /* Points that float up off the score when you gain */
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, 4px)   scale(.8); }
      18%  { opacity: 1; transform: translate(-50%, -4px)  scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -42px) scale(1); }
    }
    .gain {
      position: absolute; left: 50%; top: 0;
      font-family: 'Bebas Neue','Impact',sans-serif;
      font-size: 22px; font-weight: 900; color: #00e676;
      text-shadow: 0 2px 12px rgba(0,230,118,.6);
      pointer-events: none; z-index: 40;
      animation: floatUp 1.05s ease-out forwards;
    }

    /* Confetti for a strong finish */
    @keyframes confFall {
      0%   { opacity: 1; transform: translate3d(0,-24px,0) rotate(0deg); }
      100% { opacity: .15; transform: translate3d(var(--dx,0px), 105vh, 0) rotate(var(--rot,720deg)); }
    }
    .conf {
      position: fixed; top: -24px;
      width: 8px; height: 13px; border-radius: 2px;
      pointer-events: none; z-index: 999;
      animation: confFall linear forwards;
    }

    /* Progress dots */
    .pdot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,.16);
      transition: background .25s, transform .25s;
      flex-shrink: 0;
    }
    .pdot-on   { background: #FFD700; }
    .pdot-cur  { background: #fff; transform: scale(1.55); box-shadow: 0 0 8px rgba(255,255,255,.7); }
    .pdot-miss { background: rgba(244,67,54,.75); }

    /* Timer bar gets a moving sheen so it reads as "live" */
    @keyframes sheen { to { background-position: 240% 0; } }
    .tf-live {
      background-image: linear-gradient(100deg,
        rgba(255,255,255,0) 34%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 66%);
      background-size: 240% 100%;
      animation: sheen 1.9s linear infinite;
    }

    /* Home ball idle bounce */
    @keyframes ballIdle {
      0%,100% { transform: translateY(0) rotate(-4deg); }
      50%     { transform: translateY(-9px) rotate(4deg); }
    }
    .ball-idle { animation: ballIdle 2.8s ease-in-out infinite; display: inline-block; }

    /* Gold gradient wordmark */
    .goldgrad {
      background: linear-gradient(175deg, #FFF3B0 4%, #FFD700 42%, #E0A800 96%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 3px 18px rgba(255,215,0,.32));
    }

    /* Primary buttons get depth + a press response */
    .btn-press { transition: transform .12s, box-shadow .12s, filter .12s; }
    .btn-press:active { transform: scale(.955); filter: brightness(1.08); }


    /* ═══════════════════════════════════════════════════════════════
       THE PLAQUE
       The question board. Its corners are cut on the diagonal — the
       shape every one of these shows has used since the eighties — and
       the gold edge is a second clipped element behind it rather than a
       border, because a border would follow the box, not the cut.
    ═══════════════════════════════════════════════════════════════ */
    .plaque {
      position: relative;
      padding: 2px;                 /* this is the visible gold edge */
      background: linear-gradient(150deg, var(--gold-hi), var(--gold) 34%, var(--gold-lo) 78%, var(--gold) 100%);
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      filter: drop-shadow(0 6px 22px rgba(0,0,0,.55));
    }
    .plaque-in {
      background: linear-gradient(165deg, #1b2668 0%, #16205a 38%, #0b1136 100%);
      clip-path: polygon(13px 0, 100% 0, 100% calc(100% - 13px), calc(100% - 13px) 100%, 0 100%, 0 13px);
      padding: 13px 15px;
      display: flex; align-items: center; gap: 11px;
      min-height: 62px;
    }
    /* a slow glint travelling across the gold edge */
    @keyframes plaqueGlint { to { background-position: 260% 0; } }
    .plaque::after {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(105deg,
        transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%);
      background-size: 260% 100%;
      animation: plaqueGlint 5.5s linear infinite;
      pointer-events: none; mix-blend-mode: overlay;
    }

    /* ── Lettered answer tiles (A … J) ── */
    .tile-letter {
      position: absolute; top: 3px; left: 3px;
      min-width: 14px; height: 14px; padding: 0 3px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(255,200,69,.9), rgba(184,134,11,.9));
      color: #10142e;
      font: 900 9px/14px 'Inter', system-ui, sans-serif;
      text-align: center; letter-spacing: .3px;
      box-shadow: 0 1px 3px rgba(0,0,0,.6);
      z-index: 3; pointer-events: none;
    }
    .b-correct .tile-letter { background: linear-gradient(180deg,#7dffb4,#00c853); }
    .b-wrong   .tile-letter { background: linear-gradient(180deg,#ff9aa4,#d32f2f); color:#fff; }

    /* ── Audience vote bars ──
       Anchored to the top of the tile, not the bottom. They used to sit just
       above the caption, which on a 320px screen is where a long name wraps
       to a second line — the percentage landed on top of "Samuel Eto'o". */
    /* An underline along the tile's bottom edge. Anything floating *inside*
       the tile collides with something: at the bottom it hit a wrapped player
       name, at the top it cut through a centred text label. The edge is the
       one place both layouts leave free. */
    .vote {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 3px; border-radius: 0 0 8px 8px; overflow: hidden;
      background: rgba(0,0,0,.55); z-index: 4; pointer-events: none;
    }
    .vote > i {
      display: block; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #4FC3F7, #7C4DFF);
      animation: voteGrow .7s cubic-bezier(.2,.9,.3,1) backwards;
    }
    @keyframes voteGrow { from { width: 0 !important; } }
    .vote-pct {
      position: absolute; right: 3px; top: 3px; z-index: 4;
      padding: 1px 3px; border-radius: 4px;
      background: rgba(4,7,22,.86);
      font: 900 8.5px/1.1 'Inter', system-ui, sans-serif;
      color: #cfe6ff; pointer-events: none;
    }

    /* ── Tile caption ──
       A name may legitimately need two lines ("Andrés Iniesta" on a narrow
       phone). Give it a scrim so it stays readable over the photo, and cap it
       at two lines so a third can never push out of the tile. */
    .tile-name {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 8px 2px 3px;
      background: linear-gradient(to top, rgba(6,10,28,.93) 42%, rgba(6,10,28,0));
      font-size: 7.6px; font-weight: 700; line-height: 1.12;
      color: rgba(255,255,255,.92); text-align: center;
      font-family: 'Inter', system-ui, sans-serif;
      /* Three lines, not two: on a 320px screen a tile is ~54px wide, and the
         inline flag takes enough of the first line that "Cristiano Ronaldo"
         needs a third. Two lines truncated it to "Cristiano…" — unusable when
         the name is the answer. */
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; overflow-wrap: anywhere;
    }
    .tile-name .fl { display: inline-block; vertical-align: -1px; margin-right: 2px; }
    .tile-club { font-size: 8.6px; -webkit-line-clamp: 2; }
    /* A handful of names ("Juninho Pernambucano") are long enough to overrun
       even three lines on a 320px tile. Shrink just those rather than making
       every caption smaller for the sake of the outliers. */
    .tile-name-long { font-size: 6.7px; line-height: 1.06; -webkit-line-clamp: 4; }
    /* Roomier phones can afford the larger caption back */
    @media (min-width: 400px) {
      .tile-name { font-size: 8.4px; -webkit-line-clamp: 2; }
      .tile-club { font-size: 9px; }
      .tile-name-long { font-size: 7.4px; -webkit-line-clamp: 3; }
    }

    /* ── The pundit's pick ── */
    .expert-ring { box-shadow: 0 0 0 2px #AB47BC, 0 0 14px rgba(171,71,188,.55) !important; }

    /* ═══════════════════════════════════════════════════════════════
       THE MOMENT
       Confirming an answer stops the clock and drains the colour out of
       everything you did not pick, so the board holds its breath with
       you. The higher the rung, the longer we sit here.
    ═══════════════════════════════════════════════════════════════ */
    @keyframes lockPulse {
      0%,100% { box-shadow: 0 0 0 3px var(--gold), 0 0 20px rgba(255,200,69,.45); }
      50%     { box-shadow: 0 0 0 4px var(--gold), 0 0 44px rgba(255,200,69,.9); }
    }
    .b-locked { animation: lockPulse .78s ease-in-out infinite !important; transform: scale(1.05) !important; }
    .b-faded  { opacity: .2; filter: grayscale(1) brightness(.7); transition: opacity .35s, filter .35s; }

    @keyframes stageDim { from { opacity: 0; } to { opacity: 1; } }
    .stage-dark {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 22%, rgba(0,0,0,.62) 78%);
      animation: stageDim .5s ease-out backwards;
    }

    /* ── The prize ladder ── */
    .rung {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px; border-radius: 7px;
      font: 800 11px/1.2 'Inter', system-ui, sans-serif;
      color: var(--ink-dim);
      transition: background .25s, color .25s, transform .25s;
    }
    .rung-safe { color: rgba(255,255,255,.62); background: rgba(255,255,255,.035); }
    .rung-done { color: var(--win); }
    .rung-now  {
      background: linear-gradient(90deg, rgba(255,200,69,.28), rgba(255,200,69,.06));
      color: #fff; transform: scale(1.03);
      box-shadow: inset 0 0 0 1px rgba(255,200,69,.55);
    }
    .rung-top  { color: var(--gold); }
    .rung-n {
      width: 17px; text-align: right; flex-shrink: 0;
      font-size: 9px; color: var(--ink-faint); font-weight: 700;
    }

    /* The rail across the top of the quiz: one notch per rung */
    .notch {
      flex: 1; height: 5px; border-radius: 3px;
      background: rgba(255,255,255,.09);
      transition: background .3s, box-shadow .3s;
    }
    .notch-done { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); }
    .notch-safe { background: rgba(255,255,255,.26); }
    .notch-safe.notch-done { background: linear-gradient(180deg,#b9ffd4,var(--win)); }
    .notch-now  {
      background: #fff;
      box-shadow: 0 0 9px rgba(255,255,255,.85);
      animation: timerPulse 1.1s ease-in-out infinite;
    }

    /* Money climbing the ladder */
    @keyframes prizeUp {
      0%   { transform: translateY(6px) scale(.85); opacity: 0; }
      55%  { transform: translateY(0)   scale(1.16); opacity: 1; }
      100% { transform: translateY(0)   scale(1); opacity: 1; }
    }
    .prize-pop { animation: prizeUp .55s cubic-bezier(.2,.9,.3,1); }

    /* ═══════════════════════════════════════════════════════════════
       SHORT SCREENS
       On a 568px-tall phone the quiz screen fits — until an ajuda adds a
       row, or the question carries a photo. Then the board grows past the
       viewport and CONFIRMAR drops below the fold, which on a timed
       question costs the player the round. Reclaim the height from
       padding and gaps rather than letting the page scroll.
       The rules need !important because the layout is inline-styled.
    ═══════════════════════════════════════════════════════════════ */
    @media (max-height: 660px) {
      .qz-screen           { padding: 8px !important; gap: 5px !important; }
      .qz-screen .plaque-in { min-height: 46px; padding: 8px 11px; gap: 8px; }
      .qz-screen .plaque-in p { font-size: 13.5px !important; line-height: 1.35 !important; }
      .qz-screen .ajuda    { padding: 3px 7px !important; font-size: 9px !important; }
      .qz-screen .reveal-box { width: 96px !important; height: 96px !important; }
      .qz-screen .stakes-v { font-size: 21px !important; }
      .qz-screen .expert-box { padding: 4px 8px !important; }
      .qz-screen .expert-box p { font-size: 10px !important; }
      .qz-screen .footer-hint { display: none; }
    }
    /* Very short (landscape, or a small phone with a tall keyboard bar) */
    @media (max-height: 520px) {
      .qz-screen .reveal-box { width: 72px !important; height: 72px !important; }
      .qz-screen .ajuda span { display: none; }
      .qz-screen .ajuda    { min-width: 34px !important; }
    }

    /* ── Misc ── */
    button { font-family: 'Inter', system-ui, sans-serif; }
    .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body>
<div id="qz">
  <div id="grid-overlay"></div>
  <div id="ct"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   WEB AUDIO — procedural sound effects
═══════════════════════════════════════════════════ */
let _AC = null;
function AC() {
  if (!_AC) _AC = new (window.AudioContext || window.webkitAudioContext)();
  return _AC;
}

/* MUTE — read straight from storage so it survives a reload */
let muted = (() => { try { return localStorage.getItem('fqbr_muted') === 'true'; }
                     catch (e) { return false; } })();
function setMuted(v) {
  muted = v;
  try { localStorage.setItem('fqbr_muted', String(v)); } catch (e) {}
}

function beep(freq, dur, type='sine', vol=0.18, freqEnd=null) {
  if (muted) return;
  try {
    const ac = AC();
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + dur);
  } catch(e) {}
}

const snd = {
  tap()     { beep(520, .055, 'sine',     .12, 380); },
  correct() {
    [[523,.22],[659,.22],[784,.3]].forEach(([f,d],i) =>
      setTimeout(() => beep(f, d, 'triangle', .2), i*90));
  },
  almost()  { beep(440, .18, 'sine', .15); },
  wrong()   { beep(200, .32, 'sawtooth', .14, 90); },
  select()  { beep(660, .07, 'sine', .1, 600); },
  swipe()   { beep(300, .12, 'sine', .08, 500); },

  /* the money ladder lighting up another rung */
  rung()    {

  },

  fanfare() {

      setTimeout(() => { beep(f, d, 'triangle', .2); beep(f/2, d, 'sine', .12); }, i*110));
  },
  /* walking away with the money */
  cash()    {
    [[784,.12],[988,.12],[1319,.28]].forEach(([f,d],i) =>
      setTimeout(() => beep(f, d, 'sine', .16), i*80));
  },

  drop()    {
    beep(320, .9, 'sawtooth', .16, 55);
    setTimeout(() => beep(160, .7, 'square', .1, 40), 120);
  },
  cut()     { beep(1400, .06, 'square', .1, 400); setTimeout(() => beep(900, .07, 'square', .08, 260), 70); },
  crowd()   { beep(140, .55, 'sawtooth', .05, 260); beep(300, .5, 'triangle', .04, 520); },
  freeze()  { [1568,1319,1047].forEach((f,i) => setTimeout(() => beep(f, .16, 'sine', .09), i*60)); },

/* ═══════════════════════════════════════════════════
   FLAGS — drawn, not typed

   Flag emoji (🇧🇷 and friends) are regional-indicator pairs: Android WebView
   and Windows have no glyphs for most of them, so they degrade to the bare
   letters "BR" or to tofu boxes. The England flag is worse still — a tag
   sequence that almost nothing outside Apple renders. Every flag here is
   therefore hand-drawn SVG on a 9×6 field, which looks identical on every
   device the app can possibly run on.
═══════════════════════════════════════════════════ */
const _NORDIC = (bg, cross, inner) =>
  `<rect width="9" height="6" fill="${bg}"/>` +
  `<path d="M0 2.35h9v1.3H0z M2.45 0h1.3v6h-1.3z" fill="${cross}"/>` +
  (inner ? `<path d="M0 2.7h9v.6H0z M2.8 0h.6v6h-.6z" fill="${inner}"/>` : '');

const _VERT = (a, b, c) =>
  `<rect width="3" height="6" fill="${a}"/><rect x="3" width="3" height="6" fill="${b}"/>` +
  `<rect x="6" width="3" height="6" fill="${c}"/>`;

const _HORZ = (a, b, c) =>
  `<rect width="9" height="2" fill="${a}"/><rect y="2" width="9" height="2" fill="${b}"/>` +
  `<rect y="4" width="9" height="2" fill="${c}"/>`;

const _STAR = (cx, cy, r, fill) => {
  let d = '';
  for (let i = 0; i < 5; i++) {
    const o = -Math.PI / 2 + i * 2 * Math.PI / 5;
    const inn = o + Math.PI / 5;
    d += (i ? 'L' : 'M') + (cx + Math.cos(o) * r).toFixed(2) + ' ' + (cy + Math.sin(o) * r).toFixed(2)
       + 'L' + (cx + Math.cos(inn) * r * .4).toFixed(2) + ' ' + (cy + Math.sin(inn) * r * .4).toFixed(2);
  }
  return `<path d="${d}Z" fill="${fill}"/>`;
};

const FLAGS = {

/* A drawn flag chip. `h` is the height in px; the flag keeps a 3:2 ratio. */
function flagSVG(code, h) {
  h = h || 8;
  const name = CTRY_NAME[code] || code || '';
  const art  = FLAGS[code];
  const box  = `width:${(h * 1.5).toFixed(1)}px;height:${h}px;flex-shrink:0;vertical-align:-1px;
    border-radius:1.5px;box-shadow:0 0 0 .5px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);`;
  if (!art) {
    return `<span title="${name}" style="${box}display:inline-block;background:#3a4a5a;
      font-size:${(h * .78).toFixed(0)}px;line-height:${h}px;text-align:center;color:#fff;
      font-weight:800;letter-spacing:-.3px;">${(code || '?').slice(0, 2)}</span>`;
  }
  return `<svg viewBox="0 0 9 6" preserveAspectRatio="none" role="img" aria-label="${name}"
    style="${box}display:inline-block;">${art}</svg>`;
}

/* The little mark on a category chip. Most categories carry an emoji that
   every platform has a glyph for; the ones whose natural mark is a flag set
   `flag` instead and get the drawing, because a flag emoji would come out as
   the bare letters "BR". */
function catIcon(c) {
  if (!c) return '';
  return c.flag ? flagSVG(c.flag, 10) : (c.emoji || '');
}

/* ═══════════════════════════════════════════════════
   ICONS — drawn, not typed

   ✓ ✗ ✕ ★ → and friends are *text* symbols, not emoji: Roboto has no
   glyph for most of them, so Android's WebView draws an empty box. The
   ones that are emoji but default to text presentation (✂ ❄ ⏭ 🛡 🗺)
   are just as unreliable. Everything structural in the UI is therefore
   an inline SVG path — same pixels on every device, and it inherits the
   colour we actually want instead of a vendor's.
═══════════════════════════════════════════════════ */

     stroke-linejoin="round" aria-hidden="true"
     style="display:inline-block;vertical-align:-.14em;flex-shrink:0;${extra || ''}"><path d="${d}"/></svg>`;

  { key:'facil',    label:'Fácil',    emoji:'😊', n:10, col:'#43A047',
    desc:'Alternativas variadas · 30s',
    time:30, strict:0.00, opts:10, tier:1, pmul:1   },
  { key:'moderado', label:'Moderado', emoji:'⚽', n:15, col:'#FF9800',
    desc:'Alternativas parecidas · 25s',
    time:25, strict:0.55, opts:10, tier:2, pmul:1.5 },
  { key:'dificil',  label:'Difícil',  emoji:'🔥', n:20, col:'#E53935',
    desc:'Mesma posição e era · 20s',
    time:20, strict:1.00, opts:10, tier:3, pmul:2   },
];
const DCFG = () => DIFFS.find(d => d.key === diffKey) || DIFFS[0];

/* ═══════════════════════════════════════════════════
   SMART DISTRACTOR ENGINE
   Wrong answers are scored for plausibility instead of
   being drawn at random, so harder levels really are harder.
═══════════════════════════════════════════════════ */
/* Seedable PRNG — when _seed is set the sequence is reproducible, which is
   what makes the Daily Challenge identical for every player. */
let _seed = null;
function rnd() {
  if (_seed === null) return Math.random();
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function seedFrom(n) { _seed = (n * 2654435761) | 0; }

function shuf(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* days since 2024-01-01 — the daily puzzle number */
function dayIndex(d) {
  const n = d || new Date();
  return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())
                     - Date.UTC(2024, 0, 1)) / 86400000);
}

function eraOverlap(a, b) {
  if (!a.era || !b.era) return 0;
  return Math.max(0, Math.min(a.era[1], b.era[1]) - Math.max(a.era[0], b.era[0]));
}

/* How confusable is `cand` with the correct player `ref`? 0-100 */
function simPlayer(cand, ref) {
  let sc = 0;
  if (cand.pos  === ref.pos)  sc += 38;           // same position
  if (cand.ctry === ref.ctry) sc += 22;           // same country
  sc += Math.min(26, eraOverlap(cand, ref) * 1.8); // contemporaries
  const shared = (cand.clubs || []).filter(c => (ref.clubs || []).includes(c)).length;
  sc += Math.min(14, shared * 7);                 // shared clubs
  return sc;
}

/* Confusability between clubs */
function simClub(cand, ref) {
  let sc = 0;
  if (cand.s === ref.s) sc += 42;                              // same state
  sc += Math.max(0, 22 - Math.abs((cand.f||1900) - (ref.f||1900)) / 2);
  if ((cand.lib > 0) === (ref.lib > 0)) sc += 20;              // both/neither Libertadores
  if ((cand.br  > 0) === (ref.br  > 0)) sc += 16;              // both/neither Brasileirão
  return sc;
}

function getDisp(q) {
  const isPlayer = q.type === 'player';
  const pool0 = isPlayer ? PL : CL;
  const sim   = isPlayer ? simPlayer : simClub;
  const cfg   = DCFG();
  const strict = (q.strict !== undefined) ? q.strict : qStrict();
  const nOpts  = q.opts || cfg.opts;

  // `fixed` = show exactly these tiles (comparison questions)
  if (q.fixed) return shuf(q.fixed.map(id => pool0.find(x => x.id === id)).filter(Boolean));

  const right = q.a.map(id => pool0.find(x => x.id === id)).filter(Boolean);

  // `pool` = explicit list of ids allowed as wrong answers
  let wrong;
  if (q.pool) {
    const allow = new Set(q.pool);
    wrong = pool0.filter(x => allow.has(x.id) && !q.a.includes(x.id));
  } else {
    const skip = new Set([...(q.excl || []), ...q.a]);
    wrong = pool0.filter(x => !skip.has(x.id));
  }

  const ref = right[0];
  if (ref && strict > 0 && wrong.length > nOpts) {
    const jitter = 14 * (1 - strict) + 6;
    wrong = wrong
      .map(x => ({ x, s: sim(x, ref) + rnd() * jitter }))
      .sort((a, b) => b.s - a.s)
      .map(o => o.x);
    const need = nOpts - right.length;
    const band = Math.max(need + 2, Math.round(wrong.length * (1 - strict * 0.72)));
    wrong = wrong.slice(0, band);
  }

  wrong = shuf(wrong);
  return shuf([...right, ...wrong.slice(0, Math.max(0, nOpts - right.length))]);
}

/* ═══════════════════════════════════════════════════
   QUESTION DIFFICULTY RATING
═══════════════════════════════════════════════════ */
const FAMOUS = new Set(['pele','messi','cr7','ronaldo','ronaldinho','neymar',
  'maradona','zidane','romario','garrincha','zico','kaka','mbappe','vinicius','gabigol']);

function qTier(q) {
  if (q.d) return q.d;                       // explicit override
  const cid = (q._cat && q._cat.id) || '';
  if (cid === 'estados')  return 1;
  if (cid === 'estadios') return 2;
  if (cid === 'lendas')   return 2;
  if (cid === 'libertadores' || cid === 'brasileirao') {
    const m = /\b(19|20)\d{2}\b/.exec(q.t);
    const y = m ? parseInt(m[0], 10) : 2000;
    return y >= 2015 ? 1 : y >= 2005 ? 2 : 3;
  }
  if (cid === 'craques') {
    return q.a.some(id => FAMOUS.has(id)) ? 2 : 3;
  }
  return 2;
}

function buildGame(key) {
  const cfg = DIFFS.find(d => d.key === key) || DIFFS[0];
  let all = CATS.flatMap(c => c.qs.map(q => ({ ...q, _cat: c })));
  if (typeof GEN_QS === 'function') all = all.concat(GEN_QS(cfg.tier));
  all.forEach(q => { q._d = qTier(q); });

  // prefer questions at the requested tier, then nearest tiers
  const scored = shuf(all).map(q => ({ q, w: -Math.abs(q._d - cfg.tier) * 10 + rnd() * 4 }));
  scored.sort((a, b) => b.w - a.w);

  // generators can emit the same wording twice (e.g. two "who was a goalkeeper?"),
  // so de-duplicate by question text before filling the round
  const seen = new Set();
  const qs = [];
  for (const o of scored) {
    if (seen.has(o.q.t)) continue;
    seen.add(o.q.t);
    qs.push(o.q);
    if (qs.length >= cfg.n) break;
  }

  return {
    id: 'mixed', name: 'Futebol Quiz BR', emoji: '⚽',
    tag: 'Perguntas misturadas', col: '#FFD700', diff: cfg.label,
    qs: shuf(qs),
  };
}


/* ═══════════════════════════════════════════════════
   QUESTION GENERATORS
   Build fresh questions from the structured data so the
   pool never runs dry and distractors are correct by design.
═══════════════════════════════════════════════════ */
function GEN_QS(tier) {
  /* GENCAT — badge shown in the quiz header for generated questions */
  const GC = {
    club:  { id:'g_club',  name:'Carreira',  emoji:'🧭', col:'#26A69A' },
    pos:   { id:'g_pos',   name:'Posição',   emoji:'🎯', col:'#7E57C2' },
    nat:   { id:'g_nat',   name:'Seleções',  emoji:'🌎', col:'#42A5F5' },
    hist:  { id:'g_hist',  name:'História',  emoji:'📚', col:'#C8A400' },
    squad: { id:'g_squad', name:'Elenco',    emoji:'👥', col:'#66BB6A' },
    era:   { id:'g_era',   name:'Época',     emoji:'⏳', col:'#FFA726' },
    photo: { id:'g_photo', name:'Foto',      emoji:'📸', col:'#EC407A' },
    path:  { id:'g_path',  name:'Caminho',   emoji:'🔀', col:'#26C6DA' },
  };
  const out  = [];
  const CIDS = new Set(CL.map(c => c.id));
  const rndOf = a => a[Math.floor(rnd() * a.length)];
  const pick = (a, n) => shuf(a).slice(0, n);

  /* ── 1. Which Brazilian club did this player turn out for? ── */
  const withBr = PL.filter(p => (p.clubs || []).some(c => CIDS.has(c)));
  pick(withBr, 26).forEach(p => {
    const mine = (p.clubs || []).filter(c => CIDS.has(c));
    out.push({
      t: `Por qual destes clubes ${p.n} jogou?`,
      a: [rndOf(mine)],
      pool: CL.filter(c => !(p.clubs || []).includes(c.id)).map(c => c.id),
      face: p.img, _cat: GC.club,
      d: p.ctry === 'BRA' ? 2 : 3,
    });
  });

  /* ── 2. Position recognition ── */
  ['GK', 'DF', 'MF'].forEach(pos => {
    const same   = PL.filter(p => p.pos === pos);
    const others = PL.filter(p => p.pos !== pos);
    if (same.length < 2 || others.length < 9) return;
    pick(same, 4).forEach(p => {
      out.push({
        t: `Qual destes jogadores atuava como ${POS_NAME[pos].toLowerCase()}?`,
        a: [p.id], type: 'player',
        pool: others.map(x => x.id), _cat: GC.pos,
        d: pos === 'GK' ? 1 : 2,
      });
    });
  });

  /* ── 3. Nationality ── */
  const byCtry = {};
  PL.forEach(p => { (byCtry[p.ctry] = byCtry[p.ctry] || []).push(p); });
  Object.keys(byCtry).filter(c => c !== 'BRA' && byCtry[c].length >= 1).forEach(c => {
    const p = rndOf(byCtry[c]);
    out.push({
      t: `Qual destes jogadores defendeu a seleção de ${CTRY_NAME[c] || c}?`,
      _skip: !CTRY_NAME[c],
      a: [p.id], type: 'player',
      pool: PL.filter(x => x.ctry !== c).map(x => x.id), _cat: GC.nat,
      d: 2,
    });
  });

  /* ── 4. Oldest club (comparison, exact 10 tiles) ── */
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const oldest = set.reduce((a, b) => (a.f <= b.f ? a : b));
    if (set.filter(c => c.f === oldest.f).length > 1) continue;   // avoid ties
    out.push({ t: 'Qual destes clubes foi fundado primeiro?',
               a: [oldest.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 3 });
  }

  /* ── 5. Most Brasileirão titles ── */
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const top = set.reduce((a, b) => (a.br >= b.br ? a : b));
    if (top.br === 0 || set.filter(c => c.br === top.br).length > 1) continue;
    out.push({ t: 'Qual destes clubes tem mais títulos do Brasileirão?',
               a: [top.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* ── 6. Libertadores winners (multi-select) ── */
  for (let i = 0; i < 3; i++) {
    const champs = pick(CL.filter(c => c.lib > 0), 3);
    const rest   = pick(CL.filter(c => c.lib === 0), 7);
    if (champs.length < 3 || rest.length < 7) break;
    out.push({ t: 'Selecione os clubes que JÁ venceram a Libertadores',
               a: champs.map(c => c.id),
               fixed: champs.concat(rest).map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* ── 7. Team-mates: who also played for this club? ── */
  const clubPlayers = {};
  PL.forEach(p => (p.clubs || []).forEach(c => {
    if (CIDS.has(c)) (clubPlayers[c] = clubPlayers[c] || []).push(p);
  }));
  pick(Object.keys(clubPlayers).filter(c => clubPlayers[c].length >= 2), 6).forEach(c => {
    const yes = pick(clubPlayers[c], 2);
    const no  = PL.filter(p => !(p.clubs || []).includes(c));
    out.push({
      t: `Selecione os 2 jogadores que passaram pelo ${clubName(c)}`,
      a: yes.map(p => p.id), type: 'player',
      pool: no.map(p => p.id),
      crest: c, _cat: GC.squad,
      d: 3,
    });
  });

  /* ── 8. Era placement ── */
  pick(PL.filter(p => p.era && p.era[0] >= 1990), 6).forEach(p => {
    const dec = Math.floor(p.era[0] / 10) * 10;
    const others = PL.filter(x => x.era && Math.floor(x.era[0] / 10) * 10 !== dec);
    if (others.length < 9) return;
    out.push({
      t: `Qual destes jogadores começou a carreira nos anos ${dec}?`,
      a: [p.id], type: 'player',
      pool: others.map(x => x.id), _cat: GC.era,
      d: 3,
    });
  });

  /* ── 9. PHOTO REVEAL: the picture sharpens as the clock runs down ── */
  pick(PL.filter(p => p.img), 8).forEach(p => {
    const others = PL.filter(x => x.id !== p.id);
    out.push({
      t: 'Quem é este jogador? (a foto vai ficando nítida)',
      a: [p.id], type: 'player',
      reveal: p.img,
      textTiles: true,
      pool: others.map(x => x.id), _cat: GC.photo,
      d: 2,
    });
  });

  /* ── 10. CAREER PATH: guess the player from the clubs he played for ── */
  pick(PL.filter(p => (p.clubs || []).length >= 3), 8).forEach(p => {
    /* Joined with a middle dot, not an arrow: U+2192 has no glyph in Roboto,
       so Android's WebView draws a box between every club. The wording
       carries the ordering instead. */
    const path = (p.clubs || []).slice(0, 4).map(clubName).join('  ·  ');
    out.push({
      t: `Que jogador passou por estes clubes, nesta ordem?\n${path}`,
      a: [p.id], type: 'player',
      textTiles: true,
      pool: PL.filter(x => x.id !== p.id).map(x => x.id), _cat: GC.path,
      d: 3,
    });
  });

  /* ═════ GEN2 — extra templates ═════ */

  /* 11. Stadium → club */
  const STIDS = Object.keys(typeof STAD !== 'undefined' ? STAD : {});
  const STAD_CLUB = { allianz:'palmeiras', neoq:'corinthians', beirario:'internacional',
    vilabelmiro:'santos', saojanua:'vasco', arena_gre:'gremio' };
  pick(STIDS.filter(k => STAD_CLUB[k]), 4).forEach(k => {
    const owner = STAD_CLUB[k];
    out.push({
      t: `Qual clube manda seus jogos no ${STAD[k].name}, em ${STAD[k].city}?`,
      a: [owner],
      pool: CL.filter(c => c.id !== owner).map(c => c.id),
      stad: k,
      _cat: GC.hist, d: 2,
    });
  });

  /* 12. Which club is from this state? */
  const byState = {};
  CL.forEach(c => { (byState[c.s] = byState[c.s] || []).push(c); });
  const ST_NAME = { RJ:'Rio de Janeiro', SP:'São Paulo', RS:'Rio Grande do Sul',
    MG:'Minas Gerais', PR:'Paraná', BA:'Bahia', CE:'Ceará', PE:'Pernambuco', SC:'Santa Catarina' };
  pick(Object.keys(byState).filter(st => ST_NAME[st] && byState[st].length >= 2), 4).forEach(st => {
    const yes = rndOf(byState[st]);
    out.push({
      t: `Qual destes clubes é de ${ST_NAME[st]}?`,
      a: [yes.id],
      pool: CL.filter(c => c.s !== st).map(c => c.id),
      _cat: GC.hist, d: 1,
    });
  });

  /* 13. Head-to-head: who played longer? */
  for (let i = 0; i < 4; i++) {
    const two = pick(PL.filter(p => p.era), 2);
    if (two.length < 2) break;
    const span = p => p.era[1] - p.era[0];
    if (span(two[0]) === span(two[1])) continue;
    const longer = span(two[0]) > span(two[1]) ? two[0] : two[1];
    out.push({
      t: 'Quem teve a carreira mais longa?',
      a: [longer.id], type: 'player',
      fixed: two.map(p => p.id),
      _cat: GC.era, d: 2,
    });
  }

  /* 14. Odd one out — nine share a trait, one doesn't */
  ['GK', 'DF', 'MF', 'FW'].forEach(pos => {
    const same = PL.filter(p => p.pos === pos);
    const other = PL.filter(p => p.pos !== pos);
    if (same.length < 9 || !other.length) return;
    const odd = rndOf(other);
    out.push({
      t: `Qual destes NÃO era ${POS_NAME[pos].toLowerCase()}?`,
      a: [odd.id], type: 'player',
      fixed: pick(same, 9).map(p => p.id).concat(odd.id),
      _cat: GC.pos, d: 2,
    });
  });

  /* 15. Which club was founded in this decade? */
  for (let i = 0; i < 3; i++) {
    const c = rndOf(CL);
    const dec = Math.floor(c.f / 10) * 10;
    const others = CL.filter(x => Math.floor(x.f / 10) * 10 !== dec);
    if (others.length < 9) continue;
    out.push({
      t: `Qual destes clubes foi fundado na década de ${dec}?`,
      a: [c.id],
      pool: others.map(x => x.id),
      _cat: GC.hist, d: 3,
    });
  }

  /* 16. Contemporaries — who played in the same era? */
  pick(PL.filter(p => p.era), 5).forEach(p => {
    const overlaps = x => x.id !== p.id &&
      Math.min(x.era[1], p.era[1]) - Math.max(x.era[0], p.era[0]) >= 5;
    const mates = PL.filter(overlaps);
    const strangers = PL.filter(x => x.id !== p.id && !overlaps(x));
    if (!mates.length || strangers.length < 9) return;
    const mate = rndOf(mates);
    out.push({
      t: `Quem jogou na mesma época que ${p.n}?`,
      a: [mate.id], type: 'player',
      fixed: pick(strangers, 9).map(x => x.id).concat(mate.id),
      face: p.img,
      _cat: GC.era, d: 3,
    });
  });

  /* 17. Most Libertadores titles among these */
  for (let i = 0; i < 3; i++) {
    const set = pick(CL, 10);
    const top = set.reduce((a, b) => (a.lib >= b.lib ? a : b));
    if (top.lib === 0 || set.filter(c => c.lib === top.lib).length > 1) continue;
    out.push({ t: 'Qual destes clubes tem mais títulos da Libertadores?',
               a: [top.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* 18. Country → multi-select */
  Object.keys(byCtry).filter(c => byCtry[c].length >= 2 && c !== 'BRA').slice(0, 4).forEach(c => {
    const yes = pick(byCtry[c], 2);
    const no = PL.filter(p => p.ctry !== c);
    if (no.length < 8) return;
    out.push({
      t: `Selecione os 2 jogadores de ${CTRY_NAME[c] || c}`,
      a: yes.map(p => p.id), type: 'player',
      fixed: yes.map(p => p.id).concat(pick(no, 8).map(p => p.id)),
      _cat: GC.nat, d: 3,
    });
  });

  // Safety net: a generator bug must never put an unanswerable question in front
  // of a player, so drop anything whose answers don't resolve.
  return out.filter(q =>
    !q._skip &&
    q.a && q.a.length &&
    q.a.every(id => (q.type === 'player' ? PL : CL).some(x => x.id === id)));
}

/* ═══════════════════════════════════════════════════
   GAME STATE
═══════════════════════════════════════════════════ */
let sc       = 'home';
let cat      = null;
let qi       = 0;
let numQs    = 10;
let diffKey  = 'facil';
let sel      = new Set();
let pts      = 0;
let prevPts  = 0;   // to detect score change for animation
let streak   = 0;
let disp     = [];
let tLeft    = 30;
let tMax     = 30;
let tmr      = null;
let lastMsg  = '';
/* ═══════════════════════════════════════════════════
   COMBO SCORING + PERSISTENCE
═══════════════════════════════════════════════════ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('fqbr_' + k);
                    return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fqbr_' + k, JSON.stringify(v)); } catch (e) {} },
};
let scores     = LS.get('scores', {});      // best points per difficulty
let stats      = LS.get('stats', { games:0, correct:0, answered:0, bestStreak:0 });
let nCorrect   = 0;   // perfect answers this run
let nPartial   = 0;
let bestStreak = 0;
let lastGain   = 0;
let runLog     = [];  // per-question 3/1/0, for the share card

/* points for one answer, with speed + combo + difficulty multipliers */
function scoreAnswer(base) {
  if (base <= 0) return { gained:0, mult:1, speed:0 };
  const frac  = tMax ? tLeft / tMax : 0;
  const speed = base === 3 ? (frac > 0.6 ? 2 : frac > 0.3 ? 1 : 0) : 0;
  const mult  = streak >= 6 ? 3 : streak >= 3 ? 2 : 1;
  return { gained: Math.round((base + speed) * mult * DCFG().pmul), mult, speed };
}


/* ═══════════════════════════════════════════════════
   DAILY CHALLENGE
   One identical 10-question run per day for everybody,
   plus a Wordle-style card that is easy to paste in WhatsApp.
═══════════════════════════════════════════════════ */
let isDaily = false;

function dailyDone() { return LS.get('dailyDay', -1) === dayIndex(); }
function dailyInfo() { return LS.get('dailyRes', null); }

function dailyStreakNow() {
  const last = LS.get('dailyDay', -1);
  const st   = LS.get('dailyStreak', 0);
  const today = dayIndex();
  if (last === today || last === today - 1) return st;
  return 0;                       // streak broken
}

function saveDaily() {
  const today = dayIndex(), last = LS.get('dailyDay', -1);
  let st = LS.get('dailyStreak', 0);
  st = (last === today - 1) ? st + 1 : (last === today ? st : 1);
  LS.set('dailyDay', today);
  LS.set('dailyStreak', st);
  LS.set('dailyRes', { pts, nCorrect, total: cat.qs.length, log: runLog, streak: st });
}

function shareText() {
  const link = 'https://tdosreis.github.io/futebol-quiz/';

  /* The ladder gets its own card: the climb reads better as a column of
     rungs than as a row of squares, and the number is the whole story. */
  if (isMil) {
    const climb   = LADDER.map((s, i) => i < rung ? '🟨' : '⬛').join('');
    const verdict = banked >= LADDER[LADDER.length - 1].v ? 'LEVEI O MILHÃO!'
                  : cashed ? 'parei e levei' : 'caí e levei';
    return `Rumo ao Milhão ⚽ Futebol Quiz BR\n${climb}\n`
         + `${verdict} ${money(banked)} · degrau ${rung}/${LADDER.length}\n${link}`;
  }

  const grid = runLog.map(p => p === 3 ? '🟩' : p === 1 ? '🟨' : p === -1 ? '⬜' : '⬛').join('');
  const head = isDaily ? `Futebol Quiz BR ⚽ Desafio #${dayIndex()}`
                       : `Futebol Quiz BR ⚽ ${DCFG().label}`;
  const strk = bestStreak >= 3 ? `  🔥${bestStreak}` : '';
  return `${head}\n${grid}\n${nCorrect}/${cat.qs.length} acertos · ${pts} pts${strk}\n${link}`;
}

function doShare() {
  const txt = shareText();
  if (navigator.share) {
    navigator.share({ text: txt }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      const b = document.getElementById('bshare');
      if (b) { b.textContent = 'COPIADO!'; setTimeout(() => { b.textContent = 'COMPARTILHAR'; }, 1600); }
    }).catch(() => {});
  }
}

function startDaily() {
  isDaily = true; isSurv = false; isMil = false;
  diffKey = 'moderado';
  seedFrom(dayIndex());
  cat = buildGame('moderado');
  cat.qs = cat.qs.slice(0, 10);
  cat.name = 'Desafio Diário';
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = [];
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}


/* ═══════════════════════════════════════════════════
   AJUDAS (LIFELINES)
   The show's five cards, each usable once per run. They cost
   nothing but the speed bonus, so using one is a real trade-off.
     cortar   — burns half the wrong tiles
     placar   — the audience votes
     expert   — a pundit gives an opinion (and can be wrong)
     congelar — stops the clock for this question
     pular    — next question, same rung
   `parar` (cash out) lives with the ladder, not here: it ends the run.
═══════════════════════════════════════════════════ */
let lifes  = { half: 1, poll: 1, expert: 1, freeze: 1, skip: 1 };
let hidden = new Set();   // tiles burned by "cortar"
let frozen = false;       // clock paused for this question
let poll   = null;        // {id: percent} audience vote, drawn over the tiles
let expert = null;        // { id, line } the pundit's call

function resetLifes() {
  lifes  = { half: 1, poll: 1, expert: 1, freeze: 1, skip: 1 };
  hidden = new Set();
  frozen = false;
  poll   = null;
  expert = null;
  ladderOpen = false;
}

/* cleared between questions; the cards themselves stay spent */
function clearHelpers() {
  hidden = new Set();
  frozen = false;
  poll   = null;
  expert = null;
  ladderOpen = false;
}

/* How many tiles Cortar would actually burn right now. Some questions are
   two-way comparisons ("who had the longer career?"), where halving one
   wrong option rounds to nothing — the card must not be spent on those. */
function cutCount() {
  if (!cat || !cat.qs || !cat.qs[qi]) return 0;
  const q = cat.qs[qi];
  const wrong = disp.filter(o => !q.a.includes(o.id) && !hidden.has(o.id));
  return Math.floor(wrong.length / 2);
}

function useHalf() {
  if (!lifes.half || sc !== 'quiz' || cutCount() < 1) return;
  const q = cat.qs[qi];
  const wrong = disp.filter(o => !q.a.includes(o.id) && !hidden.has(o.id)).map(o => o.id);
  // remove half of the wrong options, keeping the board readable
  const drop = shuf(wrong).slice(0, cutCount());
  drop.forEach(id => { hidden.add(id); sel.delete(id); });
  lifes.half = 0;
  snd.cut();
  go();
}

/* ── PLACAR: the audience votes ──────────────────────────────
   The crowd is well informed but not infallible, and it gets shakier
   as the money climbs: the right answer takes the biggest share only
   about as often as the rung is easy. */
function usePoll() {
  if (!lifes.poll || sc !== 'quiz') return;
  const q    = cat.qs[qi];
  const live = disp.filter(o => !hidden.has(o.id));
  if (!live.length) return;

  /* How often the crowd's biggest bar is actually the right answer. Decided
     up front rather than emerging from weights, because this number is the
     whole balance of the card: too high and Placar is a free answer that
     makes the other four pointless, too low and nobody would spend it.
     ~88% on the first rung, ~22% on the last. */
  const acc     = isMil ? Math.max(0.22, 0.88 - rung * 0.045) : 0.75;
  const rightOf = live.filter(o => q.a.includes(o.id));
  const wrongOf = live.filter(o => !q.a.includes(o.id));
  const lands   = rnd() < acc && rightOf.length > 0;
  const pool    = lands ? rightOf : (wrongOf.length ? wrongOf : live);
  const winner  = pool[Math.floor(rnd() * pool.length)];

  /* The leading bar, then the remainder scattered over everyone else. Every
     other share is capped below the lead and whatever is left over from the
     rounding goes back to the winner, so the biggest bar is always the one
     the crowd actually picked — otherwise the card would lie about itself. */
  const lead   = Math.round(24 + rnd() * 22);      // 24–46%
  const others = live.filter(o => o.id !== winner.id);
  const noise  = others.map(o => ({ id: o.id, w: 0.25 + rnd() * rnd() * 3 }));
  const sum    = noise.reduce((s, x) => s + x.w, 0) || 1;
  const cap    = Math.max(1, lead - 2);

  poll = {};
  let spent = 0;
  noise.forEach(x => {
    const share = Math.max(0, Math.min(cap, Math.round(x.w / sum * (100 - lead))));
    poll[x.id] = share;
    spent += share;
  });
  poll[winner.id] = 100 - spent;                   // ≥ lead, so always the tallest

  lifes.poll = 0;
  snd.crowd();
  go();
}

/* ── ESPECIALISTA: a commentator calls it ────────────────────
   Right most of the time early on, distinctly shaky near the million —
   and the phrasing tells you how much to trust him. */
const EXPERT_SURE  = ['Sem sombra de dúvida:', 'Pode marcar tranquilo:', 'Essa eu sei de cor:',
                      'Cravo aqui, sem medo:', 'Acompanhei isso de perto:'];
const EXPERT_UNSURE = ['Acho que é', 'Se a memória não falha,', 'Chutaria em',
                       'Na dúvida eu iria de', 'Vou no palpite:'];

function useExpert() {
  if (!lifes.expert || sc !== 'quiz') return;
  const q    = cat.qs[qi];
  const live = disp.filter(o => !hidden.has(o.id));
  const acc  = isMil ? Math.max(0.4, 0.95 - rung * 0.038) : 0.8;
  const sure = rnd() < acc;

  const rightOnes = live.filter(o => q.a.includes(o.id));
  const wrongOnes = live.filter(o => !q.a.includes(o.id));
  const pickFrom  = sure && rightOnes.length ? rightOnes : (wrongOnes.length ? wrongOnes : live);
  const choice    = pickFrom[Math.floor(rnd() * pickFrom.length)];

  const lines = sure ? EXPERT_SURE : EXPERT_UNSURE;
  expert = {
    id: choice ? choice.id : null,
    sure,
    line: lines[Math.floor(rnd() * lines.length)],
    name: choice ? choice.n : '—',
  };
  lifes.expert = 0;
  snd.select();
  go();
}

function useFreeze() {
  if (!lifes.freeze || sc !== 'quiz') return;
  lifes.freeze = 0;
  frozen = true;
  snd.freeze();
  go();
}

function useSkip() {
  if (!lifes.skip || sc !== 'quiz') return;
  lifes.skip = 0;
  clearInterval(tmr);
  snd.swipe();
  runLog.push(-1);                 // neither right nor wrong
  qi++;
  sel.clear(); clearHelpers(); lastMsg = '';
  if (qi >= cat.qs.length) { finishRun(); }
  else {
    sc = 'quiz'; tMax = qTime(); tLeft = tMax;
    disp = getDisp(cat.qs[qi]);
    startTmr();
  }
  go();
}


/* ═══════════════════════════════════════════════════
   MEDALS — long-run progression
═══════════════════════════════════════════════════ */
const MEDALS = [
  { id:'first',  ic:'⚽', n:'Estreia',        d:'Jogue sua primeira partida',
    t: st => st.games >= 1 },

];

function earnedMedals() { return MEDALS.filter(m => { try { return m.t(stats); } catch (e) { return false; } }); }

/* returns medals unlocked by the run that just finished */
function newMedals() {
  const had = new Set(LS.get('medals', []));
  const now = earnedMedals().map(m => m.id);
  LS.set('medals', now);
  return MEDALS.filter(m => now.includes(m.id) && !had.has(m.id));
}

/* ═══════════════════════════════════════════════════
   SURVIVAL — one mistake and the run is over
═══════════════════════════════════════════════════ */
let isSurv = false;

function startSurvival() {
  isSurv = true; isDaily = false; isMil = false; _seed = null;
  diffKey = 'moderado';
  cat = buildGame('moderado');
  cat.name = 'Mata-mata';
  // a long queue; the run ends on the first mistake, not on length
  const extra = buildGame('dificil');
  cat.qs = cat.qs.concat(extra.qs);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = [];
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* ═══════════════════════════════════════════════════
   RUMO AO MILHÃO — the prize ladder

   The headline mode. Sixteen questions, one per rung, each worth
   more than the last and each drawn from a harder pool with a shorter
   clock and nastier distractors. Two rungs are checkpoints: clear one
   and that money is yours whatever happens afterwards. Miss a question
   and the run ends at your last checkpoint — so every rung above one is
   a bet, and "PARAR" is always on the table.
═══════════════════════════════════════════════════ */
const LADDER = [
  { v:      1000, tier: 1, time: 45 },
  { v:      2000, tier: 1, time: 45 },
  { v:      3000, tier: 1, time: 42 },
  { v:      5000, tier: 1, time: 40, safe: true },
  { v:     10000, tier: 2, time: 38 },
  { v:     15000, tier: 2, time: 36 },
  { v:     20000, tier: 2, time: 34 },
  { v:     30000, tier: 2, time: 32 },
  { v:     50000, tier: 2, time: 30, safe: true },
  { v:     75000, tier: 3, time: 30 },
  { v:    100000, tier: 3, time: 28 },
  { v:    150000, tier: 3, time: 26 },
  { v:    250000, tier: 3, time: 24 },
  { v:    400000, tier: 3, time: 22 },
  { v:    600000, tier: 3, time: 20 },
  { v:   1000000, tier: 3, time: 20 },
];

let isMil  = false;
let rung   = 0;       // index into LADDER — the question being played for
let banked = 0;       // guaranteed by the last checkpoint cleared
let cashed = false;   // player pressed PARAR instead of falling
let ladderOpen = false;   // the ladder sheet is up; the clock waits

const RUNG    = () => LADDER[Math.min(rung, LADDER.length - 1)];
const isFinal = () => rung === LADDER.length - 1;

/* R$ 1.000.000 — pt-BR grouping without leaning on Intl in old WebViews */
function money(v) {
  return 'R$ ' + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

/* the money you walk away with if you get this one wrong */
function safetyNet() {
  let v = 0;
  for (let i = 0; i < rung; i++) if (LADDER[i].safe) v = LADDER[i].v;
  return v;
}

/* seconds on the clock and distractor strictness for the current question */
function qTime()   { return isMil ? RUNG().time : DCFG().time; }
function qStrict() { return isMil ? Math.min(1, rung / (LADDER.length - 1) * 1.15) : DCFG().strict; }

/* One question per rung, each matched to that rung's tier. Built in one pass
   so a question can never repeat inside a run. */
function buildMilhao() {
  let all = CATS.flatMap(c => c.qs.map(q => ({ ...q, _cat: c })));
  if (typeof GEN_QS === 'function') {
    all = all.concat(GEN_QS(1)).concat(GEN_QS(2)).concat(GEN_QS(3));
  }
  all.forEach(q => { q._d = qTier(q); });

  const seen = new Set();
  const pool = shuf(all).filter(q => { if (seen.has(q.t)) return false; seen.add(q.t); return true; });

  const used = new Set();
  const qs = LADDER.map(step => {
    let best = null, bestW = -1e9;
    for (let i = 0; i < pool.length; i++) {
      if (used.has(i)) continue;
      const w = -Math.abs(pool[i]._d - step.tier) * 10 + rnd() * 3;
      if (w > bestW) { bestW = w; best = i; }
    }
    used.add(best);
    return pool[best];
  }).filter(Boolean);

  return { id:'milhao', name:'Rumo ao Milhão', emoji:'💰',
           tag:'Uma pergunta por degrau', col:'#FFD700', diff:'Show', qs };
}

function startMilhao() {
  isMil = true; isDaily = false; isSurv = false; _seed = null;
  diffKey = 'moderado';                  // only used for the score multiplier
  cat = buildMilhao();
  rung = 0; banked = 0; cashed = false;
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = [];
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* PARAR — take the money on the table and stop. Always a win. */
function cashOut() {
  if (!isMil || sc !== 'quiz') return;
  clearInterval(tmr);
  cashed = true;
  banked = rung > 0 ? LADDER[rung - 1].v : 0;
  snd.cash();
  finishRun();
  go();
}

function milBest() { return LS.get('milBest', 0); }

/* ═══════════════════════════════════════════════════
   SVG — CLUB CRESTS
═══════════════════════════════════════════════════ */


/* Club artwork: use the licensed crest image when we have one, otherwise fall
   back to genericCrest(): a designed shield in the club's colours. This keeps
   the bundle free of non-free Wikipedia files. */

/* ── Designed fallback badge (used when we have no licensed crest file) ── */
function _lum(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
/* How far apart two colours are in plain RGB terms. Luminance alone is the
   wrong test for a kit: Sport's red and black stripes sit only 0.16 apart in
   brightness but are obviously different colours, and judging them by
   lightness painted them white. */
function _dist(a, b) {
  const p = hex => {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(x => x + x).join('');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  return Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
}
function _shade(hex, amt) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
  const r = f(parseInt(h.slice(0, 2), 16)), g = f(parseInt(h.slice(2, 4), 16)), b = f(parseInt(h.slice(4, 6), 16));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* Five clubs — Corinthians, Vasco, Sport, Bragantino and Náutico — have no
   crest file, and that is deliberate: Wikipedia carries those marks only under
   fair use, which cannot be redistributed inside a shipped app (see
   tools/patch_nonfree.py). Drawing imitations of the real crests would be
   worse than shipping none, so this badge deliberately does not resemble them.
   It is an identification device built from public facts we already hold —
   the club's colours, its kit pattern, its founding year, its titles — and it
   is drawn with enough craft to sit beside a photographed crest without
   looking like a missing asset. */
const KIT = {
  vasco:       'sash',     // black shirt, white diagonal sash
  nautico:     'stripes',  // red and white vertical stripes
  sport:       'stripes',  // red and black vertical stripes
  bragantino:  'band',     // white shirt, red chest band
  corinthians: 'solid',
};

function genericCrest(id) {
  const c = CL.find(x => x.id === id);
  if (!c) return '';
  const uid   = 'c' + id.replace(/\W/g, '');
  const base  = c.c1;
  /* The pattern takes the club's real second colour whenever the two are
     visibly different, so Sport gets its red-on-black stripes instead of
     Náutico's red-on-white. Only genuinely similar pairs get a neutral. */
  const alt   = _dist(c.c1, c.c2) > 70
                ? c.c2
                : (_lum(base) < 0.5 ? '#ececec' : '#1a1a1a');
  const kit   = KIT[id] || 'solid';
  const ink   = _lum(base) < 0.55 ? '#ffffff' : '#141414';
  const rim   = _lum(c.c2) > 0.5 ? c.c2 : '#d8d8d8';
  const stars = Math.min(3, (c.br || 0) + (c.lib || 0));

  /* the kit pattern, clipped to the inner disc */
  let field = `<circle cx="30" cy="29" r="21" fill="url(#${uid}g)"/>`;
  if (kit === 'stripes') {
    field += [ -18, -10, -2, 6, 14 ].map(x =>
      `<rect x="${30 + x}" y="8" width="4" height="42" fill="${alt}" opacity=".92"/>`).join('');
  } else if (kit === 'sash') {
    field += `<path d="M11 40 L41 8 L49 15 L19 47 Z" fill="${alt}" opacity=".95"/>`;
  } else if (kit === 'band') {
    field += `<rect x="9" y="25" width="42" height="9" fill="${alt}" opacity=".95"/>`;
  }

  const starRow = stars
    ? Array.from({ length: stars }, (_, i) =>
        _STAR(30 + (i - (stars - 1) / 2) * 7, 15.5, 2.7, rim)).join('')
    : '';

  return `
    <defs>
      <linearGradient id="${uid}g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="${_shade(base, 0.16)}"/>
        <stop offset="100%" stop-color="${_shade(base, -0.20)}"/>
      </linearGradient>
      <linearGradient id="${uid}r" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0%"   stop-color="${_shade(rim, 0.30)}"/>
        <stop offset="48%"  stop-color="${rim}"/>
        <stop offset="100%" stop-color="${_shade(rim, -0.34)}"/>
      </linearGradient>
      <clipPath id="${uid}c"><circle cx="30" cy="29" r="21"/></clipPath>
    </defs>

    <!-- outer ring -->

/* `label` decides whether the crest speaks. On an answer tile the club name
   sits right underneath it, so the crest is decorative and stays silent —
   otherwise a screen reader says every name twice. In the question header
   there is no such caption, so there the crest has to carry the name. */
/* Most crests are transparent artwork that can float on the tile. These three
   are not: Corinthians' free file carries its own split background, and the
   only freely-licensed Vasco and Náutico marks on Commons are the club flags,
   which are solid rectangles. Dropped in raw they read as stray white boxes
   among the shields, so they get framed as deliberate emblem plaques. */
const FLAT_LOGOS = new Set(['corinthians', 'vasco', 'nautico']);

function clubArt(id, style, label) {
  const name = clubName(id);
  if (LOGOS[id]) {
    const flat = FLAT_LOGOS.has(id)
      ? 'border-radius:6px;border:1px solid rgba(255,255,255,.22);' +
        'box-shadow:0 2px 8px rgba(0,0,0,.55);background:#fff;'
      : '';
    return `<img src="${LOGOS[id]}" style="${style}${flat}"
      onerror="clubFallback(this,'${id}')"
      ${label ? `alt="${name}"` : 'alt="" aria-hidden="true"'} />`;
  }
  return `<svg viewBox="0 0 60 60" style="${style}"
    ${label ? `role="img" aria-label="${name}"` : 'aria-hidden="true"'}
    >${genericCrest(id)}</svg>`;
}

/* If a crest file is missing (e.g. an old cached page pointing at a file we
   removed), swap in the app's own SVG crest instead of a broken-image icon. */
function clubFallback(img, id) {
  try {
    const alt = img.getAttribute('alt');
    img.outerHTML = `<svg viewBox="0 0 60 60" style="${img.getAttribute('style') || ''}"
      ${alt ? `role="img" aria-label="${alt}"` : 'aria-hidden="true"'}
      >${genericCrest(id)}</svg>`;
  } catch (e) { img.style.opacity = '.3'; }
}

/* ═══════════════════════════════════════════════════
   BADGE — one answer tile

   Ten of these make the board. Each carries the show's letter marker
   (A…J), and can be overlaid with the audience vote, the pundit's pick,
   or the lock-in dimming, depending on what the player has spent.
═══════════════════════════════════════════════════ */
const LETTERS = 'ABCDEFGHIJKLMNOP';

function badge(item, idx) {
  const isPlayer = 'img' in item;
  const isSel   = sel.has(item.id);
  const live    = sc === 'quiz' || sc === 'ask' || sc === 'lock';
  const isAns   = (sc === 'reveal') && cat.qs[qi].a.includes(item.id);
  const isWrong = (sc === 'reveal') && isSel && !isAns;
  const curQ    = (cat && cat.qs && cat.qs[qi]) || {};
  const delay   = `animation-delay:${Math.min(9, idx || 0) * 32}ms;`;

  if (hidden.has(item.id) && live) {
    return `<div style="${delay}width:100%;${curQ.textTiles ? 'min-height:44px' : 'aspect-ratio:1'};
      border-radius:9px;background:rgba(255,255,255,.015);opacity:.3;
      border:1px dashed rgba(255,255,255,.07);"></div>`;
  }

  let cls  = 'b';
  let ring = '';
  if (sc === 'reveal') {
    if (isAns)        { cls += ' b-correct'; ring = 'box-shadow:0 0 0 3px #00e676,0 0 20px rgba(0,230,118,.45);'; }
    else if (isWrong) { cls += ' b-wrong';   ring = 'box-shadow:0 0 0 3px #f44336,0 0 20px rgba(244,67,54,.45);'; }
  } else if (sc === 'ask' || sc === 'lock') {
    // the board holds its breath: only what you picked stays lit
    if (isSel) { cls += ' b-locked'; }
    else       { cls += ' b-faded'; }
  } else if (isSel) {
    cls += ' b-sel';
    ring = `box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(255,200,69,.5);transform:scale(1.06);`;
  } else if (expert && expert.id === item.id) {
    cls += ' expert-ring';
  }

  const letter = `<span class="tile-letter">${LETTERS[idx] || '?'}</span>`;

  const votePct = poll && poll[item.id] !== undefined ? poll[item.id] : null;
  const voteEl  = votePct === null ? '' :
    `<span class="vote-pct">${votePct}%</span>
     <span class="vote"><i style="width:${votePct}%;animation-delay:${(idx || 0) * 45}ms;"></i></span>`;

  if (curQ.textTiles) {
    return `<div class="${cls}" data-id="${item.id}" style="
${delay}        width:100%;min-height:46px;border-radius:9px;cursor:pointer;
        background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
        border:1px solid rgba(255,255,255,.08);
        position:relative;user-select:none;
        display:flex;align-items:center;justify-content:center;text-align:center;
        padding:6px 4px 6px 18px;transition:transform .12s,box-shadow .12s;${ring}">
      ${letter}${voteEl}
      <span style="font-size:10px;font-weight:700;color:rgba(255,255,255,.92);
        font-family:'Inter',system-ui;line-height:1.25;
        text-shadow:0 1px 4px rgba(0,0,0,.9);">${item.n}</span>
    </div>`;
  }

  if (isPlayer) {
    return `<div class="${cls}" data-id="${item.id}" style="
${delay}        width:100%;aspect-ratio:1;border-radius:9px;cursor:pointer;
        position:relative;user-select:none;
        background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
        border:1px solid rgba(255,255,255,.08);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
        padding:9px 3px 29px;
        transition:transform .12s,box-shadow .12s,filter .1s;${ring}">
      ${letter}${voteEl}
      <div style="width:68%;aspect-ratio:1;border-radius:50%;overflow:hidden;flex-shrink:0;
        border:2px solid rgba(255,200,69,.32);box-shadow:0 2px 10px rgba(0,0,0,.6);">
        <img src="${item.img}" alt="${item.n}"
          style="width:100%;height:100%;object-fit:cover;object-position:top center;pointer-events:none;"
          onerror="this.style.opacity='.25'" />
      </div>
      <span class="tile-name${item.n.length > 15 ? ' tile-name-long' : ''}"
        ><span class="fl">${flagSVG(item.ctry, 7)}</span>${item.n}</span>
    </div>`;
  }

  // ── Club tile ──
  return `<div class="${cls}" data-id="${item.id}" style="
${delay}      width:100%;aspect-ratio:1;border-radius:9px;cursor:pointer;
      position:relative;overflow:hidden;user-select:none;
      background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:transform .12s,box-shadow .12s,filter .1s;${ring}">
    ${letter}${voteEl}
    ${clubArt(item.id, (FLAT_LOGOS.has(item.id)
        ? 'width:70%;max-height:56%;object-fit:contain;'
        : 'width:76%;height:76%;object-fit:contain;') + 'pointer-events:none;flex-shrink:0;')}
    <span class="tile-name tile-club${item.n.length > 15 ? ' tile-name-long' : ''}">${item.n}</span>
  </div>`;
}

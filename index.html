       <line x1="30" y1="10" x2="30" y2="50" stroke="rgba(255,255,255,.4)" stroke-width="1"/>`
    : `<rect x="6" y="9" width="48" height="42" fill="#3A7030"/>
       <rect x="6" y="9" width="48" height="42" fill="none" stroke="#FFF" stroke-width="1.5"/>
       <rect x="17" y="9" width="26" height="42" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
       <line x1="6" y1="30" x2="54" y2="30" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
       <circle cx="30" cy="30" r="6" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1"/>`;
  return `<rect width="60" height="60" fill="#2A5020"/>
    ${field}
    <text x="30" y="57" text-anchor="middle" font-size="6.5" font-weight="700"
      fill="rgba(255,255,255,.7)" font-family="Inter,system-ui">${s.name}</text>`;
}

/* ═══════════════════════════════════════════════════
   SVG — CLUB CRESTS
═══════════════════════════════════════════════════ */


/* Club artwork: use the licensed crest image when we have one, otherwise fall
   back to genericCrest(): a designed shield in the club's colours. This keeps
   the bundle free of non-free Wikipedia files. */

/* ── Designed fallback badge (used when we have no licensed crest file) ── */
function _lum(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
/* How far apart two colours are in plain RGB terms. Luminance alone is the
   wrong test for a kit: Sport's red and black stripes sit only 0.16 apart in
   brightness but are obviously different colours, and judging them by
   lightness painted them white. */
function _dist(a, b) {
  const p = hex => {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(x => x + x).join('');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  return Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
}
function _shade(hex, amt) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
  const r = f(parseInt(h.slice(0, 2), 16)), g = f(parseInt(h.slice(2, 4), 16)), b = f(parseInt(h.slice(4, 6), 16));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* Every club now ships its own official escudo, so nothing reaches this badge
   through LOGOS any more. It stays as clubFallback's landing spot: if a crest
   file ever 404s — an old cached page pointing at a file we replaced — a drawn
   shield is a better answer than a broken-image icon.
   It deliberately does not resemble any real crest. It is an identification
   device built from public facts we already hold —
   the club's colours, its kit pattern, its founding year, its titles — and it
   is drawn with enough craft to sit beside a photographed crest without
   looking like a missing asset. */
const KIT = {
  vasco:       'sash',     // black shirt, white diagonal sash
  nautico:     'stripes',  // red and white vertical stripes
  sport:       'stripes',  // red and black vertical stripes
  bragantino:  'band',     // white shirt, red chest band
  corinthians: 'solid',
};

function genericCrest(id) {
  const c = CL.find(x => x.id === id);
  if (!c) return '';
  const uid  = 'c' + id.replace(/\W/g, '');
  const base = c.c1;
  /* The pattern takes the club's real second colour whenever the two are
     visibly different, so Sport gets its red-on-black stripes instead of
     Náutico's red-on-white. Only genuinely similar pairs get a neutral. */
  const alt  = _dist(c.c1, c.c2) > 70
               ? c.c2
               : (_lum(base) < 0.5 ? '#ececec' : '#1a1a1a');
  const kit  = KIT[id] || 'solid';
  const ink  = _lum(base) < 0.55 ? '#ffffff' : '#141414';
  const edge = _lum(base) < 0.5 ? '#f0f0f0' : '#1a1a1a';

  /* The same outline every real crest is cut to, so the drawn badge sits in
     the row as one of them rather than as a different kind of object. It is
     flat on purpose: the chrome ring and glossy dome this used to have were
     the loudest thing on a board of flat, printed marks. */
  const SHIELD = 'M30 2 L55.8 10.4 L55.8 31.2 C55.8 45.6 43.8 55.2 30 59.1 '
               + 'C16.2 55.2 4.2 45.6 4.2 31.2 L4.2 10.4 Z';

  let field = `<path d="${SHIELD}" fill="${base}"/>`;
  if (kit === 'stripes') {
    field += [-21, -13, -5, 3, 11].map(x =>
      `<rect x="${30 + x}" y="0" width="4.4" height="60" fill="${alt}"/>`).join('');
  } else if (kit === 'sash') {
    field += `<path d="M2 42 L44 2 L54 11 L12 51 Z" fill="${alt}"/>`;
  } else if (kit === 'band') {
    field += `<rect x="0" y="24" width="60" height="10" fill="${alt}"/>`;
  }

  const stars = Math.min(3, (c.br || 0) + (c.lib || 0));
  const starRow = stars
    ? Array.from({ length: stars }, (_, i) =>
        _STAR(30 + (i - (stars - 1) / 2) * 7.5, 13, 2.6, ink)).join('')
    : '';

  return `
    <defs><clipPath id="${uid}s"><path d="${SHIELD}"/></clipPath></defs>
    <g clip-path="url(#${uid}s)">${field}</g>
    <path d="${SHIELD}" fill="none" stroke="${edge}" stroke-width="2.2" stroke-linejoin="round"/>
    ${starRow}
    <text x="30" y="36" text-anchor="middle"
      font-family="'Archivo','Arial Black',Impact,sans-serif"
      font-size="15" font-weight="800" letter-spacing="0.3" fill="${ink}">${c.a}</text>
    ${c.f ? `<text x="30" y="46.5" text-anchor="middle"
      font-family="'Archivo',system-ui,sans-serif"
      font-size="6.4" font-weight="700" letter-spacing=".4" fill="${ink}"
      opacity=".78">${c.f}</text>` : ''}
  `;
}

/* `label` decides whether the crest speaks. On an answer tile the club name
   sits right underneath it, so the crest is decorative and stays silent —
   otherwise a screen reader says every name twice. In the question header
   there is no such caption, so there the crest has to carry the name. */
/* Every club now ships its own official escudo, and every one of those files
   is transparent artwork that floats on the page. The shield clip-path this
   used to need — for flags and for files flattened onto a background — went
   with the last of them. */
function clubArt(id, style, label) {
  const name = clubName(id);
  const inner = LOGOS[id]
    ? `<img src="${LOGOS[id]}" alt="" aria-hidden="true" onerror="clubFallback(this,'${id}')" />`
    : `<svg viewBox="0 0 60 60" class="fill" aria-hidden="true">${genericCrest(id)}</svg>`;
  return `<span class="crest-disc" style="${style || ''}"
    ${label ? `role="img" aria-label="${name}"` : 'aria-hidden="true"'}>${inner}</span>`;
}

/* If a crest file is missing (e.g. an old cached page pointing at a file we
   removed), swap in the app's own SVG crest instead of a broken-image icon. */
function clubFallback(img, id) {
  try {
    img.outerHTML = `<svg viewBox="0 0 60 60" class="fill" aria-hidden="true">${genericCrest(id)}</svg>`;
  } catch (e) { img.style.opacity = '.3'; }
}

/* ═══════════════════════════════════════════════════
   POCKET — one answer tile

   Ten of these make the board. Each is a pocket in the album page with
   a numbered tab in the corner, and can carry the audience vote, the
   pundit's pick, or the lock-in dimming, depending on what the player
   has spent.
═══════════════════════════════════════════════════ */
const NUM = i => String((i || 0) + 1).padStart(2, '0');

function badge(item, idx) {
  const isPlayer = 'img' in item;
  const isSel   = sel.has(item.id);
  const live    = sc === 'quiz' || sc === 'ask' || sc === 'lock';
  const isAns   = (sc === 'reveal') && cat.qs[qi].a.includes(item.id);
  const isWrong = (sc === 'reveal') && isSel && !isAns;
  const curQ    = (cat && cat.qs && cat.qs[qi]) || {};
  const delay   = `animation-delay:${Math.min(9, idx || 0) * 28}ms;`;

  if (hidden.has(item.id) && live) {
    return `<div class="b-gone" style="${delay}${isTextQ(curQ) ? 'min-height:44px' : 'aspect-ratio:1/1.22'}"></div>`;
  }

  let cls = 'b';
  if (sc === 'reveal') {
    if (isAns)        cls += ' b-correct';
    else if (isWrong) cls += ' b-wrong';
  } else if (sc === 'ask' || sc === 'lock') {
    cls += isSel ? ' b-locked' : ' b-faded';       // the board holds its breath
  } else if (isSel) {
    cls += ' b-sel';
  } else if (expert && expert.id === item.id) {
    cls += ' expert-ring';
  }

  const tab = `<span class="tab">${NUM(idx)}</span>`;
  const votePct = poll && poll[item.id] !== undefined ? poll[item.id] : null;
  if (votePct !== null) cls += ' b-voted';
  const voteEl  = votePct === null ? '' :
    `<span class="vote-pct">${votePct}%</span>
     <span class="vote"><i style="width:${votePct}%;animation-delay:${(idx || 0) * 45}ms;"></i></span>`;
  const longCls = item.n.length > 15 ? ' tile-name-long' : '';

  if (isTextQ(curQ)) {
    return `<div class="${cls} b-text" data-id="${item.id}" style="${delay}">
      ${tab}${voteEl}<span class="tile-name${longCls}">${item.n}</span></div>`;
  }

  if (isPlayer) {
    /* The tile is the same figurinha that goes in the album — old stock or
       new depending on the man — so picking one and later finding it stuck
       on your page is visibly the same object. */
    return `<div class="${cls} b-fig" data-id="${item.id}" style="${delay}">
      ${tab}${voteEl}
      ${figurinha(item, 'sm', { decorative: true, sub: '', noFlag: curQ._noFlag,
                                hideCtry: curQ._hideCtry, hideEra: curQ._hideEra })}
    </div>`;
  }

  // ── Club pocket ──
  return `<div class="${cls} b-crest" data-id="${item.id}" style="${delay}">
    ${tab}${voteEl}
    <div class="crest-box">${clubArt(item.id, '', false)}</div>
    <span class="tile-name tile-club${longCls}">${item.n}</span>
  </div>`;
}

/* Every question carries a picture.
   A bare question card is the one place the album stops looking like an album,
   and the text questions — the rules, the leagues, the coaches — had nothing at
   all. Explicit art first (a face, a crest, a flag, a drawn vignette), then a
   fallback from the category, so a question added later can never end up bare.

   The fallback must not answer anything: it is a category mark, never the
   subject of the question. A flag is only ever set by hand, and never on a
   question whose answer is a country. */
const QICON = {
  rules: w => ART.rules(w), plane: w => ART.plane(w), boot: w => ART.boot(w),
  bench: w => ART.bench(w), globe: w => ART.globe(w), stadium: w => ART.stadium(w),
  trophy: w => ART.trophy(w), ball: w => ART.ball(w),
};

/* what a category falls back to when a question names nothing to draw */
const CAT_ART = {
  origens: 'rules',  europa: 'globe',   curiosos: 'bench',
  copa:    'trophy', ouro:   'boot',    craques: 'boot',
  estadios:'stadium',lendas: 'trophy',  brasileirao: 'trophy',
  libertadores:'trophy', estados: 'globe', apelidos: 'ball',
  g_escudo:'ball',   g_conta:'ball',
};

function questionArt(q) {
  if (q.port)  return `<div class="qart qart-face print"><img src="${PORT_IMGS[q.port]}" alt="${PORT[q.port].name}" /></div>`;
  if (q.stad)  return `<div class="qart qart-wide qart-draw">${ART.stadium(92)}</div>`;
  if (q.face)  return `<div class="qart qart-face print"><img src="${q.face}" alt="" aria-hidden="true"
        onerror="this.parentElement.style.display='none'" /></div>`;
  if (q.crest) return `<div class="qart qart-crest${q._crestIsQ ? ' qart-hero' : ''}">${
        clubArt(q.crest, 'max-width:100%;max-height:100%;object-fit:contain;', true)}</div>`;
  if (q.qimg)  return `<div class="qart qart-wide print"><img src="${q.qimg}" alt="Momento do jogo referido na pergunta" style="object-position:center;"
        onerror="this.parentElement.style.display='none'" /></div>`;
  if (q.flag && FLAGS[q.flag])
    return `<div class="qart qart-flag" role="img" aria-label="${CTRY_NAME[q.flag] || q.flag}">
      <svg viewBox="0 0 9 6" preserveAspectRatio="none">${FLAGS[q.flag]}</svg></div>`;
  const key = q.icon || CAT_ART[(q._cat && q._cat.id) || ''] || 'ball';
  const draw = QICON[key] || QICON.ball;
  return `<div class="qart qart-wide qart-draw">${draw(92)}</div>`;
}

/* ═══════════════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════════════ */
const topbar = (label, id) => `
  <div class="topbar">
    <button id="${id || 'bhome'}" class="btn btn-ghost btn-icon" aria-label="Voltar">${ICON.back('currentColor', 13)}</button>
    <span class="crumb">${label}</span>
  </div>`;

const runlogEl = () => `<div class="runlog" aria-hidden="true">${
  runLog.map(p => `<i class="${p === 3 ? 'rl-3' : p === 1 ? 'rl-1' : p === 0 ? 'rl-0' : ''}"></i>`).join('')}</div>`;

/* What the run actually earned you, as the objects themselves. A chip saying
   "3 figurinhas novas" is a receipt; the stickers are the reward, and the end
   of a run is the one moment the player wants to look at them. Capped at six
   so a long Milhão run does not turn the screen into a second album page. */
const newStickerStrip = () => {
  if (!runNewIds.length) return '';
  const got  = runNewIds.map(id => PL.find(p => p.id === id)).filter(Boolean);
  if (!got.length) return '';
  const show = got.slice(0, 6), rest = got.length - show.length;
  return `
    <div class="newfigs">
      <div class="eyebrow" style="color:var(--brass);">${
        got.length === 1 ? 'Nova figurinha' : `${got.length} figurinhas novas`}</div>
      <div class="newfigs-row">
        ${show.map((p, i) => `<span class="newfig" style="animation-delay:${i * 70}ms;">${
          figurinha(p, 'sm', { decorative: true, sub: '' })}</span>`).join('')}
        ${rest > 0 ? `<span class="newfig-more">+${rest}</span>` : ''}
      </div>
    </div>`;
};

const medalChips = () => (window._newMedals || []).length ? `
  <div style="display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:4px;">
    ${window._newMedals.map(m => `<span class="chip chip-brass" style="text-transform:none;letter-spacing:.02em;font-size:11px;">
      ${(ICON[m.ic] || ICON.medal)('currentColor', 12)} Nova figurinha: ${m.n}</span>`).join('')}
  </div>` : '';

/* ── Which printing a player belongs to ─────────────────────
   The album was collected over fifty years, so it has two kinds of page
   in it. A career that started before the Premier League is on the old
   stock; anything since is on the current one. */
/* 2000, not 1992: Ronaldo, Ronaldinho and Rivaldo belong to the old
   pages in every way that matters, and putting them on mint stock looked
   like a filing error. */
const MODERN_FROM = 2000;
const figEra = p => (p.era && p.era[0] < MODERN_FROM) ? 'retro' : 'modern';

/* The two shapes behind a modern figurinha take the player's own
   national colours, the way the real ones do. */
const CTRY_COLORS = {
  BRA:['#FEDF00','#009B3A'], ARG:['#74ACDF','#F6B40E'], POR:['#DA291C','#046A38'],
  FRA:['#002395','#ED2939'], NED:['#AE1C28','#21468B'], GER:['#DD0000','#FFCE00'],
  ITA:['#008C45','#CD212A'], ENG:['#CE1124','#0A2C6B'], ESP:['#AA151B','#F1BF00'],
  URU:['#0038A8','#F6B40E'], BEL:['#FAE042','#ED2939'], CRO:['#FF0000','#171796'],
  COL:['#FCD116','#003893'], SWE:['#FECC00','#006AA7'], POL:['#DC143C','#EEEEEE'],
  EGY:['#CE1126','#111111'], CMR:['#007A5E','#FCD116'], NOR:['#BA0C2F','#00205B'],
  UKR:['#FFDD00','#0057B7'], HUN:['#CE2939','#477050'], CZE:['#D7141A','#11457E'],
  DEN:['#C8102E','#EEEEEE'], RUS:['#0039A6','#D52B1E'], MEX:['#006847','#CE1126'],
  CHI:['#D52B1E','#0039A6'], GHA:['#CE1126','#006B3F'], SCO:['#0065BD','#EEEEEE'],
  WAL:['#C8102E','#00AB39'], SEN:['#00853F','#FDEF42'], NGA:['#008751','#EEEEEE'],
  BUL:['#00966E','#D62612'], CIV:['#F77F00','#009E60'], LBR:['#BF0A30','#002868'],
};
const ctryColors = c => CTRY_COLORS[c] || ['#17593F', '#B8860B'];

/* One figurinha. `size` is lg (album page), sm (a tile on the board) or
   hero (the cover). */
function figurinha(p, size, opts) {
  opts = opts || {};
  /* hideEra also flattens the two printings into one. The retro/modern split
     is itself an era clue — one mint card among nine tea-coloured ones answers
     "who is the intruder" before a single name is read. */
  const era  = opts.hideEra ? 'retro' : figEra(p);
  const yr   = p.era ? p.era[0] : '';
  /* What the header band is allowed to say on this board. */
  const bandTxt = [
    opts.hideCtry ? '' : bandCtry(p.ctry),
    (opts.hideEra || !yr) ? '' : String(Math.floor(yr / 10) * 10).slice(2),
  ].filter(Boolean).join(' ');
  const sub  = opts.sub !== undefined ? opts.sub
             : `${POS_NAME[p.pos]} · ${p.era ? p.era[0] + '–' + p.era[1] : ''}`;
  const alt  = opts.decorative ? 'alt="" aria-hidden="true"' : `alt="${p.n}"`;
  const nmCls = 'fig-nm' + (p.n.length > 13 ? ' fig-nm-long' : '');
  const shot = `<div class="fig-shot"><img src="${p.img}" ${alt}
      onerror="this.style.opacity='.2'" /></div>`;

  if (era === 'retro') {
    /* the header band carries the country and the decade, the way the old
       albums carried the tournament — unless this board must not say so */
    return `<span class="fig fig-retro fig-${size}">
      <span class="fig-band${bandTxt ? '' : ' fig-band-mute'}">${bandTxt || ''}</span>
      <span class="fig-art">${shot}</span>
      <span class="fig-cap"><span class="${nmCls}">${p.n}</span>
      ${sub ? `<span class="fig-sub">${sub}</span>` : ''}</span>
    </span>`;
  }

  const [c1, c2] = ctryColors(p.ctry);
  /* The new stock carries the country alone — it already shows the flag and
     the club underneath, and "BRASIL 2001" ran out of band whatever the font.
     (A board that must hide the era renders everyone on retro stock, so this
     branch is never the one asked to drop a decade.) */
  /* Country alone normally — "BRASIL 2001" ran out of band whatever the font.
     When the country is being hidden the decade takes its place, so a modern
     card does not sit blank-headed in a row of cards showing one. */
  const mBand = opts.hideCtry
    ? (opts.hideEra || !yr ? '' : String(Math.floor(yr / 10) * 10).slice(2))
    : bandCtry(p.ctry);
  return `<span class="fig fig-modern fig-${size}">
    <span class="fig-band${mBand ? '' : ' fig-band-mute'}">${mBand}</span>
    <span class="fig-art">
      ${opts.hideCtry ? '' : `<span class="blob" style="background:${c1};width:54%;height:58%;left:0;top:10%;"></span>
      <span class="blob" style="background:${c2};width:42%;height:46%;right:0;top:34%;"></span>`}
      ${shot}
      ${(opts.noFlag || opts.hideCtry) ? '' : `<span class="fig-flag">${flagSVG(p.ctry, size === 'hero' ? 15 : size === 'lg' ? 9.5 : 7)}</span>`}
    </span>
    <span class="fig-cap"><span class="${nmCls}">${p.n}</span>
    ${sub ? `<span class="fig-sub">${sub}</span>` : ''}</span>
  </span>`;
}

/* The sticker on the cover. It changes every time the album is opened — a
   fixed face made the cover look broken — and once you have collected
   anything it shows one of yours, so the cover is your album, not ours.

   Its caption is always position · country. It used to prefer the nickname
   where there was one, which read as an inconsistency rather than a flourish:
   the line said "Atacante · Inglaterra" under Bobby Charlton and "Fenômeno"
   under Ronaldo Fenômeno, so the same slot meant a different thing depending
   on the face. The nickname still has its own place on the back of the card. */
function heroSticker() {
  const great = PL.filter(p => FAMOUS.has(p.id) || (p.wc && p.wc.length) || p.bo > 0);
  const mine  = great.filter(p => album.has(p.id));
  const pool  = mine.length ? mine : (great.length ? great : PL);
  const p = pool[Math.floor(Math.random() * pool.length)] || PL[0];
  return { p, num: PL.indexOf(p) + 1 };
}

function html() {

  /* ── Home: the cover ────────────────────────────────────────── */
  if (sc === 'home') {
    const best = milBest();
    const done = dailyDone(), dst = dailyStreakNow(), dres = dailyInfo();
    const { p: hero, num } = heroSticker();
    const year = new Date().getFullYear();

    /* The three modes share the lifelines' language now: the icon in a disc
       tinted with that mode's own colour, so the home screen and the board
       look like the same app rather than two. */
    const mode = (id, ic, label, tail, kind) => `
      <button id="${id}" class="mode mode-${kind}">
        <span class="mode-disc">${ic}</span>
        <span class="mt">${label}</span>
        ${tail ? `<span class="ms">${tail}</span>` : ''}
      </button>`;

    return `
    <div class="pg pg-center" style="padding:20px 20px 24px;gap:13px;">

      <div class="eyebrow" style="width:100%;display:flex;justify-content:space-between;">
        <span>Edição ${year}</span><b>Fig. Nº ${String(num).padStart(3, '0')}</b>
      </div>

      <div>
        <div class="eyebrow">Futebol Quiz BR</div>
        <h1 class="display" style="font-size:38px;margin-top:6px;">Rumo ao<br>
          <em class="brass" style="font-size:46px;">Milhão</em></h1>
      </div>

      <div class="hero-sticker" style="position:relative;">
        <span class="alb-n" style="font-size:9px;padding:2px 6px;">Nº ${String(num).padStart(3, '0')}</span>
        ${figurinha(hero, 'hero', { sub: `${POS_NAME[hero.pos]} · ${CTRY_NAME[hero.ctry] || hero.ctry}` })}
      </div>

      <p class="small muted" style="max-width:280px;font-size:12.5px;">
        Dezesseis perguntas separam você de
        <b class="brass" style="white-space:nowrap;">R$ 1.000.000</b>.
        Elas ficam mais difíceis a cada degrau.</p>

      ${best > 0 ? `<span class="chip chip-brass">${ICON.money('currentColor', 11)} Seu recorde · ${money(best)}</span>` : ''}

      <button id="mil-btn" class="btn btn-brass btn-lg">${ICON.play('currentColor', 15)} Jogar agora</button>

      <div class="modes">
        ${mode('daily-btn', ICON.calendar('currentColor', 16), 'Diário',
          done ? (dres ? dres.nCorrect + '/' + dres.total : 'feito')
               : 'Nº ' + dayIndex() + (dst > 0 ? ' · ' + dst + ' seg.' : ''), done ? 'done' : 'daily')}
        ${mode('surv-btn', ICON.shield('currentColor', 16), 'Mata-mata',
          (stats.survBest || 0) > 0 ? 'recorde ' + stats.survBest : 'até errar', 'surv')}
        ${mode('cta-btn', ICON.ladder('currentColor', 16), 'Treino', 'sem apostar', 'train')}
      </div>

      ${(() => {
        const e = earnedMedals();
        if (!e.length) return '';
        return `<div id="medal-strip" class="medal-strip" title="Medalhas">
          ${e.slice(0, 11).map(m => `<span class="medal-dot" title="${m.n}">${(ICON[m.ic] || ICON.medal)('currentColor', 13)}</span>`).join('')}
          ${e.length > 11 ? `<span class="small muted" style="align-self:center;">+${e.length - 11}</span>` : ''}
        </div>`;
      })()}

      <button id="balb" class="mode mode-album" style="width:100%;max-width:340px;flex-direction:row;gap:11px;text-align:left;">
        <span class="mode-disc">${ICON.book('currentColor', 17)}</span>
        <span style="flex:1;min-width:0;">
          <span class="mt" style="display:block;">Meu álbum</span>
          <span class="ms" style="display:block;">${album.size} de ${PL.length} figurinhas</span>
        </span>
        <span class="alb-ring alb-ring-lg" style="--p:${albumPct()}">
          <span class="alb-ring-n">${albumPct()}<i>%</i></span>
        </span>
      </button>

      <div class="home-foot">
        <button id="bmute" class="btn btn-ghost btn-icon" title="Som" aria-label="Som">${
          muted ? ICON.mute('currentColor', 14) : ICON.sound('currentColor', 14)}</button>
        <button id="bmed"  class="link">Medalhas</button>
        <button id="bcred" class="link">Créditos</button>
      </div>

      ${stats.games > 0 ? `<div class="small muted" style="font-size:10.5px;display:flex;gap:5px;align-items:center;">
        ${stats.games} ${stats.games === 1 ? 'partida' : 'partidas'}
        · ${Math.round(stats.correct / Math.max(1, stats.answered) * 100)}% de acerto
        ${stats.bestStreak >= 3 ? `· ${ICON.flame('var(--brass)', 11)} ${stats.bestStreak}` : ''}</div>` : ''}
    </div>`;
  }

  /* ── O ÁLBUM: every figurinha, collected or still missing ────
     The album is the one thing that only ever grows. Answer a player
     correctly and he is stuck in here for good; the empty pockets are
     the reason to keep playing. */
  if (sc === 'album') {
    const byCountry = {};
    PL.forEach((p, i) => { (byCountry[p.ctry] = byCountry[p.ctry] || []).push({ p, n: i + 1 }); });

    /* The album reaches thirty-nine countries, and half of them are one player.
       Twenty-three section headers each opening onto a single card made the
       back of the album read as a list of fragments. The old albums did what
       this does: the countries with a full row of their own get a page, and
       everyone else shares the last one. Each sticker still carries its own
       flag, so nobody loses their nationality — only the header is shared. */
    const PAGE_MIN = 3;
    const own  = Object.keys(byCountry).filter(c => byCountry[c].length >= PAGE_MIN);
    const rest = Object.keys(byCountry).filter(c => byCountry[c].length <  PAGE_MIN);
    const groups = {};
    own.forEach(c => groups[c] = byCountry[c]);
    const order = own.sort((a, b) =>
      a === 'BRA' ? -1 : b === 'BRA' ? 1 : groups[b].length - groups[a].length || a.localeCompare(b));
    if (rest.length) {
      groups.__resto = rest
        .sort((a, b) => (CTRY_NAME[a] || a).localeCompare(CTRY_NAME[b] || b))
        .flatMap(c => byCountry[c]);
      order.push('__resto');
    }

    /* The album was printed in several languages, and every old one prints
       the country's name in all of them across the header band. */
    const LANGS = {
      BRA:'Brazil · Brasilien · Brésil · Brasile', ARG:'Argentina · Argentinien · Argentine',
      ITA:'Italy · Italien · Italie · Italia',     GER:'Germany · Deutschland · Allemagne',
      ENG:'England · Angleterre · Inghilterra',    FRA:'France · Frankreich · Francia',
      ESP:'Spain · Spanien · Espagne · Spagna',    POR:'Portugal · Portogallo',
      NED:'Holland · Niederlande · Pays-Bas',      URU:'Uruguay · Uruguai',
    };
    const total = PL.length;

    return `
    <div class="pg" style="gap:8px;">
      ${topbar('Meu álbum')}
      <div class="alb-head">
        <div class="display" style="font-size:26px;">${album.size}<span class="muted" style="font-size:16px;"> / ${total}</span></div>
        <div class="small muted">${albumPct()}% colado</div>
      </div>
      <div class="alb-bar"><i style="width:${albumPct()}%"></i></div>
      ${album.size ? `<div class="alb-hint">${ICON.book('currentColor', 10)}
        Toque em uma figurinha para ver o verso</div>` : ''}
      ${album.size === 0 ? `<div style="display:flex;align-items:center;gap:12px;
        background:var(--pocket);border:1px solid var(--rule-2);border-radius:11px;padding:11px 13px;margin-top:6px;">
        <span style="width:44px;flex:none;">${ART.ball(44)}</span>
        <span class="small muted">Cada resposta certa cola uma figurinha aqui.
          As páginas começam vazias — é você que enche.</span></div>` : ''}
      <div class="scroll-y" style="flex:1;margin-top:2px;">
        ${order.map((ctry, pageNo) => {
          const got = groups[ctry].filter(g => album.has(g.p.id)).length;
          const isRest = ctry === '__resto';
          return `
          <div class="alb-sec">
            <span class="crest-box" style="width:34px;">${isRest
              ? `<span class="alb-globe">${ICON.ball('currentColor', 21)}</span>`
              : flagSVG(ctry, 22)}</span>
            <span style="min-width:0;">
              <span class="t">${isRest ? 'RESTO DO MUNDO' : (CTRY_NAME[ctry] || ctry).toUpperCase()}</span>
              <span class="langs">${isRest
                ? 'Rest of the world · Rest der Welt · Reste du monde'
                : (LANGS[ctry] || '')}</span>
            </span>
            <span class="alb-sec-end">
              <span class="cnt">${got}/${groups[ctry].length}</span>
              <span class="alb-ring" style="--p:${Math.round(got / groups[ctry].length * 100)}">
                <span class="alb-ring-n">${Math.round(got / groups[ctry].length * 100)}<i>%</i></span>
              </span>
            </span>
          </div>
          <div class="alb-grid">
            ${groups[ctry].map(({ p, n }) => {
              const got = album.has(p.id);
              return `<div class="alb-slot${got ? ' alb-turn' : ' empty'}${
                runNewIds.includes(p.id) ? ' alb-fresh' : ''}"${
                got ? ` data-fig="${p.id}" role="button" tabindex="0"
                       aria-label="${p.n} — toque para virar a figurinha"` : ''}>
                <span class="alb-n">${String(n).padStart(3, '0')}</span>
                ${got
                  ? `<span class="flip"><span class="flip-in">
                       <span class="flip-face flip-front">${figurinha(p, 'lg', {
                         sub: (p.clubs && p.clubs[0]) ? clubName(p.clubs[0]) : POS_NAME[p.pos] })}</span>
                       <span class="flip-face flip-back">${figurinhaBack(p, n)}</span>
                     </span></span>`
                  : `<span class="ph" aria-hidden="true">?</span><span class="nm">a colar</span>`}
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
        <div class="alb-foot"><span>Futebol Quiz BR</span><span>${album.size} de ${total}</span></div>
      </div>
    </div>`;
  }

  /* ── Medals ── */
  if (sc === 'medals') {
    const got = new Set(earnedMedals().map(m => m.id));
    return `
    <div class="pg" style="gap:10px;">
      ${topbar(`Figurinhas especiais · ${got.size}/${MEDALS.length}`)}
      <div class="scroll-y" style="display:flex;flex-direction:column;gap:7px;flex:1;">
        ${MEDALS.map(m => {
          const on = got.has(m.id);
          /* A locked medal used to show only its target. How far along you
             are is the part worth knowing — "58 de 108" is a reason to play
             one more round; "colecione 108 figurinhas" is a wall. */
          let bar = '';
          if (!on && m.p) {
            try {
              const [have, need] = m.p(stats);
              const pct = Math.max(0, Math.min(100, Math.round(have / need * 100)));
              bar = `<div class="medal-prog"><i style="width:${pct}%"></i></div>
                     <div class="medal-num">${have} / ${need}</div>`;
            } catch (e) { bar = ''; }
          }
          return `<div class="medal ${on ? 'medal-on' : 'medal-off'}">
            <span class="ic">${(ICON[m.ic] || ICON.medal)('currentColor', 17)}</span>
            <div style="flex:1;min-width:0;">
              <div class="t">${m.n}</div>
              <div class="d">${m.d}</div>
              ${bar}
            </div>
            ${on ? ICON.check('var(--good)', 14) : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  /* ── Credits ── */
  if (sc === 'credits') {
    const pairs = {};
    Object.values(typeof CREDITS !== 'undefined' ? CREDITS : {}).forEach(c => {
      const k = (c.a || 'Desconhecido') + '||' + (c.l || '?');
      pairs[k] = (pairs[k] || 0) + 1;
    });
    const rows = Object.keys(pairs).sort().map(k => {
      const [a, l] = k.split('||');
      return `<div class="credit-row"><span style="flex:1;color:var(--ink-2);line-height:1.35;">${a}</span>
        <span class="l">${l}</span></div>`;
    }).join('');

    /* Every photo currently carries a credit, so this renders nothing. It
       stays as a guard: if a future photo lands without one, saying so beats
       an attribution list that quietly looks complete. */
    const unsourced = PL.filter(p => p.img && !CREDITS[p.img]).map(p => p.n);
    return `
    <div class="pg" style="gap:10px;">
      ${topbar('Créditos das imagens')}
      <p class="small muted" style="font-size:11px;">
        As fotos vêm da <b style="color:var(--ink);">Wikimedia Commons</b> e são usadas sob
        licenças livres (CC / domínio público), impressas aqui em serigrafia.
        Obrigado a cada autor listado abaixo.<br><br>
        Escudos dos clubes são marcas registradas de seus respectivos clubes, exibidos
        apenas para identificação dentro do quiz. Todos são o escudo oficial de
        cada clube; seis deles — Vasco, Corinthians, Náutico, Paysandu, Sport e
        Bragantino — não têm versão sob licença livre em lugar nenhum, e estão
        aqui só para identificar o clube.
      </p>
      <div class="scroll-y" style="flex:1;background:var(--pocket);border:1px solid var(--rule-2);
        border-radius:11px;padding:8px 12px;max-height:${unsourced.length ? 262 : 330}px;">${
        rows || '<span class="small muted">—</span>'}</div>
      ${unsourced.length ? `<div class="note">
        <div style="font-weight:800;color:var(--brass);margin-bottom:2px;">Fonte ainda não registrada</div>
        <div class="muted">${unsourced.join(', ')} — estamos rastreando a autoria dessas fotos.
          Se você é o autor, escreva para tiagor.reis@gmail.com.</div>
      </div>` : ''}
      <p class="small muted" style="font-size:9.5px;text-align:center;">Detalhes completos: commons.wikimedia.org</p>
    </div>`;
  }

  /* ── Treino: fixed-length rounds, nothing at stake ── */
  if (sc === 'difficulty') return `
  <div class="pg" style="gap:10px;">
    ${topbar('Treino · escolha a dificuldade')}
    <div style="display:flex;flex-direction:column;gap:9px;flex:1;justify-content:center;">
      ${DIFFS.map(d => `
      <div class="dc dc-${d.key}" data-key="${d.key}" data-n="${d.n}">
        <span class="ic">${(ICON[d.ic] || ICON.star)('currentColor', 18)}</span>
        <div style="flex:1;min-width:0;">
          <div class="t">${d.label}</div>
          <div class="d">${d.desc}</div>
        </div>
        <div class="n num">${d.n}<small>perguntas</small>
          ${scores[d.key] !== undefined
            ? `<small style="color:${d.col};text-transform:none;letter-spacing:.02em;">recorde ${scores[d.key]} pts</small>` : ''}
        </div>
      </div>`).join('')}
    </div>
    <p class="small muted" style="font-size:10px;text-align:center;">Rodadas de treino: sem degraus, sem prêmio, só pontos</p>
  </div>`;

  /* ── How a ladder run ends ───────────────────────────────────
     Three different endings, and they should not look alike. Walking
     away with money is a win and gets the brass; falling to a
     checkpoint still pays, but quietly; going out with nothing is
     stated plainly rather than dressed up. */
  if (sc === 'end' && isMil) {
    const won     = banked >= LADDER[LADDER.length - 1].v;
    const cleared = rung;
    const tone    = won ? 'brass' : banked > 0 ? 'good' : 'bad';
    const head    = won     ? 'Um milhão!'
                  : cashed  ? 'Você parou a tempo'
                  : banked  ? 'Caiu, mas levou'
                  :           'Fim de jogo';
    const sub     = won
      ? 'Dezesseis perguntas, dezesseis acertos. Não dá pra ir mais longe.'
      : cashed
      ? 'Saiu com o dinheiro na mão — decisão de quem sabe a hora.'
      : banked
      ? `Errou a pergunta de ${money(LADDER[Math.min(rung, LADDER.length - 1)].v)} — o degrau garantido segurou.`
      : 'Escorregou antes do primeiro degrau garantido. Da próxima, considere parar.';

    return `
    <div class="pg pg-center scroll-y" style="padding:26px 22px;gap:9px;">
      <div class="eyebrow">Rumo ao Milhão · degrau ${cleared}/${LADDER.length}</div>
      ${banked > 0 ? `<div style="margin:2px 0 -2px;">${ART.trophy(58)}</div>` : ''}
      <div class="display ${tone}" style="font-size:30px;"><em>${head}</em></div>
      <div id="endcash" class="display prize-pop ${banked > 0 ? 'brass' : 'muted'}"
        data-to="${banked}"
        style="font-size:${banked >= 100000 ? 44 : 52}px;letter-spacing:-.03em;">${money(banked)}</div>
      <p class="small muted" style="max-width:290px;font-size:12px;">${sub}</p>

      <div class="rail" style="width:100%;max-width:300px;margin:6px 0;">
        ${LADDER.map((step, i) => `<span class="notch${i < rung ? ' notch-done' : ''}${step.safe ? ' notch-safe' : ''}"></span>`).join('')}
      </div>

      <div class="stats">
        <div><div class="v num">${nCorrect}</div><div class="k">Acertos</div></div>
        <div><div class="v num">${pts}</div><div class="k">Pontos</div></div>
        <div><div class="v num brass">${money(Math.max(milBest(), banked))}</div><div class="k">Recorde</div></div>
      </div>

      ${newStickerStrip()}
      ${medalChips()}

      <div class="foot-row" style="margin-top:12px;">
        <button id="bshare"  class="btn btn-ghost btn-sm">Compartilhar</button>
        <button id="bmilrep" class="btn btn-brass">De novo</button>
        <button id="bhome"   class="btn btn-ghost btn-sm">Início</button>
      </div>
    </div>`;
  }

  /* ── End of a round ── */
  if (sc === 'end') {
    const total = cat.qs.length;
    const pct = Math.round(nCorrect / total * 100);
    const msg = pct >= 80 ? 'Craque!' : pct >= 50 ? 'Boa jogada!' : 'Treina mais!';
    const isRecord = scores[diffKey] !== undefined && pts === scores[diffKey] && pts > 0;
    const curDiff  = DIFFS.find(d => d.key === diffKey);
    return `
    <div class="pg pg-center" style="padding:28px 24px;gap:10px;">
      <span class="chip chip-soft" style="color:${curDiff.col};">
        ${isSurv ? `${ICON.shield('currentColor', 11)} Mata-mata · ${nCorrect} ${nCorrect === 1 ? 'acerto' : 'acertos'} seguidos`
                 : `${(ICON[curDiff.ic] || ICON.star)('currentColor', 11)} ${curDiff.label} · ${total} perguntas`}</span>
      ${pct >= 80 ? `<div style="margin:2px 0 -4px;">${ART.trophy(52)}</div>` : ''}
      <div class="display" style="font-size:34px;margin-top:6px;"><em>${msg}</em></div>
      <div id="endpts" class="display num" style="font-size:64px;line-height:1;font-weight:600;"
        data-to="${pts}">${pts}</div>
      <div class="small muted">pontos · ${nCorrect}/${total} acertos (${pct}%)</div>
      ${bestStreak >= 3 ? `<div class="small" style="display:flex;gap:4px;align-items:center;color:var(--brass);font-weight:700;">
        ${ICON.flame('currentColor', 12)} melhor sequência: ${bestStreak}</div>` : ''}
      <div class="bar"><i style="width:${pct}%;"></i></div>
      ${isRecord ? `<span class="chip chip-brass">${ICON.star('currentColor', 11)} Novo recorde</span>` : ''}
      ${medalChips()}
      ${newStickerStrip()}
      <div style="margin-top:6px;">${runlogEl()}</div>
      <div class="foot-row" style="margin-top:12px;">
        <button id="bshare" class="btn btn-ghost btn-sm">Compartilhar</button>
        <button id="brep"   class="btn btn-primary">Jogar de novo</button>
        <button id="bdiff"  class="btn btn-ghost btn-sm">Mudar dificuldade</button>
      </div>
    </div>`;
  }

  /* ── Quiz / Reveal ── */
  const q    = cat.qs[qi];
  const qcat = q._cat || cat;
  const tpct = (tLeft / tMax) * 100;
  const tcls = tLeft <= 5 ? 't-bad' : tLeft <= 10 ? 't-warn' : isMil ? 't-brass' : '';
  const armed = sc === 'quiz';

  const art = questionArt(q);

  const scoreChanged = pts !== prevPts;

  /* the rail: sixteen notches, one per rung, checkpoints picked out */
  const prizeRail = !isMil ? '' : `
    <div class="rail">${LADDER.map((step, i) => `<span class="notch${
      i < rung ? ' notch-done' : ''}${step.safe ? ' notch-safe' : ''}${i === rung ? ' notch-now' : ''}"></span>`).join('')}</div>`;

  /* what this question is worth, and what you keep if it goes wrong */
  const stakes = !isMil ? '' : `
    <div class="stakes">
      <div style="min-width:0;">
        <div class="eyebrow">Pergunta ${rung + 1} de ${LADDER.length}${isFinal() ? ' · a última' : ''}</div>
        <div class="stakes-v prize-pop">${money(RUNG().v)}</div>
      </div>
      <button id="bladder" class="safe-box">
        <div>
          <div class="k">Garantido</div>
          <div class="v num ${safetyNet() ? 'good' : 'muted'}">${safetyNet() ? money(safetyNet()) : '—'}</div>
        </div>
        ${ICON.ladder('var(--ink-3)', 14)}
      </button>
    </div>`;

  const expertBox = !(expert && armed) ? '' : `
    <div class="expert-box">
      ${ICON.mic('var(--brass)', 15)}
      <p><em>${expert.line}</em> <b>${expert.name}</b>${expert.sure ? '' : ' <em>— mas é chute, hein.</em>'}</p>
    </div>`;

  /* Five different things to spend, and they used to look like five identical
     grey pills. Each carries its own colour now — the same colour the game
     already uses for what it does: the cut is the red of a wrong answer, the
     freeze is the cold of the clock running out, the skip is the pitch green
     of moving on. The tint only shows while the lifeline is still yours. */
  const ajudas = [
    ['bhalf',   'Cortar',    ICON.cut,   lifes.half && cutCount() >= 1, 'cut'],
    ['bpoll',   'Placar',    ICON.crowd, lifes.poll,                    'poll'],
    ['bexpert', 'Convidado', ICON.mic,   lifes.expert,                  'mic'],
    ['bfreeze', 'Congelar',  ICON.snow,  lifes.freeze,                  'snow'],
    ['bskip',   'Pular',     ICON.skip,  lifes.skip,                    'skip'],
  ];

  const progress = isMil ? '' : `
    <div style="display:flex;align-items:center;gap:3px;max-width:104px;flex-wrap:wrap;justify-content:flex-end;">
      ${cat.qs.length <= 20 ? cat.qs.map((_, i) => {
          const cls = i < runLog.length ? (runLog[i] === 3 ? 'pdot pdot-on'
                    : runLog[i] === 0 ? 'pdot pdot-miss' : 'pdot pdot-on')
                    : (i === qi ? 'pdot pdot-cur' : 'pdot');
          return `<span class="${cls}"></span>`;
        }).join('')
      : `<span class="small muted num">${qi + 1}/${cat.qs.length}</span>`}
    </div>`;

  return `
  <div class="pg qz-screen${introOn ? ' intro' : ''}${justCut ? ' cut-now' : ''}" style="padding:13px;gap:9px;position:relative;">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="display:flex;align-items:center;gap:7px;min-width:0;">
        <button id="bexit" class="btn btn-ghost btn-icon" aria-label="Sair">${ICON.close('currentColor', 12)}</button>
        <span class="chip">${catIcon(qcat)}<span>${qcat.name}</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        ${streak > 1 ? `<span class="chip chip-brass streak-chip${
          introOn ? ' streak-up' : ''}" style="padding:2px 8px;">${
          ICON.flame('currentColor', 11)}${streak}x</span>` : ''}
        ${progress}
        ${isMil
          ? `<div class="clock ${tLeft <= 5 ? 'timer-low' : ''}">${ICON.clock('currentColor', 13)}
               <span id="clock-n" class="v num">${tLeft}</span></div>`
          : `<div id="score-disp" class="score ${scoreChanged ? 'score-up' : ''}">${
               sc === 'reveal' && lastGain > 0 ? `<span class="gain">+${lastGain}</span>` : ''}
               <span class="v num">${pts}</span><span class="u">pts</span></div>`}
      </div>
    </div>

    ${prizeRail}
    ${stakes}

    <div class="timer"><i id="tf" class="${tcls}${tLeft <= 5 ? ' timer-low' : ''}" style="width:${tpct}%;"></i></div>

    ${q.reveal ? `
    <div style="display:flex;justify-content:center;padding:2px 0 2px;">
      <div class="reveal-box print">
        <img id="revimg" src="${q.reveal}" alt="" aria-hidden="true"
          style="filter:blur(${sc === 'reveal' ? 0 : (20 * (tLeft / tMax)).toFixed(1)}px);
            transform:scale(1.08);transition:filter .9s linear;" />
      </div>
    </div>` : ''}

    <div class="qcard${isMil ? ' qcard-brass' : ''}">
      ${art}
      <p>${q.t}</p>
    </div>

    ${expertBox}

    <div class="board ${isTextQ(q)
        ? 'board-2' + (disp.length > 6 ? ' board-2-tight' : '')
        : disp.length <= 4 ? 'board-big' : 'board-5'}">
      ${disp.map((c, i) => badge(c, i)).join('')}
    </div>

    ${armed ? `
    <div class="foot">
      <div class="ajudas">
        ${ajudas.map(([id, lbl, ic, on, kind]) => `
          <button id="${id}" ${on ? '' : 'disabled'} class="ajuda aj-${kind}${
            on ? '' : ' aj-spent'}${firedAid === id ? ' aj-firing' : ''}">
            <span class="aj-disc">${ic('currentColor', 15)}</span>
            <span class="aj-lbl">${lbl}</span></button>`).join('')}
      </div>
      ${frozen ? `<div class="small pitch" style="font-weight:700;display:flex;align-items:center;gap:4px;">
        ${ICON.snow('currentColor', 11)} Relógio parado nesta pergunta</div>` : ''}
      <p class="footer-hint">
        ${q.type === 'txt'
          ? (q.a.length > 1 ? `Marque as ${q.a.length} respostas certas` : 'Marque a resposta certa')
          : q.type === 'player'
          ? (q.a.length > 1 ? `Marque os ${q.a.length} jogadores certos` : 'Marque o jogador certo')
          : (q.a.length > 1 ? `Marque os ${q.a.length} times certos`     : 'Marque o time certo')}</p>
      <div class="foot-row">
        <button id="bconf" ${sel.size ? '' : 'disabled'} class="btn ${isMil ? 'btn-brass' : 'btn-primary'} btn-lg${sel.size ? ' is-armed' : ''}">
          ${sel.size && q.type === 'player' ? 'Colar figurinha' : 'Confirmar'}</button>
        ${isMil && rung > 0 ? `
        <button id="bstop" class="btn btn-ghost btn-sm">${ICON.stop('currentColor', 13)} Parar · ${money(LADDER[rung - 1].v)}</button>` : ''}
      </div>
    </div>`
    : sc === 'ask' ? `
    <div class="pg-center" style="display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:4px;">
      <div class="display brass" style="font-size:22px;text-align:center;"><em>Essa é a sua resposta final?</em></div>
      <p class="small muted" style="text-align:center;max-width:300px;">
        Está valendo <b class="brass">${money(RUNG().v)}</b>. Se errar, você sai com ${money(safetyNet())}.</p>
      <div class="foot-row">
        <button id="bfinal"  class="btn btn-brass">É essa</button>
        <button id="bunlock" class="btn btn-ghost btn-sm">Deixa eu pensar</button>
      </div>
    </div>`
    : sc === 'lock' ? `
    <div class="settling">
      <span class="settle-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="small muted">${isMil ? money(RUNG().v) + ' na mesa…' : ''}</span>
    </div>`
    : `<div style="text-align:center;padding:4px 0;" id="rvl"></div>`}

    ${(sc === 'ask' || sc === 'lock') ? '<div class="stage-dark"></div>' : ''}
    ${ladderOpen ? ladderOverlay() : ''}
  </div>`;
}

/* ── The full ladder, as a sheet over the board ──────────────────
   Opening it stops the clock: checking where you stand is not
   something the player should have to pay for in seconds. */
function ladderOverlay() {
  return `
  <div class="sheet">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="eyebrow" style="color:var(--brass);">A escada do milhão</span>
      <button id="bladderclose" class="btn btn-ghost btn-icon" aria-label="Fechar">${ICON.close('currentColor', 13)}</button>
    </div>
    <div class="scroll-y" style="flex:1;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;">
      ${LADDER.map((step, i) => {
        const state = i < rung ? 'rung-done' : i === rung ? 'rung-now' : step.safe ? 'rung-safe' : '';
        const top = i === LADDER.length - 1 ? ' rung-top' : '';
        return `<div class="rung ${state}${top}">
          <span class="rung-n">${i + 1}</span>
          ${step.safe ? ICON.shield(i < rung ? 'var(--good)' : 'var(--ink-4)', 11) : '<span style="width:11px;"></span>'}
          <span style="flex:1;">${money(step.v)}</span>
          ${i < rung ? ICON.check('var(--good)', 12) : ''}
        </div>`;
      }).join('')}
    </div>
    <p class="small muted" style="font-size:10px;text-align:center;">
      ${ICON.shield('var(--ink-3)', 10)} são os degraus garantidos —
      passou de um, esse dinheiro é seu aconteça o que acontecer.</p>
  </div>`;
}

/* ── A shower of paper, only for the million ── */
function burst(n) {
  const cols = ['var(--brass)', 'var(--pitch)', 'var(--ink)', 'var(--pocket)'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = cols[(Math.random() * cols.length) | 0];
    d.style.setProperty('--dx', ((Math.random() * 160) - 80).toFixed(0) + 'px');
    d.style.setProperty('--rot', ((Math.random() * 900) + 360).toFixed(0) + 'deg');
    d.style.animationDuration = (2.2 + Math.random() * 1.5).toFixed(2) + 's';
    d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    frag.appendChild(d);
  }
  document.body.appendChild(frag);
  setTimeout(() => document.querySelectorAll('.conf').forEach(e => e.remove()), 4500);
}

/* ═══════════════════════════════════════════════════
   RENDER + EVENT BINDING
═══════════════════════════════════════════════════ */
/* Every tap on a tile re-renders the whole screen, which replayed the board's
   deal-in and the question card's entrance from the top — the board reshuffled
   itself visually each time you changed your mind. The entrances belong to a
   new question, not to a repaint, so they run only when the question changed. */
let _qKey = null;
let introOn = true;
let justCut = false;
let firedAid = null;   // the lifeline spent on this render, so it can flare once
let gameN   = 0;   // bumped when a run starts, so two runs' question 0 differ

function go() {
  /* Only the board itself gets an entrance, and only when the question under
     it changed. Locking in an answer (ask/lock) and the reveal are the same
     question still on screen — re-dealing the tiles there would undo the very
     thing the lock screen is doing. gameN separates two runs that both open on
     question zero. */
  const qk = `${gameN}:${qi}`;
  introOn = sc === 'quiz' && qk !== _qKey;
  if (sc === 'quiz') _qKey = qk;

  prevPts = pts; // snapshot before render (score-up only fires once)
  document.getElementById('ct').innerHTML = html();
  prevPts = pts; // prevent re-fire on subsequent re-renders without score change

  justCut = false;   // consumed by the render above
  firedAid = null;

  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);

  /* ── home ── */
  on('mil-btn',     () => { snd.rung();   startMilhao(); });
  on('cta-btn',     () => { snd.swipe();  sc = 'difficulty'; go(); });
  on('daily-btn',   () => { snd.select(); startDaily(); });
  on('surv-btn',    () => { snd.select(); startSurvival(); });
  on('bcred',       () => { snd.swipe();  sc = 'credits'; go(); });
  on('bmed',        () => { snd.swipe();  sc = 'medals';  go(); });
  on('balb',        () => { snd.swipe();  sc = 'album';   go(); });

  /* ── Turning a figurinha over in the album ──
     Bound once on the page, not per card — there can be two hundred of them —
     and it toggles a class on the element rather than re-rendering, because a
     re-render would put every card face-up again mid-turn. */
  if (sc === 'album') {
    const turn = el => {
      const slot = el.closest && el.closest('.alb-turn');
      if (!slot) return;
      slot.classList.toggle('turned');
      snd.swipe();
    };
    const grid = document.querySelector('.scroll-y');
    if (grid) {
      grid.addEventListener('click', e => turn(e.target));
      grid.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turn(e.target); }
      });
    }
  }
  on('medal-strip', () => { snd.swipe();  sc = 'medals';  go(); });
  on('bmute',       () => { setMuted(!muted); snd.tap(); go(); });

  if (sc === 'end' && !window._celebrated) {
    // paper falls for the million and nothing else: the album is calm
    if (isMil && banked >= LADDER[LADDER.length - 1].v) { window._celebrated = true; burst(48); }
  }
  if (sc !== 'end') window._celebrated = false;

  /* ── run controls ── */
  on('bshare',  () => { snd.tap(); doShare(); });
  on('bhome',   () => { snd.swipe(); clearInterval(tmr); sc = 'home'; go(); });
  on('bexit',   () => { snd.swipe(); clearInterval(tmr); sc = isMil ? 'home' : 'difficulty'; go(); });
  on('bconf',   confirmAnswer);
  on('bfinal',  lockIn);
  on('bunlock', unlockAnswer);
  on('brep',    () => { snd.swipe(); startGame(); });
  on('bmilrep', () => { snd.rung();  startMilhao(); });
  on('bdiff',   () => { snd.swipe(); sc = 'difficulty'; go(); });
  on('bstop',   cashOut);

  /* ── the ajuda cards ── */
  on('bhalf',   useHalf);
  on('bpoll',   usePoll);
  on('bexpert', useExpert);
  on('bfreeze', useFreeze);
  on('bskip',   useSkip);

  /* ── the ladder sheet (opening it holds the clock) ── */
  on('bladder',      () => { ladderOpen = true;  snd.swipe(); go(); });
  on('bladderclose', () => { ladderOpen = false; snd.swipe(); go(); });

  document.querySelectorAll('.dc').forEach(d => d.addEventListener('click', () => {
    diffKey = d.dataset.key;
    numQs   = parseInt(d.dataset.n);
    snd.select();
    startGame();
  }));

  document.querySelectorAll('.b').forEach(b => b.addEventListener('click', () => {
    if (sc !== 'quiz') return;
    snd.tap();
    const id = b.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    go();
  }));

  if (sc === 'reveal') {
    const rv = document.getElementById('rvl');
    if (rv && lastMsg) rv.innerHTML = lastMsg;
  }

  /* The final number is the one thing the whole run was for, and it simply
     appeared. It counts up instead — fast, under a second, easing out so the
     last few tick slowly. Reduced motion gets the number, not the climb.
     Two of these: points on a training round, reais on the ladder. */
  const endN = document.getElementById('endpts') || document.getElementById('endcash');
  if (endN && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const asMoney = endN.id === 'endcash';
    const show = v => endN.textContent = asMoney ? money(v) : String(v);
    const to = parseInt(endN.dataset.to, 10) || 0;
    if (to > 0) {
      /* the ladder's number is bigger and the moment is bigger, so it takes
         a little longer to arrive */
      const dur = asMoney ? 1250 : 900, t0 = performance.now();
      show(0);
      /* The true score must land whatever happens. requestAnimationFrame stops
         when the tab is backgrounded, so a player who looks away mid-count
         would come back to a number that is not their score. This timer is the
         guarantee; the animation is only the nice part. */
      const land = setTimeout(() => show(to), dur + 120);
      const tick = now => {
        /* clamped at both ends: a rAF callback can carry a timestamp from
           before the one performance.now() handed back, and an unclamped k
           then runs the easing backwards into negative numbers. */
        const k = Math.max(0, Math.min(1, (now - t0) / dur));
        show(Math.round(to * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(tick);
        else clearTimeout(land);
      };
      requestAnimationFrame(tick);
    }
  }
}

/* ═══════════════════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════════════════ */
function startGame() {
  isDaily = false; isSurv = false; isMil = false; _seed = null;
  cat = buildGame(diffKey);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = []; runNew = 0; runNewIds = []; gameN++;
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* ── The "resposta final?" beat ────────────────────────────────
   Confirming does not reveal straight away. The clock stops, the board
   dims to the tiles you picked, and the answer hangs there for a moment
   that gets longer the more money is on the line. From R$ 75.000 up the
   host asks out loud first, and you can still take it back. */
const ASK_FROM_RUNG = 9;

function confirmAnswer() {
  if (sel.size === 0 || sc !== 'quiz') return;
  if (isMil && rung >= ASK_FROM_RUNG) {
    clearInterval(tmr);
    sc = 'ask';
    snd.lock();
    go();
    return;
  }
  lockIn();
}

function unlockAnswer() {          // "deixa eu pensar" — back to the board
  if (sc !== 'ask') return;
  sc = 'quiz';
  snd.swipe();
  startTmr();
  go();
}

function lockIn() {
  clearInterval(tmr);
  sc = 'lock';
  snd.lock();
  go();

  const hold = isMil ? Math.min(2600, 900 + rung * 120) : 700;
  let beats = 0;
  const pulse = setInterval(() => {
    if (++beats > 6 || sc !== 'lock') { clearInterval(pulse); return; }
    snd.heartbeat();
  }, Math.max(260, hold / 5));

  setTimeout(() => { clearInterval(pulse); if (sc === 'lock') doReveal(); }, hold);
}

function doReveal() {
  clearInterval(tmr);
  sc = 'reveal';

  const q     = cat.qs[qi];
  const rs    = new Set(q.a);
  const sa    = [...sel];
  const wrong = sa.filter(id => !rs.has(id)).length;
  const right = sa.filter(id =>  rs.has(id)).length;
  const p     = wrong === 0 && right === rs.size ? 3
              : wrong === 0 && right > 0          ? 1
              :                                     0;

  prevPts = pts;
  if (p === 3) streak++; else streak = 0;
  bestStreak = Math.max(bestStreak, streak);

  /* Getting it right sticks the figurinha in the album for good. */
  const gotNew = (p === 3 && q.type === 'player') ? collect(q.a) : [];
  runNew += gotNew.length;
  runNewIds.push(...gotNew);

  const { gained, mult, speed } = scoreAnswer(p);
  pts += gained;
  lastGain = gained;
  if (p === 3) nCorrect++; else if (p === 1) nPartial++;
  runLog.push(p);

  if (isMil) {
    if      (p === 3 && isFinal()) snd.fanfare();
    else if (p === 3)              snd.rung();
    else                           snd.drop();
    /* Settle the money now, while we know the answer. The pause that
       follows is only there for the drama — nothing about the outcome
       should depend on a timer firing. */
    if (p !== 3)          banked = safetyNet();
    else if (isFinal())   { banked = LADDER[LADDER.length - 1].v; cashed = true; }
  } else if (p === 3) snd.correct();
  else if (p === 1)   snd.almost();
  else                snd.wrong();

  const chip = (ic, txt) => `<span class="bonus">${ic}${txt}</span>`;
  const bonuses = (speed ? chip(ICON.bolt('var(--pitch)', 10), 'rápido +' + speed) : '')
                + (mult > 1 ? chip(ICON.flame('var(--brass)', 10), 'combo ×' + mult) : '')
                + (DCFG().pmul > 1 ? chip((ICON[DCFG().ic] || ICON.star)(DCFG().col, 10), '×' + DCFG().pmul) : '');

  const rightNames = q.a.map(id => {
    const pool = q.type === 'player' ? PL : CL;
    const hit = pool.find(x => x.id === id);
    return hit ? hit.n : id;
  }).join(', ');

  /* Turn the answer over: one card when there is a single answer, and
     nothing at all on multi-answer questions, where five cards would
     bury the board. */
  const isPl  = q.type === 'player';
  const backs = q.a.length === 1
    ? (() => { const it = (isPl ? PL : CL).find(x => x.id === q.a[0]);
               return it ? stickerBack(it, isPl, gotNew.includes(it.id)) : ''; })()
    : '';

  if (isMil) {
    /* On the ladder there is no half credit: you either climb or you fall. */
    lastMsg = p === 3
      ? `<span class="display good" style="font-size:18px;">${ICON.check('currentColor', 14)} ${
          isFinal() ? 'É o milhão!' : 'Colada! ' + money(RUNG().v)}</span>`
        + (isFinal() ? '' : `<div class="small muted" style="margin-top:3px;">Próximo degrau: ${money(LADDER[rung + 1].v)}</div>`) + backs
      : `<span class="display bad" style="font-size:18px;">${ICON.cross('currentColor', 14)} Essa não era…</span>
         <div class="small muted" style="margin-top:3px;">Era <b class="good">${rightNames}</b>
          · você leva ${money(safetyNet())}</div>` + backs;
  } else {
    lastMsg = (p === 3
      ? `<span class="display good" style="font-size:17px;">${ICON.check('currentColor', 13)} Colada! +${gained}</span>${bonuses}`
      : p === 1
      ? `<span class="display brass" style="font-size:17px;">Quase! +${gained}</span>${bonuses}`
      : `<span class="display bad" style="font-size:17px;">${ICON.cross('currentColor', 13)} Errou!</span>
         <div class="small muted" style="margin-top:3px;">Resposta: <b class="good">${rightNames}</b></div>`) + backs;
  }

  go();
  setTimeout(() => { advanceAfterReveal(p); go(); }, isMil ? 2600 : 2200);
}

/* What happens once the reveal has been on screen long enough: either the
   run moves to the next question or it ends. Split out of doReveal so the
   state machine can be driven without waiting on a timer. */
function advanceAfterReveal(p) {
  if (isMil) {
    if (p !== 3) {                  // fell back to the last checkpoint
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    /* `rung` counts rungs *cleared*, so it advances past the last one too —
       that is what makes the end screen read 16/16 rather than 15/16. */
    rung++;
    if (rung >= LADDER.length) {    // took the million
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    qi++;
    sel.clear(); clearHelpers(); lastMsg = '';
    sc = 'quiz'; tMax = qTime(); tLeft = tMax;
    disp = getDisp(cat.qs[qi]);
    startTmr();
    return;
  }

  if (isSurv && p !== 3) {          // survival: anything short of perfect ends it
    cat.qs = cat.qs.slice(0, qi + 1);
    finishRun();
    return;
  }
  qi++;
  sel.clear();
  clearHelpers();
  lastMsg = '';
  if (isSurv && qi >= cat.qs.length - 2) {
    const more = buildGame(rnd() > .5 ? 'moderado' : 'dificil');
    cat.qs = cat.qs.concat(more.qs);
  }
  if (qi >= cat.qs.length) {
    finishRun();
  } else {
    sc    = 'quiz';
    tMax  = qTime();
    tLeft = tMax;
    disp  = getDisp(cat.qs[qi]);
    startTmr();
  }
}


function finishRun() {
  clearInterval(tmr);
  sc = 'end';
  if (scores[diffKey] === undefined || pts > scores[diffKey]) {
    scores[diffKey] = pts;
    LS.set('scores', scores);
  }
  if (isDaily) saveDaily();
  stats.games    += 1;
  stats.correct  += nCorrect;
  stats.answered += cat.qs.length;
  stats.bestStreak = Math.max(stats.bestStreak || 0, bestStreak);
  const acc = nCorrect / Math.max(1, cat.qs.length);
  if (isMil) {
    stats.milBest  = Math.max(stats.milBest || 0, banked);
    stats.milRung  = Math.max(stats.milRung || 0, rung);
    if (banked >= LADDER[LADDER.length - 1].v) stats.million = (stats.million || 0) + 1;
    if (banked > milBest()) LS.set('milBest', banked);
  } else if (isSurv) {
    stats.survBest = Math.max(stats.survBest || 0, nCorrect);
  } else {
    if (acc === 1) stats.perfect = (stats.perfect || 0) + 1;
    if (diffKey === 'dificil' && acc >= 0.8) stats.hard80 = (stats.hard80 || 0) + 1;
  }
  LS.set('stats', stats);
  window._newMedals = newMedals();
}

function startTmr() {
  clearInterval(tmr);
  tmr = setInterval(() => {
    if (frozen || ladderOpen) return;
    tLeft = Math.max(0, tLeft - 1);
    const tf = document.getElementById('tf');
    if (tf) {
      tf.style.width = (tLeft / tMax * 100) + '%';
      tf.classList.toggle('t-warn', tLeft <= 10 && tLeft > 5);
      tf.classList.toggle('t-bad',  tLeft <= 5);
      if (tLeft <= 5) tf.classList.add('timer-low');
    }
    const cn = document.getElementById('clock-n');
    if (cn) { cn.textContent = tLeft; if (tLeft <= 5) cn.parentElement.classList.add('timer-low'); }
    const rv = document.getElementById('revimg');
    if (rv && sc === 'quiz') rv.style.filter = 'blur(' + (20 * (tLeft / tMax)).toFixed(1) + 'px)';
    if (tLeft <= 0 && sc === 'quiz') doReveal();
  }, 1000);
}

/* ── Boot ── */
go();

/* ── Service Worker registration ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(() => {}); // silently fail (e.g. file:// protocol)
  });
}
</script>

  <style>
    /* ── Reset & base ── */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0a0f0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', system-ui, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #qz {
      background: #060e08;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      color: #fff;
      min-height: 500px;
      width: 100%;
      max-width: 680px;
    }

    #grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 52px 52px;
      pointer-events: none;
      z-index: 0;
    }

    #ct { position: relative; z-index: 1; }

    /* Flex/grid children default to min-width:auto, so one wide child (a long
       author name, a club-career path) stretches the screen past the viewport
       and #qz's overflow:hidden clips everything. Opt every box out of that. */
    #ct > div { max-width: 100%; }
    #ct div, #ct p { min-width: 0; }
    #ct p, #ct span { overflow-wrap: anywhere; }

    /* ── Screen entrance ── */
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #ct > div { animation: screenIn .22s ease-out; }

    /* ── Badge: tap press ── */
    .b { touch-action: manipulation; }
    .b:active { transform: scale(0.93) !important; filter: brightness(1.2); }

    /* ── Category card hover ── */
    .cc { touch-action: manipulation; }
    .cc:hover  { transform: scale(1.03); background: rgba(255,255,255,.07) !important; }
    .cc:active { transform: scale(0.97) !important; }

    /* ── Difficulty card hover ── */
    .dc { touch-action: manipulation; }
    .dc:hover  { transform: translateY(-2px); background: rgba(255,255,255,.08) !important; }
    .dc:active { transform: scale(0.98) !important; }

    /* ── Badge animations ── */
    @keyframes badgePop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.14); }
      65%  { transform: scale(1.04); }
      100% { transform: scale(1.06); }
    }
    @keyframes correctGlow {
      0%, 100% { box-shadow: 0 0 0 3px #00e676, 0 0 20px rgba(0,230,118,.45); }
      50%       { box-shadow: 0 0 0 4px #00e676, 0 0 38px rgba(0,230,118,.8), 0 0 64px rgba(0,230,118,.25); }
    }
    @keyframes wrongShake {
      0%, 100% { transform: translateX(0) scale(1); }
      18%      { transform: translateX(-6px) scale(0.96); }
      36%      { transform: translateX(6px) scale(0.96); }
      54%      { transform: translateX(-4px); }
      72%      { transform: translateX(4px); }
      88%      { transform: translateX(-2px); }
    }
    @keyframes scoreUp {
      0%, 100% { transform: scale(1); }
      45%      { transform: scale(1.45); }
    }
    @keyframes fireBob {
      0%, 100% { transform: scale(1) rotate(0deg); }
      30%      { transform: scale(1.12) rotate(-4deg); }
      70%      { transform: scale(1.06) rotate(4deg); }
    }
    @keyframes ctaBounce {
      0%, 100% { transform: translateY(0); box-shadow: 0 4px 24px rgba(255,215,0,.25); }
      50%      { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(255,215,0,.45); }
    }
    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }

    .b-correct { animation: correctGlow 1.4s ease-in-out infinite !important; transform: scale(1.04) !important; }
    .b-wrong   { animation: wrongShake .45s ease-out !important; }
    .b-sel     { animation: badgePop .18s ease-out forwards; }

    .score-up  { animation: scoreUp .28s ease-out; }
    .fire-bob  { animation: fireBob .7s ease-in-out infinite; }

    #cta-btn   { animation: ctaBounce 2.2s ease-in-out infinite; }
    .timer-low { animation: timerPulse .55s ease-in-out infinite; }


    /* ══════════ VISUAL POLISH ══════════ */

    /* Ambient stadium glow behind everything (adds depth to the flat panel) */
    #qz::before {
      content: '';
      position: absolute;
      left: -25%; right: -25%; top: -30%;
      height: 78%;
      background: radial-gradient(ellipse at 50% 0%,
        rgba(255,215,0,.075), rgba(26,140,58,.05) 42%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }
    #qz::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0; height: 34%;
      background: linear-gradient(to top, rgba(0,0,0,.35), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* Option tiles fade in with a slight stagger */
    @keyframes tileIn {
      from { opacity: 0; transform: translateY(9px) scale(.94); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .b { animation: tileIn .3s cubic-bezier(.2,.8,.3,1) backwards; }

    /* Points that float up off the score when you gain */
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, 4px)   scale(.8); }
      18%  { opacity: 1; transform: translate(-50%, -4px)  scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -42px) scale(1); }
    }
    .gain {
      position: absolute; left: 50%; top: 0;
      font-family: 'Bebas Neue','Impact',sans-serif;
      font-size: 22px; font-weight: 900; color: #00e676;
      text-shadow: 0 2px 12px rgba(0,230,118,.6);
      pointer-events: none; z-index: 40;
      animation: floatUp 1.05s ease-out forwards;
    }

    /* Confetti for a strong finish */
    @keyframes confFall {
      0%   { opacity: 1; transform: translate3d(0,-24px,0) rotate(0deg); }
      100% { opacity: .15; transform: translate3d(var(--dx,0px), 105vh, 0) rotate(var(--rot,720deg)); }
    }
    .conf {
      position: fixed; top: -24px;
      width: 8px; height: 13px; border-radius: 2px;
      pointer-events: none; z-index: 999;
      animation: confFall linear forwards;
    }

    /* Progress dots */
    .pdot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,.16);
      transition: background .25s, transform .25s;
      flex-shrink: 0;
    }
    .pdot-on   { background: #FFD700; }
    .pdot-cur  { background: #fff; transform: scale(1.55); box-shadow: 0 0 8px rgba(255,255,255,.7); }
    .pdot-miss { background: rgba(244,67,54,.75); }

    /* Timer bar gets a moving sheen so it reads as "live" */
    @keyframes sheen { to { background-position: 240% 0; } }
    .tf-live {
      background-image: linear-gradient(100deg,
        rgba(255,255,255,0) 34%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 66%);
      background-size: 240% 100%;
      animation: sheen 1.9s linear infinite;
    }

    /* Home ball idle bounce */
    @keyframes ballIdle {
      0%,100% { transform: translateY(0) rotate(-4deg); }
      50%     { transform: translateY(-9px) rotate(4deg); }
    }
    .ball-idle { animation: ballIdle 2.8s ease-in-out infinite; display: inline-block; }

    /* Gold gradient wordmark */
    .goldgrad {
      background: linear-gradient(175deg, #FFF3B0 4%, #FFD700 42%, #E0A800 96%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 3px 18px rgba(255,215,0,.32));

    .btn-press { transition: transform .12s, box-shadow .12s, filter .12s; }
    .btn-press:active { transform: scale(.955); filter: brightness(1.08); }

    /* ── Misc ── */
    button { font-family: 'Inter', system-ui, sans-serif; }
  </style>

/* ═══════════════════════════════════════════════════
   WEB AUDIO — procedural sound effects
═══════════════════════════════════════════════════ */
let _AC = null;
function AC() {
  if (!_AC) _AC = new (window.AudioContext || window.webkitAudioContext)();
  return _AC;
}

function beep(freq, dur, type='sine', vol=0.18, freqEnd=null) {
  try {
    const ac = AC();
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + dur);
  } catch(e) {}
}

  almost()  { beep(440, .18, 'sine', .15); },
  wrong()   { beep(200, .32, 'sawtooth', .14, 90); },
  select()  { beep(660, .07, 'sine', .1, 600); },
  swipe()   { beep(300, .12, 'sine', .08, 500); },
};

/* ═══════════════════════════════════════════════════
   SMART DISTRACTOR ENGINE
   Wrong answers are scored for plausibility instead of
   being drawn at random, so harder levels really are harder.
═══════════════════════════════════════════════════ */
/* Seedable PRNG — when _seed is set the sequence is reproducible, which is
   what makes the Daily Challenge identical for every player. */
let _seed = null;
function rnd() {
  if (_seed === null) return Math.random();
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function seedFrom(n) { _seed = (n * 2654435761) | 0; }

function shuf(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* days since 2024-01-01 — the daily puzzle number */
function dayIndex(d) {
  const n = d || new Date();
  return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())
                     - Date.UTC(2024, 0, 1)) / 86400000);
}

function eraOverlap(a, b) {
  if (!a.era || !b.era) return 0;
  return Math.max(0, Math.min(a.era[1], b.era[1]) - Math.max(a.era[0], b.era[0]));
}

/* How confusable is `cand` with the correct player `ref`? 0-100 */
function simPlayer(cand, ref) {
  let sc = 0;
  if (cand.pos  === ref.pos)  sc += 38;           // same position
  if (cand.ctry === ref.ctry) sc += 22;           // same country
  sc += Math.min(26, eraOverlap(cand, ref) * 1.8); // contemporaries
  const shared = (cand.clubs || []).filter(c => (ref.clubs || []).includes(c)).length;
  sc += Math.min(14, shared * 7);                 // shared clubs
  return sc;
}

/* Confusability between clubs */
function simClub(cand, ref) {
  let sc = 0;
  if (cand.s === ref.s) sc += 42;                              // same state
  sc += Math.max(0, 22 - Math.abs((cand.f||1900) - (ref.f||1900)) / 2);
  if ((cand.lib > 0) === (ref.lib > 0)) sc += 20;              // both/neither Libertadores
  if ((cand.br  > 0) === (ref.br  > 0)) sc += 16;              // both/neither Brasileirão
  return sc;
}

function getDisp(q) {
  const isPlayer = q.type === 'player';
  const pool0 = isPlayer ? PL : CL;
  const sim   = isPlayer ? simPlayer : simClub;
  const cfg   = DCFG();
  const strict = (q.strict !== undefined) ? q.strict : cfg.strict;
  const nOpts  = q.opts || cfg.opts;

  // `fixed` = show exactly these tiles (comparison questions)
  if (q.fixed) return shuf(q.fixed.map(id => pool0.find(x => x.id === id)).filter(Boolean));

  const right = q.a.map(id => pool0.find(x => x.id === id)).filter(Boolean);

  // `pool` = explicit list of ids allowed as wrong answers
  let wrong;
  if (q.pool) {
    const allow = new Set(q.pool);
    wrong = pool0.filter(x => allow.has(x.id) && !q.a.includes(x.id));
  } else {
    const skip = new Set([...(q.excl || []), ...q.a]);
    wrong = pool0.filter(x => !skip.has(x.id));
  }

  const ref = right[0];
  if (ref && strict > 0 && wrong.length > nOpts) {
    const jitter = 14 * (1 - strict) + 6;
    wrong = wrong
      .map(x => ({ x, s: sim(x, ref) + rnd() * jitter }))
      .sort((a, b) => b.s - a.s)
      .map(o => o.x);
    const need = nOpts - right.length;
    const band = Math.max(need + 2, Math.round(wrong.length * (1 - strict * 0.72)));
    wrong = wrong.slice(0, band);
  }

  wrong = shuf(wrong);
  return shuf([...right, ...wrong.slice(0, Math.max(0, nOpts - right.length))]);
}

/* ═══════════════════════════════════════════════════
   QUESTION DIFFICULTY RATING
═══════════════════════════════════════════════════ */
const FAMOUS = new Set(['pele','messi','cr7','ronaldo','ronaldinho','neymar',
  'maradona','zidane','romario','garrincha','zico','kaka','mbappe','vinicius','gabigol']);

function qTier(q) {
  if (q.d) return q.d;                       // explicit override
  const cid = (q._cat && q._cat.id) || '';
  if (cid === 'estados')  return 1;
  if (cid === 'estadios') return 2;
  if (cid === 'lendas')   return 2;
  if (cid === 'libertadores' || cid === 'brasileirao') {
    const m = /\b(19|20)\d{2}\b/.exec(q.t);
    const y = m ? parseInt(m[0], 10) : 2000;
    return y >= 2015 ? 1 : y >= 2005 ? 2 : 3;
  }
  if (cid === 'craques') {
    return q.a.some(id => FAMOUS.has(id)) ? 2 : 3;
  }
  return 2;
}

function buildGame(key) {
  const cfg = DIFFS.find(d => d.key === key) || DIFFS[0];
  let all = CATS.flatMap(c => c.qs.map(q => ({ ...q, _cat: c })));
  if (typeof GEN_QS === 'function') all = all.concat(GEN_QS(cfg.tier));
  all.forEach(q => { q._d = qTier(q); });

  // prefer questions at the requested tier, then nearest tiers
  const scored = shuf(all).map(q => ({ q, w: -Math.abs(q._d - cfg.tier) * 10 + rnd() * 4 }));
  scored.sort((a, b) => b.w - a.w);

  // generators can emit the same wording twice (e.g. two "who was a goalkeeper?"),
  // so de-duplicate by question text before filling the round
  const seen = new Set();
  const qs = [];
  for (const o of scored) {
    if (seen.has(o.q.t)) continue;
    seen.add(o.q.t);
    qs.push(o.q);
    if (qs.length >= cfg.n) break;
  }

  return {
    id: 'mixed', name: 'Futebol Quiz BR', emoji: '⚽',
    tag: 'Perguntas misturadas', col: '#FFD700', diff: cfg.label,
    qs: shuf(qs),
  };
}


/* ═══════════════════════════════════════════════════
   QUESTION GENERATORS
   Build fresh questions from the structured data so the
   pool never runs dry and distractors are correct by design.
═══════════════════════════════════════════════════ */
function GEN_QS(tier) {
  /* GENCAT — badge shown in the quiz header for generated questions */
  const GC = {
    club:  { id:'g_club',  name:'Carreira',  emoji:'🧭', col:'#26A69A' },
    pos:   { id:'g_pos',   name:'Posição',   emoji:'🎯', col:'#7E57C2' },
    nat:   { id:'g_nat',   name:'Seleções',  emoji:'🌎', col:'#42A5F5' },
    hist:  { id:'g_hist',  name:'História',  emoji:'📚', col:'#C8A400' },
    squad: { id:'g_squad', name:'Elenco',    emoji:'👥', col:'#66BB6A' },
    era:   { id:'g_era',   name:'Época',     emoji:'⏳', col:'#FFA726' },
    photo: { id:'g_photo', name:'Foto',      emoji:'📸', col:'#EC407A' },
    path:  { id:'g_path',  name:'Caminho',   emoji:'🗺️', col:'#26C6DA' },
  };
  const out  = [];
  const CIDS = new Set(CL.map(c => c.id));
  const rndOf = a => a[Math.floor(rnd() * a.length)];
  const pick = (a, n) => shuf(a).slice(0, n);

  /* ── 1. Which Brazilian club did this player turn out for? ── */
  const withBr = PL.filter(p => (p.clubs || []).some(c => CIDS.has(c)));
  pick(withBr, 26).forEach(p => {
    const mine = (p.clubs || []).filter(c => CIDS.has(c));
    out.push({
      t: `Por qual destes clubes ${p.n} jogou?`,
      a: [rndOf(mine)],
      pool: CL.filter(c => !(p.clubs || []).includes(c.id)).map(c => c.id),
      face: p.img, _cat: GC.club,
      d: p.ctry === 'BRA' ? 2 : 3,
    });
  });

  /* ── 2. Position recognition ── */
  ['GK', 'DF', 'MF'].forEach(pos => {
    const same   = PL.filter(p => p.pos === pos);
    const others = PL.filter(p => p.pos !== pos);
    if (same.length < 2 || others.length < 9) return;
    pick(same, 4).forEach(p => {
      out.push({
        t: `Qual destes jogadores atuava como ${POS_NAME[pos].toLowerCase()}?`,
        a: [p.id], type: 'player',
        pool: others.map(x => x.id), _cat: GC.pos,
        d: pos === 'GK' ? 1 : 2,
      });
    });
  });

  /* ── 3. Nationality ── */
  const byCtry = {};
  PL.forEach(p => { (byCtry[p.ctry] = byCtry[p.ctry] || []).push(p); });
  Object.keys(byCtry).filter(c => c !== 'BRA' && byCtry[c].length >= 1).forEach(c => {
    const p = rndOf(byCtry[c]);
    out.push({
      t: `Qual destes jogadores defendeu a seleção de ${CTRY_NAME[c] || c}?`,
      _skip: !CTRY_NAME[c],
      a: [p.id], type: 'player',
      pool: PL.filter(x => x.ctry !== c).map(x => x.id), _cat: GC.nat,
      d: 2,
    });
  });

  /* ── 4. Oldest club (comparison, exact 10 tiles) ── */
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const oldest = set.reduce((a, b) => (a.f <= b.f ? a : b));
    if (set.filter(c => c.f === oldest.f).length > 1) continue;   // avoid ties
    out.push({ t: 'Qual destes clubes foi fundado primeiro?',
               a: [oldest.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 3 });
  }

  /* ── 5. Most Brasileirão titles ── */
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const top = set.reduce((a, b) => (a.br >= b.br ? a : b));
    if (top.br === 0 || set.filter(c => c.br === top.br).length > 1) continue;
    out.push({ t: 'Qual destes clubes tem mais títulos do Brasileirão?',
               a: [top.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* ── 6. Libertadores winners (multi-select) ── */
  for (let i = 0; i < 3; i++) {
    const champs = pick(CL.filter(c => c.lib > 0), 3);
    const rest   = pick(CL.filter(c => c.lib === 0), 7);
    if (champs.length < 3 || rest.length < 7) break;
    out.push({ t: 'Selecione os clubes que JÁ venceram a Libertadores',
               a: champs.map(c => c.id),
               fixed: champs.concat(rest).map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* ── 7. Team-mates: who also played for this club? ── */
  const clubPlayers = {};
  PL.forEach(p => (p.clubs || []).forEach(c => {
    if (CIDS.has(c)) (clubPlayers[c] = clubPlayers[c] || []).push(p);
  }));
  pick(Object.keys(clubPlayers).filter(c => clubPlayers[c].length >= 2), 6).forEach(c => {
    const yes = pick(clubPlayers[c], 2);
    const no  = PL.filter(p => !(p.clubs || []).includes(c));
    out.push({
      t: `Selecione os 2 jogadores que passaram pelo ${clubName(c)}`,
      a: yes.map(p => p.id), type: 'player',
      pool: no.map(p => p.id),
      crest: c, _cat: GC.squad,
      d: 3,
    });
  });

  /* ── 8. Era placement ── */
  pick(PL.filter(p => p.era && p.era[0] >= 1990), 6).forEach(p => {
    const dec = Math.floor(p.era[0] / 10) * 10;
    const others = PL.filter(x => x.era && Math.floor(x.era[0] / 10) * 10 !== dec);
    if (others.length < 9) return;
    out.push({
      t: `Qual destes jogadores começou a carreira nos anos ${dec}?`,
      a: [p.id], type: 'player',
      pool: others.map(x => x.id), _cat: GC.era,
      d: 3,
    });
  });

  /* ── 9. PHOTO REVEAL: the picture sharpens as the clock runs down ── */
  pick(PL.filter(p => p.img), 8).forEach(p => {
    const others = PL.filter(x => x.id !== p.id);
    out.push({
      t: 'Quem é este jogador? (a foto vai ficando nítida)',
      a: [p.id], type: 'player',
      reveal: p.img,
      textTiles: true,
      pool: others.map(x => x.id), _cat: GC.photo,
      d: 2,
    });
  });

  /* ── 10. CAREER PATH: guess the player from the clubs he played for ── */
  pick(PL.filter(p => (p.clubs || []).length >= 3), 8).forEach(p => {
    const path = (p.clubs || []).slice(0, 4).map(clubName).join(' → ');
    out.push({
      t: `Que jogador seguiu este caminho?\n${path}`,
      a: [p.id], type: 'player',
      textTiles: true,
      pool: PL.filter(x => x.id !== p.id).map(x => x.id), _cat: GC.path,
      d: 3,
    });
  });

  /* ═════ GEN2 — extra templates ═════ */

  /* 11. Stadium → club */
  const STIDS = Object.keys(typeof STAD !== 'undefined' ? STAD : {});
  const STAD_CLUB = { allianz:'palmeiras', neoq:'corinthians', beirario:'internacional',
    vilabelmiro:'santos', saojanua:'vasco', arena_gre:'gremio' };
  pick(STIDS.filter(k => STAD_CLUB[k]), 4).forEach(k => {
    const owner = STAD_CLUB[k];
    out.push({
      t: `Qual clube manda seus jogos no ${STAD[k].name}, em ${STAD[k].city}?`,
      a: [owner],
      pool: CL.filter(c => c.id !== owner).map(c => c.id),
      stad: k,
      _cat: GC.hist, d: 2,
    });
  });

  /* 12. Which club is from this state? */
  const byState = {};
  CL.forEach(c => { (byState[c.s] = byState[c.s] || []).push(c); });
  const ST_NAME = { RJ:'Rio de Janeiro', SP:'São Paulo', RS:'Rio Grande do Sul',
    MG:'Minas Gerais', PR:'Paraná', BA:'Bahia', CE:'Ceará', PE:'Pernambuco', SC:'Santa Catarina' };
  pick(Object.keys(byState).filter(st => ST_NAME[st] && byState[st].length >= 2), 4).forEach(st => {
    const yes = rndOf(byState[st]);
    out.push({
      t: `Qual destes clubes é de ${ST_NAME[st]}?`,
      a: [yes.id],
      pool: CL.filter(c => c.s !== st).map(c => c.id),
      _cat: GC.hist, d: 1,
    });
  });

  /* 13. Head-to-head: who played longer? */
  for (let i = 0; i < 4; i++) {
    const two = pick(PL.filter(p => p.era), 2);
    if (two.length < 2) break;
    const span = p => p.era[1] - p.era[0];
    if (span(two[0]) === span(two[1])) continue;
    const longer = span(two[0]) > span(two[1]) ? two[0] : two[1];
    out.push({
      t: 'Quem teve a carreira mais longa?',
      a: [longer.id], type: 'player',
      fixed: two.map(p => p.id),
      _cat: GC.era, d: 2,
    });
  }

  /* 14. Odd one out — nine share a trait, one doesn't */
  ['GK', 'DF', 'MF', 'FW'].forEach(pos => {
    const same = PL.filter(p => p.pos === pos);
    const other = PL.filter(p => p.pos !== pos);
    if (same.length < 9 || !other.length) return;
    const odd = rndOf(other);
    out.push({
      t: `Qual destes NÃO era ${POS_NAME[pos].toLowerCase()}?`,
      a: [odd.id], type: 'player',
      fixed: pick(same, 9).map(p => p.id).concat(odd.id),
      _cat: GC.pos, d: 2,
    });
  });

  /* 15. Which club was founded in this decade? */
  for (let i = 0; i < 3; i++) {
    const c = rndOf(CL);
    const dec = Math.floor(c.f / 10) * 10;
    const others = CL.filter(x => Math.floor(x.f / 10) * 10 !== dec);
    if (others.length < 9) continue;
    out.push({
      t: `Qual destes clubes foi fundado na década de ${dec}?`,
      a: [c.id],
      pool: others.map(x => x.id),
      _cat: GC.hist, d: 3,
    });
  }

  /* 16. Contemporaries — who played in the same era? */
  pick(PL.filter(p => p.era), 5).forEach(p => {
    const overlaps = x => x.id !== p.id &&
      Math.min(x.era[1], p.era[1]) - Math.max(x.era[0], p.era[0]) >= 5;
    const mates = PL.filter(overlaps);
    const strangers = PL.filter(x => x.id !== p.id && !overlaps(x));
    if (!mates.length || strangers.length < 9) return;
    const mate = rndOf(mates);
    out.push({
      t: `Quem jogou na mesma época que ${p.n}?`,
      a: [mate.id], type: 'player',
      fixed: pick(strangers, 9).map(x => x.id).concat(mate.id),
      face: p.img,
      _cat: GC.era, d: 3,
    });
  });

  /* 17. Most Libertadores titles among these */
  for (let i = 0; i < 3; i++) {
    const set = pick(CL, 10);
    const top = set.reduce((a, b) => (a.lib >= b.lib ? a : b));
    if (top.lib === 0 || set.filter(c => c.lib === top.lib).length > 1) continue;
    out.push({ t: 'Qual destes clubes tem mais títulos da Libertadores?',
               a: [top.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* 18. Country → multi-select */
  Object.keys(byCtry).filter(c => byCtry[c].length >= 2 && c !== 'BRA').slice(0, 4).forEach(c => {
    const yes = pick(byCtry[c], 2);
    const no = PL.filter(p => p.ctry !== c);
    if (no.length < 8) return;
    out.push({
      t: `Selecione os 2 jogadores de ${CTRY_NAME[c] || c}`,
      a: yes.map(p => p.id), type: 'player',
      fixed: yes.map(p => p.id).concat(pick(no, 8).map(p => p.id)),
      _cat: GC.nat, d: 3,
    });
  });

  // Safety net: a generator bug must never put an unanswerable question in front
  // of a player, so drop anything whose answers don't resolve.
  return out.filter(q =>
    !q._skip &&
    q.a && q.a.length &&
    q.a.every(id => (q.type === 'player' ? PL : CL).some(x => x.id === id)));
}

/* ═══════════════════════════════════════════════════
   GAME STATE
═══════════════════════════════════════════════════ */
let sc       = 'home';
let cat      = null;
let qi       = 0;
let numQs    = 10;
let diffKey  = 'facil';
let sel      = new Set();
let pts      = 0;
let prevPts  = 0;   // to detect score change for animation
let streak   = 0;
let disp     = [];
let tLeft    = 30;
let tMax     = 30;
let tmr      = null;
let lastMsg  = '';
/* ═══════════════════════════════════════════════════
   COMBO SCORING + PERSISTENCE
═══════════════════════════════════════════════════ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('fqbr_' + k);
                    return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fqbr_' + k, JSON.stringify(v)); } catch (e) {} },
};
let scores     = LS.get('scores', {});      // best points per difficulty
let stats      = LS.get('stats', { games:0, correct:0, answered:0, bestStreak:0 });
let nCorrect   = 0;   // perfect answers this run
let nPartial   = 0;
let bestStreak = 0;
let lastGain   = 0;
let runLog     = [];  // per-question 3/1/0, for the share card

/* points for one answer, with speed + combo + difficulty multipliers */
function scoreAnswer(base) {
  if (base <= 0) return { gained:0, mult:1, speed:0 };
  const frac  = tMax ? tLeft / tMax : 0;
  const speed = base === 3 ? (frac > 0.6 ? 2 : frac > 0.3 ? 1 : 0) : 0;
  const mult  = streak >= 6 ? 3 : streak >= 3 ? 2 : 1;
  return { gained: Math.round((base + speed) * mult * DCFG().pmul), mult, speed };
}


/* ═══════════════════════════════════════════════════
   DAILY CHALLENGE
   One identical 10-question run per day for everybody,
   plus a Wordle-style card that is easy to paste in WhatsApp.
═══════════════════════════════════════════════════ */
let isDaily = false;

function dailyDone() { return LS.get('dailyDay', -1) === dayIndex(); }
function dailyInfo() { return LS.get('dailyRes', null); }

function dailyStreakNow() {
  const last = LS.get('dailyDay', -1);
  const st   = LS.get('dailyStreak', 0);
  const today = dayIndex();
  if (last === today || last === today - 1) return st;
  return 0;                       // streak broken
}

function saveDaily() {
  const today = dayIndex(), last = LS.get('dailyDay', -1);
  let st = LS.get('dailyStreak', 0);
  st = (last === today - 1) ? st + 1 : (last === today ? st : 1);
  LS.set('dailyDay', today);
  LS.set('dailyStreak', st);
  LS.set('dailyRes', { pts, nCorrect, total: cat.qs.length, log: runLog, streak: st });
}

function shareText() {
  const res  = isDaily ? null : null;
  const grid = runLog.map(p => p === 3 ? '🟩' : p === 1 ? '🟨' : p === -1 ? '⬜' : '⬛').join('');
  const head = isDaily ? `Futebol Quiz BR ⚽ Desafio #${dayIndex()}`
                       : `Futebol Quiz BR ⚽ ${DCFG().label}`;
  const strk = bestStreak >= 3 ? `  🔥${bestStreak}` : '';
  return `${head}\n${grid}\n${nCorrect}/${cat.qs.length} acertos · ${pts} pts${strk}\n`
       + `https://tdosreis.github.io/futebol-quiz/`;
}

function doShare() {
  const txt = shareText();
  if (navigator.share) {
    navigator.share({ text: txt }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      const b = document.getElementById('bshare');
      if (b) { b.textContent = 'COPIADO!'; setTimeout(() => { b.textContent = 'COMPARTILHAR'; }, 1600); }
    }).catch(() => {});
  }
}

function startDaily() {
  isDaily = true; isSurv = false;
  diffKey = 'moderado';
  seedFrom(dayIndex());
  cat = buildGame('moderado');
  cat.qs = cat.qs.slice(0, 10);
  cat.name = 'Desafio Diário';
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = [];
  resetLifes();
  sc = 'quiz'; tMax = DCFG().time; tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}


/* ═══════════════════════════════════════════════════
   LIFELINES
   Three single-use helpers per run. They cost nothing but
   the speed bonus, so using one is a real trade-off.
═══════════════════════════════════════════════════ */
let lifes  = { half: 1, freeze: 1, skip: 1 };
let hidden = new Set();   // tiles removed by 50/50
let frozen = false;       // clock paused for this question

function resetLifes() {
  lifes  = { half: 1, freeze: 1, skip: 1 };
  hidden = new Set();
  frozen = false;
}

function useHalf() {
  if (!lifes.half || sc !== 'quiz') return;
  const q = cat.qs[qi];
  const wrong = disp.filter(o => !q.a.includes(o.id)).map(o => o.id);
  // remove half of the wrong options, keeping the board readable
  const drop = shuf(wrong).slice(0, Math.floor(wrong.length / 2));
  drop.forEach(id => { hidden.add(id); sel.delete(id); });
  lifes.half = 0;
  snd.select();
  go();
}

function useFreeze() {
  if (!lifes.freeze || sc !== 'quiz') return;
  lifes.freeze = 0;
  frozen = true;
  snd.select();
  go();
}

function useSkip() {
  if (!lifes.skip || sc !== 'quiz') return;
  lifes.skip = 0;
  clearInterval(tmr);
  snd.swipe();
  runLog.push(-1);                 // neither right nor wrong
  qi++;
  sel.clear(); hidden = new Set(); frozen = false; lastMsg = '';
  if (qi >= cat.qs.length) { finishRun(); }
  else {
    sc = 'quiz'; tMax = DCFG().time; tLeft = tMax;
    disp = getDisp(cat.qs[qi]);
    startTmr();
  }
  go();
}


/* ═══════════════════════════════════════════════════
   MEDALS — long-run progression
═══════════════════════════════════════════════════ */
const MEDALS = [
  { id:'first',  ic:'⚽', n:'Estreia',        d:'Jogue sua primeira partida',
    t: st => st.games >= 1 },

function earnedMedals() { return MEDALS.filter(m => { try { return m.t(stats); } catch (e) { return false; } }); }

/* returns medals unlocked by the run that just finished */
function newMedals() {
  const had = new Set(LS.get('medals', []));
  const now = earnedMedals().map(m => m.id);
  LS.set('medals', now);
  return MEDALS.filter(m => now.includes(m.id) && !had.has(m.id));
}

═══════════════════════════════════════════════════ */
let isSurv = false;

function startSurvival() {
  isSurv = true; isDaily = false; _seed = null;
  diffKey = 'moderado';
  cat = buildGame('moderado');
  cat.name = 'Mata-mata';
  // a long queue; the run ends on the first mistake, not on length
  const extra = buildGame('dificil');
  cat.qs = cat.qs.concat(extra.qs);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = [];
  resetLifes();
  sc = 'quiz'; tMax = DCFG().time; tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* Club artwork: use the licensed crest image when we have one, otherwise fall
   back to genericCrest(): a designed shield in the club's colours. This keeps
   the bundle free of non-free Wikipedia files. */

/* ── Designed fallback badge (used when we have no licensed crest file) ── */
function _lum(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
function _shade(hex, amt) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
  const r = f(parseInt(h.slice(0, 2), 16)), g = f(parseInt(h.slice(2, 4), 16)), b = f(parseInt(h.slice(4, 6), 16));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function genericCrest(id) {
  const c = CL.find(x => x.id === id);
  if (!c) return '';
  const uid  = 'bg' + id.replace(/\W/g, '');
  const dark = _lum(c.c1) < 0.5;
  const ink  = dark ? '#ffffff' : '#111111';
  const trim = _lum(c.c2) > 0.25 ? c.c2 : '#e8e8e8';
  const SHIELD = 'M30 3 L53 11 L53 30 C53 43 42 52 30 57 C18 52 7 43 7 30 L7 11 Z';
  return `
    <defs>
      <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="${_shade(c.c1, 0.10)}"/>
        <stop offset="100%" stop-color="${_shade(c.c1, -0.16)}"/>
      </linearGradient>
    </defs>
    <path d="${SHIELD}" fill="url(#${uid})" stroke="${trim}" stroke-width="2.6"
      stroke-linejoin="round"/>
    <path d="M30 3 L53 11 L53 17 L7 17 L7 11 Z" fill="${trim}" opacity=".92"/>
    <circle cx="30" cy="11" r="3.1" fill="${c.c1}" opacity=".85"/>
    <text x="30" y="41" text-anchor="middle"
      font-family="'Bebas Neue','Arial Black',Impact,sans-serif"
      font-size="19" font-weight="900" letter-spacing="1.2" fill="${ink}">${c.a}</text>
  `;
}

function clubArt(id, style) {
  if (LOGOS[id]) {
    return `<img src="${LOGOS[id]}" alt="" style="${style}"
      onerror="clubFallback(this,'${id}')" />`;
  }
  return `<svg viewBox="0 0 60 60" style="${style}" aria-hidden="true">${genericCrest(id)}</svg>`;
}

/* If a crest file is missing (e.g. an old cached page pointing at a file we
   removed), swap in the app's own SVG crest instead of a broken-image icon. */
function clubFallback(img, id) {
  try {
    img.outerHTML = `<svg viewBox="0 0 60 60" style="${img.getAttribute('style') || ''}"
      aria-hidden="true">${genericCrest(id)}</svg>`;
  } catch (e) { img.style.opacity = '.3'; }
}

${delay}        width:100%;min-height:44px;border-radius:9px;cursor:pointer;
        background:rgba(255,255,255,.06);user-select:none;

  if (isPlayer) {
    return `<div class="${cls}" data-id="${item.id}" style="
${delay}  ${delay}      width:100%;aspect-ratio:1;border-radius:9px;cursor:pointer;
        position:relative;user-select:none;

  return `<div class="${cls}" data-id="${item.id}" style="

/* ── Confetti (pure DOM, no library) ── */
function burst(n) {
  const cols = ['#FFD700','#00e676','#4FC3F7','#FF7043','#FFFFFF','#AB47BC'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = cols[(Math.random() * cols.length) | 0];
    d.style.setProperty('--dx', ((Math.random() * 160) - 80).toFixed(0) + 'px');
    d.style.setProperty('--rot', ((Math.random() * 900) + 360).toFixed(0) + 'deg');
    d.style.animationDuration = (1.9 + Math.random() * 1.5).toFixed(2) + 's';
    d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    if (Math.random() > .6) d.style.borderRadius = '50%';
    frag.appendChild(d);
  }
  document.body.appendChild(frag);
  setTimeout(() => document.querySelectorAll('.conf').forEach(e => e.remove()), 4200);
}

/* ═══════════════════════════════════════════════════
   RENDER + EVENT BINDING
═══════════════════════════════════════════════════ */
function go() {
  prevPts = pts; // snapshot before render (score-up only fires once)
  document.getElementById('ct').innerHTML = html();
  prevPts = pts; // prevent re-fire on subsequent re-renders without score change

  document.getElementById('cta-btn')?.addEventListener('click', () => { snd.swipe(); sc='difficulty'; go(); });
  document.getElementById('daily-btn')?.addEventListener('click', () => { snd.select(); startDaily(); });
  document.getElementById('bcred')?.addEventListener('click', () => { snd.swipe(); sc='credits'; go(); });
  document.getElementById('surv-btn')?.addEventListener('click', () => { snd.select(); startSurvival(); });
  document.getElementById('medal-strip')?.addEventListener('click', () => { snd.swipe(); sc='medals'; go(); });

  if (sc === 'end' && !window._celebrated) {
    const acc = nCorrect / Math.max(1, cat.qs.length);
    if (acc >= 0.7) { window._celebrated = true; burst(acc >= 0.9 ? 70 : 42); }
  }
  if (sc !== 'end') window._celebrated = false;
  document.getElementById('bshare')?.addEventListener('click', () => { snd.tap(); doShare(); });
  document.getElementById('bhome')?.addEventListener('click',   () => { snd.swipe(); clearInterval(tmr); sc='home'; go(); });
  document.getElementById('bexit')?.addEventListener('click',   () => { snd.swipe(); clearInterval(tmr); sc='difficulty'; go(); });
  document.getElementById('bconf')?.addEventListener('click',   () => { if (sel.size > 0) doReveal(); });
  document.getElementById('brep')?.addEventListener('click',    () => { snd.swipe(); startGame(); });
  document.getElementById('bdiff')?.addEventListener('click',   () => { snd.swipe(); sc='difficulty'; go(); });

  document.querySelectorAll('.dc').forEach(d => d.addEventListener('click', () => {
    diffKey = d.dataset.key;
    numQs   = parseInt(d.dataset.n);
    snd.select();
    startGame();
  }));

  document.querySelectorAll('.b').forEach(b => b.addEventListener('click', () => {
    if (sc !== 'quiz') return;
    snd.tap();
    const id = b.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    go();
  }));

  if (sc === 'reveal') {
    const rv = document.getElementById('rvl');
    if (rv && lastMsg) rv.innerHTML = lastMsg;
  }
}

/* ═══════════════════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════════════════ */
function startGame() {
  isDaily = false; isSurv = false; _seed = null;
  cat = buildGame(diffKey);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = [];
  resetLifes();
  sc = 'quiz'; tMax = DCFG().time; tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

function doReveal() {
  clearInterval(tmr);
  sc = 'reveal';

  const q     = cat.qs[qi];
  const rs    = new Set(q.a);
  const sa    = [...sel];
  const wrong = sa.filter(id => !rs.has(id)).length;
  const right = sa.filter(id =>  rs.has(id)).length;
  const p     = wrong === 0 && right === rs.size ? 3
              : wrong === 0 && right > 0          ? 1
              :                                     0;

  prevPts = pts;
  if (p === 3) streak++; else streak = 0;
  bestStreak = Math.max(bestStreak, streak);

  const { gained, mult, speed } = scoreAnswer(p);
  pts += gained;
  lastGain = gained;
  if (p === 3) nCorrect++; else if (p === 1) nPartial++;
  runLog.push(p);

  if      (p === 3) snd.correct();
  else if (p === 1) snd.almost();
  else              snd.wrong();

  const chip = (txt, col) => `<span style="display:inline-block;background:${col}22;
      border:1px solid ${col}44;color:${col};border-radius:9px;padding:1px 7px;
      font-size:10px;font-weight:700;margin-left:4px;
      font-family:'Inter',system-ui;">${txt}</span>`;
  const bonuses = (speed ? chip('⚡ rápido +' + speed, '#4FC3F7') : '')
                + (mult > 1 ? chip('🔥 combo ×' + mult, '#FF7700') : '')
                + (DCFG().pmul > 1 ? chip(DCFG().emoji + ' ×' + DCFG().pmul, DCFG().col) : '');

  lastMsg = p === 3
    ? `<span style="font-size:15px;font-weight:800;color:#00e676;
        font-family:'Inter',system-ui;">✓ Perfeito! +${gained}</span>${bonuses}`
    : p === 1
    ? `<span style="font-size:15px;font-weight:800;color:#FFD700;
        font-family:'Inter',system-ui;">~ Quase! +${gained}</span>${bonuses}`
    : `<span style="font-size:15px;font-weight:800;color:#f44336;
        font-family:'Inter',system-ui;">✗ Errou!</span>`;

  go();

  setTimeout(() => {
    if (isSurv && p !== 3) {          // survival: anything short of perfect ends it
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      go();
      return;
    }
    qi++;
    sel.clear();
    hidden = new Set();
    frozen = false;
    lastMsg = '';
    if (isSurv && qi >= cat.qs.length - 2) {
      const more = buildGame(rnd() > .5 ? 'moderado' : 'dificil');
      cat.qs = cat.qs.concat(more.qs);
    }
    if (qi >= cat.qs.length) {
      finishRun();
    } else {
      sc    = 'quiz';
      tMax  = DCFG().time;
      tLeft = tMax;
      disp  = getDisp(cat.qs[qi]);
      startTmr();
    }
    go();
  }, 2200);
}


function finishRun() {
  clearInterval(tmr);
  sc = 'end';
  if (scores[diffKey] === undefined || pts > scores[diffKey]) {
    scores[diffKey] = pts;
    LS.set('scores', scores);
  }
  if (isDaily) saveDaily();
  stats.games    += 1;
  stats.correct  += nCorrect;
  stats.answered += cat.qs.length;
  stats.bestStreak = Math.max(stats.bestStreak || 0, bestStreak);
  const acc = nCorrect / Math.max(1, cat.qs.length);
  if (isSurv) {
    stats.survBest = Math.max(stats.survBest || 0, nCorrect);
  } else {
    if (acc === 1) stats.perfect = (stats.perfect || 0) + 1;
    if (diffKey === 'dificil' && acc >= 0.8) stats.hard80 = (stats.hard80 || 0) + 1;
  }
  LS.set('stats', stats);
  window._newMedals = newMedals();
}

function startTmr() {
  clearInterval(tmr);
  tmr = setInterval(() => {
    if (frozen) return;
    tLeft = Math.max(0, tLeft - 1);
    const tf = document.getElementById('tf');
    if (tf) {
      tf.style.width      = (tLeft / tMax * 100) + '%';
      tf.style.background = tLeft > 10 ? cat.col : tLeft > 5 ? '#FF9800' : '#F44336';
      if (tLeft <= 5 && !tf.classList.contains('timer-low')) tf.classList.add('timer-low');
    }
    const rv = document.getElementById('revimg');
    if (rv && sc === 'quiz') rv.style.filter = 'blur(' + (20 * (tLeft / tMax)).toFixed(1) + 'px)';
    if (tLeft <= 0 && sc === 'quiz') doReveal();
  }, 1000);
}

/* ── Boot ── */

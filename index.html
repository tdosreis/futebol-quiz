       sit at the back of a real album. Their pocket numbers carry on from the
       players, so every sticker in the book has one number and no two share
       it. */
    let nx = PL.length;
    const extraSec = [
      ['__escudos',  ESCUDOS.map(SK.esc)],
      ['__selecoes', SELECOES.map(SK.sel)],
      ['__mascotes', MASCOTES.map(SK.msc)],
    ];
    extraSec.forEach(([key, sids]) => {
      groups[key] = sids.map(sid => ({ sid, n: ++nx }));
      order.push(key);
    });

    /* The album was printed in several languages, and every old one prints the
       country's name in all of them across the header band. */
    const LANGS = {
      BRA:'Brazil · Brasilien · Brésil · Brasile', ARG:'Argentina · Argentinien · Argentine',
      ITA:'Italy · Italien · Italie · Italia',     GER:'Germany · Deutschland · Allemagne',
      ENG:'England · Angleterre · Inghilterra',    FRA:'France · Frankreich · Francia',
      ESP:'Spain · Spanien · Espagne · Spagna',    POR:'Portugal · Portogallo',
      NED:'Holland · Niederlande · Pays-Bas',      URU:'Uruguay · Uruguai',
    };
    /* Sections that are not countries: what the band, the tab and the pages
       of each are called. */
    const SEC = {
      __resto:    { t:'RESTO DO MUNDO', tab:'RDM', langs:'Rest of the world · Rest der Welt',
                    ic: () => ICON.ball('currentColor', 15) },
      __escudos:  { t:'ESCUDOS',        tab:'ESC', langs:'Crests · Wappen · Stemmi',
                    page:'Escudos', ic: () => ICON.shield('currentColor', 14) },
      __selecoes: { t:'SELEÇÕES',       tab:'SEL', langs:'National teams · Nationalmannschaften',
                    page:'Seleções', ic: () => ICON.shirt('currentColor', 14) },
      __mascotes: { t:'MASCOTES',       tab:'MAS', langs:'Mascots · Maskottchen · Mascotte',
                    page:'Mascotes', ic: () => ICON.star('currentColor', 14) },
    };
    const sidOf  = g => g.sid || g.p.id;
    const isExtra = c => !!(SEC[c] && SEC[c].page);
    const total  = ALL_STICKERS.length;
    const pagesOf = c => isExtra(c)
      ? extraPages(groups[c], SEC[c].page)
      : albumPages(groups[c]);

    if (!albCtry || !groups[albCtry]) albCtry = order[0];
    /* If the run just earned something, open on the spread that sticker lives
       in — the reward is the reason they came here. */
    if (runNewIds.length && movedScreen) {
      const fresh = runNewIds[0];
      const home  = fresh && order.find(c => groups[c].some(g => sidOf(g) === fresh));
      if (home) {
        albCtry = home;
        const i = pagesOf(home).findIndex(pg => pg.items.some(g => sidOf(g) === fresh));
        albPage = i < 0 ? 0 : i;
      }
    }

    const pages = pagesOf(albCtry);
    albPage = Math.max(0, Math.min(albPage, pages.length - 1));
    const spread = pages[albPage] || { from: 1990, to: 1990, items: [] };
    const isRest = albCtry === '__resto';
    const sec    = SEC[albCtry];
    const secGot = groups[albCtry].filter(g => album.has(sidOf(g))).length;
    const secAll = groups[albCtry].length;

    return `
    <div class="pg alb-pg" style="gap:7px;">
      ${topbar('Meu álbum')}

      <div class="alb-head">
        <div class="display" style="font-size:24px;">${album.size}<span class="muted" style="font-size:15px;"> / ${total}</span></div>
        <div class="small muted">${albumPct()}% colado</div>
      </div>
      <div class="alb-bar"><i style="width:${albumPct()}%"></i></div>

      <!-- the index: every section of the album, as a row of tabs -->
      <div class="alb-tabs" id="alb-tabs">
        ${order.map(c => {
          const g = groups[c];
          const got = g.filter(x => album.has(sidOf(x))).length;
          const S = SEC[c];
          return `<button class="alb-tab${c === albCtry ? ' is-on' : ''}${got === g.length ? ' is-done' : ''}"
                    data-ctry="${c}" title="${S ? S.t : (CTRY_NAME[c] || c)}">
            <span class="alb-tab-fl">${S ? S.ic() : flagSVG(c, 11)}</span>
            <span class="alb-tab-c">${S ? S.tab : c}</span>
            <span class="alb-tab-n">${got}/${g.length}</span>
          </button>`;
        }).join('')}
      </div>

      <!-- the spread -->
      <!-- a section with one spread is printed on the paper of its newest card,
           not its oldest: "todas as épocas" is not a period piece -->
      <div class="alb-book ${isExtra(albCtry) ? 'dec-x' + albCtry.slice(2, 3)
        : decStyle(pages.length === 1 ? spread.to : spread.from)}" id="alb-book">
        <!-- The block of pages either side of the one you are on. A book is
             visibly thicker on the side you have not read yet, and nothing
             says "you are four spreads in with three to go" faster. -->
        ${(() => {
          const px = n => Math.min(9, n) * 1.6;
          const edge = (side, n) => n <= 0 ? '' :
            `<span class="alb-edge alb-edge-${side}" aria-hidden="true"
               style="width:${px(n)}px"></span>`;
          return edge('l', albPage) + edge('r', pages.length - 1 - albPage);
        })()}
        <div class="alb-band">
          <span class="crest-box" style="width:30px;flex:none;">${sec
            ? `<span class="alb-globe">${sec.ic()}</span>`
            : flagSVG(albCtry, 20)}</span>
          <span style="min-width:0;flex:1;">
            <span class="t">${sec ? sec.t : (CTRY_NAME[albCtry] || albCtry).toUpperCase()}</span>
            <span class="langs">${sec ? sec.langs : (LANGS[albCtry] || '')}</span>
          </span>
          <span class="alb-dec">${isExtra(albCtry)
            ? (spread.label || sec.page)
            : (pages.length === 1 ? 'Todas as épocas' : decLabel(spread))}</span>
        </div>

        <div class="alb-sheet scroll-y${albTurning ? ' turn-' + albTurning : ''}">
          <div class="alb-grid">
            ${spread.items.map(it => {
              const { p, n } = it;
              const sid = it.sid || p.id;
              const got = album.has(sid);
              const nm  = p ? p.n : (stk(sid) || {}).n || '';
              const front = p
                ? figurinha(p, 'lg', {
                    sub: (p.clubs && p.clubs[0]) ? clubName(p.clubs[0]) : POS_NAME[p.pos],
                    noYear: true })
                : figExtra(sid, 'lg');
              const back = p ? figurinhaBack(p, n) : figExtraBack(sid, n);
              return `<div class="alb-slot${got ? ' alb-turn' : ' empty'}${
                runNewIds.includes(sid) ? ' alb-fresh' : ''}"${
                got ? ` data-fig="${sid}" role="button" tabindex="0"
                       aria-label="${nm} — toque para virar a figurinha"` : ''}>
                <span class="alb-n">${String(n).padStart(3, '0')}</span>
                ${got
                  ? `<span class="flip"><span class="flip-in">
                       <span class="flip-face flip-front">${front}</span>
                       <span class="flip-face flip-back">${back}</span>
                     </span></span>`
                  : `<span class="ph" aria-hidden="true">?</span><span class="nm">a colar</span>`}
              </div>`;
            }).join('')}
          </div>
          <div class="alb-foot">
            <span>${sec ? sec.t.toLowerCase() : (CTRY_NAME[albCtry] || albCtry)}</span>
            <span>${secGot} de ${secAll}</span>
          </div>
        </div>
      </div>

      <!-- turning the page -->
      <div class="alb-turnbar">
        <button id="alb-prev" class="alb-arrow" ${albPage === 0 ? 'disabled' : ''}
          aria-label="Página anterior">${ICON.back('currentColor', 15)}</button>
        <div class="alb-pips" aria-hidden="true">
          ${pages.map((pg, i) => `<span class="alb-pip${i === albPage ? ' is-on' : ''}${
            pg.items.every(g => album.has(sidOf(g))) ? ' is-full' : ''}"></span>`).join('')}
        </div>
        <button id="alb-next" class="alb-arrow alb-fwd" ${albPage >= pages.length - 1 ? 'disabled' : ''}
          aria-label="Próxima página">${ICON.back('currentColor', 15)}</button>
      </div>

      <div class="alb-hint" style="justify-content:center;">${album.size === 0
        ? `${ICON.ball('currentColor', 12)} Cada resposta certa cola uma figurinha aqui.`
        : `${ICON.book('currentColor', 10)} Toque em uma figurinha para ver o verso`}</div>
    </div>`;
  }

  /* ── Medals ── */
  if (sc === 'medals') {
    const got = new Set(earnedMedals().map(m => m.id));
    return `
    <div class="pg" style="gap:10px;">
      ${topbar(`Figurinhas especiais · ${got.size}/${MEDALS.length}`)}
      <div class="scroll-y" style="display:flex;flex-direction:column;gap:7px;flex:1;">
        ${MEDALS.map(m => {
          const on = got.has(m.id);
          /* A locked medal used to show only its target. How far along you
             are is the part worth knowing — "58 de 108" is a reason to play
             one more round; "colecione 108 figurinhas" is a wall. */
          let bar = '';
          if (!on && m.p) {
            try {
              const [have, need] = m.p(stats);
              const pct = Math.max(0, Math.min(100, Math.round(have / need * 100)));
              bar = `<div class="medal-prog"><i style="width:${pct}%"></i></div>
                     <div class="medal-num">${have} / ${need}</div>`;
            } catch (e) { bar = ''; }
          }
          return `<div class="medal ${on ? 'medal-on' : 'medal-off'}">
            <span class="ic">${(ICON[m.ic] || ICON.medal)('currentColor', 17)}</span>
            <div style="flex:1;min-width:0;">
              <div class="t">${m.n}</div>
              <div class="d">${m.d}</div>
              ${bar}
            </div>
            ${on ? ICON.check('var(--good)', 14) : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  /* ── Credits ── */
  if (sc === 'credits') {
    const pairs = {};
    Object.values(typeof CREDITS !== 'undefined' ? CREDITS : {}).forEach(c => {
      const k = (c.a || 'Desconhecido') + '||' + (c.l || '?');
      pairs[k] = (pairs[k] || 0) + 1;
    });
    const rows = Object.keys(pairs).sort().map(k => {
      const [a, l] = k.split('||');
      return `<div class="credit-row"><span style="flex:1;color:var(--ink-2);line-height:1.35;">${a}</span>
        <span class="l">${l}</span></div>`;
    }).join('');

    /* Every photo currently carries a credit, so this renders nothing. It
       stays as a guard: if a future photo lands without one, saying so beats
       an attribution list that quietly looks complete. */
    const unsourced = PL.filter(p => p.img && !CREDITS[p.img]).map(p => p.n);
    return `
    <div class="pg" style="gap:10px;">
      ${topbar('Créditos das imagens')}
      <p class="small muted" style="font-size:11px;">
        As fotos vêm da <b style="color:var(--ink);">Wikimedia Commons</b> e são usadas sob
        licenças livres (CC / domínio público), impressas aqui em serigrafia.
        Obrigado a cada autor listado abaixo.<br><br>
        Escudos dos clubes são marcas registradas de seus respectivos clubes, exibidos
        apenas para identificação dentro do quiz. Todos são o escudo oficial de
        cada clube, tirado do infobox do artigo do clube — que é o que define a
        marca atual. Uma parte deles não tem versão sob licença livre em lugar
        nenhum: são marcas registradas, exibidas aqui só para identificar o
        clube dentro do quiz, e estão listadas abaixo com essa licença.<br><br>
        Os mascotes são desenhados aqui. Mascote de clube é arte do próprio
        clube e não existe sob licença livre; nenhum destes é a arte oficial de
        ninguém.
      </p>
      <!-- The cap was a flat 330px, from when the page never filled the sheet;
           on a tall phone that wasted half the screen. It has to stay a cap of
           some kind — #qz is only min-height:100dvh, so with no definite height
           to divide, a flex child cannot shrink and the list would push the
           footnote off the bottom — but measured against the screen it now
           grows with it. -->
      <div class="scroll-y" style="flex:1;background:var(--pocket);border:1px solid var(--rule-2);
        border-radius:11px;padding:8px 12px;max-height:${unsourced.length ? 46 : 58}vh;">${
        rows || '<span class="small muted">—</span>'}</div>
      ${unsourced.length ? `<div class="note">
        <div style="font-weight:800;color:var(--brass);margin-bottom:2px;">Fonte ainda não registrada</div>
        <div class="muted">${unsourced.join(', ')} — estamos rastreando a autoria dessas fotos.
          Se você é o autor, escreva para tiagor.reis@gmail.com.</div>
      </div>` : ''}
      <p class="small muted" style="font-size:9.5px;text-align:center;margin-top:auto;">Detalhes completos: commons.wikimedia.org</p>
    </div>`;
  }

  /* ── Treino: fixed-length rounds, nothing at stake ── */
  if (sc === 'difficulty') return `
  <div class="pg" style="gap:10px;">
    ${topbar('Treino · escolha a dificuldade')}
    <div style="display:flex;flex-direction:column;gap:9px;flex:1;justify-content:center;">
      ${DIFFS.map(d => `
      <div class="dc dc-${d.key}" data-key="${d.key}" data-n="${d.n}">
        <span class="ic">${(ICON[d.ic] || ICON.star)('currentColor', 18)}</span>
        <div style="flex:1;min-width:0;">
          <div class="t">${d.label}</div>
          <div class="d">${d.desc}</div>
        </div>
        <div class="n num">${d.n}<small>perguntas</small>
          ${scores[d.key] !== undefined
            ? `<small style="color:${d.col};text-transform:none;letter-spacing:.02em;">recorde ${scores[d.key]} pts</small>` : ''}
        </div>
      </div>`).join('')}
    </div>
    <p class="small muted" style="font-size:10px;text-align:center;">Rodadas de treino: sem degraus, sem prêmio, só pontos</p>
  </div>`;

  /* ── How a ladder run ends ───────────────────────────────────
     Three different endings, and they should not look alike. Walking
     away with money is a win and gets the brass; falling to a
     checkpoint still pays, but quietly; going out with nothing is
     stated plainly rather than dressed up. */
  if (sc === 'end' && isMil) {
    const won     = banked >= LADDER[LADDER.length - 1].v;
    const cleared = rung;
    const tone    = won ? 'brass' : banked > 0 ? 'good' : 'bad';
    const head    = won     ? 'Um milhão!'
                  : cashed  ? 'Você parou a tempo'
                  : banked  ? 'Caiu, mas levou'
                  :           'Fim de jogo';
    const sub     = won
      ? 'Dezesseis perguntas, dezesseis acertos. Não dá pra ir mais longe.'
      : cashed
      ? 'Saiu com o dinheiro na mão — decisão de quem sabe a hora.'
      : banked
      ? `Errou a pergunta de ${money(LADDER[Math.min(rung, LADDER.length - 1)].v)} — o degrau garantido segurou.`
      : 'Escorregou antes do primeiro degrau garantido. Da próxima, considere parar.';

    return `
    <div class="pg pg-center scroll-y" style="padding:26px 22px;gap:9px;">
      <div class="eyebrow">Rumo ao Milhão · degrau ${cleared}/${LADDER.length}</div>
      ${banked > 0 ? `<div style="margin:2px 0 -2px;">${ART.trophy(58)}</div>` : ''}
      <div class="display ${tone}" style="font-size:30px;"><em>${head}</em></div>
      <div id="endcash" class="display prize-pop ${banked > 0 ? 'brass' : 'muted'}"
        data-to="${banked}"
        style="font-size:${banked >= 100000 ? 44 : 52}px;letter-spacing:-.03em;">${money(banked)}</div>
      <p class="small muted" style="max-width:290px;font-size:12px;">${sub}</p>

      <div class="rail" style="width:100%;max-width:300px;margin:6px 0;">
        ${LADDER.map((step, i) => `<span class="notch${i < rung ? ' notch-done' : ''}${step.safe ? ' notch-safe' : ''}"></span>`).join('')}
      </div>

      <div class="stats">
        <div><div class="v num">${nCorrect}</div><div class="k">Acertos</div></div>
        <div><div class="v num">${pts}</div><div class="k">Pontos</div></div>
        <div><div class="v num brass">${money(Math.max(milBest(), banked))}</div><div class="k">Recorde</div></div>
      </div>

      ${newStickerStrip()}
      ${medalChips()}

      <div class="foot-row" style="margin-top:12px;">
        <button id="bshare"  class="btn btn-ghost btn-sm">Compartilhar</button>
        <button id="bmilrep" class="btn btn-brass">De novo</button>
        <button id="bhome"   class="btn btn-ghost btn-sm">Início</button>
      </div>
    </div>`;
  }

  /* ── End of a round ── */
  if (sc === 'end') {
    const total = cat.qs.length;
    const pct = Math.round(nCorrect / total * 100);
    const msg = pct >= 80 ? 'Craque!' : pct >= 50 ? 'Boa jogada!' : 'Treina mais!';
    const isRecord = scores[diffKey] !== undefined && pts === scores[diffKey] && pts > 0;
    const curDiff  = DIFFS.find(d => d.key === diffKey);
    return `
    <div class="pg pg-center" style="padding:28px 24px;gap:10px;">
      <span class="chip chip-soft" style="color:${curDiff.col};">
        ${isSurv ? `${ICON.shield('currentColor', 11)} Mata-mata · ${nCorrect} ${nCorrect === 1 ? 'acerto' : 'acertos'} seguidos`
                 : `${(ICON[curDiff.ic] || ICON.star)('currentColor', 11)} ${curDiff.label} · ${total} perguntas`}</span>
      ${pct >= 80 ? `<div style="margin:2px 0 -4px;">${ART.trophy(52)}</div>` : ''}
      <div class="display" style="font-size:34px;margin-top:6px;"><em>${msg}</em></div>
      <div id="endpts" class="display num" style="font-size:64px;line-height:1;font-weight:600;"
        data-to="${pts}">${pts}</div>
      <div class="small muted">pontos · ${nCorrect}/${total} acertos (${pct}%)</div>
      ${bestStreak >= 3 ? `<div class="small" style="display:flex;gap:4px;align-items:center;color:var(--brass);font-weight:700;">
        ${ICON.flame('currentColor', 12)} melhor sequência: ${bestStreak}</div>` : ''}
      <div class="bar"><i style="width:${pct}%;"></i></div>
      ${isRecord ? `<span class="chip chip-brass">${ICON.star('currentColor', 11)} Novo recorde</span>` : ''}
      ${medalChips()}
      ${newStickerStrip()}
      <div style="margin-top:6px;">${runlogEl()}</div>
      <div class="foot-row" style="margin-top:12px;">
        <button id="bshare" class="btn btn-ghost btn-sm">Compartilhar</button>
        <button id="brep"   class="btn btn-primary">Jogar de novo</button>
        <button id="bdiff"  class="btn btn-ghost btn-sm">Mudar dificuldade</button>
      </div>
    </div>`;
  }

  /* ── Quiz / Reveal ── */
  const q    = cat.qs[qi];
  const qcat = q._cat || cat;
  const tpct = (tLeft / tMax) * 100;
  const tcls = tLeft <= 5 ? 't-bad' : tLeft <= 10 ? 't-warn' : isMil ? 't-brass' : '';
  const armed = sc === 'quiz';

  const art = questionArt(q);

  const scoreChanged = pts !== prevPts;

  /* the rail: sixteen notches, one per rung, checkpoints picked out */
  const prizeRail = !isMil ? '' : `
    <div class="rail">${LADDER.map((step, i) => `<span class="notch${
      i < rung ? ' notch-done' : ''}${step.safe ? ' notch-safe' : ''}${i === rung ? ' notch-now' : ''}"></span>`).join('')}</div>`;

  /* what this question is worth, and what you keep if it goes wrong */
  const stakes = !isMil ? '' : `
    <div class="stakes">
      <div style="min-width:0;">
        <div class="eyebrow">Pergunta ${rung + 1} de ${LADDER.length}${isFinal() ? ' · a última' : ''}</div>
        <div class="stakes-v prize-pop">${money(RUNG().v)}</div>
      </div>
      <button id="bladder" class="safe-box">
        <div>
          <div class="k">Garantido</div>
          <div class="v num ${safetyNet() ? 'good' : 'muted'}">${safetyNet() ? money(safetyNet()) : '—'}</div>
        </div>
        ${ICON.ladder('var(--ink-3)', 14)}
      </button>
    </div>`;

  const expertBox = !(expert && armed) ? '' : `
    <div class="expert-box">
      ${ICON.mic('var(--brass)', 15)}
      <p><em>${expert.line}</em> <b>${expert.name}</b>${expert.sure ? '' : ' <em>— mas é chute, hein.</em>'}</p>
    </div>`;

  /* Five different things to spend, and they used to look like five identical
     grey pills. Each carries its own colour now — the same colour the game
     already uses for what it does: the cut is the red of a wrong answer, the
     freeze is the cold of the clock running out, the skip is the pitch green
     of moving on. The tint only shows while the lifeline is still yours. */
  const ajudas = [
    ['bhalf',   'Cortar',    ICON.cut,   lifes.half && cutCount() >= 1, 'cut'],
    ['bpoll',   'Placar',    ICON.crowd, lifes.poll,                    'poll'],
    ['bexpert', 'Convidado', ICON.mic,   lifes.expert,                  'mic'],
    ['bfreeze', 'Congelar',  ICON.snow,  lifes.freeze,                  'snow'],
    ['bskip',   'Pular',     ICON.skip,  lifes.skip,                    'skip'],
  ];

  const progress = isMil ? '' : `
    <div style="display:flex;align-items:center;gap:3px;max-width:104px;flex-wrap:wrap;justify-content:flex-end;">
      ${cat.qs.length <= 20 ? cat.qs.map((_, i) => {
          const cls = i < runLog.length ? (runLog[i] === 3 ? 'pdot pdot-on'
                    : runLog[i] === 0 ? 'pdot pdot-miss' : 'pdot pdot-on')
                    : (i === qi ? 'pdot pdot-cur' : 'pdot');
          return `<span class="${cls}"></span>`;
        }).join('')
      : `<span class="small muted num">${qi + 1}/${cat.qs.length}</span>`}
    </div>`;

  return `
  <div class="pg qz-screen${introOn ? ' intro' : ''}${justCut ? ' cut-now' : ''}" style="padding:13px;gap:9px;position:relative;">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="display:flex;align-items:center;gap:7px;min-width:0;">
        <button id="bexit" class="btn btn-ghost btn-icon" aria-label="Sair">${ICON.close('currentColor', 12)}</button>
        <span class="chip">${catIcon(qcat)}<span>${qcat.name}</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        ${streak > 1 ? `<span class="chip chip-brass streak-chip${
          introOn ? ' streak-up' : ''}" style="padding:2px 8px;">${
          ICON.flame('currentColor', 11)}${streak}x</span>` : ''}
        ${progress}
        ${isMil
          ? `<div class="clock ${tLeft <= 5 ? 'timer-low' : ''}">${ICON.clock('currentColor', 13)}
               <span id="clock-n" class="v num">${tLeft}</span></div>`
          : `<div id="score-disp" class="score ${scoreChanged ? 'score-up' : ''}">${
               sc === 'reveal' && lastGain > 0 ? `<span class="gain">+${lastGain}</span>` : ''}
               <span class="v num">${pts}</span><span class="u">pts</span></div>`}
      </div>
    </div>

    ${prizeRail}
    ${stakes}

    <div class="timer"><i id="tf" class="${tcls}${tLeft <= 5 ? ' timer-low' : ''}" style="width:${tpct}%;"></i></div>

    ${q.reveal ? `
    <div style="display:flex;justify-content:center;padding:2px 0 2px;">
      <div class="reveal-box print">
        <img id="revimg" src="${q.reveal}" alt="" aria-hidden="true"
          style="filter:blur(${sc === 'reveal' ? 0 : (20 * (tLeft / tMax)).toFixed(1)}px);
            transform:scale(1.08);transition:filter .9s linear;" />
      </div>
    </div>` : ''}

    <div class="qcard${isMil ? ' qcard-brass' : ''}">
      ${art}
      <p>${q.t}</p>
    </div>

    ${expertBox}

    <div class="board ${isTextQ(q)
        ? 'board-2' + (disp.length > 6 ? ' board-2-tight' : '')
        : disp.length <= 4 ? 'board-big' : 'board-5'}">
      ${disp.map((c, i) => badge(c, i)).join('')}
    </div>

    ${armed ? `
    <div class="foot">
      <div class="ajudas">
        ${ajudas.map(([id, lbl, ic, on, kind]) => `
          <button id="${id}" ${on ? '' : 'disabled'} class="ajuda aj-${kind}${
            on ? '' : ' aj-spent'}${firedAid === id ? ' aj-firing' : ''}">
            <span class="aj-disc">${ic('currentColor', 15)}</span>
            <span class="aj-lbl">${lbl}</span></button>`).join('')}
      </div>
      ${frozen ? `<div class="small pitch" style="font-weight:700;display:flex;align-items:center;gap:4px;">
        ${ICON.snow('currentColor', 11)} Relógio parado nesta pergunta</div>` : ''}
      <p class="footer-hint">
        ${q.type === 'txt'
          ? (q.a.length > 1 ? `Marque as ${q.a.length} respostas certas` : 'Marque a resposta certa')
          : q.type === 'player'
          ? (q.a.length > 1 ? `Marque os ${q.a.length} jogadores certos` : 'Marque o jogador certo')
          : (q.a.length > 1 ? `Marque os ${q.a.length} times certos`     : 'Marque o time certo')}</p>
      <div class="foot-row">
        <button id="bconf" ${sel.size ? '' : 'disabled'} class="btn ${isMil ? 'btn-brass' : 'btn-primary'} btn-lg${sel.size ? ' is-armed' : ''}">
          ${sel.size && q.type === 'player' ? 'Colar figurinha' : 'Confirmar'}</button>
        ${isMil && rung > 0 ? `
        <button id="bstop" class="btn btn-ghost btn-sm">${ICON.stop('currentColor', 13)} Parar · ${money(LADDER[rung - 1].v)}</button>` : ''}
      </div>
    </div>`
    : sc === 'ask' ? `
    <div class="pg-center" style="display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:4px;">
      <div class="display brass" style="font-size:22px;text-align:center;"><em>Essa é a sua resposta final?</em></div>
      <p class="small muted" style="text-align:center;max-width:300px;">
        Está valendo <b class="brass">${money(RUNG().v)}</b>. Se errar, você sai com ${money(safetyNet())}.</p>
      <div class="foot-row">
        <button id="bfinal"  class="btn btn-brass">É essa</button>
        <button id="bunlock" class="btn btn-ghost btn-sm">Deixa eu pensar</button>
      </div>
    </div>`
    : sc === 'lock' ? `
    <div class="settling">
      <span class="settle-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="small muted">${isMil ? money(RUNG().v) + ' na mesa…' : ''}</span>
    </div>`
    : `<div style="text-align:center;padding:4px 0;" id="rvl"></div>`}

    ${(sc === 'ask' || sc === 'lock') ? '<div class="stage-dark"></div>' : ''}
    ${ladderOpen ? ladderOverlay() : ''}
  </div>`;
}

/* ── The full ladder, as a sheet over the board ──────────────────
   Opening it stops the clock: checking where you stand is not
   something the player should have to pay for in seconds. */
function ladderOverlay() {
  return `
  <div class="sheet">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="eyebrow" style="color:var(--brass);">A escada do milhão</span>
      <button id="bladderclose" class="btn btn-ghost btn-icon" aria-label="Fechar">${ICON.close('currentColor', 13)}</button>
    </div>
    <div class="scroll-y" style="flex:1;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;">
      ${LADDER.map((step, i) => {
        const state = i < rung ? 'rung-done' : i === rung ? 'rung-now' : step.safe ? 'rung-safe' : '';
        const top = i === LADDER.length - 1 ? ' rung-top' : '';
        return `<div class="rung ${state}${top}">
          <span class="rung-n">${i + 1}</span>
          ${step.safe ? ICON.shield(i < rung ? 'var(--good)' : 'var(--ink-4)', 11) : '<span style="width:11px;"></span>'}
          <span style="flex:1;">${money(step.v)}</span>
          ${i < rung ? ICON.check('var(--good)', 12) : ''}
        </div>`;
      }).join('')}
    </div>
    <p class="small muted" style="font-size:10px;text-align:center;">
      ${ICON.shield('var(--ink-3)', 10)} são os degraus garantidos —
      passou de um, esse dinheiro é seu aconteça o que acontecer.</p>
  </div>`;
}

/* ── A shower of paper, only for the million ── */
function burst(n) {
  const cols = ['var(--brass)', 'var(--pitch)', 'var(--ink)', 'var(--pocket)'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = cols[(Math.random() * cols.length) | 0];
    d.style.setProperty('--dx', ((Math.random() * 160) - 80).toFixed(0) + 'px');
    d.style.setProperty('--rot', ((Math.random() * 900) + 360).toFixed(0) + 'deg');
    d.style.animationDuration = (2.2 + Math.random() * 1.5).toFixed(2) + 's';
    d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    frag.appendChild(d);
  }
  document.body.appendChild(frag);
  setTimeout(() => document.querySelectorAll('.conf').forEach(e => e.remove()), 4500);
}

/* ═══════════════════════════════════════════════════
   RENDER + EVENT BINDING
═══════════════════════════════════════════════════ */
/* Every tap on a tile re-renders the whole screen, which replayed the board's
   deal-in and the question card's entrance from the top — the board reshuffled
   itself visually each time you changed your mind. The entrances belong to a
   new question, not to a repaint, so they run only when the question changed. */
let _qKey = null;
let introOn = true;
let justCut = false;
let firedAid = null;   // the lifeline spent on this render, so it can flare once
let gameN   = 0;   // bumped when a run starts, so two runs' question 0 differ
let _lastSc = null;
/* which section of the album is open, and which spread within it */
let albCtry = null;
let albPage = 0;
let albTurning = null;   // 'fwd' | 'back', consumed by the next render
let albLeaf    = null;   // a copy of the spread being turned away from

function go() {
  /* Only the board itself gets an entrance, and only when the question under
     it changed. Locking in an answer (ask/lock) and the reveal are the same
     question still on screen — re-dealing the tiles there would undo the very
     thing the lock screen is doing. gameN separates two runs that both open on
     question zero. */
  const qk = `${gameN}:${qi}`;
  introOn = sc === 'quiz' && qk !== _qKey;
  if (sc === 'quiz') _qKey = qk;

  const ct = document.getElementById('ct');
  const movedScreen = sc !== _lastSc;
  _lastSc = sc;
  if (ct) ct.classList.toggle('screen-in', movedScreen);

  prevPts = pts; // snapshot before render (score-up only fires once)
  document.getElementById('ct').innerHTML = html();
  prevPts = pts; // prevent re-fire on subsequent re-renders without score change

  justCut = false;   // consumed by the render above
  firedAid = null;
  albTurning = null;

  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);

  /* ── home ── */
  on('mil-btn',     () => { snd.rung();   startMilhao(); });
  on('cta-btn',     () => { snd.swipe();  sc = 'difficulty'; go(); });
  on('daily-btn',   () => { snd.select(); startDaily(); });
  on('surv-btn',    () => { snd.select(); startSurvival(); });
  on('bcred',       () => { snd.swipe();  sc = 'credits'; go(); });
  on('bmed',        () => { snd.swipe();  sc = 'medals';  go(); });
  on('balb',        () => { snd.swipe();  sc = 'album';   go(); });

  /* ── Opening the album on what you just won ──
     Two hundred and forty-eight pockets, and the three you just filled are
     somewhere among them. If the run earned anything, the album opens scrolled
     to the first of them rather than at Brazil's first page. Only on arrival:
     turning a card over must not yank the page around. */
  if (sc === 'album') {
    /* ── Turning a figurinha over ──
       Bound once on the sheet, not per card, and it toggles a class rather than
       re-rendering: a re-render would put every card face-up again mid-turn. */
    const turn = el => {
      const slot = el.closest && el.closest('.alb-turn');
      if (!slot) return;
      slot.classList.toggle('turned');
      snd.swipe();
    };
    const sheet = document.querySelector('.alb-sheet');
    if (sheet) {
      sheet.addEventListener('click', e => turn(e.target));
      sheet.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turn(e.target); }
      });
    }

    /* ── Choosing a section ── */
    const tabs = document.getElementById('alb-tabs');
    if (tabs) tabs.addEventListener('click', e => {
      const b = e.target.closest && e.target.closest('.alb-tab');
      if (!b) return;
      if (b.dataset.ctry === albCtry) return;
      albCtry = b.dataset.ctry; albPage = 0;
      snd.swipe(); go();
    });

    /* ── Turning the page ──
       `albTurning` carries which way it went into the next render, so the new
       spread comes in from the side the page was turned towards. */
    const flip = dir => {
      /* Photograph the spread before it goes. `go()` replaces the sheet
         outright, so the only way to show the page leaving is to keep a copy
         of it — measured against the book, because the sheet sits below the
         country band and a leaf pinned to the whole book would swing the band
         away too. */
      const bk = document.getElementById('alb-book');
      const sh = bk && bk.querySelector(':scope > .alb-sheet');
      if (bk && sh && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const b = bk.getBoundingClientRect(), r = sh.getBoundingClientRect();
        albLeaf = { out: sh.outerHTML, dir: dir > 0 ? 'fwd' : 'back',
                    top: r.top - b.top, left: r.left - b.left,
                    w: r.width, h: r.height };
      }
      albTurning = dir > 0 ? 'fwd' : 'back';
      albPage += dir;
      snd.page(); go();
    };
    on('alb-prev', () => flip(-1));
    on('alb-next', () => flip(1));

    /* the arrow keys turn the page too — the album is read on a laptop as
       often as on a phone, and a book turns with the keys there */
    if (!window._albKeys) {
      window._albKeys = true;
      document.addEventListener('keydown', e => {
        if (sc !== 'album') return;
        if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
        const prev = document.getElementById('alb-prev');
        const next = document.getElementById('alb-next');
        if (e.key === 'ArrowLeft'  && prev && !prev.disabled) { e.preventDefault(); prev.click(); }
        if (e.key === 'ArrowRight' && next && !next.disabled) { e.preventDefault(); next.click(); }
      });
    }

    /* the same gesture the object itself would take */
    const book = document.getElementById('alb-book');
    if (book) {
      let x0 = null, y0 = null;
      book.addEventListener('touchstart', e => {
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      }, { passive: true });
      book.addEventListener('touchend', e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0;
        const dy = e.changedTouches[0].clientY - y0;
        x0 = null;
        /* a swipe, not a scroll: mostly sideways and far enough to mean it */
        if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
        const prev = document.getElementById('alb-prev');
        const next = document.getElementById('alb-next');
        if (dx < 0 && next && !next.disabled) flip(1);
        if (dx > 0 && prev && !prev.disabled) flip(-1);
      }, { passive: true });
    }

    /* Build the turning page out of the two spreads. Forward, the right half
       of the old spread swings across and lands as the left half of the new
       one — so that is exactly what goes on its two faces. Backward is the
       same move mirrored. */
    if (albLeaf) {
      const L = albLeaf; albLeaf = null;
      const bk = document.getElementById('alb-book');
      const sheet = bk && bk.querySelector(':scope > .alb-sheet');
      if (bk && sheet) {
        const fwd  = L.dir === 'fwd';
        const sign = fwd ? -1 : 1;
        const half = (html, which) => `<div class="alb-clip half-${which}">${html}</div>`;

        const wrap = document.createElement('div');
        wrap.className = 'alb-turnwrap';
        wrap.setAttribute('aria-hidden', 'true');
        wrap.style.cssText = `top:${L.top}px;left:${L.left}px;width:${L.w}px;height:${L.h}px;`;
        wrap.innerHTML =
          `<div class="alb-under side-${fwd ? 'l' : 'r'}">${half(L.out, fwd ? 'l' : 'r')}</div>
           <div class="alb-cast side-${fwd ? 'r' : 'l'}"></div>
           <div class="alb-leaf leaf-${L.dir}">
             <div class="alb-face is-front">${half(L.out, fwd ? 'r' : 'l')}<div class="alb-shade"></div></div>
             <div class="alb-face is-back">${half(sheet.outerHTML, fwd ? 'l' : 'r')}<div class="alb-shade"></div></div>
           </div>`;

        wrap.querySelectorAll('.alb-sheet').forEach(el => {
          el.style.overflow = 'hidden'; el.classList.remove('turn-fwd', 'turn-back');
        });
        wrap.querySelectorAll('[tabindex],[role="button"],[id]').forEach(el => {
          el.removeAttribute('tabindex'); el.removeAttribute('role'); el.removeAttribute('id');
        });
        bk.appendChild(wrap);

        /* ── the turn ──
           One leaf, so there is nothing to seam. What makes it read as paper
           now is the perspective it turns under, a shade that sweeps across it,
           and a little roll — a page tips as it goes over, it does not pivot
           like a gate. */
        const DUR = 480, ROLL = 7;
        const leaf  = wrap.querySelector('.alb-leaf');
        const shades = wrap.querySelectorAll('.alb-shade');
        const cast  = wrap.querySelector('.alb-cast');
        let t0 = 0, raf = 0;
        const frame = now => {
          if (!t0) t0 = now;
          const t = Math.min(1, (now - t0) / DUR);
          /* leaves quickly, lands softly */
          const e = 1 - Math.pow(1 - t, 2.1);
          const lift = Math.sin(Math.PI * t);          // nought at both ends
          leaf.style.transform =
            `rotateY(${sign * e * 180}deg) rotateZ(${sign * ROLL * lift}deg)` +
            ` translateZ(${lift * 26}px)`;
          shades.forEach(x => { x.style.opacity = String(.25 + lift * .75); });
          if (cast) cast.style.opacity = String(Math.max(0, 1 - e * 1.8));
          if (t < 1) raf = requestAnimationFrame(frame); else wrap.remove();
        };
        raf = requestAnimationFrame(() => { raf = requestAnimationFrame(frame); });
        setTimeout(() => { cancelAnimationFrame(raf); wrap.remove(); }, DUR + 700);
      }
    }

    /* the index runs wider than the screen, so the section you are reading has
       to be brought under your thumb — otherwise opening on a fresh sticker
       from Uruguay leaves the strip sitting on Brazil */
    if (tabs) {
      const cur = tabs.querySelector('.alb-tab.is-on');
      if (cur) {
        const want = cur.offsetLeft - (tabs.clientWidth - cur.offsetWidth) / 2;
        const max  = tabs.scrollWidth - tabs.clientWidth;
        tabs.scrollLeft = Math.max(0, Math.min(want, max));
      }
      const edges = () => {
        tabs.classList.toggle('fade-l', tabs.scrollLeft > 4);
        tabs.classList.toggle('fade-r',
          tabs.scrollLeft + tabs.clientWidth < tabs.scrollWidth - 4);
      };
      tabs.addEventListener('scroll', edges, { passive: true });
      edges();
    }

    /* a fresh sticker is on the spread the album opened to; bring it into view
       inside the sheet rather than moving the whole page */
    if (runNewIds.length && movedScreen) {
      const first = document.querySelector('.alb-fresh');
      if (first && first.scrollIntoView) first.scrollIntoView({ block: 'nearest' });
    }
  }
  on('medal-strip', () => { snd.swipe();  sc = 'medals';  go(); });
  on('bmute',       () => { setMuted(!muted); snd.tap(); go(); });

  if (sc === 'end' && !window._celebrated) {
    // paper falls for the million and nothing else: the album is calm
    if (isMil && banked >= LADDER[LADDER.length - 1].v) { window._celebrated = true; burst(48); }
  }
  if (sc !== 'end') window._celebrated = false;

  /* ── run controls ── */
  on('bshare',  () => { snd.tap(); doShare(); });
  on('bhome',   () => { snd.swipe(); clearInterval(tmr); sc = 'home'; go(); });
  on('bexit',   () => { snd.swipe(); clearInterval(tmr); sc = isMil ? 'home' : 'difficulty'; go(); });
  on('bconf',   confirmAnswer);
  on('bfinal',  lockIn);
  on('bunlock', unlockAnswer);
  on('brep',    () => { snd.swipe(); startGame(); });
  on('bmilrep', () => { snd.rung();  startMilhao(); });
  on('bdiff',   () => { snd.swipe(); sc = 'difficulty'; go(); });
  on('bstop',   cashOut);

  /* ── the ajuda cards ── */
  on('bhalf',   useHalf);
  on('bpoll',   usePoll);
  on('bexpert', useExpert);
  on('bfreeze', useFreeze);
  on('bskip',   useSkip);

  /* ── the ladder sheet (opening it holds the clock) ── */
  on('bladder',      () => { ladderOpen = true;  snd.swipe(); go(); });
  on('bladderclose', () => { ladderOpen = false; snd.swipe(); go(); });

  document.querySelectorAll('.dc').forEach(d => d.addEventListener('click', () => {
    diffKey = d.dataset.key;
    numQs   = parseInt(d.dataset.n);
    snd.select();
    startGame();
  }));

  document.querySelectorAll('.b').forEach(b => b.addEventListener('click', () => {
    if (sc !== 'quiz') return;
    snd.tap();
    const id = b.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    go();
  }));

  if (sc === 'reveal') {
    const rv = document.getElementById('rvl');
    if (rv && lastMsg) rv.innerHTML = lastMsg;
  }

  /* The final number is the one thing the whole run was for, and it simply
     appeared. It counts up instead — fast, under a second, easing out so the
     last few tick slowly. Reduced motion gets the number, not the climb.
     Two of these: points on a training round, reais on the ladder. */
  const endN = document.getElementById('endpts') || document.getElementById('endcash');
  if (endN && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const asMoney = endN.id === 'endcash';
    const show = v => endN.textContent = asMoney ? money(v) : String(v);
    const to = parseInt(endN.dataset.to, 10) || 0;
    if (to > 0) {
      /* the ladder's number is bigger and the moment is bigger, so it takes
         a little longer to arrive */
      const dur = asMoney ? 1250 : 900, t0 = performance.now();
      show(0);
      /* The true score must land whatever happens. requestAnimationFrame stops
         when the tab is backgrounded, so a player who looks away mid-count
         would come back to a number that is not their score. This timer is the
         guarantee; the animation is only the nice part. */
      const land = setTimeout(() => show(to), dur + 120);
      const tick = now => {
        /* clamped at both ends: a rAF callback can carry a timestamp from
           before the one performance.now() handed back, and an unclamped k
           then runs the easing backwards into negative numbers. */
        const k = Math.max(0, Math.min(1, (now - t0) / dur));
        show(Math.round(to * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(tick);
        else clearTimeout(land);
      };
      requestAnimationFrame(tick);
    }
  }
}

/* ═══════════════════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════════════════ */
function startGame() {
  isDaily = false; isSurv = false; isMil = false; _seed = null;
  cat = buildGame(diffKey);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = []; runNew = 0; runNewIds = []; gameN++;
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* ── The "resposta final?" beat ────────────────────────────────
   Confirming does not reveal straight away. The clock stops, the board
   dims to the tiles you picked, and the answer hangs there for a moment
   that gets longer the more money is on the line. From R$ 75.000 up the
   host asks out loud first, and you can still take it back. */
const ASK_FROM_RUNG = 9;

function confirmAnswer() {
  if (sel.size === 0 || sc !== 'quiz') return;
  if (isMil && rung >= ASK_FROM_RUNG) {
    clearInterval(tmr);
    sc = 'ask';
    snd.lock();
    go();
    return;
  }
  lockIn();
}

function unlockAnswer() {          // "deixa eu pensar" — back to the board
  if (sc !== 'ask') return;
  sc = 'quiz';
  snd.swipe();
  startTmr();
  go();
}

function lockIn() {
  clearInterval(tmr);
  sc = 'lock';
  snd.lock();
  go();

  const hold = isMil ? Math.min(2600, 900 + rung * 120) : 700;
  let beats = 0;
  const pulse = setInterval(() => {
    if (++beats > 6 || sc !== 'lock') { clearInterval(pulse); return; }
    snd.heartbeat();
  }, Math.max(260, hold / 5));

  setTimeout(() => { clearInterval(pulse); if (sc === 'lock') doReveal(); }, hold);
}

function doReveal() {
  clearInterval(tmr);
  sc = 'reveal';

  const q     = cat.qs[qi];
  const rs    = new Set(q.a);
  const sa    = [...sel];
  const wrong = sa.filter(id => !rs.has(id)).length;
  const right = sa.filter(id =>  rs.has(id)).length;
  const p     = wrong === 0 && right === rs.size ? 3
              : wrong === 0 && right > 0          ? 1
              :                                     0;

  prevPts = pts;
  if (p === 3) streak++; else streak = 0;
  bestStreak = Math.max(bestStreak, streak);

  /* Getting it right sticks the figurinha in the album for good. */
  const gotNew = p === 3 ? collect(earned(q)) : [];
  runNew += gotNew.length;
  runNewIds.push(...gotNew);

  const { gained, mult, speed } = scoreAnswer(p);
  pts += gained;
  lastGain = gained;
  if (p === 3) nCorrect++; else if (p === 1) nPartial++;
  runLog.push(p);

  if (isMil) {
    if      (p === 3 && isFinal()) snd.fanfare();
    else if (p === 3)              snd.rung();
    else                           snd.drop();
    /* Settle the money now, while we know the answer. The pause that
       follows is only there for the drama — nothing about the outcome
       should depend on a timer firing. */
    if (p !== 3)          banked = safetyNet();
    else if (isFinal())   { banked = LADDER[LADDER.length - 1].v; cashed = true; }
  } else if (p === 3) snd.correct();
  else if (p === 1)   snd.almost();
  else                snd.wrong();

  const chip = (ic, txt) => `<span class="bonus">${ic}${txt}</span>`;
  const bonuses = (speed ? chip(ICON.bolt('var(--pitch)', 10), 'rápido +' + speed) : '')
                + (mult > 1 ? chip(ICON.flame('var(--brass)', 10), 'combo ×' + mult) : '')
                + (DCFG().pmul > 1 ? chip((ICON[DCFG().ic] || ICON.star)(DCFG().col, 10), '×' + DCFG().pmul) : '');

  const rightNames = q.a.map(id => {
    const pool = q.type === 'player' ? PL : CL;
    const hit = pool.find(x => x.id === id);
    return hit ? hit.n : id;
  }).join(', ');

  /* Turn the answer over: one card when there is a single answer, and
     nothing at all on multi-answer questions, where five cards would
     bury the board. */
  const isPl  = q.type === 'player';
  const backs = q.a.length === 1
    ? (() => { const it = (isPl ? PL : CL).find(x => x.id === q.a[0]);
               return it ? stickerBack(it, isPl, gotNew.includes(it.id)) : ''; })()
    : '';

  if (isMil) {
    /* On the ladder there is no half credit: you either climb or you fall. */
    lastMsg = p === 3
      ? `<span class="display good" style="font-size:18px;">${ICON.check('currentColor', 14)} ${
          isFinal() ? 'É o milhão!' : 'Colada! ' + money(RUNG().v)}</span>`
        + (isFinal() ? '' : `<div class="small muted" style="margin-top:3px;">Próximo degrau: ${money(LADDER[rung + 1].v)}</div>`) + backs
      : `<span class="display bad" style="font-size:18px;">${ICON.cross('currentColor', 14)} Essa não era…</span>
         <div class="small muted" style="margin-top:3px;">Era <b class="good">${rightNames}</b>
          · você leva ${money(safetyNet())}</div>` + backs;
  } else {
    lastMsg = (p === 3
      ? `<span class="display good" style="font-size:17px;">${ICON.check('currentColor', 13)} Colada! +${gained}</span>${bonuses}`
      : p === 1
      ? `<span class="display brass" style="font-size:17px;">Quase! +${gained}</span>${bonuses}`
      : `<span class="display bad" style="font-size:17px;">${ICON.cross('currentColor', 13)} Errou!</span>
         <div class="small muted" style="margin-top:3px;">Resposta: <b class="good">${rightNames}</b></div>`) + backs;
  }

  go();
  setTimeout(() => { advanceAfterReveal(p); go(); }, isMil ? 2600 : 2200);
}

/* What happens once the reveal has been on screen long enough: either the
   run moves to the next question or it ends. Split out of doReveal so the
   state machine can be driven without waiting on a timer. */
function advanceAfterReveal(p) {
  if (isMil) {
    if (p !== 3) {                  // fell back to the last checkpoint
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    /* `rung` counts rungs *cleared*, so it advances past the last one too —
       that is what makes the end screen read 16/16 rather than 15/16. */
    rung++;
    if (rung >= LADDER.length) {    // took the million
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    qi++;
    sel.clear(); clearHelpers(); lastMsg = '';
    sc = 'quiz'; tMax = qTime(); tLeft = tMax;
    disp = getDisp(cat.qs[qi]);
    startTmr();
    return;
  }

  if (isSurv && p !== 3) {          // survival: anything short of perfect ends it
    cat.qs = cat.qs.slice(0, qi + 1);
    finishRun();
    return;
  }
  qi++;
  sel.clear();
  clearHelpers();
  lastMsg = '';
  if (isSurv && qi >= cat.qs.length - 2) {
    const more = buildGame(rnd() > .5 ? 'moderado' : 'dificil');
    cat.qs = cat.qs.concat(more.qs);
  }
  if (qi >= cat.qs.length) {
    finishRun();
  } else {
    sc    = 'quiz';
    tMax  = qTime();
    tLeft = tMax;
    disp  = getDisp(cat.qs[qi]);
    startTmr();
  }
}


function finishRun() {
  clearInterval(tmr);
  sc = 'end';
  if (scores[diffKey] === undefined || pts > scores[diffKey]) {
    scores[diffKey] = pts;
    LS.set('scores', scores);
  }
  if (isDaily) saveDaily();
  stats.games    += 1;
  stats.correct  += nCorrect;
  stats.answered += cat.qs.length;
  stats.bestStreak = Math.max(stats.bestStreak || 0, bestStreak);
  const acc = nCorrect / Math.max(1, cat.qs.length);
  if (isMil) {
    stats.milBest  = Math.max(stats.milBest || 0, banked);
    stats.milRung  = Math.max(stats.milRung || 0, rung);
    if (banked >= LADDER[LADDER.length - 1].v) stats.million = (stats.million || 0) + 1;
    if (banked > milBest()) LS.set('milBest', banked);
  } else if (isSurv) {
    stats.survBest = Math.max(stats.survBest || 0, nCorrect);
  } else {
    if (acc === 1) stats.perfect = (stats.perfect || 0) + 1;
    if (diffKey === 'dificil' && acc >= 0.8) stats.hard80 = (stats.hard80 || 0) + 1;
  }
  LS.set('stats', stats);
  window._newMedals = newMedals();
}

function startTmr() {
  clearInterval(tmr);
  tmr = setInterval(() => {
    if (frozen || ladderOpen) return;
    tLeft = Math.max(0, tLeft - 1);
    const tf = document.getElementById('tf');
    if (tf) {
      tf.style.width = (tLeft / tMax * 100) + '%';
      tf.classList.toggle('t-warn', tLeft <= 10 && tLeft > 5);
      tf.classList.toggle('t-bad',  tLeft <= 5);
      if (tLeft <= 5) tf.classList.add('timer-low');
    }
    const cn = document.getElementById('clock-n');
    if (cn) { cn.textContent = tLeft; if (tLeft <= 5) cn.parentElement.classList.add('timer-low'); }
    const rv = document.getElementById('revimg');
    if (rv && sc === 'quiz') rv.style.filter = 'blur(' + (20 * (tLeft / tMax)).toFixed(1) + 'px)';
    if (tLeft <= 0 && sc === 'quiz') doReveal();
  }, 1000);
}

/* ── Boot ── */
go();

/* ── Service Worker registration ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(() => {}); // silently fail (e.g. file:// protocol)
  });
}
</script>
</body>

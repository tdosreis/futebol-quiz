  if (sc === 'end' && isMil) {
    const won     = banked >= LADDER[LADDER.length - 1].v;
    const cleared = rung;                       // rungs actually banked
    const tone    = won ? 'var(--gold)' : banked > 0 ? 'var(--win)' : 'var(--lose)';
    const head    = won     ? 'UM MILHÃO!'
                  : cashed  ? 'VOCÊ PAROU A TEMPO'
                  : banked  ? 'CAIU, MAS LEVOU'
                  :           'FIM DE JOGO';
    const sub     = won
      ? 'Dezesseis perguntas, dezesseis acertos. Não dá pra ir mais longe.'
      : cashed
      ? 'Saiu com o dinheiro na mão — decisão de quem sabe a hora.'
      : banked
      ? `Errou a pergunta de ${money(LADDER[Math.min(rung, LADDER.length - 1)].v)} — o degrau garantido segurou.`
      : 'Escorregou antes do primeiro degrau garantido. Da próxima, considere parar.';

    return `
    <div class="scroll-y" style="display:flex;flex-direction:column;align-items:center;
      justify-content:center;min-height:500px;padding:26px 22px;text-align:center;gap:9px;">

      <div style="font-size:10px;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.35);
        font-family:'Inter',system-ui;">RUMO AO MILHÃO · DEGRAU ${cleared}/${LADDER.length}</div>

      <div style="font-size:26px;font-weight:900;color:${tone};letter-spacing:2px;
        font-family:'Bebas Neue','Impact',sans-serif;">${head}</div>

      <div class="prize-pop ${banked > 0 ? 'goldgrad' : ''}"
        style="font-size:${banked >= 100000 ? 46 : 54}px;font-weight:900;line-height:1;
        font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:1px;
        ${banked > 0 ? '' : 'color:rgba(255,255,255,.3);'}">${money(banked)}</div>

      <p style="font-size:12px;color:rgba(255,255,255,.45);margin:2px 0 0;max-width:290px;
        line-height:1.6;font-family:'Inter',system-ui;">${sub}</p>

      <!-- the climb, rung by rung -->
      <div style="display:flex;gap:2px;align-items:center;width:100%;max-width:300px;margin:6px 0;">
        ${LADDER.map((step, i) => `<span class="notch${i < rung ? ' notch-done' : ''}${
          step.safe ? ' notch-safe' : ''}"></span>`).join('')}
      </div>

      <div style="display:flex;gap:16px;font-family:'Inter',system-ui;">
        <div><div style="font-size:17px;font-weight:900;color:#fff;">${nCorrect}</div>
          <div style="font-size:9px;color:rgba(255,255,255,.3);letter-spacing:1px;">ACERTOS</div></div>
        <div><div style="font-size:17px;font-weight:900;color:#fff;">${pts}</div>
          <div style="font-size:9px;color:rgba(255,255,255,.3);letter-spacing:1px;">PONTOS</div></div>
        <div><div style="font-size:17px;font-weight:900;color:var(--gold);">${money(Math.max(milBest(), banked))}</div>
          <div style="font-size:9px;color:rgba(255,255,255,.3);letter-spacing:1px;">RECORDE</div></div>
      </div>

      ${(window._newMedals || []).length ? `<div style="display:flex;flex-direction:column;
        gap:4px;margin-top:6px;align-items:center;">
        ${window._newMedals.map(m => `<div style="display:flex;align-items:center;gap:7px;
          background:rgba(255,200,69,.12);border:1px solid rgba(255,200,69,.4);
          border-radius:20px;padding:4px 13px;">
          <span style="font-size:16px;">${m.ic}</span>
          <span style="font-size:11px;font-weight:800;color:var(--gold);
            font-family:'Inter',system-ui;">Nova medalha: ${m.n}</span>
        </div>`).join('')}
      </div>` : ''}

      <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap;justify-content:center;">
        <button id="bshare" class="btn-press" style="background:#25D366;color:#fff;font-size:13px;
          font-weight:900;padding:10px 20px;border-radius:20px;border:none;cursor:pointer;
          font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:2px;">COMPARTILHAR</button>
        <button id="bmilrep" class="btn-press" style="
          background:linear-gradient(180deg,#FFF0B0,#FFC845 45%,#D9A000);color:#0b1136;
          font-size:14px;font-weight:900;padding:10px 22px;border-radius:20px;border:none;
          cursor:pointer;font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:2px;">
          DE NOVO</button>
        <button id="bhome" class="btn-press" style="background:rgba(255,255,255,.08);color:#fff;
          font-size:12px;font-weight:700;padding:10px 18px;border-radius:20px;border:none;
          cursor:pointer;font-family:'Inter',system-ui;">Início</button>
      </div>
    </div>`;
  }

  /* ── End Screen ── */
  if (sc === 'end') {
    const total = cat.qs.length;
    const pct = Math.round(nCorrect / total * 100);
    const [em, msg] = pct >= 80 ? ['🏆','Craque!'] : pct >= 50 ? ['⚽','Boa jogada!'] : ['😅','Treina mais!'];
    const isRecord = scores[diffKey] !== undefined && pts === scores[diffKey] && pts > 0;
    const curDiff  = DIFFS.find(d => d.key === diffKey);
    return `
    <div style="display:flex;flex-direction:column;align-items:center;
      justify-content:center;min-height:500px;padding:2rem;text-align:center;gap:10px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:2px;
        color:${curDiff.col};font-family:'Inter',system-ui;">
        ${isSurv ? `🛡️ MATA-MATA · ${nCorrect} ${nCorrect === 1 ? 'acerto' : 'acertos'} seguidos`
                 : `${curDiff.emoji} ${curDiff.label.toUpperCase()} · ${cat.qs.length} perguntas`}</div>
      <div style="font-size:52px;margin:4px 0;filter:drop-shadow(0 2px 12px rgba(0,0,0,.5));">${em}</div>
      <div style="font-size:28px;font-weight:800;color:#FFD700;
        font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:2px;">${msg}</div>
      <div style="font-size:68px;font-weight:900;color:#fff;line-height:1;
        font-family:'Bebas Neue','Impact',sans-serif;">${pts}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.35);font-family:'Inter',system-ui;">
        pontos · ${nCorrect}/${total} acertos (${pct}%)</div>
      ${bestStreak >= 3 ? `<div style="font-size:12px;color:#FF7700;font-weight:700;
        font-family:'Inter',system-ui;">🔥 melhor sequência: ${bestStreak}</div>` : ''}
      <div style="width:200px;height:6px;background:rgba(255,255,255,.1);
        border-radius:3px;overflow:hidden;margin:4px 0;">
        <div style="height:100%;width:${pct}%;background:${curDiff.col};border-radius:3px;
          transition:width 1s ease-out;"></div>
      </div>
      ${isRecord ? `<div style="font-size:12px;font-weight:800;color:#FFD700;
        font-family:'Inter',system-ui;">🌟 Novo recorde!</div>` : ''}
      ${(window._newMedals || []).length ? `<div style="display:flex;flex-direction:column;
        gap:4px;margin-top:8px;align-items:center;">
        ${window._newMedals.map(m => `<div style="display:flex;align-items:center;gap:7px;
          background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.4);
          border-radius:20px;padding:4px 13px;">
          <span style="font-size:16px;">${m.ic}</span>
          <span style="font-size:11px;font-weight:800;color:#FFD700;
            font-family:'Inter',system-ui;">Nova medalha: ${m.n}</span>
        </div>`).join('')}
      </div>` : ''}
      <div style="display:flex;gap:3px;margin-top:8px;font-size:15px;letter-spacing:1px;">
        ${runLog.map(p => p === 3 ? '🟩' : p === 1 ? '🟨' : p === -1 ? '⬜' : '⬛').join('')}</div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;">
        <button id="bshare" style="background:#25D366;color:#fff;font-size:13px;
          font-weight:900;padding:10px 22px;border-radius:20px;border:none;cursor:pointer;
          font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:2px;">COMPARTILHAR</button>
        <button id="brep" style="background:${curDiff.col};color:#fff;font-size:14px;
          font-weight:900;padding:10px 24px;border-radius:20px;border:none;cursor:pointer;
          font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:2px;">
          JOGAR DE NOVO</button>
        <button id="bdiff" style="background:rgba(255,255,255,.09);color:#fff;font-size:13px;
          font-weight:700;padding:10px 20px;border-radius:20px;border:none;cursor:pointer;
          font-family:'Inter',system-ui;">
          Mudar dificuldade</button>
      </div>
    </div>`;
  }

  /* ── Quiz / Reveal ── */
  const q    = cat.qs[qi];
  const qcat = q._cat || cat;          // source category for label / colour
  const tpct = (tLeft / tMax) * 100;
  // on the ladder the clock is gold like everything else that costs money
  const tc   = tLeft > 10 ? (isMil ? '#FFC845' : qcat.col) : tLeft > 5 ? '#FF9800' : '#F44336';
  const timerCls = tLeft <= 5 ? 'timer-low' : '';

  const portSVG = q.port
    ? `<div style="flex-shrink:0;width:54px;height:54px;border-radius:50%;overflow:hidden;
        border:2px solid rgba(255,255,255,.18);box-shadow:0 2px 12px rgba(0,0,0,.5);">
        <img src="${PORT_IMGS[q.port]}" alt="${PORT[q.port].name}"
          style="width:100%;height:100%;object-fit:cover;object-position:top;" /></div>` : '';
  const stadSVG = q.stad
    ? `<div style="flex-shrink:0;width:88px;height:56px;border-radius:8px;overflow:hidden;
        border:1px solid rgba(255,255,255,.12);box-shadow:0 2px 12px rgba(0,0,0,.5);">
        <img src="${STAD_IMGS[q.stad]}" alt="${STAD[q.stad].name}"
          style="width:100%;height:100%;object-fit:cover;" /></div>` : '';
  const faceEl = q.face
    ? `<div style="flex-shrink:0;width:56px;height:56px;border-radius:50%;overflow:hidden;
        border:2px solid rgba(255,255,255,.2);box-shadow:0 2px 12px rgba(0,0,0,.55);">
        <img src="${q.face}" alt="" aria-hidden="true"
          style="width:100%;height:100%;object-fit:cover;object-position:top center;"
          onerror="this.parentElement.style.display='none'" /></div>` : '';
  const crestEl = q.crest
    ? `<div style="flex-shrink:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;">
        ${clubArt(q.crest, 'max-width:100%;max-height:100%;object-fit:contain;', true)}</div>` : '';
  const qimgEl = q.qimg
    ? `<div style="flex-shrink:0;width:96px;height:64px;border-radius:8px;overflow:hidden;
        border:1px solid rgba(255,255,255,.15);box-shadow:0 2px 12px rgba(0,0,0,.6);">
        <img src="${q.qimg}" alt="Momento do jogo referido na pergunta"
          style="width:100%;height:100%;object-fit:cover;"
          onerror="this.parentElement.style.display='none'" /></div>` : '';

  const scoreChanged = pts !== prevPts;
  const armed = sc === 'quiz';           // the board is accepting taps

  /* ── The rail: sixteen notches, one per rung, checkpoints picked out ── */
  const prizeRail = !isMil ? '' : `
    <div style="display:flex;gap:2px;align-items:center;">
      ${LADDER.map((step, i) => `<span class="notch${
        i < rung ? ' notch-done' : ''}${step.safe ? ' notch-safe' : ''}${
        i === rung ? ' notch-now' : ''}"></span>`).join('')}
    </div>`;

  /* ── What this question is worth, and what you keep if it goes wrong ── */
  const stakes = !isMil ? '' : `
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;">
      <div style="min-width:0;">
        <div style="font-size:9px;letter-spacing:2.5px;color:rgba(255,255,255,.35);
          font-weight:800;font-family:'Inter',system-ui;">
          PERGUNTA ${rung + 1} DE ${LADDER.length}${isFinal() ? ' · A ÚLTIMA' : ''}</div>
        <div class="prize-pop goldgrad stakes-v" style="font-size:27px;font-weight:900;line-height:1.05;
          font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:1.5px;">
          ${money(RUNG().v)}</div>
      </div>
      <button id="bladder" class="btn-press" style="background:rgba(255,255,255,.05);
        border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:5px 9px;
        cursor:pointer;text-align:right;flex-shrink:0;
        display:flex;align-items:center;gap:7px;">
        <div>
          <div style="font-size:8px;letter-spacing:1.5px;color:rgba(255,255,255,.3);
            font-weight:800;font-family:'Inter',system-ui;">GARANTIDO</div>
          <div style="font-size:12px;font-weight:900;color:${safetyNet() ? 'var(--win)' : 'rgba(255,255,255,.3)'};
            font-family:'Inter',system-ui;">${safetyNet() ? money(safetyNet()) : '—'}</div>
        </div>
        ${ICON.ladder('rgba(255,255,255,.4)', 15)}
      </button>
    </div>`;

  /* ── The pundit's line, if he was called ── */
  const expertBox = !(expert && armed) ? '' : `
    <div class="expert-box" style="display:flex;align-items:center;gap:9px;
      background:rgba(171,71,188,.12);border:1px solid rgba(171,71,188,.38);
      border-radius:11px;padding:7px 11px;">
      ${ICON.mic('#CE93D8', 16)}
      <p style="font-size:11px;color:#E1BEE7;margin:0;line-height:1.45;
        font-family:'Inter',system-ui;">
        <em style="opacity:.75;">${expert.line}</em>
        <strong style="color:#fff;">${expert.name}</strong>${
        expert.sure ? '' : ' <span style="opacity:.6;">— mas é chute, hein.</span>'}</p>
    </div>`;

  /* ── The five cards ── */
  const ajudas = [
    ['bhalf',   'Cortar',   ICON.cut,  lifes.half && cutCount() >= 1],
    ['bpoll',   'Placar',   ICON.crowd, lifes.poll],
    ['bexpert', 'Convidado',ICON.mic,  lifes.expert],
    ['bfreeze', 'Congelar', ICON.snow, lifes.freeze],
    ['bskip',   'Pular',    ICON.skip, lifes.skip],
  ];

  return `
  <div class="qz-screen" style="padding:13px;display:flex;flex-direction:column;gap:9px;
    min-height:500px;position:relative;">

    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="display:flex;align-items:center;gap:7px;min-width:0;">
        <button id="bexit" style="background:rgba(255,255,255,.07);border:none;
          color:rgba(255,255,255,.4);font-size:11px;padding:4px 10px;
          border-radius:12px;cursor:pointer;font-family:'Inter',system-ui;
          display:flex;align-items:center;">${ICON.close('currentColor', 12)}</button>
        <div style="background:${qcat.col}18;border:1px solid ${qcat.col}30;
          border-radius:16px;padding:3px 10px;font-size:10px;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis;
          font-weight:700;color:${qcat.col};font-family:'Inter',system-ui;
          display:flex;align-items:center;gap:4px;">${catIcon(qcat)}<span>${qcat.name}</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:7px;flex-shrink:0;">
        ${streak > 1
          ? `<div class="fire-bob" style="background:rgba(255,100,0,.14);border:1px solid rgba(255,100,0,.22);
              border-radius:12px;padding:2px 8px;font-size:11px;
              color:#FF7700;font-weight:700;font-family:'Inter',system-ui;">🔥${streak}x</div>` : ''}
        ${isMil ? '' : `<div style="display:flex;align-items:center;gap:3px;max-width:104px;flex-wrap:wrap;
          justify-content:flex-end;">
          ${cat.qs.length <= 20 ? cat.qs.map((_, i) => {
              const cls = i < runLog.length ? (runLog[i] === 3 ? 'pdot pdot-on'
                        : runLog[i] === 0 ? 'pdot pdot-miss' : 'pdot pdot-on')
                        : (i === qi ? 'pdot pdot-cur' : 'pdot');
              return `<span class="${cls}"></span>`;
            }).join('')
          : `<span style="font-size:11px;color:rgba(255,255,255,.32);
               font-family:'Inter',system-ui;">${qi+1}/${cat.qs.length}</span>`}
        </div>`}
        ${isMil
          /* money is the score here, so the corner shows the clock instead */
          ? `<div class="${tLeft <= 5 ? 'timer-low' : ''}" style="display:flex;align-items:center;
              gap:4px;color:${tLeft > 5 ? 'rgba(255,255,255,.62)' : '#F44336'};">
              ${ICON.clock('currentColor', 13)}
              <span id="clock-n" style="font-size:17px;font-weight:900;letter-spacing:.5px;
                font-family:'Bebas Neue','Impact',sans-serif;">${tLeft}</span>
            </div>`
          : `<div id="score-disp" class="${scoreChanged ? 'score-up' : ''}"
              style="position:relative;font-size:18px;font-weight:900;color:var(--gold);
                font-family:'Bebas Neue','Impact',sans-serif;letter-spacing:1px;">${
              sc === 'reveal' && lastGain > 0 ? `<span class="gain">+${lastGain}</span>` : ''}${pts}
              <span style="font-size:9px;margin-left:1px;color:rgba(255,200,69,.45);
                font-family:'Inter',system-ui;font-weight:600;">pts</span>
            </div>`}
      </div>
    </div>

    ${prizeRail}
    ${stakes}

    <!-- Timer bar -->
    <div style="height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;">
      <div id="tf" class="${timerCls} ${armed ? 'tf-live' : ''}" style="height:100%;width:${tpct}%;
        background-color:${tc};border-radius:2px;transition:width .8s linear;"></div>
    </div>

    <!-- Progressive photo reveal -->
    ${q.reveal ? `
    <div style="display:flex;justify-content:center;padding:2px 0 4px;">
      <div class="reveal-box" style="width:144px;height:144px;border-radius:14px;overflow:hidden;
        border:2px solid rgba(255,200,69,.3);box-shadow:0 6px 26px rgba(0,0,0,.7);
        position:relative;background:#0b1136;">
        <img id="revimg" src="${q.reveal}" alt="" aria-hidden="true"
          style="width:100%;height:100%;object-fit:cover;object-position:top center;
            filter:blur(${sc === 'reveal' ? 0 : (20 * (tLeft / tMax)).toFixed(1)}px);
            transform:scale(1.08);transition:filter .9s linear;" />
      </div>
    </div>` : ''}

    <!-- The plaque -->
    <div class="plaque">
      <div class="plaque-in">
        ${portSVG}${stadSVG}${faceEl}${crestEl}${qimgEl}
        <p style="font-size:15px;font-weight:600;color:#fff;line-height:1.45;
          margin:0;flex:1;min-width:0;overflow-wrap:anywhere;
          font-family:'Inter',system-ui;white-space:pre-line;
          text-shadow:0 1px 6px rgba(0,0,0,.6);">${q.t}</p>
      </div>
    </div>

    ${expertBox}

    <!-- Option grid — 2 wide columns for name tiles, 5 for crest/face tiles -->
    <div style="display:grid;grid-template-columns:repeat(${
      q.textTiles ? 2 : disp.length <= 4 ? 2 : 5},1fr);gap:${disp.length <= 4 ? 12 : 7}px;">
      ${disp.map((c, i) => badge(c, i)).join('')}
    </div>

    <!-- Footer -->
    ${armed ? `
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px;">
      <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;">
        ${ajudas.map(([id, lbl, ic, on]) => `
          <button id="${id}" ${on ? '' : 'disabled'} class="btn-press ajuda" style="
            background:${on ? 'linear-gradient(180deg,rgba(255,200,69,.16),rgba(255,200,69,.05))'
                            : 'rgba(255,255,255,.02)'};
            border:1px solid ${on ? 'rgba(255,200,69,.38)' : 'rgba(255,255,255,.05)'};
            color:${on ? 'rgba(255,255,255,.88)' : 'rgba(255,255,255,.16)'};
            border-radius:12px;padding:5px 9px;font-size:9.5px;font-weight:800;
            cursor:${on ? 'pointer' : 'default'};font-family:'Inter',system-ui;
            display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;
            ${on ? '' : 'text-decoration:line-through;'}">
            ${ic(on ? '#FFC845' : 'rgba(255,255,255,.16)', 15)}${lbl}</button>`).join('')}
      </div>
      ${frozen ? `<div style="font-size:10px;color:#4FC3F7;font-weight:700;
        font-family:'Inter',system-ui;display:flex;align-items:center;gap:4px;">
        ${ICON.snow('#4FC3F7', 11)} Relógio parado nesta pergunta</div>` : ''}
      <p class="footer-hint" style="font-size:10px;color:rgba(255,255,255,.24);margin:0;
        text-align:center;font-family:'Inter',system-ui;">
        ${q.type === 'player'
          ? (q.a.length > 1 ? `Marque os ${q.a.length} jogadores certos` : 'Marque o jogador certo')
          : (q.a.length > 1 ? `Marque os ${q.a.length} times certos`     : 'Marque o time certo')
        }</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;">
        <button id="bconf" ${sel.size ? '' : 'disabled'} class="btn-press" style="
            background:${sel.size > 0
              ? 'linear-gradient(180deg,#FFF0B0,#FFC845 45%,#D9A000)'
              : 'rgba(255,255,255,.06)'};
            color:${sel.size > 0 ? '#0b1136' : 'rgba(255,255,255,.2)'};
            font-size:17px;font-weight:900;padding:11px 38px;
            border-radius:24px;border:none;
            box-shadow:${sel.size > 0 ? '0 5px 20px rgba(255,200,69,.3)' : 'none'};
            cursor:${sel.size > 0 ? 'pointer' : 'default'};
            letter-spacing:2px;transition:all .18s;
            font-family:'Bebas Neue','Impact',sans-serif;">CONFIRMAR</button>
        ${isMil && rung > 0 ? `
        <button id="bstop" class="btn-press" style="
            background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
            color:rgba(255,255,255,.7);font-size:11px;font-weight:800;
            padding:9px 15px;border-radius:22px;cursor:pointer;
            font-family:'Inter',system-ui;display:flex;align-items:center;gap:5px;">
          ${ICON.stop('rgba(255,255,255,.7)', 14)}PARAR · ${money(LADDER[rung - 1].v)}</button>` : ''}
      </div>
    </div>`
    : sc === 'ask' ? `
    <div style="display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:6px;">
      <div style="font-size:22px;font-weight:900;color:var(--gold);letter-spacing:2px;
        font-family:'Bebas Neue','Impact',sans-serif;text-align:center;">
        ESSA É A SUA RESPOSTA FINAL?</div>
      <p style="font-size:11px;color:rgba(255,255,255,.42);margin:0;text-align:center;
        font-family:'Inter',system-ui;max-width:300px;line-height:1.5;">
        Está valendo <strong style="color:var(--gold);">${money(RUNG().v)}</strong>.
        Se errar, você sai com ${money(safetyNet())}.</p>
      <div style="display:flex;gap:9px;">
        <button id="bfinal" class="btn-press" style="
          background:linear-gradient(180deg,#FFF0B0,#FFC845 45%,#D9A000);color:#0b1136;
          font-size:16px;font-weight:900;padding:11px 30px;border-radius:24px;border:none;
          box-shadow:0 5px 20px rgba(255,200,69,.32);cursor:pointer;letter-spacing:2px;
          font-family:'Bebas Neue','Impact',sans-serif;">É ESSA</button>
        <button id="bunlock" class="btn-press" style="
          background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
          color:rgba(255,255,255,.7);font-size:12px;font-weight:800;
          padding:11px 18px;border-radius:24px;cursor:pointer;
          font-family:'Inter',system-ui;">Deixa eu pensar</button>
      </div>
    </div>`
    : sc === 'lock' ? `
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0;">
      <div class="timer-low" style="font-size:15px;font-weight:900;color:var(--gold);
        letter-spacing:3px;font-family:'Bebas Neue','Impact',sans-serif;">RESPOSTA TRAVADA</div>
      <div style="font-size:10px;color:rgba(255,255,255,.3);
        font-family:'Inter',system-ui;">${isMil ? money(RUNG().v) + ' na mesa…' : 'vamos ver…'}</div>
    </div>`
    : `<div style="text-align:center;padding:6px 0;" id="rvl"></div>`}

    ${(sc === 'ask' || sc === 'lock') ? '<div class="stage-dark"></div>' : ''}
    ${ladderOpen ? ladderOverlay() : ''}
  </div>`;
}

/* ── The full ladder, as a sheet over the board ──────────────────
   Opening it stops the clock: checking where you stand is not
   something the player should have to pay for in seconds. */
function ladderOverlay() {
  return `
  <div style="position:absolute;inset:0;z-index:20;
    background:linear-gradient(180deg,#0a1030 0%,#04071a 100%);
    display:flex;flex-direction:column;padding:14px;gap:8px;
    animation:screenIn .18s ease-out;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:12px;font-weight:900;letter-spacing:2px;color:var(--gold);
        font-family:'Inter',system-ui;">A ESCADA DO MILHÃO</span>
      <button id="bladderclose" style="background:rgba(255,255,255,.08);border:none;
        color:rgba(255,255,255,.6);padding:5px 9px;border-radius:10px;cursor:pointer;
        display:flex;align-items:center;">${ICON.close('currentColor', 13)}</button>
    </div>
    <div class="scroll-y" style="flex:1;display:flex;flex-direction:column-reverse;
      justify-content:flex-end;gap:2px;">
      ${LADDER.map((step, i) => {
        const state = i < rung ? 'rung-done' : i === rung ? 'rung-now'
                    : step.safe ? 'rung-safe' : '';
        const top = i === LADDER.length - 1 ? ' rung-top' : '';
        return `<div class="rung ${state}${top}">
          <span class="rung-n">${i + 1}</span>
          ${step.safe ? ICON.shield(i < rung ? '#00e676' : 'rgba(255,255,255,.35)', 11)
                      : '<span style="width:11px;"></span>'}
          <span style="flex:1;">${money(step.v)}</span>
          ${i < rung ? ICON.check('#00e676', 12) : ''}
        </div>`;
      }).join('')}
    </div>
    <p style="font-size:10px;color:rgba(255,255,255,.32);margin:0;text-align:center;
      line-height:1.5;font-family:'Inter',system-ui;">
      ${ICON.shield('rgba(255,255,255,.32)', 10)} são os degraus garantidos —
      passou de um, esse dinheiro é seu aconteça o que acontecer.</p>
  </div>`;
}


/* ── Confetti (pure DOM, no library) ── */
function burst(n) {
  // money falls gold; everything else gets the party mix
  const cols = isMil
    ? ['#FFD700','#FFF0B0','#FFC845','#D9A000','#FFFFFF','#FFE469']
    : ['#FFD700','#00e676','#4FC3F7','#FF7043','#FFFFFF','#AB47BC'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = cols[(Math.random() * cols.length) | 0];
    d.style.setProperty('--dx', ((Math.random() * 160) - 80).toFixed(0) + 'px');
    d.style.setProperty('--rot', ((Math.random() * 900) + 360).toFixed(0) + 'deg');
    d.style.animationDuration = (1.9 + Math.random() * 1.5).toFixed(2) + 's';
    d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    if (Math.random() > .6) d.style.borderRadius = '50%';
    frag.appendChild(d);
  }
  document.body.appendChild(frag);
  setTimeout(() => document.querySelectorAll('.conf').forEach(e => e.remove()), 4200);
}

/* ═══════════════════════════════════════════════════
   RENDER + EVENT BINDING
═══════════════════════════════════════════════════ */
function go() {
  prevPts = pts; // snapshot before render (score-up only fires once)
  document.getElementById('ct').innerHTML = html();
  prevPts = pts; // prevent re-fire on subsequent re-renders without score change

  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);

  /* ── home ── */
  on('mil-btn',     () => { snd.rung();   startMilhao(); });
  on('cta-btn',     () => { snd.swipe();  sc = 'difficulty'; go(); });
  on('daily-btn',   () => { snd.select(); startDaily(); });
  on('surv-btn',    () => { snd.select(); startSurvival(); });
  on('bcred',       () => { snd.swipe();  sc = 'credits'; go(); });
  on('bmed',        () => { snd.swipe();  sc = 'medals';  go(); });
  on('medal-strip', () => { snd.swipe();  sc = 'medals';  go(); });
  on('bmute',       () => { setMuted(!muted); snd.tap(); go(); });

  if (sc === 'end' && !window._celebrated) {
    if (isMil) {
      // gold rain for the million, a modest handful for any other payout
      if (banked >= LADDER[LADDER.length - 1].v) { window._celebrated = true; burst(120); }
      else if (banked > 0)                       { window._celebrated = true; burst(30); }
    } else {
      const acc = nCorrect / Math.max(1, cat.qs.length);
      if (acc >= 0.7) { window._celebrated = true; burst(acc >= 0.9 ? 70 : 42); }
    }
  }
  if (sc !== 'end') window._celebrated = false;

  /* ── run controls ── */
  on('bshare',  () => { snd.tap(); doShare(); });
  on('bhome',   () => { snd.swipe(); clearInterval(tmr); sc = 'home'; go(); });
  on('bexit',   () => { snd.swipe(); clearInterval(tmr); sc = isMil ? 'home' : 'difficulty'; go(); });
  on('bconf',   confirmAnswer);
  on('bfinal',  lockIn);
  on('bunlock', unlockAnswer);
  on('brep',    () => { snd.swipe(); startGame(); });
  on('bmilrep', () => { snd.rung();  startMilhao(); });
  on('bdiff',   () => { snd.swipe(); sc = 'difficulty'; go(); });
  on('bstop',   cashOut);

  /* ── the ajuda cards ── */
  on('bhalf',   useHalf);
  on('bpoll',   usePoll);
  on('bexpert', useExpert);
  on('bfreeze', useFreeze);
  on('bskip',   useSkip);

  /* ── the ladder sheet (opening it holds the clock) ── */
  on('bladder',      () => { ladderOpen = true;  snd.swipe(); go(); });
  on('bladderclose', () => { ladderOpen = false; snd.swipe(); go(); });

  document.querySelectorAll('.dc').forEach(d => d.addEventListener('click', () => {
    diffKey = d.dataset.key;
    numQs   = parseInt(d.dataset.n);
    snd.select();
    startGame();
  }));

  document.querySelectorAll('.b').forEach(b => b.addEventListener('click', () => {
    if (sc !== 'quiz') return;
    snd.tap();
    const id = b.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    go();
  }));

  if (sc === 'reveal') {
    const rv = document.getElementById('rvl');
    if (rv && lastMsg) rv.innerHTML = lastMsg;
  }
}

/* ═══════════════════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════════════════ */
function startGame() {
  isDaily = false; isSurv = false; isMil = false; _seed = null;
  cat = buildGame(diffKey);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = [];
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* ── The "resposta final?" beat ────────────────────────────────
   Confirming does not reveal straight away. The clock stops, the board
   dims to the tiles you picked, and the answer hangs there for a moment
   that gets longer the more money is on the line. From R$ 75.000 up the
   host asks out loud first, and you can still take it back. */
const ASK_FROM_RUNG = 9;

function confirmAnswer() {
  if (sel.size === 0 || sc !== 'quiz') return;
  if (isMil && rung >= ASK_FROM_RUNG) {
    clearInterval(tmr);
    sc = 'ask';
    snd.lock();
    go();
    return;
  }
  lockIn();
}

function unlockAnswer() {          // "deixa eu pensar" — back to the board
  if (sc !== 'ask') return;
  sc = 'quiz';
  snd.swipe();
  startTmr();
  go();
}

function lockIn() {
  clearInterval(tmr);
  sc = 'lock';
  snd.lock();
  go();

  const hold = isMil ? Math.min(2600, 900 + rung * 120) : 700;
  let beats = 0;
  const pulse = setInterval(() => {
    if (++beats > 6 || sc !== 'lock') { clearInterval(pulse); return; }
    snd.heartbeat();
  }, Math.max(260, hold / 5));

  setTimeout(() => { clearInterval(pulse); if (sc === 'lock') doReveal(); }, hold);
}

function doReveal() {
  clearInterval(tmr);
  sc = 'reveal';

  const q     = cat.qs[qi];
  const rs    = new Set(q.a);
  const sa    = [...sel];
  const wrong = sa.filter(id => !rs.has(id)).length;
  const right = sa.filter(id =>  rs.has(id)).length;
  const p     = wrong === 0 && right === rs.size ? 3
              : wrong === 0 && right > 0          ? 1
              :                                     0;

  prevPts = pts;
  if (p === 3) streak++; else streak = 0;
  bestStreak = Math.max(bestStreak, streak);

  const { gained, mult, speed } = scoreAnswer(p);
  pts += gained;
  lastGain = gained;
  if (p === 3) nCorrect++; else if (p === 1) nPartial++;
  runLog.push(p);

  if (isMil) {
    if      (p === 3 && isFinal()) snd.fanfare();
    else if (p === 3)              snd.rung();
    else                           snd.drop();
    /* Settle the money now, while we know the answer. The pause that
       follows is only there for the drama — nothing about the outcome
       should depend on a timer firing. */
    if (p !== 3)          banked = safetyNet();
    else if (isFinal())   { banked = LADDER[LADDER.length - 1].v; cashed = true; }
  } else if (p === 3) snd.correct();
  else if (p === 1)   snd.almost();
  else                snd.wrong();

  const chip = (txt, col) => `<span style="display:inline-block;background:${col}22;
      border:1px solid ${col}44;color:${col};border-radius:9px;padding:1px 7px;
      font-size:10px;font-weight:700;margin-left:4px;
      font-family:'Inter',system-ui;">${txt}</span>`;
  const bonuses = (speed ? chip('⚡ rápido +' + speed, '#4FC3F7') : '')
                + (mult > 1 ? chip('🔥 combo ×' + mult, '#FF7700') : '')
                + (DCFG().pmul > 1 ? chip(DCFG().emoji + ' ×' + DCFG().pmul, DCFG().col) : '');

  const rightNames = q.a.map(id => {
    const pool = q.type === 'player' ? PL : CL;
    const hit = pool.find(x => x.id === id);
    return hit ? hit.n : id;
  }).join(', ');

  if (isMil) {
    /* On the ladder there is no half credit: you either climb or you fall. */
    lastMsg = p === 3
      ? `<span style="font-size:16px;font-weight:900;color:#00e676;
          font-family:'Inter',system-ui;">${ICON.check('#00e676', 13)} ${
          isFinal() ? 'É O MILHÃO!' : 'Certíssimo! ' + money(RUNG().v)}</span>`
        + (isFinal() ? '' : `<div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;
            font-family:'Inter',system-ui;">Próximo degrau: ${money(LADDER[rung + 1].v)}</div>`)
      : `<span style="font-size:16px;font-weight:900;color:#f44336;
          font-family:'Inter',system-ui;">${ICON.cross('#f44336', 13)} Essa não era…</span>
         <div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;
          font-family:'Inter',system-ui;">Era <strong style="color:#00e676;">${rightNames}</strong>
          · você leva ${money(safetyNet())}</div>`;
  } else {
    lastMsg = p === 3
      ? `<span style="font-size:15px;font-weight:800;color:#00e676;
          font-family:'Inter',system-ui;">${ICON.check('#00e676', 12)} Perfeito! +${gained}</span>${bonuses}`
      : p === 1
      ? `<span style="font-size:15px;font-weight:800;color:#FFD700;
          font-family:'Inter',system-ui;">~ Quase! +${gained}</span>${bonuses}`
      : `<span style="font-size:15px;font-weight:800;color:#f44336;
          font-family:'Inter',system-ui;">${ICON.cross('#f44336', 12)} Errou!</span>
         <div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;
          font-family:'Inter',system-ui;">Resposta: <strong style="color:#00e676;">${rightNames}</strong></div>`;
  }

  go();
  setTimeout(() => { advanceAfterReveal(p); go(); }, isMil ? 2600 : 2200);
}

/* What happens once the reveal has been on screen long enough: either the
   run moves to the next question or it ends. Split out of doReveal so the
   state machine can be driven without waiting on a timer. */
function advanceAfterReveal(p) {
  if (isMil) {
    if (p !== 3) {                  // fell back to the last checkpoint
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    /* `rung` counts rungs *cleared*, so it advances past the last one too —
       that is what makes the end screen read 16/16 rather than 15/16. */
    rung++;
    if (rung >= LADDER.length) {    // took the million
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    qi++;
    sel.clear(); clearHelpers(); lastMsg = '';
    sc = 'quiz'; tMax = qTime(); tLeft = tMax;
    disp = getDisp(cat.qs[qi]);
    startTmr();
    return;
  }

  if (isSurv && p !== 3) {          // survival: anything short of perfect ends it
    cat.qs = cat.qs.slice(0, qi + 1);
    finishRun();
    return;
  }
  qi++;
  sel.clear();
  clearHelpers();
  lastMsg = '';
  if (isSurv && qi >= cat.qs.length - 2) {
    const more = buildGame(rnd() > .5 ? 'moderado' : 'dificil');
    cat.qs = cat.qs.concat(more.qs);
  }
  if (qi >= cat.qs.length) {
    finishRun();
  } else {
    sc    = 'quiz';
    tMax  = qTime();
    tLeft = tMax;
    disp  = getDisp(cat.qs[qi]);
    startTmr();
  }
}


function finishRun() {
  clearInterval(tmr);
  sc = 'end';
  if (scores[diffKey] === undefined || pts > scores[diffKey]) {
    scores[diffKey] = pts;
    LS.set('scores', scores);
  }
  if (isDaily) saveDaily();
  stats.games    += 1;
  stats.correct  += nCorrect;
  stats.answered += cat.qs.length;
  stats.bestStreak = Math.max(stats.bestStreak || 0, bestStreak);
  const acc = nCorrect / Math.max(1, cat.qs.length);
  if (isMil) {
    stats.milBest  = Math.max(stats.milBest || 0, banked);
    stats.milRung  = Math.max(stats.milRung || 0, rung);
    if (banked >= LADDER[LADDER.length - 1].v) stats.million = (stats.million || 0) + 1;
    if (banked > milBest()) LS.set('milBest', banked);
  } else if (isSurv) {
    stats.survBest = Math.max(stats.survBest || 0, nCorrect);
  } else {
    if (acc === 1) stats.perfect = (stats.perfect || 0) + 1;
    if (diffKey === 'dificil' && acc >= 0.8) stats.hard80 = (stats.hard80 || 0) + 1;
  }
  LS.set('stats', stats);
  window._newMedals = newMedals();
}

function startTmr() {
  clearInterval(tmr);
  tmr = setInterval(() => {
    if (frozen || ladderOpen) return;
    tLeft = Math.max(0, tLeft - 1);
    const tf = document.getElementById('tf');
    if (tf) {
      tf.style.width      = (tLeft / tMax * 100) + '%';
      tf.style.background = tLeft > 10 ? cat.col : tLeft > 5 ? '#FF9800' : '#F44336';
      if (tLeft <= 5 && !tf.classList.contains('timer-low')) tf.classList.add('timer-low');
    }
    const cn = document.getElementById('clock-n');
    if (cn) cn.textContent = tLeft;
    const rv = document.getElementById('revimg');
    if (rv && sc === 'quiz') rv.style.filter = 'blur(' + (20 * (tLeft / tMax)).toFixed(1) + 'px)';
    if (tLeft <= 0 && sc === 'quiz') doReveal();
  }, 1000);
}

/* ── Boot ── */
go();

/* ── Service Worker registration ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(() => {}); // silently fail (e.g. file:// protocol)
  });
}
</script>
</body>
</html>
